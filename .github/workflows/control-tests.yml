name: CI · Control tests (measure, not required)
# The fill ladder's widget zoo (spec docs/superpowers/specs/2026-10-12-fill-ladder.md, PR 1): one hand-made page per control shape (desktop/e2e/widget-zoo), replayed with the real
# extension, offline. It MEASURES how many pages the fill reads and keeps committed; a miss never fails it (pages that fail today are the fill ladder's found bugs). It fails only when the
# replay broke or a page pressed a submit. NOT a required check: a page moves to desktop/e2e/recorded/ (the required replay shards) only once it passes.
on:
  pull_request:   # GitHub's paths decide on a pull request (owner, 14 Oct 2026: "rely fully on gh workflow paths"); not required (a skipped workflow never reports); main runs it as a step of build.yml (CI · Tests), as a warning only
    branches: [main]
    paths:
      # Exactly what this workflow loads (tools/replay-files.mjs --paths control-tests.yml prints it; desktop/test/replay-workflow-paths.test.js fails when it drifts), plus its install files.
      - 'desktop/e2e/lib/app-log.mjs'
      - 'desktop/e2e/lib/app.mjs'
      - 'desktop/e2e/lib/apply-fixtures.mjs'
      - 'desktop/e2e/lib/capture-page.mjs'
      - 'desktop/e2e/lib/chrome-lean.mjs'
      - 'desktop/e2e/lib/coverage.mjs'
      - 'desktop/e2e/lib/engine.mjs'
      - 'desktop/e2e/lib/extension.mjs'
      - 'desktop/e2e/lib/launch-guard.mjs'
      - 'desktop/e2e/lib/forms.mjs'
      - 'desktop/e2e/lib/journey.mjs'
      - 'desktop/e2e/lib/ladder-fixtures.mjs'
      - 'desktop/e2e/lib/ladder-moves.mjs'
      - 'desktop/e2e/lib/ladder-score-path.mjs'
      - 'desktop/e2e/lib/ladder-score.mjs'
      - 'desktop/e2e/lib/owner-guard-env.mjs'
      - 'desktop/e2e/lib/page-replay.mjs'
      - 'desktop/e2e/lib/privacy-tripwire.mjs'
      - 'desktop/e2e/lib/test-accounts.mjs'
      - 'desktop/e2e/lib/real-claude.mjs'
      - 'desktop/e2e/lib/real-extension.mjs'
      - 'desktop/e2e/lib/recorded-false-readings.mjs'
      - 'desktop/e2e/lib/replay-browser.mjs'
      - 'desktop/e2e/lib/replay-lines.mjs'
      - 'desktop/e2e/lib/replay-time.mjs'
      - 'desktop/e2e/lib/replay-truth.mjs'
      - 'desktop/e2e/lib/run-logs.mjs'
      - 'desktop/e2e/lib/site-ledger.mjs'
      - 'desktop/e2e/lib/widget-zoo-model.mjs'
      - 'desktop/e2e/lib/widget-zoo.mjs'
      - 'desktop/e2e/widget-zoo.mjs'
      - 'desktop/e2e/widget-zoo/**'
      - 'desktop/lib/**'
      - 'desktop/renderer/countries.js'
      - 'desktop/renderer/question-kind.js'
      - 'desktop/scripts/extension-stamp.mjs'
      - 'desktop/scripts/stage.mjs'
      - 'extension/**'
      - 'worker/src/ai-prices.js'
      - 'worker/src/ai.js'
      - 'worker/src/answer-declarations.js'
      - 'worker/src/answer-examples.js'
      - 'worker/src/answer-facts.js'
      - 'worker/src/country-names.js'
      - 'worker/src/pay-convert.js'
      - 'worker/src/written-answer.js'
      - 'worker/src/writing-rules.js'
      - 'worker/src/answer-missing.js'
      - 'worker/src/cv-facts.js'
      - 'worker/src/extension-log.js'
      - 'worker/src/extension-run-record.js'
      - 'worker/src/extension.js'
      - 'worker/src/job-answers.js'
      - 'worker/src/owner-guard.js'
      - 'desktop/e2e/package.json'
      - 'desktop/e2e/package-lock.json'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/control-tests.yml'
      - '.github/actions/playwright-browser/**'
  workflow_dispatch:

concurrency:   # newest wins (owner, 15 Oct 2026): a newer push replaces the PR's older run, and a newer push to main cancels the older commit's run (the newest commit's run decides); a by-hand run is its own group and never cancelled
  group: widget-zoo-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  zoo:
    name: control tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: The PR paths list everything this workflow loads
        run: node tools/replay-files.mjs --check control-tests.yml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      # desktop/shared is generated (gitignored): the replay's app imports it (lib/ladder/rung2-sketch.js -> shared/alias-schema.js); without it the job died before any page (12 Oct 2026).
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: Chromium (the real extension needs the full browser, not the headless shell)
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e}
      - name: Replay the control pages
        working-directory: desktop/e2e
        env:
          JP_REPLAY: 1
          JOB_PILOTTO_HEAVY: 0
          REPLAY_LOG: 1   # the extension's decision lines per page: why a miss happened
        run: node widget-zoo.mjs --json widget-zoo.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: widget-zoo
          path: desktop/e2e/widget-zoo.json
          if-no-files-found: ignore
