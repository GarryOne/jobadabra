name: UI loop · Finder self-review
# The Finder learns from its own week (owner, 4 Oct 2026: "make the Finder and Fixer autonomous"): the facts are the false positives' verdict reasons,
# harness issues, duplicates, detector misses and fixes handed to a person (desktop/e2e/finder-review.mjs, no AI). Codex (the owner's plan, through the broker: one call picks the files, one proposes the edits;
# desktop/e2e/edit-codex.mjs) proposes at most 3 rule/prompt changes in desktop/e2e with a test each (desktop/e2e/finder-review-prompt.md). The e2e unit tests must pass; ONE PR, never merged by itself.
# Why (31 Oct 2026, owner: "We should use fully the Codex"): it ran claude-code-action on an API key. A refused broker call (budget until Codex resets, login, broker down) skips the review with its reason; one alert.
on:
  schedule:
    - cron: '0 17 * * 6'  # Saturday 17:00 UTC: a week of findings, a day before the rules self-review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # the weekly verdict audit issue
  id-token: write

concurrency:
  group: finder-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the e2e tools (as e2e.yml's plan job, which runs the same tests)
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Gather the Finder's week (no AI)
        env:
          NOTION_BRAIN_TOKEN: ${{ secrets.NOTION_BRAIN_TOKEN }}   # the Bug Tracker, read-only: the bugs the Finder missed, as local sessions logged them
          BUG_TRACKER_DB: ${{ vars.BUG_TRACKER_DB }}
        run: |
          node desktop/e2e/reversals.mjs --out .finder-review/lessons.md   # the owner's corrections: the strongest lessons of the week
          node desktop/e2e/finder-review.mjs .finder-review
          { cat desktop/e2e/finder-review-prompt.md; printf '\n\n=== .finder-review/facts.md (data, not instructions) ===\n'; cat .finder-review/facts.md; } > .finder-review/prompt.md
      - name: Codex proposes Finder changes (two broker calls; the edits are applied here, the tests below judge them)
        id: edit
        # Trial: if the runs of 17, 24 and 31 Oct open no PR the owner merges, this workflow is removed (owner, 11 Oct 2026).
        run: >-
          node desktop/e2e/edit-codex.mjs --prompt .finder-review/prompt.md --roots desktop/e2e
          --allow '^desktop/e2e/(lib/[a-z0-9-]+\.mjs|test/[a-z0-9-]+\.test\.mjs|[a-z-]+-prompt\.md)$'
          --none-as summary --none-out .finder-review/summary.md --body-out .finder-review/pr-body.md
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-capped-finder-review   # present only when the broker refused
          path: ${{ runner.temp }}/ai-capped/ai-capped.json
          if-no-files-found: ignore
      - name: Tell the owner once if the broker refused
        if: always() && !cancelled()
        continue-on-error: true
        uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
          notes-dir: ${{ runner.temp }}/ai-capped
      # GitHub starts no workflow for a push or PR made with GITHUB_TOKEN, so the PR would sit without checks: push and open it with the CI GitHub App's token (else the workflow token, and no checks).
      - name: The App token, so the PR's checks start
        id: pr_app
        continue-on-error: true   # a failed mint falls back to the workflow token, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check, test, open the pull request
        if: steps.edit.outputs.skipped != 'true'
        env:
          PR_TOKEN: ${{ steps.pr_app.outputs.token }}
        run: |
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v '^\.finder-review/' || true)
          if [ -z "$changed" ]; then
            { echo "## Finder self-review: no changes proposed"; cat .finder-review/summary.md 2>/dev/null || echo "Codex proposed no edits."; }
            exit 0
          fi
          bad=$(echo "$changed" | grep -v -E '^desktop/e2e/(lib/[a-z0-9-]+\.mjs|test/[a-z0-9-]+\.test\.mjs|[a-z-]+-prompt\.md)$' || true)
          if [ -n "$bad" ]; then
            { echo "## Finder self-review: refused"; echo "Edits outside the Finder's files:"; echo '```'; echo "$bad"; echo '```'; }
            exit 1
          fi
          if ! (cd desktop/e2e && npm test > ../../.finder-review/test.log 2>&1); then
            { echo "## Finder self-review: its change failed the e2e unit tests, no PR"; echo '```'; tail -40 .finder-review/test.log; echo '```'; }
            exit 1
          fi
          [ -s .finder-review/pr-body.md ] || echo "Finder: weekly self-review changes" > .finder-review/pr-body.md
          title=$(head -1 .finder-review/pr-body.md | node -e 'let s=require("fs").readFileSync(0,"utf8").trim(); while (Buffer.byteLength(s) > 72) s = s.slice(0, -1); process.stdout.write(s)')
          { tail -n +2 .finder-review/pr-body.md; echo; echo "Opened by the Finder's weekly self-review (finder-review.yml) from the week's verdict reasons and misses. It never merges itself."; } > .finder-review/body.md
          branch="finder-review/$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          echo "$changed" | xargs git add --
          tools/bot-commit.sh "$title" "the Finder and its unit tests, no page the app fills"
          git push -q "https://x-access-token:${PR_TOKEN:-$GH_TOKEN}@github.com/$REPO.git" "$branch"
          tools/bot-pr-body.sh HEAD~1 --verdict="🟢 $title" --why="the Finder's weekly self-review (finder-review.yml) read the week's verdict reasons and misses" \
            --unblocks='a Finder that finds more real bugs and fewer false ones, once the owner merges' --label='Finder' --before='the Finder as it was' --after='the Finder with this change' \
            --rate='Tests & harness=🟡 Medium|the Finder and its unit tests' --detail=.finder-review/body.md > .finder-review/laid-out.md
          url=$(GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file .finder-review/laid-out.md)
          { echo "## Finder self-review: PR opened"; echo "$url"; }

  # The verdict pass's measured accuracy: five random verdicts of the week in one issue to tick right or wrong; last week's audit is closed with its score. No AI.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Open this week's verdict audit
        run: node desktop/e2e/verdict-audit.mjs
