# The pool rows replayed offline (owner, 13-14 Oct 2026; spec docs/superpowers/specs/2026-10-13-replay-by-network.md "Schedule, gate and alerts"): each row's newest
# network record (the Mac's on the release net-records, the by-hand pool runs' 14 days as net-records-<run>) replayed with main (replay-records.mjs: the site's own
# scripts from the record, the AI only from the live run's kept answers, never a site, never a model call). replay-gate.mjs then compares each row with the last
# green run (same recordings, same runner): only rows 100% same as live there count, and a counted row whose outcome fell is worse (after one retry). Red = a counted
# row worse; that run never becomes the baseline. The rows run on 5 Linux runners at once (JP_REPLAY_SHARD, owner 14 Oct 2026: one runner took 25+ min), one gate job after them. The nightly beta (desktop.yml) builds only a commit with a green run. No key (NET_RECORD_KEY): it says so and stops.
name: CI · Site replays · all (offline)
run-name: ${{ inputs.scheduled && 'Replay check · on time (Worker cron)' || 'Replay check' }}

# (Until 17 Oct 2026 it ran 4 times a day, started by the Worker; a scheduled run with nothing changed since the last green replay stopped at once. The `scheduled` input and that check stay for a by-hand run.) Never on a PR (15+ min each).
# Since 17 Oct 2026 (owner: "Replays stay for debugging only"; the daily check is a LIVE run of one site per multi-step platform, not this): never on a PR, no schedule, no Worker start.
# By hand only (debugging, bisecting); the nightly beta no longer waits for it (owner, 17 Oct 2026).
on:
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Started on time by the Worker cron'
        type: boolean
        default: false
      test_worse:
        description: 'Test only (never on main): a row name whose outcome is lowered by one box, to prove the accept label'
        default: ''
      test_accepts:
        description: 'Test only: a fake list of merged PRs as JSON [{number,title,labels:[{name}],comments:[{body,authorAssociation}]}]'
        default: ''

permissions:
  contents: read
  actions: read   # the pool runs' encrypted records, the baseline run's results
  pull-requests: read   # the PRs merged since the baseline: their replay-accepted label and comment (replay-accepts.mjs)

concurrency:   # each commit keeps its own run (tests/test_main_runs_finish.py)
  group: replay-offline-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.key.outputs.ok == '1' && steps.dup.outputs.skip != '1' && '1' || '0' }}
    steps:
      - name: The record key is set
        id: key
        env:
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
        run: |
          if [ -z "$NET_RECORD_KEY" ]; then echo "replay-offline: key not set (NET_RECORD_KEY): nothing replayed"; echo "ok=0" >> "$GITHUB_OUTPUT"; else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.ok == '1'
        with:
          fetch-depth: 0
      - name: Anything changed since the last green replay?
        # Owner, 14 Oct 2026: as the e2e schedule, a scheduled run replays only when something it replays changed: the app and extension code (not their tests),
        # this workflow, or the recordings (the release net-records, or a newer recording run's artifact). Nothing changed: it stops, green (the nightly gate then passes). A run by hand always runs.
        if: steps.key.outputs.ok == '1'
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled }}
        run: |
          [ "$BY_HAND" = true ] && { echo "replay-offline: started by hand: replaying"; exit 0; }
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow site-replays.yml --branch main --status success --limit 20 --json databaseId,headSha,createdAt \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)][0] | \"\(.headSha) \(.createdAt)\"" 2>/dev/null || true)
          read -r sha at <<< "${last:-}"
          [ -z "${sha:-}" ] && { echo "replay-offline: no green run yet: replaying"; exit 0; }
          ci=$(gh run list -R "$GITHUB_REPOSITORY" --workflow record-sites.yml --limit 1 --json createdAt --jq '.[0].createdAt // ""' 2>/dev/null || true)   # a recording run's artifact net-records-<run> is a new recording too (15 Oct 2026)
          records=$(gh release view net-records -R "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].updatedAt] | max // ""' 2>/dev/null || true)
          if git cat-file -e "$sha" 2>/dev/null && git diff --quiet "$sha" HEAD -- desktop extension worker/src .github/workflows/site-replays.yml ':!desktop/test' ':!desktop/e2e/test' \
             && { [ -z "$records" ] || [[ "$records" < "$at" ]]; } && { [ -z "$ci" ] || [[ "$ci" < "$at" ]]; }; then
            echo "replay-offline: nothing changed since the last green replay (${sha::7}, $at): nothing to do"; echo "skip=1" >> "$GITHUB_OUTPUT"
          else echo "replay-offline: changed since ${sha::7}: replaying"; fi
  refill-wait:
    # A refill in progress finishes first (owner, 15 Oct 2026: a replay started by the records publish ran on the not-yet-refilled answers and put "3 of 77 same as live" on /admin, replacing 21 / 13 of 16).
    # Looks every 60 s at the runs of replay-refill.yml started before this one (pool-ci-wait.mjs); after 50 minutes it goes on anyway and the upload says its answers are stale (fidelity-report.mjs answersStale).
    needs: check
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Wait for the refill runs that started earlier
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_WAIT_WORKFLOWS: replay-refill.yml
          POOL_WAIT_WHAT: replay refill
          POOL_WAIT_POLL: '60'
          POOL_WAIT_MAX: '3000'
        run: node desktop/e2e/pool-ci-wait.mjs
  bundles:
    # The release's recordings downloaded ONCE for every job of this run and kept ENCRYPTED (this repo is public: an artifact is readable by anyone; each job decrypts with NET_RECORD_KEY as before).
    # One gh download per replay job tripped GitHub's burst limit for every session (15 Oct 2026); a job that finds none fails loudly here, not as a gate verdict. After the refill wait: the release is read once the refill's publish is in it.
    needs: [check, refill-wait]
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The release's bundles, still encrypted
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: bash desktop/e2e/net-records-fetch.sh --bundles-only "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@v6
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
          retention-days: 1

  replay:
    needs: [check, bundles]
    if: needs.check.outputs.go == '1'
    runs-on: ubuntu-24.04   # Linux (15 Oct 2026): the Mac-made rows come out the same as live here (the PR gate's pinned rows); macOS runners queued for hours
    timeout-minutes: 45   # a fifth of the rows each; ~80-150 s a row
    strategy:
      fail-fast: false
      max-parallel: 4   # one workflow never holds most of the 20 runners (owner, 15 Oct 2026)
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      JOB_PILOTTO_HEAVY: '0'   # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install --with-deps chromium)
      - uses: actions/download-artifact@v7
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The pool's newest records (14 days), decrypted on the runner only
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh)
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}   # read-only, jobadabra-lab only (the Mac's records)
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Replay each row offline with this build
        working-directory: desktop/e2e
        env:
          JP_REPLAY_SHARD: ${{ matrix.shard }}/5
        run: |
          set -o pipefail
          node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-out"
      # The late-answer pass (owner, 15 Oct 2026: moved here from the PR check, "edge-case or costly checks will be caught hours later on the scheduled runs"): this shard's rows again with
      # every kept answer delayed 4 s; judged only by "no answer lost" (lib/lost-answers.mjs), never against live. A row that lost them alerts like a drop (the gate job).
      - name: Late-answer pass (answers delayed 4 s)
        working-directory: desktop/e2e
        env:
          JP_REPLAY_SHARD: ${{ matrix.shard }}/5
          JOB_PILOTTO_MODEL_MEMO_LATENCY_PAD_MS: '4000'
        run: |
          node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/replay-late" > /dev/null || true
          node replay-late.mjs "$GITHUB_WORKSPACE/replay-late/replays" | tee "$GITHUB_WORKSPACE/replay-out/late.md"
          # the late pass's own app logs ride with the shard (16 Oct 2026: a lost-answers row could not be read afterwards, only the normal pass's log was kept)
          mkdir -p "$GITHUB_WORKSPACE/replay-out/late-logs"; for d in "$GITHUB_WORKSPACE"/replay-late/replays/*/; do [ -f "$d/app.log" ] && cp "$d/app.log" "$GITHUB_WORKSPACE/replay-out/late-logs/$(basename "$d").log"; done; true
      - name: This shard's rows (for the gate; no record, no key)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: replay-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            replay-out/step4/*.json
            replay-out/replays/*/end.png
            replay-out/replays/*/step-*.png
            replay-out/replays/*/replay.json
            replay-out/replays/*/app.log
            replay-out/replays/*/ai-calls.json
            replay-out/late.md
            replay-out/late-logs/*.log
          retention-days: 7
          if-no-files-found: ignore
  prejudge:
    # Which rows came out worse (the gate's first look, no accepts, no retry): only those are replayed again. The judge is pure Node.
    needs: [check, replay]
    if: always() && needs.check.outputs.go == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      worse: ${{ steps.first.outputs.worse }}
      any: ${{ steps.first.outputs.any }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: replay-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - name: The rows that came out worse
        id: first
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_TEST_WORSE: ${{ inputs.test_worse }}
        run: |
          out="$RUNNER_TEMP/first"; mkdir -p "$out/step4"
          for d in "$RUNNER_TEMP"/shards/*/; do cp "$d"step4/*.json "$out/step4/" 2>/dev/null || true; done
          baseline=$(bash replay-baseline.sh "$out/baseline")
          node replay-gate.mjs "$out/step4" "$baseline" "$out/results.json" --pinned replay-faithful.json > /dev/null || true
          { echo "any=$([ -s "$out/results.json.worse" ] && echo 1 || echo 0)"; echo "worse<<EOF"; cat "$out/results.json.worse" 2>/dev/null || true; echo; echo EOF; } >> "$GITHUB_OUTPUT"
  retry:
    # A worse row is replayed once more (the same runner kind as the baseline), only when there is one.
    needs: [check, prejudge, bundles]
    if: always() && needs.check.outputs.go == '1' && needs.prejudge.outputs.any == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      JOB_PILOTTO_HEAVY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: Replay the worse rows again
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh)
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}   # the Mac's records on jobadabra-lab (net-records-fetch.sh)
          WORSE: ${{ needs.prejudge.outputs.worse }}
        run: |
          echo "retry: $(echo "$WORSE" | tr '\n' ',')"
          (cd "$GITHUB_WORKSPACE/desktop" && npm ci) && (cd "$GITHUB_WORKSPACE/desktop/e2e" && (npm ci || npm install)) && pip install --quiet -r "$GITHUB_WORKSPACE/requirements.txt" && npx playwright-core install --with-deps chromium
          bash "$GITHUB_WORKSPACE/.github/replay-records-fetch.sh"
          JP_REPLAY_ONLY="$WORSE" node replay-records.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/retry" > /dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: replay-retry-${{ github.run_id }}
          path: retry/step4/*.json
          retention-days: 7
          if-no-files-found: ignore
  gate:
    needs: [check, replay, prejudge, retry]
    if: always() && needs.check.outputs.go == '1'
    runs-on: ubuntu-24.04   # the judge is pure Node (a macOS runner queued for 30 min); the retry replay is its own job
    timeout-minutes: 30
    env:
      JOB_PILOTTO_HEAVY: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: replay-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v7   # the retry's rows, when a row came out worse
        continue-on-error: true
        with:
          name: replay-retry-${{ github.run_id }}
          path: replay-out/retry/step4
      - name: Compare with the last green run (the baseline)
        id: gate
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          REPLAY_TEST_WORSE: ${{ inputs.test_worse }}
          TEST_ACCEPTS: ${{ inputs.test_accepts }}
        run: |
          out="$GITHUB_WORKSPACE/replay-out"; mkdir -p "$out/baseline" "$out/step4" "$out/replays"
          # the shards' rows, merged (each shard's artifact: step4/*.json and replays/<row>/)
          for d in "$RUNNER_TEMP"/shards/*/; do cp "$d"step4/*.json "$out/step4/" 2>/dev/null || true; cp -R "$d"replays/. "$out/replays/" 2>/dev/null || true; done
          echo "replay-offline: $(ls "$out/step4" | wc -l | tr -d ' ') rows from the shards"
          baseline=-   # the newest green run that kept results (one that stopped on "nothing changed" kept none)
          for base in $(for wf in site-replays.yml replay-offline.yml; do gh run list -R "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --status success --limit 20 --json databaseId --jq ".[] | select(.databaseId != $GITHUB_RUN_ID) | .databaseId"; done); do   # replay-offline.yml: the old file name, read until 28 Oct 2026
            if gh run download "$base" -R "$GITHUB_REPOSITORY" --name "replay-results-linux-$base" --dir "$out/baseline" >/dev/null 2>&1; then baseline="$out/baseline/results.json"; echo "baseline: run $base"; break; fi
          done
          [ "$baseline" = - ] && echo "baseline: none yet on Linux (the macOS-made baseline is not used: another runner kind): this run becomes the first"
          # the owner's accept: a PR merged since the baseline, labeled replay-accepted, with a "Replay-accept: <reason>" comment (replay-accepts.mjs)
          if [ -n "$TEST_ACCEPTS" ]; then printf '%s' "$TEST_ACCEPTS" > "$out/fake-prs.json"; export REPLAY_ACCEPTS_FAKE="$out/fake-prs.json"; fi
          node replay-accepts.mjs "$baseline" "$out/accepts.json"
          retry=(); [ -n "$(ls "$out/retry/step4" 2>/dev/null)" ] && retry=(--retry "$out/retry/step4") && echo "retry: replayed again"
          set +e
          node replay-gate.mjs "$out/step4" "$baseline" "$out/results.json" "${retry[@]}" --accepts "$out/accepts.json" --pinned replay-faithful.json > "$out/gate.md"; code=$?
          set -e
          cat "$out/gate.md"
          # a pinned row that passed only on a retry 3+ times in 7 days (the dates ride in each row of results.json): named in the run, not left pinned on luck
          flaky=$(node -e 'const rows=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).rows;console.log(Object.entries(rows).filter(([,row])=>(row.noiseAt||[]).length>=3).map(([name])=>name).join("; "))' "$out/results.json")
          [ -z "$flaky" ] || echo "::warning::flaky pinned rows (passed only on a retry 3+ times in 7 days): $flaky"
          # the late-answer pass of each shard (late.md): a row that lost Claude's answers is red like a drop, and named in the alert
          : > "$out/late-lost.txt"; for d in "$RUNNER_TEMP"/shards/*/; do grep '^- ' "$d"late.md >> "$out/late-lost.txt" 2>/dev/null || true; done
          [ -s "$out/late-lost.txt" ] && { code=1; echo "### Late answers: rows that lost Claude's answers"; cat "$out/late-lost.txt"; }
          { echo "red=$([ "$code" = 0 ] && echo 0 || echo 1)"; echo "what<<EOF"; grep -E '\| worse \|' "$out/gate.md" | head -10 | sed -E 's/^\| ([^|]+) \| worse \| ([^|]+) \|$/\1: \2/'; sed -E 's/^- /late answers lost: /' "$out/late-lost.txt" | head -10; echo EOF; echo "merged=$(node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).merged||[];console.log(m.map(p=>"#"+p.number).join(", "))' "$out/accepts.json")"; } >> "$GITHUB_OUTPUT"
      - name: Keep this run's results (the next run's baseline when green)
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: replay-results-linux-${{ github.run_id }}
          path: replay-out/results.json
          retention-days: 90
      - name: Send the rows to /admin/form-filling/lab "Replay vs live" (main only)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: desktop/e2e
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
        run: '[ -d "$GITHUB_WORKSPACE/replay-out/step4" ] && node fidelity-report.mjs "$GITHUB_WORKSPACE/replay-out/step4" || echo "replay-offline: nothing to send"'
      - name: Each row's replay (pictures, app log; no record, no key)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: replay-offline-${{ github.run_id }}
          path: |
            replay-out/replays/*/end.png
            replay-out/replays/*/step-*.png
            replay-out/replays/*/replay.json
            replay-out/replays/*/app.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Tell the owner on Telegram (a failure, or back to green)
        if: always() && github.ref == 'refs/heads/main'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          CI_ALERT_ASSUME_FAILED: gate   # this job is the one that fails after the alert step (the repeat check compares failed jobs)
          RED: ${{ steps.gate.outputs.red }}
          WHAT: ${{ steps.gate.outputs.what }}
          MERGED: ${{ steps.gate.outputs.merged }}
        run: |
          if [ "$RED" = 1 ]; then node ci-alert.mjs failure "Pinned rows no longer same as live: ${WHAT:-see the run}" "If intended: label the PR replay-accepted + comment Replay-accept: <reason>"
          elif [ "${{ job.status }}" != success ] || [ "${{ needs.replay.result }}" != success ]; then node ci-alert.mjs failure "The replay job broke before its verdict" "Open the run; the next scheduled replay re-checks"
          else node ci-alert.mjs success; fi
      - name: Red when a counted row got worse
        if: steps.gate.outputs.red == '1'
        run: echo "::error::a counted row got worse than the last green run (see the summary)" && exit 1
