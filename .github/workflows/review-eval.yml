name: Proof · Screenshot review scored on the judged issues
# Scores a screenshot reviewer (desktop/e2e/review-eval.mjs) on every AI-review issue people closed as resolution:fixed (a real bug: seen again?) or
# resolution:by-design (a false alarm: raised again?). Owner, 26 Oct 2026: CI's review runs on Claude Haiku 5.5 (~$1 a month); this checks how much of
# what Sonnet found it still sees. By hand only, never on a PR or a push: a Claude model costs about $0.001 a screenshot (Haiku 5.5), the judge a few
# Workers AI neurons. Needs E2E_ANTHROPIC_KEY with credit and CI's own Workers AI token (never production's).
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Models to score, comma-separated (claude-* on the Anthropic key, @cf/* or free-ai:* on Workers AI)'
        default: 'claude-haiku-5-5'
      lessons:
        description: 'With the by-design lessons: on, off or both'
        default: 'on'

permissions:
  contents: read
  issues: read   # the judged issues and their screenshots

concurrency:
  group: review-eval-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  eval:
    name: Score the screenshot review
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: The e2e harness's packages
        working-directory: desktop/e2e
        run: npm ci --ignore-scripts || npm install --ignore-scripts
      - name: Score the models
        working-directory: desktop/e2e
        env:
          E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
          CI_FREE_AI_CF_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          CI_FREE_AI_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          MODELS: ${{ inputs.models }}
          LESSONS: ${{ inputs.lessons }}
        run: |
          set -o pipefail
          node review-eval.mjs --out "$RUNNER_TEMP/review-eval" --models "$MODELS" --lessons "$LESSONS" 2>&1 | tee "$RUNNER_TEMP/review-eval.log"
          grep -E '^\|' "$RUNNER_TEMP/review-eval.log" >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: review-eval
          path: ${{ runner.temp }}/review-eval/review-eval.json
          if-no-files-found: ignore
