name: Pipeline · Gmail and Calendar
run-name: mail${{ inputs.delay && inputs.delay != '0' && format(' (after {0} min)', inputs.delay) || '' }}

# Read-only: Gmail and Calendar -> 📈 Application Events, Stage, Next interview, Telegram.
# How often: the cron in templates/github-actions/mail.yml (your private repo). 05, 10, 16 UTC = 07:00, 12:00, 18:00 in Zurich (summer time);
# the 16:00 UTC run sends the evening-before interview prep. Also started 5 minutes after an
# application is marked Applied (watcher, ✅ button, /add), and by /mail in Telegram.
on:
  # Called by the scheduled workflow in your private repo (templates/github-actions/mail.yml);
  # no schedule here, so this public repo never reads your mail.
  workflow_call:
    inputs:
      delay: {type: string, default: '0'}
      days: {type: string, default: '2'}
      code_repository: {type: string, default: ''}
      code_ref: {type: string, default: '', description: 'the release tag of that code (the app pins its own version); empty: the default branch'}
  workflow_dispatch:
    inputs:
      delay:
        description: 'minutes to wait first (5 after an application, so its confirmation email has arrived)'
        required: false
        default: '0'
      days:
        description: 'how many days of Gmail to look at'
        required: false
        default: '2'

permissions:
  contents: read


# Optional features can be switched off without deleting their secrets (src/features.py),
# e.g. repository variable JOB_PILOTTO_DISABLE=google_jobs,mail.
env:
  # Free AI for a Free AI install (desktop/lib/github.js): src/ai/providers/anthropic_api.py points the SDK there. Tracking goes on after the free trial.
  JOB_PILOTTO_AI_BASE_URL: ${{ vars.JOB_PILOTTO_AI_BASE_URL }}
  # The model of the small AI steps (title and page checks, triage, search picks), as the app sets it in this repo (desktop/lib/github.js).
  JOB_PILOTTO_SMALL_MODEL: ${{ vars.JOB_PILOTTO_SMALL_MODEL }}
  # The AI engine the user chose for Always on (api: Anthropic key, openai: OpenAI key; never a CLI here) and the OpenAI tiers' models,
  # as the app sets them in this repo (desktop/lib/github.js; src/ai/providers, src/ai/models.py).
  JOB_PILOTTO_AI_ENGINE: ${{ vars.JOB_PILOTTO_AI_ENGINE }}
  JOB_PILOTTO_OPENAI_SMALL_MODEL: ${{ vars.JOB_PILOTTO_OPENAI_SMALL_MODEL }}
  JOB_PILOTTO_OPENAI_MAIN_MODEL: ${{ vars.JOB_PILOTTO_OPENAI_MAIN_MODEL }}
  JOB_PILOTTO_OPENAI_BIG_MODEL: ${{ vars.JOB_PILOTTO_OPENAI_BIG_MODEL }}
  # Notion's limit (~3 requests a second) is shared with the user's app on their computer: this run takes ~1.4/s.
  JOB_PILOTTO_NOTION_GAP_MS: '700'
  JOB_PILOTTO_DISABLE: ${{ vars.JOB_PILOTTO_DISABLE }}
  # How the person wants to be told (the app sets it, desktop/lib/github.js): email, telegram, app. E-mail goes through the website with the install's key (src/notify.py).
  JOB_PILOTTO_NOTIFY: ${{ vars.JOB_PILOTTO_NOTIFY }}
  JOB_PILOTTO_TRIAL_KEY: ${{ secrets.JOB_PILOTTO_TRIAL_KEY }}
  # Your Notion workspace: database and page IDs, as repository variables (the Desktop App sets them).
  NOTION_APPLICATIONS_DB: ${{ vars.NOTION_APPLICATIONS_DB }}
  NOTION_MATCHES_DB: ${{ vars.NOTION_MATCHES_DB }}
  NOTION_EVENTS_DB: ${{ vars.NOTION_EVENTS_DB }}
  NOTION_INSIGHTS_DB: ${{ vars.NOTION_INSIGHTS_DB }}
  NOTION_INTERVIEWS_DB: ${{ vars.NOTION_INTERVIEWS_DB }}
  NOTION_EMPLOYERS_DB: ${{ vars.NOTION_EMPLOYERS_DB }}
  NOTION_AGENT_RUNS_DB: ${{ vars.NOTION_AGENT_RUNS_DB }}
  NOTION_CRON_RUNS_DB: ${{ vars.NOTION_CRON_RUNS_DB }}
  NOTION_PROFILE_PAGE_ID: ${{ vars.NOTION_PROFILE_PAGE_ID }}
  NOTION_ANSWERS_PAGE_ID: ${{ vars.NOTION_ANSWERS_PAGE_ID }}
  NOTION_KNOWLEDGE_PAGE: ${{ vars.NOTION_KNOWLEDGE_PAGE }}
  NOTION_PIPELINE_PAGE: ${{ vars.NOTION_PIPELINE_PAGE }}

jobs:
  mail:
    runs-on: ubuntu-24.04
    concurrency:
      group: job-pilotto-mail
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
    steps:
      # A check someone started (Telegram, the app) gets an answer: here, what to do in the app.
      - name: Not connected yet
        if: env.GOOGLE_REFRESH_TOKEN == ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STARTED_BY_SOMEONE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          text="📧 Gmail isn't connected for Always on yet. In the Jobadabra app: Settings → Connections → Gmail & Calendar → Connect (it's sent to GitHub too)."
          echo "$text"
          if [ "$STARTED_BY_SOMEONE" = "true" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -sS -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${text}"
          fi
      # A Gmail check reads and writes the user's Notion workspace: without its NOTION_* variables (set by the
      # Desktop App in the private Always-on repo) there is nothing to read, and Notion answers 400.
      # Say so and skip instead of dying in a traceback (1 Oct 2026: the post-application watcher dispatched this
      # workflow in the public engine repo, so every submitted application queued a failing check).
      - name: No workspace in this repository
        if: env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB == ''
        run: |
          echo "::notice::No Jobadabra workspace in ${GITHUB_REPOSITORY} (NOTION_APPLICATIONS_DB is empty)."
          echo "A Gmail check needs the workspace the Desktop App writes to your private repo; nothing to do here."
          echo "It runs from your private Always-on repo's schedule, or as 'Check Gmail now' in the app."
      - uses: actions/checkout@v5
        if: env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB != ''
        # Called from a private repo (templates/github-actions): run this repo's code there.
        with:
          repository: ${{ inputs.code_repository || github.repository }}
          ref: ${{ inputs.code_ref }}
      - uses: actions/setup-python@v6
        if: env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB != ''
        with:
          python-version: '3.12'
      # Which emails were already classified and which reminders were sent; losing it only
      # costs one re-classification (events are deduplicated in Notion by Source ID).
      - name: Restore mail state
        if: env.GOOGLE_REFRESH_TOKEN != ''
        uses: actions/cache/restore@v5
        with:
          path: data/mail-state.json
          key: job-pilotto-mail-${{ github.run_id }}
          restore-keys: job-pilotto-mail-
      - name: Wait
        if: env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB != '' && inputs.delay && inputs.delay != '0'
        run: sleep $(( ${{ inputs.delay }} * 60 ))
      - name: Check Gmail and Calendar
        if: env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB != ''
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_SCOPES: ${{ secrets.GOOGLE_SCOPES }}   # which of Gmail / Calendar the user allowed (src/sources/google_scopes.py)
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_PILOTTO_MAIL_MODEL: ${{ vars.JOB_PILOTTO_MAIL_MODEL || 'claude-haiku-5-5' }}
          JOB_PILOTTO_RUN_ID: ${{ github.run_id }}
        run: |
          echo "run_id=${JOB_PILOTTO_RUN_ID}"
          pip install --quiet -r requirements.txt
          send=()
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then send=(--send); fi
          case ",$JOB_PILOTTO_NOTIFY," in *,email,*) send=(--send) ;; esac   # e-mail chosen: src/notify.py
          # Only a check that recorded something answers on Telegram: a quiet one says so in the app and on its ⏱️
          # Search runs row, and a "nothing that changes your applications" message for every check someone started
          # is noise (the app dispatches this workflow for its "Check Gmail now", 1 Oct 2026).
          # --log-run: its ⏱️ Search runs row (running, then result and log) is how the app and Notion see it.
          python -m src.ai.mail "${send[@]}" --log-run --days "${{ inputs.days || '2' }}"
      - name: Save mail state
        if: always() && env.GOOGLE_REFRESH_TOKEN != '' && env.NOTION_APPLICATIONS_DB != ''
        uses: actions/cache/save@v5
        with:
          path: data/mail-state.json
          key: job-pilotto-mail-${{ github.run_id }}
