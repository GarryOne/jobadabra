name: CI · Ready to send image
# Builds the Ready to send container image and runs one night in it against a stand-in site (hosted/ready-fill/image-check.mjs, ~1-2 min):
# a night that cannot start fails the PR instead of the first real night (18 Oct 2026: every night failed at setup, found 25 min after the deploy).
# Fictional data only, no AI, no keys, nothing deployed.
on:
  pull_request:
    paths:
      - 'hosted/ready-fill/**'   # extension/ and worker/src/ changes are checked by the same night before each runner deploy (release-ready-runner.yml), not on every PR
      - 'desktop/lib/form-address.js'   # copied into the image
      - '.github/workflows/ready-fill-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read
  statuses: write       # the PR's "All checks passed"
concurrency:
  group: ready-fill-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a PR's newer push cancels its older run
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build the image
        run: docker build -f hosted/ready-fill/Dockerfile -t ready-fill:check .
      - name: One night against a stand-in site
        run: node hosted/ready-fill/image-check.mjs ready-fill:check
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
