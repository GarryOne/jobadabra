<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Product Delivery Lead - Application</title></head><body>
<!-- A one-page application whose Address box the page fills itself, on load, with its guess of the visitor's place from their IP (benchmark form 106, 27 Oct 2026:
     "Des Moines, United States of America" on a US runner). Written by hand from the run's end screen and field list; the page's own guess is a page script. Fake applicant. -->
<form onsubmit="return false" style="font:14px system-ui;padding:20px;max-width:560px">
  <h3>Personal information</h3>
  <div><label for="firstname">First name<span aria-hidden="true">*</span></label><input id="firstname" name="firstname" type="text" required></div>
  <div><label for="lastname">Last name<span aria-hidden="true">*</span></label><input id="lastname" name="lastname" type="text" required></div>
  <div><label for="email">Email<span aria-hidden="true">*</span></label><input id="email" name="email" type="email" required></div>
  <div><label for="address">Address<span aria-hidden="true">*</span></label><input id="address" name="address" type="text" autocomplete="off" required>
    <p>Include your city, region, and country, so that employers can easily manage your application.</p></div>
  <button type="submit">Submit application</button>
</form>
<script>
  // The page's own guess of where the visitor is, written into the box before anyone types (as the live page does from the visitor's IP).
  document.getElementById('address').value = 'Des Moines, United States of America';
</script>
</body></html>
