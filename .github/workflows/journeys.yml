# Since 17 Oct 2026 (owner: "Daily with site replays": 63 PR runs, 4 red, 0 real; 3 reds were recording downloads) this runs by hand only (debugging), never on a PR and on no schedule; a journey that fails tells Telegram.
# Journey tests (owner, 16 Oct 2026): replays whole recorded journeys offline (desktop/e2e/journeys.json: signed-in Richemont, SuccessFactors, a
# Lever form) with the real extension and the app, and judges what the person SEES at every step: the card's line and the panel's headline, count and Report button, against the live
# run's own steps, plus never Submitted / never Ready early (desktop/e2e/journey.mjs, lib/journey-check.mjs). One runner per journey, $0 (memo-only AI), minutes. Fixes passed unit tests on
# pieces and failed on the owner's real journey ("Logging in…" for ever, "Apply button detected" on an error page); this is the test of the whole. Not a required check.
name: CI · Journeys (card and panel per step)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: journeys-${{ github.sha }}
  cancel-in-progress: false

jobs:
  bundles:
    # The release's recordings downloaded ONCE for every journey job (as site-replays-pr.yml does), kept ENCRYPTED: three jobs each calling gh drew three times on the read token's hourly limit,
    # which is the owner's account's, shared with every session (19:06Z, 16 Oct 2026: it ran out and the journeys went red as "no record").
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The release's bundles, still encrypted
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: bash desktop/e2e/net-records-fetch.sh --bundles-only "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@v6
        with:
          name: journey-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
          retention-days: 1

  journey:
    needs: bundles
    name: journey ${{ matrix.row }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        row: ['Richemont Workday', 'SuccessFactors: account and form', 'Lever: single page, no account']   # journeys.json rows that are neither pending nor macOnly (desktop/e2e/test/journey-run.test.mjs keeps them equal)
    env:
      JOB_PILOTTO_HEAVY: '0'   # the heavy lock is a Mac's queue; this runner is its own machine
    steps:
      - name: The record key is set
        env:
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
        run: |
          if [ -z "$NET_RECORD_KEY" ]; then echo "::error::journeys: key not set (NET_RECORD_KEY): nothing can be replayed"; exit 1; fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install --with-deps chromium)
      - uses: actions/download-artifact@v7
        with:
          name: journey-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: The pool's records, decrypted on the runner only
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh): no gh call here
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}   # the bundles are already downloaded (the bundles job holds the read token): no gh call here
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Replay the journey and judge the card and the panel at every step
        working-directory: desktop/e2e
        env:
          ROW: ${{ matrix.row }}
        run: node journey-run.mjs "$GITHUB_WORKSPACE/records" "$GITHUB_WORKSPACE/journey-out" "--only=$ROW" 2>&1 | tee "$GITHUB_WORKSPACE/journey.log"; test "${PIPESTATUS[0]}" = 0
      - name: The journey's steps and its card (for the review)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: journey-${{ strategy.job-index }}
          path: |
            journey.log
            journey-out/*/journey-steps.json
            journey-out/*/journey-verdict.json
            journey-out/*/end.png
            journey-out/*/app.log
          retention-days: 7
          if-no-files-found: ignore
  alert:
    # A journey that fails tells the owner on Telegram, and the first good run after says "back to green" (ci-alert.mjs, as the daily site replays).
    needs: journey
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tell the owner on Telegram (a failure, or back to green)
        # Why (owner, 27 Oct 2026, via the coordinator): a run cancelled by hand is no failure; it sent "🔴 … the estimate is above the cap, or the key is missing" (refill 40451220954). cancelled() is the run's own cancel, never a job's timeout. Guard: tests/test_ci_alert_cancel.py.
        if: ${{ !cancelled() }}
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          CI_ALERT_ASSUME_FAILED: ''
        run: |
          if [ "${{ needs.journey.result }}" = success ]; then node ci-alert.mjs success
          else node ci-alert.mjs failure "A journey no longer passes (card or panel per step)" "Open the run: the journey-N artifact has its steps and end picture"; fi
