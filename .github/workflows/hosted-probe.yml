name: CI · Hosted Always on cost probe (one-off)
# One-off measurement for private spec jobadabra-lab:docs/specs/2026-10-16-hosted-always-on.md §3 (owner, 16 Oct 2026: "Build in GitHub Actions", spend stop $0.10): builds the engine image, deploys
# a throwaway Worker + one standard-1 container to our Cloudflare account, runs one cold and one warm search on the example config (no keys, no user data), prints the
# measured memory, time, CPU and egress and the cost per run, then deletes the Worker. Never scheduled. Starts when the label `run-hosted-probe` is put on the PR, or by hand.
# Delete this file (and tools/hosted-probe/) after the numbers are in the spec, unless the hosted build plan needs it.
on:
  pull_request:
    types: [labeled]
    paths:
      - 'tools/hosted-probe/**'
      - '.github/workflows/hosted-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read
  statuses: write       # the PR's "All checks passed"
concurrency:
  group: hosted-probe-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}   # a PR's newer push cancels its older run, a by-hand run never
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-hosted-probe'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Deploy the probe Worker and container
        working-directory: tools/hosted-probe
        run: |
          npm install --no-audit --no-fund
          token=$(openssl rand -hex 16)
          echo "::add-mask::$token"
          echo "PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          npx wrangler@4.151.1 deploy --var "PROBE_TOKEN:$token" 2>&1 | tee deploy.log
      - name: Run one cold and one warm search
        run: |
          url="https://jp-hosted-probe.jobpilotto.workers.dev/run"
          for n in cold warm; do
            ok=""
            for try in 1 2 3 4 5 6; do
              code=$(curl -sS -m 420 -o "$n.json" -w '%{http_code}' -H "x-probe-token: $PROBE_TOKEN" "$url" || echo 000)
              echo "$n try $try: HTTP $code"
              if [ "$code" = 200 ]; then ok=1; break; fi
              sleep 20
            done
            [ -n "$ok" ] || { echo "::error::$n run did not answer 200"; cat "$n.json" 2>/dev/null; exit 1; }
          done
      - name: The measured cost per run
        run: |
          python3 - <<'PY' || true
          import json
          GIB, DISK_GB = 4, 8   # standard-1
          for n in ('cold', 'warm'):
              r = json.load(open(f'{n}.json'))
              mem = GIB * r['wall_s'] * 0.0000025
              cpu = (r['user_cpu_s'] + r['system_cpu_s']) * 0.00002
              disk = DISK_GB * r['wall_s'] * 0.00000007
              egress = r['net_sent_bytes'] / 1e9 * 0.025
              total = mem + cpu + disk + egress
              peak = r['cgroup_memory_peak_bytes']
              print(f"### {n}: exit {r['exit']}, {r['wall_s']} s wall, CPU {r['user_cpu_s'] + r['system_cpu_s']:.1f} s, "
                    f"max RSS {r['max_rss_kb'] / 1024:.0f} MiB, cgroup peak {(peak or 0) / 2**20:.0f} MiB, "
                    f"received {r['net_received_bytes'] / 1e6:.1f} MB, sent (egress) {r['net_sent_bytes'] / 1e6:.1f} MB")
              print(f"memory ${mem:.5f} + cpu ${cpu:.5f} + disk ${disk:.5f} + egress ${egress:.5f} = **${total:.5f} per run** (before Worker/Queue/D1/R2 pennies)\n")
              print('last lines: ' + ' | '.join(r['tail']) + '\n')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hosted-probe-results
          path: |
            cold.json
            warm.json
            tools/hosted-probe/deploy.log
          if-no-files-found: ignore
      - name: Delete the probe Worker
        if: always()
        working-directory: tools/hosted-probe
        run: |
          npx wrangler@4.151.1 delete --name jp-hosted-probe --force || true
          npx wrangler@4.151.1 containers list 2>&1 | head -20 || true
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
