<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Site Reliability Engineer at E2E Workday Corp</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}.field{margin:14px 0}label{display:block;margin-bottom:4px}input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body><h1>Site Reliability Engineer</h1><p>E2E Workday Corp · Zurich, Switzerland</p>
<div data-automation-id="applyFlowPage"><h2 data-automation-id="pageHeader">My Information</h2><form id="application_form" data-automation-id="applyFlowForm">
  <div class="field" data-automation-id="formField-legalNameSection_firstName"><label id="lbl-input-2">First Name<abbr title="required">*</abbr></label><input id="input-2" data-automation-id="legalNameSection_firstName" type="text" aria-labelledby="lbl-input-2" aria-required="true"></div><div class="field" data-automation-id="formField-legalNameSection_lastName"><label id="lbl-input-3">Last Name<abbr title="required">*</abbr></label><input id="input-3" data-automation-id="legalNameSection_lastName" type="text" aria-labelledby="lbl-input-3" aria-required="true"></div><div class="field" data-automation-id="formField-email"><label id="lbl-input-4">Email Address<abbr title="required">*</abbr></label><input id="input-4" data-automation-id="email" type="email" aria-labelledby="lbl-input-4" aria-required="true"></div>
  <div class="field" data-automation-id="formField-resume"><label id="lbl-input-5">Resume/CV<abbr title="required">*</abbr></label><input id="input-5" data-automation-id="file-upload-input-ref" type="file" aria-labelledby="lbl-input-5" aria-required="true"></div>
  <div class="field" data-automation-id="formField-source"><label id="lbl-source">How Did You Hear About Us?<abbr title="required">*</abbr></label><button type="button" id="source" data-automation-id="sourcePrompt" aria-haspopup="listbox" aria-labelledby="lbl-source" aria-required="true">Select One</button></div>
  <div class="field" data-automation-id="formField-questionnaire_aws"><label id="lbl-input-7">How many years of experience do you have with AWS?<abbr title="required">*</abbr></label><input id="input-7" data-automation-id="questionnaire_aws" type="text" aria-labelledby="lbl-input-7" aria-required="true"></div><div class="field" data-automation-id="formField-questionnaire_notice"><label id="lbl-input-9">What is your notice period?<abbr title="required">*</abbr></label><textarea id="input-9" data-automation-id="questionnaire_notice" aria-labelledby="lbl-input-9" aria-required="true" rows="3"></textarea></div>
  <div class="field"><button type="submit" id="submit_app" data-automation-id="bottom-navigation-next-button">Submit</button></div></form></div>
<script>
const fired = kind => fetch('/__fired?kind=' + kind + '&form=' + encodeURIComponent(location.pathname), {method: 'POST', keepalive: true});
document.addEventListener('click', event => { if (event.target.closest('[type=submit]')) fired('click'); }, true);
document.addEventListener('submit', event => { event.preventDefault(); fired('submit'); }, true);

</script></body></html>
