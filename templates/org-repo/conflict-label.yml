# Why (2 Nov 2026, owner: "basically on all the repos in the org... the same workflow"): the script is NOT copied here; this workflow checks out tools/conflict-label.mjs and tools/gitar-label.mjs from the public
# jobadabra/jobadabra main (run only as a label writer, never the PR's code), so a fix to the parser lands in every repo at once. Same triggers, permissions and rules as there.
# Puts an orange "Merge conflict" label on each open PR that GitHub says conflicts with its base, and takes it off once it merges cleanly (owner, 30 Oct 2026).
# Runs on a push to main (any open PR may now conflict) and on a PR push (it may be fixed); checks out main's copy of the script and NEVER runs a PR's code;
# its only writes are labels. Script and cases: jobadabra/jobadabra tools/conflict-label.mjs, tests/test_conflict_label.py.
name: CI · Conflict label

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write   # creating the label the first time (addLabel in tools/gitar-label.mjs)

# Why (30 Oct 2026): on main the newest push's run decides (tests/test_main_runs_finish.py) and reads every open PR anyway; a PR push's run is its own group,
# never cancelled, since a cancelled run is drawn as a failed check on that PR (#2400).
concurrency:
  group: conflict-label-${{ github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: true

jobs:
  conflict:   # not `label`: it must never read as the Gitar label check (web, 1 Nov 2026)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          repository: jobadabra/jobadabra   # the script lives there (public), not in this repo
          ref: main
          sparse-checkout: |
            tools/conflict-label.mjs
            tools/gitar-label.mjs
          sparse-checkout-cone-mode: false
      - name: Label the open PRs that conflict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}   # empty on a push to main: every open PR
        run: node tools/conflict-label.mjs
