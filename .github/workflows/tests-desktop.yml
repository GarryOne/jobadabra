name: CI · Tests · desktop
# On a pull request, GitHub's `paths:` below decides whether it runs (owner, 14 Oct 2026: "drop your shared pick logic, rely fully on gh workflow paths"). Not a required
# check: a workflow `paths:` skips never reports, and a required one would block the PR (tests/test_workflow_paths.py). On main, build.yml (CI · Tests) calls it on
# every push: the backstop for a break from outside these paths.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      - 'extension/**'
      - 'eslint.config.mjs'
      - 'tools/check.sh'
      - 'tools/check.py'
      # Files outside desktop/ that its tests read (tests/test_workflow_paths.py fails when one is missing).
      - '.github/workflows/e2e.yml'
      - '.github/workflows/harness.yml'
      - '.github/workflows/integration.yml'   # desktop/test/integration-workflow-paths.test.js reads its paths
      - '.gitignore'
      - 'tools/design-system/**'   # desktop/test/design-system-page.test.js builds the page with it
      - 'docs/rules/desktop-ui.md'
      - '.claude/skills/ui-look-and-feel/SKILL.md'
      - 'hosted/**'   # ready-fill.test.js imports the night's filler; site-routes.test.js reads every shipped folder
      - 'src/**'   # settings-paths-exist, bridge-registry, plan-promo, run-lines-plain, site-routes and identity-rule read engine text (#2099 changed only src/ai/decide.py and main went red)
      - 'worker/src/**'   # identity-rule.test.js, site-routes.test.js
      - 'worker/test/helpers/panel.js'   # the panel tests load the panel scripts through readPanel
      - 'tests/fixtures/audience_cases.json'   # audience.test.js
      - 'tests/fixtures/swiss_cases.json'
      - 'tools/ship.sh'   # merge-baseline.test.js
      - 'tools/clean-code-js.mjs'   # desktop/test/clean-code-js.test.js, and `npm run lint` runs it on the lines a PR adds
      - 'docs/flows/ladder.md'   # ladder-architecture.test.js checks the rung map against the code
      - 'config/notion_schema.json'
      - 'config/notion_template.json'
      - 'docs/notion-profile-template.md'
      - 'docs/site-routes.json'
      - 'tools/about-you-readers.mjs'   # desktop/test/about-you-readers.test.js
