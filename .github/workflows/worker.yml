name: Release · Worker

# Deploys the Worker (worker/: the Telegram bot and the on-time schedules, `sre-job-pilotto-bot`) to Cloudflare when it changes on main, after its own tests. The desktop release
# run (desktop.yml) no longer has anything to do with it, nor does the site (site.yml): owner, 10 Oct 2026, "the worker should have a separate deployment pipeline, triggered
# only when it changes". Not triggered by this workflow file itself: changing the pipeline deploys nothing; run it by hand to deploy the current Worker.
# Secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID (as site.yml). The Worker's own secrets (GITHUB_TOKEN, TELEGRAM_BOT_TOKEN, …) live
# on Cloudflare and are not touched by a deploy; the last step checks they are still there (worker/scripts/check-secrets.mjs).
on:
  push:
    branches: [main]
    paths:
      - 'app-core/src/**'
      - 'worker/wrangler.toml'
      - 'worker/package.json'
      - 'app-core/package-lock.json'
      - 'worker/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false   # a deploy that started finishes; the next waits

jobs:
  deploy:
    name: Deploy · Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # job-wide: a step's own env is not visible to its `if`
    steps:
      - name: Not set up yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN secret (Cloudflare → API Tokens → Edit Cloudflare Workers) to deploy the Worker."
      - uses: actions/checkout@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v5
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: '22'
      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: app-core
        run: npm ci
      - name: Tests · Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: app-core
        run: npm test
      # `npm run deploy` = wrangler deploy, then check-secrets.mjs: red when the deployed Worker lacks a secret its schedules need (5 Oct 2026: a Worker created afresh had none).
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: ../tools/cf-retry.sh npm run deploy
