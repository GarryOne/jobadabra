name: CI · UI verdicts

# THE VERDICT PASS, in parallel. After every filing of the UI loop (ui-findings.yml), up to five one-off findings (seen on one build, not yet judged) are
# judged by one plain AI call each (desktop/e2e/judge.mjs: Free AI, Haiku when unsure; the code excerpts and the screenshot go in), read-only: real / false-positive / needs-human. A real one is labelled
# `confirmed` (the fixer takes it next), a false positive is closed `wontfix-auto`, the rest `needs-human`. Why: the fixer judged one finding per run, so a run
# that filed a dozen took days to sort (4 Oct 2026). Only with the repo variable JOB_PILOTTO_FIXER_VERDICTS = "on".
on:
  workflow_run:
    workflows: ['CI · UI findings']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ui-verdict
  cancel-in-progress: false

jobs:
  pick:
    if: vars.JOB_PILOTTO_FIXER_VERDICTS == 'on'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The one-off findings to judge (none while the AI limit is reached)
        id: list
        run: |
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node desktop/e2e/pick.mjs --out .heal --verdict-list 5

  judge:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.pick.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The finding and its screenshot
        run: |
          node desktop/e2e/reversals.mjs --out .heal/lessons.md   # the owner's corrections, appended to the prompt
          node desktop/e2e/pick.mjs --out .heal --issue "$NUMBER"
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; fi
      - name: Judge it (one call, read-only)
        id: judge
        env:
          UI_JUDGE_SETUP: ${{ vars.UI_JUDGE_SETUP || 'haiku' }}
          UI_LOOP_FREE_AI_CF_TOKEN: ${{ secrets.UI_LOOP_FREE_AI_CF_TOKEN }}   # the UI loop's own Workers AI-only token, never production's
          UI_LOOP_FREE_AI_CF_ACCOUNT_ID: ${{ secrets.UI_LOOP_FREE_AI_CF_ACCOUNT_ID }}
          UI_LOOP_ANTHROPIC_KEY: ${{ secrets.UI_LOOP_ANTHROPIC_KEY }}
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          node desktop/e2e/judge.mjs --issue "$NUMBER" --screenshot .heal/screenshot.png --out .heal/verdict.md --lessons .heal/lessons.md
          node desktop/e2e/ai-budget.mjs --judge "$RUNNER_TEMP/judge-run.json" --job "verdict of issue $NUMBER" || true
          node desktop/e2e/ai-cost-report.mjs --job ui-verdict --file "$RUNNER_TEMP/judge-haiku-cost.json" --suffix "$NUMBER" || true
          cp "$RUNNER_TEMP/judge-run.json" "$RUNNER_TEMP/ai-cost.json" || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-cost-verdict-${{ matrix.issue }}
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      - name: Apply the verdict
        if: steps.judge.outcome == 'success' && hashFiles('.heal/verdict.md') != ''
        run: |
          set -euo pipefail
          # Comment, severity, labels, close: one script, shared with the triage-github-open-issues skill (desktop/e2e/apply-verdict.sh).
          desktop/e2e/apply-verdict.sh "$NUMBER" .heal/verdict.md "$REPO"
