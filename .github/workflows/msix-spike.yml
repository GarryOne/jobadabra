name: Spike · Windows Store package (MSIX)

# By hand only (gh workflow run msix-spike.yml): does the app build as an MSIX package and start when installed from it?
# Why (owner, 25 Oct 2026: "isn't there any way to get the app open without warnings on Windows without spending $100+?"):
# a Microsoft Store listing is free for individuals and Microsoft re-signs the package, so Store installs never show SmartScreen.
# This run builds the package with a throwaway identity, signs it with a self-made test certificate on the runner, installs it and
# checks that the app stays up. Nothing is published and no secret is used; the real Store identity comes from the owner's Partner Center account.
# Why (31 Oct 2026, owner: Store copy + downloaded .exe installed side by side): the second job below measures that case. It lives in this file because a workflow can be dispatched
# from a branch only if its file already exists on main; `scenario` picks which job runs.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'rename = the 25 Oct data-folder rename spike; two-installs = the .exe and the Store package side by side; virtualization = where a Store copy reads and writes AppData with and without virtualization (31 Oct 2026)'
        type: choice
        options: [rename, two-installs, virtualization, notice-preview]
        default: rename
      unvirtualized:
        description: 'virtualization scenario only: build the package with AppData write virtualization turned off (desktop6 + unvirtualizedResources); false = the package as the Store gets it today'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  msix:
    if: inputs.scenario == 'rename'
    name: Build and start the MSIX
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # stage.mjs counts the extension's commits and refuses a shallow clone
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Compile · bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Compile · build the MSIX with a test identity
        working-directory: desktop
        run: |
          npm version "0.0.1" --no-git-tag-version --allow-same-version >/dev/null
          npx electron-builder --win appx --publish never \
            -c.appx.identityName=Jobadabra.Spike -c.appx.publisher=CN=JobadabraSpike \
            -c.appx.publisherDisplayName=Jobadabra -c.appx.displayName=Jobadabra -c.appx.applicationId=Jobadabra
          ls -la dist/*.appx
      - name: Data · seed a real AppData folder like an installer-made install would
        shell: pwsh
        run: |
          $dir = Join-Path $env:APPDATA 'Job Pilotto'
          New-Item -ItemType Directory -Force (Join-Path $dir 'sub') | Out-Null
          Set-Content (Join-Path $dir 'seed.txt') 'seeded-before-install'
          Set-Content (Join-Path $dir 'sub\nested.txt') 'seeded-nested'
          New-Item -ItemType Directory -Force (Join-Path $env:APPDATA 'ControlUntouched') | Out-Null
          Set-Content (Join-Path $env:APPDATA 'ControlUntouched\c.txt') 'control'
          "real APPDATA before install: $((Get-ChildItem $env:APPDATA -Directory | ForEach-Object Name) -join ', ')"
          New-Item -ItemType Directory -Force 'C:\spike-out' | Out-Null
          "seeded: $dir"
      - name: Install · sign with a test certificate and install the package
        shell: pwsh
        working-directory: desktop
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=JobadabraSpike' -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'spike.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString 'spike' -AsPlainText -Force) | Out-Null
          Import-Certificate -FilePath (Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'spike.cer')).FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          $appx = (Get-ChildItem dist\*.appx | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p spike $appx
          Add-AppxPackage -Path $appx
          Get-AppxPackage Jobadabra.Spike | Format-List Name, PackageFullName, InstallLocation, SignatureKind
      - name: Data · rename a folder as the packaged app (cases 1 and 2)
        shell: pwsh
        run: |
          # Why (c8, full rename step 2, 25 Oct 2026): does fs.renameSync(old, new) inside the package move the real folder, only the virtual view, or fail?
          $pkg = Get-AppxPackage Jobadabra.Spike
          $appId = ([xml](Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml'))).Package.Applications.Application.Id
          $legacy = 'Job Pilotto'   # the data folder name under %APPDATA% (passed to the script, which must not spell it)
          $exe = (Get-ChildItem (Join-Path $pkg.InstallLocation 'app') -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1).FullName
          @'
          const fs = require('fs'), path = require('path');
          const out = [];
          const log = (k, v) => out.push(k + ': ' + v);
          const ra = process.env.APPDATA;
          const ls = p => { try { return fs.readdirSync(p).join(',') || '(empty)'; } catch (e) { return 'ERR ' + e.code; } };
          const rename = (a, b, tag) => { try { fs.renameSync(a, b); log(tag + ' renameSync', 'OK'); } catch (e) { log(tag + ' renameSync', 'FAIL ' + e.code + ' ' + e.message); } };
          const read = (f, tag) => { try { log(tag + ' read', fs.readFileSync(f, 'utf8')); } catch (e) { log(tag + ' read', 'FAIL ' + e.code); } };
          log('APPDATA as the app sees it', ra);
          const o2 = path.join(ra, process.argv[3]), n2 = path.join(ra, 'Jobadabra');
          log('case2 old folder seen before', ls(o2));
          rename(o2, n2, 'case2');
          log('case2 old after', ls(o2)); log('case2 new after', ls(n2));
          read(path.join(n2, 'seed.txt'), 'case2 seed at new name');
          const o1 = path.join(ra, 'Case1Old'), n1 = path.join(ra, 'Case1New');
          fs.mkdirSync(o1, { recursive: true }); fs.writeFileSync(path.join(o1, 'w.txt'), 'written-by-packaged-app');
          rename(o1, n1, 'case1');
          log('case1 old after', ls(o1)); log('case1 new after', ls(n1));
          read(path.join(n1, 'w.txt'), 'case1 file at new name');
          fs.writeFileSync('C:\\spike-out\\' + process.argv[2] + '.txt', out.join('\n'));
          '@ | Set-Content C:\spike-out\case.js
          @"
          `$env:ELECTRON_RUN_AS_NODE = '1'
          & '$exe' C:\spike-out\case.js node '$legacy'
          "@ | Set-Content C:\spike-out\run.ps1
          if (-not (Get-Command Invoke-CommandInDesktopPackage -ErrorAction SilentlyContinue)) { "Invoke-CommandInDesktopPackage is not available on this runner"; exit 1 }
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId $appId -Command 'powershell.exe' -Args '-NoProfile -ExecutionPolicy Bypass -File C:\spike-out\run.ps1' -PreventBreakaway
          Start-Sleep -Seconds 15
          "--- result as the packaged app saw it ---"
          if (Test-Path C:\spike-out\node.txt) { Get-Content C:\spike-out\node.txt } else { "no result file: the packaged app could not run the script as node" }
          "--- the real disk, seen from outside the package ---"
          "real APPDATA after: $((Get-ChildItem $env:APPDATA -Directory -Force | ForEach-Object Name) -join ', ')"
          "real folder 'Job Pilotto' exists: $(Test-Path (Join-Path $env:APPDATA 'Job Pilotto'))  'Jobadabra' exists: $(Test-Path (Join-Path $env:APPDATA 'Jobadabra'))  control exists: $(Test-Path (Join-Path $env:APPDATA 'ControlUntouched\c.txt'))"
          $cache = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalCache"
          "package cache: $cache"
          Get-ChildItem $cache -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "  cache: $($_.FullName.Substring($cache.Length))" }
      - name: Smoke · the packaged app starts and stays up
        shell: pwsh
        run: |
          $pkg = Get-AppxPackage Jobadabra.Spike
          $manifest = [xml](Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml'))
          $appId = $manifest.Package.Applications.Application.Id
          $exe = $manifest.Package.Applications.Application.Executable
          "manifest: app id $appId, executable $exe"
          Get-ChildItem $pkg.InstallLocation -Recurse -Filter *.exe -Depth 2 | Select-Object -First 8 -ExpandProperty FullName
          Start-Process explorer.exe "shell:AppsFolder\$($pkg.PackageFamilyName)!$appId"
          Start-Sleep -Seconds 25
          $running = Get-Process | Where-Object { $_.Path -like '*WindowsApps*Jobadabra.Spike*' }
          "processes from the package after 25 s: $(@($running).Count) ($((@($running) | ForEach-Object Name | Sort-Object -Unique) -join ', '))"
          "local listeners: $(@(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalAddress -eq '127.0.0.1' }).Count)"
          Get-WinEvent -LogName 'Microsoft-Windows-AppXDeploymentServer/Operational','Application' -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -in 'Error','Warning' } | Select-Object -First 8 | Format-List TimeCreated, ProviderName, Message
          if (-not $running) { Write-Error 'The packaged app did not start'; exit 1 }

  two-installs:
    if: inputs.scenario == 'two-installs'
    name: Install both copies and measure
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # stage.mjs counts the extension's commits and refuses a shallow clone
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Compile · bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Compile · build the NSIS installer and the MSIX (test identity)
        working-directory: desktop
        env:
          UNVIRTUALIZED: ${{ inputs.unvirtualized }}
        run: |
          npm version "0.0.1" --no-git-tag-version --allow-same-version >/dev/null
          extra=()
          if [ "$UNVIRTUALIZED" = "true" ]; then node scripts/appx-manifest.mjs; extra=(-c.appx.customManifestPath=appxmanifest-store.xml); fi
          npx electron-builder --win nsis appx --publish never \
            -c.appx.identityName=Jobadabra.Spike -c.appx.publisher=CN=JobadabraSpike \
            -c.appx.publisherDisplayName=Jobadabra -c.appx.displayName=Jobadabra -c.appx.applicationId=Jobadabra "${extra[@]}"
          ls -la dist/*.appx dist/*.exe
      - name: Install · the .exe silently, then the signed test MSIX
        shell: pwsh
        working-directory: desktop
        run: |
          $setup = (Get-ChildItem dist -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=JobadabraSpike' -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'spike.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString 'spike' -AsPlainText -Force) | Out-Null
          Import-Certificate -FilePath (Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'spike.cer')).FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          $appx = (Get-ChildItem dist\*.appx | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p spike $appx
          Add-AppxPackage -Path $appx
          Get-AppxPackage Jobadabra.Spike | Format-List Name, PackageFullName, PackageFamilyName, InstallLocation
      - name: Measure · four scenarios, one report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $out = 'C:\spike-out'; New-Item -ItemType Directory -Force $out | Out-Null
          $report = Join-Path $out 'report.txt'
          function Say($text) { $text | Tee-Object -FilePath $report -Append }
          $pkg = Get-AppxPackage Jobadabra.Spike
          $pfn = $pkg.PackageFamilyName
          $appId = ([xml](Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml'))).Package.Applications.Application.Id
          $msixExe = (Get-ChildItem (Join-Path $pkg.InstallLocation 'app') -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1).FullName
          $nsisExe = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter Jobadabra.exe -Depth 2 | Select-Object -First 1).FullName
          $real = Join-Path $env:APPDATA 'Jobadabra'
          $legacy = Join-Path $env:APPDATA 'Job Pilotto'
          $cache = Join-Path $env:LOCALAPPDATA "Packages\$pfn\LocalCache\Roaming"
          Say "== Inventory"
          Say "nsis exe: $nsisExe"
          Say "msix exe: $msixExe (package family $pfn)"
          Say "Start menu shortcuts: $((Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'), 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs' -Recurse -Filter *.lnk -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Jobadabra|Job Pilotto' } | ForEach-Object FullName) -join ' | ')"
          Say "Start apps: $((Get-StartApps | Where-Object Name -match 'Jobadabra|Job Pilotto' | ForEach-Object { $_.Name + ' <' + $_.AppID + '>' }) -join ' | ')"
          Say "Uninstall keys (HKCU+HKLM, installer copies): $((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -match 'Jobadabra|Job Pilotto' } | ForEach-Object { $_.DisplayName + ' ' + $_.DisplayVersion + ' [' + $_.PSChildName + ']' }) -join ' | ')"
          Say "Appx packages: $((Get-AppxPackage | Where-Object Name -match 'Jobadabra' | ForEach-Object PackageFullName) -join ' | ')"
          function Copies {   # the running processes of each copy, by where its exe lives
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and ($_.ExecutablePath -like '*WindowsApps*Jobadabra.Spike*' -or $_.ExecutablePath -eq $nsisExe) } |
              ForEach-Object { [pscustomobject]@{ Copy = $(if ($_.ExecutablePath -eq $nsisExe) { 'exe' } else { 'msix' }); Id = $_.ProcessId; Renderer = ($_.CommandLine -match '--type=renderer'); Typed = ($_.CommandLine -match '--type=') } }
          }
          function Stop-Copies { Get-Process | Where-Object { $_.Path -and ($_.Path -like '*WindowsApps*Jobadabra.Spike*' -or $_.Path -eq $nsisExe) } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 6 }
          function Start-Exe { $env:CI = 'true'; $env:GITHUB_ACTIONS = 'true'; Start-Process $nsisExe }
          function Start-Msix {   # in the package's identity (process.windowsStore), with CI set so it does not count as an install
            @"
          `$env:CI = 'true'; `$env:GITHUB_ACTIONS = 'true'
          Start-Process '$msixExe'
          "@ | Set-Content (Join-Path $out 'launch-msix.ps1')
            Invoke-CommandInDesktopPackage -PackageFamilyName $pfn -AppId $appId -Command 'powershell.exe' -Args "-NoProfile -ExecutionPolicy Bypass -File $out\launch-msix.ps1" -PreventBreakaway
          }
          function Files($root) { if (Test-Path $root) { Get-ChildItem $root -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName.Substring($root.Length) + ' (' + $_.Length + ' B)' } } }
          function Starts($log) { if (Test-Path $log) { @(Select-String -Path $log -Pattern '\[app\] start').Count } else { 0 } }
          function Shot($name) { $b = [System.Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height; [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size); $bmp.Save("$out\$name.png") }
          function Outcome($title) {
            $all = @(Copies)
            foreach ($c in 'exe', 'msix') { $mine = @($all | Where-Object Copy -eq $c); Say ("   {0,-5} processes: {1}, renderer: {2}" -f $c, $mine.Count, @($mine | Where-Object Renderer).Count) }
            Say "   app.log 'start' lines: real folder $(Starts "$real\logs\app.log"), package cache $(Starts "$cache\Jobadabra\logs\app.log"), legacy folder $(Starts "$legacy\logs\app.log")"
            Shot ($title -replace '\W+', '-')
          }

          # Why (31 Oct 2026, first run 41225480744 measured A-D with the folder already made by the .exe copy): the Store copy that makes the folder itself is the case a person with the Store first has.
          Say "== E. the Store copy alone on a clean machine, then the .exe copy"
          Stop-Copies; Remove-Item $real, $legacy, "$cache\Jobadabra" -Recurse -Force -ErrorAction SilentlyContinue
          Start-Msix; Start-Sleep 35; Outcome 'E-msix-first-ever'
          Say "   real folder: $((Files $real | Select-Object -First 6) -join '; ')"
          Say "   package cache: $((Files "$cache\Jobadabra" | Select-Object -First 6) -join '; ')"
          Say "   package cache holds app.log: $(Test-Path "$cache\Jobadabra\logs\app.log")   real folder holds app.log: $(Test-Path "$real\logs\app.log")"
          Stop-Copies; Start-Exe; Start-Sleep 30; Outcome 'E-then-exe'
          Say "   after the .exe copy started: start lines in the real folder's app.log: $(Starts "$real\logs\app.log")"
          Stop-Copies; Remove-Item $real, $legacy, "$cache\Jobadabra" -Recurse -Force -ErrorAction SilentlyContinue

          # Why (31 Oct 2026, run 41226839388: case E put the Store copy's data in the package cache and the .exe copy then made its own real folder = two data sets): does the one lock still hold when the two copies' data is in different places?
          Say "== F. clean machine: the Store copy is open (private data), then the .exe copy is started"
          Start-Msix; Start-Sleep 25; Start-Exe; Start-Sleep 35; Outcome 'F-msix-private-then-exe'
          Say "   real folder: $((Files $real | Select-Object -First 4) -join '; ')"
          Stop-Copies; Remove-Item $real, $legacy, "$cache\Jobadabra" -Recurse -Force -ErrorAction SilentlyContinue

          Say "== A. the .exe copy alone"
          Stop-Copies; Start-Exe; Start-Sleep 30; Outcome 'A-exe-alone'
          Set-Content "$real\marker-written-from-outside.txt" 'outside'
          Say "   real folder after: $((Files $real | Select-Object -First 12) -join '; ')"
          Stop-Copies

          Say "== B. the Store copy alone (the .exe copy's folder already exists)"
          Say "   package cache before: $((Files $cache) -join '; ')"
          Start-Msix; Start-Sleep 35; Outcome 'B-msix-alone'
          Say "   real folder after: $((Files $real | Select-Object -First 12) -join '; ')"
          Say "   package cache after: $((Files $cache | Select-Object -First 20) -join '; ')"
          Say "   package cache has the outside marker: $(Test-Path "$cache\Jobadabra\marker-written-from-outside.txt")"
          Stop-Copies

          Say "== C. the .exe copy is open, then the Store copy is started"
          Start-Exe; Start-Sleep 25; Start-Msix; Start-Sleep 35; Outcome 'C-exe-then-msix'
          Stop-Copies

          Say "== D. the Store copy is open, then the .exe copy is started"
          Start-Msix; Start-Sleep 25; Start-Exe; Start-Sleep 35; Outcome 'D-msix-then-exe'
          Stop-Copies

          Say "== Logs"
          foreach ($log in "$real\logs\app.log", "$cache\Jobadabra\logs\app.log") { if (Test-Path $log) { Say "-- $log"; Get-Content $log -Tail 40 | ForEach-Object { Say "   $_" } } }
          Copy-Item "$real\logs" "$out\real-logs" -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$cache\Jobadabra\logs" "$out\cache-logs" -Recurse -ErrorAction SilentlyContinue
      - name: Keep the report and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: two-installs-report
          path: C:\spike-out
          if-no-files-found: ignore
          retention-days: 14

  virtualization:
    if: inputs.scenario == 'virtualization'
    name: Store package reads and writes AppData
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # stage.mjs counts the extension's commits and refuses a shallow clone
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Compile · bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Compile · build the MSIX, with AppData write virtualization on or off
        working-directory: desktop
        env:
          UNVIRTUALIZED: ${{ inputs.unvirtualized }}
        run: |
          # Why (31 Oct 2026, owner: "Root fix + note"): the manifest edit that turns AppData write virtualization off is desktop/scripts/appx-manifest.mjs, the same file msix-store.yml uses.
          # Try 1 passed -c.appx.capabilities as a string and electron-builder's schema wants an array (run 41229368050); the script now writes the capability into the manifest itself.
          npm version "0.0.1" --no-git-tag-version --allow-same-version >/dev/null
          extra=()
          if [ "$UNVIRTUALIZED" = "true" ]; then
            node scripts/appx-manifest.mjs
            extra=(-c.appx.customManifestPath=appxmanifest-store.xml)
          fi
          npx electron-builder --win appx --publish never \
            -c.appx.identityName=Jobadabra.Spike -c.appx.publisher=CN=JobadabraSpike \
            -c.appx.publisherDisplayName=Jobadabra -c.appx.displayName=Jobadabra -c.appx.applicationId=Jobadabra \
            -c.appx.minVersion=10.0.17763.0 -c.appx.maxVersionTested=10.0.26100.0 "${extra[@]}"
          ls -la dist/*.appx
      - name: Install · sign with a test certificate and install the package
        shell: pwsh
        working-directory: desktop
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject 'CN=JobadabraSpike' -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'spike.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString 'spike' -AsPlainText -Force) | Out-Null
          Import-Certificate -FilePath (Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'spike.cer')).FullName -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName | Select-Object -Last 1).FullName
          $appx = (Get-ChildItem dist\*.appx | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /f $pfx /p spike $appx
          Add-AppxPackage -Path $appx
          $pkg = Get-AppxPackage Jobadabra.Spike
          $pkg | Format-List Name, PackageFullName, PackageFamilyName
          "manifest Properties and Capabilities as installed:"
          $xml = Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml') -Raw
          [regex]::Match($xml, '(?s)<Properties>.*?</Properties>').Value
          [regex]::Match($xml, '(?s)<Capabilities>.*?</Capabilities>').Value
      - name: Measure · what a packaged app sees and where it writes
        shell: pwsh
        run: |
          # Why (31 Oct 2026, coordinator question (a)): with write virtualization off, does an existing Store user still see data that sits in the package's private cache, or does it need a one-time copy?
          $out = 'C:\spike-out'; New-Item -ItemType Directory -Force $out | Out-Null
          $pkg = Get-AppxPackage Jobadabra.Spike
          $appId = ([xml](Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml'))).Package.Applications.Application.Id
          $exe = (Get-ChildItem (Join-Path $pkg.InstallLocation 'app') -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1).FullName
          $real = Join-Path $env:APPDATA 'Jobadabra'
          $cache = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalCache\Roaming\Jobadabra"
          # an existing Store user's data: in the private cache; a file in the real folder as an .exe install would have made it
          New-Item -ItemType Directory -Force $cache, $real | Out-Null
          Set-Content (Join-Path $cache 'seed-in-cache.txt') 'a Store user data file (private cache)'
          Set-Content (Join-Path $real 'seed-in-real.txt') 'an .exe copy data file (real folder)'
          # what the app needs to find the OTHER copy: a stand-in .exe where the NSIS installer puts it, and the packages folder
          $fake = Join-Path $env:LOCALAPPDATA 'Programs\job-pilotto-desktop'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content (Join-Path $fake 'Jobadabra.exe') 'stand-in'
          @'
          const fs = require('fs'), path = require('path');
          const out = [];
          const dir = path.join(process.env.APPDATA, 'Jobadabra');
          const ls = () => { try { return fs.readdirSync(dir).join(', ') || '(empty)'; } catch (e) { return 'ERR ' + e.code; } };
          const read = f => { try { return fs.readFileSync(path.join(dir, f), 'utf8'); } catch (e) { return 'NOT SEEN (' + e.code + ')'; } };
          out.push('the app lists its AppData folder: ' + ls());
          out.push('seed-in-cache.txt: ' + read('seed-in-cache.txt'));
          out.push('seed-in-real.txt: ' + read('seed-in-real.txt'));
          const local = process.env.LOCALAPPDATA;
          const names = d => { try { return fs.readdirSync(d); } catch (e) { return 'ERR ' + e.code; } };
          out.push('inside the package, Packages folders named Jobadabra*: ' + [].concat(names(path.join(local, 'Packages'))).filter(n => /^Jobadabra/.test(n)).join(', '));
          out.push('inside the package, the .exe copy is visible: ' + fs.existsSync(path.join(local, 'Programs', 'job-pilotto-desktop', 'Jobadabra.exe')));
          out.push('inside the package, its own cache folder lists: ' + [].concat(names(path.join(local, 'Packages', process.argv[2], 'LocalCache', 'Roaming', 'Jobadabra'))).join(', '));
          fs.writeFileSync(path.join(dir, 'written-by-app.txt'), 'written by the packaged app');
          fs.appendFileSync(path.join(dir, 'seed-in-cache.txt'), ' + appended by the app');
          fs.appendFileSync(path.join(dir, 'seed-in-real.txt'), ' + appended by the app');
          fs.writeFileSync('C:\\spike-out\\probe.txt', out.join('\n'));
          '@ | Set-Content C:\spike-out\probe.js
          @"
          `$env:ELECTRON_RUN_AS_NODE = '1'
          & '$exe' C:\spike-out\probe.js '$($pkg.PackageFamilyName)'
          "@ | Set-Content C:\spike-out\run.ps1
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId $appId -Command 'powershell.exe' -Args '-NoProfile -ExecutionPolicy Bypass -File C:\spike-out\run.ps1' -PreventBreakaway
          Start-Sleep -Seconds 15
          "== virtualization off: $env:UNVIRT"
          "--- as the packaged app saw it ---"
          if (Test-Path C:\spike-out\probe.txt) { Get-Content C:\spike-out\probe.txt } else { "no result file: the packaged app could not run the probe" }
          "--- the real folder, seen from outside ---"
          Get-ChildItem $real -Force | ForEach-Object { "  $($_.Name): $(Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)" }
          "--- the package's private cache, seen from outside ---"
          Get-ChildItem $cache -Force | ForEach-Object { "  $($_.Name): $(Get-Content $_.FullName -Raw -ErrorAction SilentlyContinue)" }
        env:
          UNVIRT: ${{ inputs.unvirtualized }}
      - name: Prove · a Store user's private data comes over, with the key that opens their secrets
        if: inputs.unvirtualized
        shell: pwsh
        run: |
          # Why (31 Oct 2026, owner: "Build the copy"; coordinator: "a Store user with cached data, then an upgrade to the unvirtualized package, then they see their jobs and their secrets unseal"):
          # the old Store copy's data is in the package's private cache, sealed with the key in its `Local State`. The package built from this branch is the upgrade.
          $out = 'C:\spike-out'; New-Item -ItemType Directory -Force $out | Out-Null
          $pkg = Get-AppxPackage Jobadabra.Spike
          $appId = ([xml](Get-Content (Join-Path $pkg.InstallLocation 'AppxManifest.xml'))).Package.Applications.Application.Id
          $msixExe = (Get-ChildItem (Join-Path $pkg.InstallLocation 'app') -Filter *.exe | Where-Object { $_.Name -notmatch 'uninstall|elevate' } | Select-Object -First 1).FullName
          $real = Join-Path $env:APPDATA 'Jobadabra'
          $cache = Join-Path $env:LOCALAPPDATA "Packages\$($pkg.PackageFamilyName)\LocalCache\Roaming\Jobadabra"
          Remove-Item $real, $cache -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $cache, "$cache\data" | Out-Null
          $electron = (Resolve-Path (Join-Path $env:GITHUB_WORKSPACE 'desktop\node_modules\electron\dist\electron.exe')).Path
          @'
          const {app, safeStorage} = require('electron');
          const fs = require('fs'), path = require('path');
          app.setPath('userData', process.env.SEAL_DIR);
          app.whenReady().then(() => {
            if (process.env.SEAL_MODE === 'seal') fs.writeFileSync(path.join(process.env.SEAL_DIR, 'sealed.txt'), safeStorage.encryptString('the-secret').toString('base64'));
            else { let r; try { r = safeStorage.decryptString(Buffer.from(fs.readFileSync(path.join(process.env.SEAL_DIR, 'sealed.txt'), 'utf8'), 'base64')); } catch (e) { r = 'CANNOT OPEN: ' + e.message; } fs.writeFileSync(process.env.SEAL_OUT, r); }
            setTimeout(() => app.quit(), 500);
          });
          '@ | Set-Content "$out\seal.js"
          function Seal($mode, $dir, $result) { $env:SEAL_MODE = $mode; $env:SEAL_DIR = $dir; $env:SEAL_OUT = $result; Start-Process $electron -ArgumentList "$out\seal.js" -Wait; Start-Sleep 2 }
          # the old Store copy: a person's setup, jobs, and a token sealed by its own key
          Set-Content "$cache\settings.json" '{"setupDone":true}'
          Set-Content "$cache\data\jobs.sqlite" 'the person jobs'
          Seal 'seal' $cache "$out\unused.txt"
          "private cache holds Local State with a key: $((Test-Path "$cache\Local State") -and ((Get-Content "$cache\Local State" -Raw) -match 'encrypted_key'))"
          "sealed.txt written: $(Test-Path "$cache\sealed.txt")"
          # control: the same sealed file next to a fresh Chromium key does not open (why Local State must travel)
          $control = Join-Path $env:RUNNER_TEMP 'control'; New-Item -ItemType Directory -Force $control | Out-Null
          Copy-Item "$cache\sealed.txt" $control
          Seal 'open' $control "$out\control-result.txt"
          "control (sealed file + a fresh key): $(Get-Content "$out\control-result.txt" -Raw -ErrorAction SilentlyContinue)"
          $before = Get-ChildItem $cache -Recurse -File | ForEach-Object { "$($_.FullName.Substring($cache.Length)) $((Get-FileHash $_.FullName).Hash)" }
          # the upgrade: the new package's first start
          @"
          `$env:CI = 'true'; `$env:GITHUB_ACTIONS = 'true'
          Start-Process '$msixExe'
          "@ | Set-Content "$out\launch-msix.ps1"
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId $appId -Command 'powershell.exe' -Args "-NoProfile -ExecutionPolicy Bypass -File $out\launch-msix.ps1" -PreventBreakaway
          Start-Sleep 60
          $procs = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -like '*WindowsApps*Jobadabra.Spike*' })
          "package processes after the upgrade start: $($procs.Count), renderer: $(@($procs | Where-Object { $_.CommandLine -match '--type=renderer' }).Count)"
          "marker: $(Get-Content "$real\store-cache-copy.json" -Raw -ErrorAction SilentlyContinue)"
          "real folder: $((Get-ChildItem $real -Recurse -File -Force | Select-Object -First 40 | ForEach-Object { $_.FullName.Substring($real.Length) }) -join '; ')"
          "jobs file in the real folder: $(Get-Content "$real\data\jobs.sqlite" -Raw -ErrorAction SilentlyContinue)"
          "settings in the real folder: $(Get-Content "$real\settings.json" -Raw -ErrorAction SilentlyContinue)"
          $after = Get-ChildItem $cache -Recurse -File | ForEach-Object { "$($_.FullName.Substring($cache.Length)) $((Get-FileHash $_.FullName).Hash)" }
          "private cache unchanged: $(-not (Compare-Object $before $after))"
          "app.log start lines in the real folder: $(@(Select-String -Path "$real\logs\app.log" -Pattern '\[app\] start' -ErrorAction SilentlyContinue).Count)"
          Get-Content "$real\logs\app.log" -ErrorAction SilentlyContinue | Select-String 'Store data copy' | ForEach-Object { "  log: $($_.Line)" }
          Get-Process | Where-Object { $_.Path -like '*WindowsApps*Jobadabra.Spike*' } | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep 5
          Seal 'open' $real "$out\real-result.txt"
          "their secret opens in the real folder: $(Get-Content "$out\real-result.txt" -Raw -ErrorAction SilentlyContinue)"
          # a second start copies nothing and restarts nothing
          Invoke-CommandInDesktopPackage -PackageFamilyName $pkg.PackageFamilyName -AppId $appId -Command 'powershell.exe' -Args "-NoProfile -ExecutionPolicy Bypass -File $out\launch-msix.ps1" -PreventBreakaway
          Start-Sleep 30
          "second start: app.log start lines now $(@(Select-String -Path "$real\logs\app.log" -Pattern '\[app\] start').Count); marker $((Get-Content "$real\store-cache-copy.json" -Raw | ConvertFrom-Json).state)"
          Get-Process | Where-Object { $_.Path -like '*WindowsApps*Jobadabra.Spike*' } | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: virtualization-report
          path: C:\spike-out
          if-no-files-found: ignore
          retention-days: 14

  notice-preview:
    if: inputs.scenario == 'notice-preview'
    name: Show the installed-twice note on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Show the note for each copy and take a screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $out = 'C:\spike-out'; New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location desktop; node node_modules/electron/install.js; $electron = (node -e "process.stdout.write(require('electron'))"); Pop-Location
          "electron: $electron"
          $lib = (Resolve-Path 'desktop\lib\two-installs-notice.js').Path -replace '\\', '/'
          @"
          const {app, dialog} = require('electron');
          app.whenReady().then(async () => {
            const {noticeOptions} = await import('file:///$lib');
            setTimeout(() => app.quit(), 9000);
            dialog.showMessageBoxSync(noticeOptions({self: process.env.SELF}));
          });
          "@ | Set-Content "$out\notice.cjs"
          foreach ($self in 'exe', 'store') {
            $env:SELF = $self
            $p = Start-Process $electron -ArgumentList "$out\notice.cjs" -PassThru
            Start-Sleep 6
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$out\notice-$self.png")
            Stop-Process $p -Force -ErrorAction SilentlyContinue; Start-Sleep 2
          }
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: notice-preview
          path: C:\spike-out
          retention-days: 7
