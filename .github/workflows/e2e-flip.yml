# Report a same-commit retry flip as an owner issue with a proposed registry entry; never edit lanes.json.
# Job: report health
name: E2E · Suspend a retry flip
on:
  workflow_run:
    workflows: ['CI · End-to-end on Mac + Linux']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed main e2e run to inspect (all attempts)'
        type: string
        required: true

permissions:
  actions: read
  issues: write
  contents: read

# Keep the lookup and issue creation together, including different runs flipping the same suite.
concurrency:
  group: e2e-flip
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Collect every attempt
        timeout-minutes: 5
        id: attempts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo 'Run id must be numeric.' >&2; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" '
            .head_branch == "main" and .head_repository.full_name == $repo and
            .path == ".github/workflows/e2e.yml" and .status == "completed" and .run_attempt >= 1
          ' <<< "$run" >/dev/null; then
            echo 'No completed main e2e run to inspect.'
            exit 0
          fi
          count="$(jq -r .run_attempt <<< "$run")"
          dir="$(mktemp -d "$RUNNER_TEMP/flip.XXXXXX")"
          pages=()
          for ((n=1; n<=count; n++)); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$n/jobs?per_page=100" --paginate --slurp > "$dir/$n.json"
            pages+=("$dir/$n.json")
          done
          jq -s --argjson run "$run" '{run: $run, attempts: [.[][]]}' "${pages[@]}" > "$dir/attempts.json"
          echo "attempts=$dir/attempts.json" >> "$GITHUB_OUTPUT"
          # Why (29 Oct 2026, owner): G5 keeps wrong-value flips red; green jobs need no traces or screenshots downloaded.
          # Why (29 Oct 2026, Gitar on #2473): the job name is matrix.key and its artifact is exactly e2e-artifacts-<key>; a prefix pattern pulled applyflows into apply and made gh refuse to overwrite.
          jq -r '[.attempts[].jobs[] | select(.run_attempt == 1 and .conclusion == "failure") |
            "e2e-artifacts-\(.name)"] | unique[]' \
            "$dir/attempts.json" > "$dir/artifact-patterns.txt"
          if [ -s "$dir/artifact-patterns.txt" ]; then echo "artifact_patterns=$dir/artifact-patterns.txt" >> "$GITHUB_OUTPUT"; fi
      - name: Download first-try artifacts
        timeout-minutes: 5
        id: artifacts
        if: steps.attempts.outputs.artifact_patterns != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
          PATTERNS: ${{ steps.attempts.outputs.artifact_patterns }}
        run: |
          dir="$(mktemp -d "$RUNNER_TEMP/flip-artifacts.XXXXXX")"
          while IFS= read -r name; do
            # A job that failed before the suite wrote anything uploaded no artifact: the flip is still judged from the job results.
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$dir/$name" || echo "::warning::No first-try artifact for $name"
          done < "$PATTERNS"
          echo "folder=$dir" >> "$GITHUB_OUTPUT"
      - name: Propose suspension and open its owner issue
        if: steps.attempts.outputs.attempts != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPTS: ${{ steps.attempts.outputs.attempts }}
          ARTIFACTS: ${{ steps.artifacts.outputs.folder }}
          OWNER: ${{ github.repository_owner }}
        run: |
          artifacts=()
          [ -z "$ARTIFACTS" ] || artifacts=(--artifacts "$ARTIFACTS")
          node tools/suspend-flip.mjs --attempts "$ATTEMPTS" "${artifacts[@]}" --owner "$OWNER" --open --repo "$GITHUB_REPOSITORY"
