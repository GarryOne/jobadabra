name: CI · Harness tests
# Every e2e harness unit test (desktop/e2e/test/*/*.test.mjs, `npm test`) on each pull request that changes what one reaches; harness-daily.yml runs the same command nightly on main.
# Why (owner, 30 Oct 2026, option C "run all on every PR"): a PR ran only a "pr" set plus the files its changes reached (test-sets.json, a picker), so tests outside them went red unseen
# (harness-daily red 28-30 Oct: 1, 3, then 6 tests, one a PR-workflow AI guard), and every new test edited the one shared list (8 PRs conflicting on it, 30 Oct). The whole folder takes 4-5 min in one job; it runs as 3 parallel parts now (1 Nov 2026).
# GitHub's `on: paths:` below starts it for every area a harness test reaches (test/harness/test-reach.test.mjs fails when one is missing).
# Not a required check: a required check whose workflow `paths:` skips never reports and blocks the PR (tests/test_affected_jobs.py). The backstop is harness-daily.yml.
# History: they ran only in e2e.yml's scheduled plan job, which broke silently for ~11 h (12 Oct 2026, ERR_MODULE_NOT_FOUND after 3394c2e); here they gate the change that would
# break them (test/record/recorded-ci-deps.test.mjs checks every job that runs them installs the app's own packages and stages desktop/shared).
on:
  workflow_call:   # main (build.yml) runs the same tests on every push, as a job beside the unit job (owner, 1 Nov 2026, test stages 3-5)
  pull_request:
    branches: [main]
    paths:
      # Every file or folder a harness test reaches (desktop/e2e/lib/test-reach.mjs), so a change that can break one starts the run: test/harness/test-reach.test.mjs fails on a missing one.
      - 'desktop/**'
      - '.github/workflows/ai-answer-drift.yml'
      # Data that other jobs replay (page-cases.yml, control-tests.yml); no harness test reaches them (owner, 14 Oct 2026: a recorded case alone started the harness).
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      # ... except the ones a harness test reads (a later pattern wins)
      - 'desktop/e2e/fixtures/slice-ci-seconds.json'
      - 'desktop/e2e/fixtures/part-seconds.json'
      - 'desktop/e2e/fixtures/cv.json'
      - 'desktop/e2e/fixtures/cv.pdf'
      # Why (#2435/#2450, 29 Oct 2026): ai-answers.mjs reads the golden directory and the photographer's stored sources and truth.
      - 'desktop/e2e/fixtures/golden/**'
      - 'desktop/e2e/fixtures/golden-photographer/sources.json'
      - 'desktop/e2e/fixtures/golden-photographer/truth.json'
      - 'desktop/e2e/fixtures/real-forms/**'
      - 'desktop/e2e/fixtures/visits/**'
      - 'desktop/e2e/recorded/multi-select-menu-1/form.html'
      - 'extension/**'
      - 'src/**'   # test/pool/quality.test.mjs reads the engine's folder
      - '.github/workflows/**'
      - '.github/workflows/e2e-windows.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/journeys.yml'
      - '.github/workflows/page-cases.yml'
      - '.github/workflows/product-brain.yml'
      - '.github/workflows/replay-refill.yml'
      - 'hosted/ready-fill/extension-storage.mjs'
      - 'hosted/ready-fill/fill-video.mjs'
      - 'tools/ai-answers-stamp.mjs'
      - 'tools/ai-format-capture.mjs'
      - 'tools/ai-format-js-capture.mjs'
      - 'tools/ai-format-python-capture.py'
      - 'tools/browser-submit-guard.js'
      - 'tools/claim-shape.mjs'
      - 'tools/e2e-part-times.mjs'
      - 'tools/design-system/build.mjs'
      - 'tools/design-system/rules-html.mjs'
      - 'tools/design-system/serve.mjs'
      - 'tools/design-system/zip.mjs'
      - 'tools/flaky-verdict.mjs'
      - 'tools/lanes-check.mjs'
      - 'tools/pool-rows.mjs'
      - 'tools/persona-search/codex.mjs'
      - 'tools/record-env.mjs'
      - 'tools/red-main-verdict.mjs'
      - 'tools/rung-trailer.mjs'
      - 'tools/seed-ai-answer-requests.mjs'
      - 'tools/sentry-fixer/codex-fix.mjs'
      - 'tools/sentry-fixer/lib.mjs'
      - 'tools/suspend-flip.mjs'
      - 'worker/src/**'   # staged into desktop/shared/worker/, which the app's server imports (review on #2241)

permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read

concurrency:   # a PR's newer push replaces its older run; each commit of main keeps its own (called from build.yml there is no PR number: tests/test_main_runs_finish.py)
  group: harness-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    # Why (owner, 1 Nov 2026: "let's just split the harness tests"): 3 parallel parts, node's own --test-shard (every file lands in exactly one part, round-robin by sorted name).
    # Measured on main run 41269779066: one job 416 s (tests 371 s, setup 45 s); the heaviest part of 3 holds about 37% of the test seconds. What to remove from it is decided later.
    name: harness tests (${{ matrix.part }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false   # every part reports its own reds; one red part must not hide the others
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: The browsers for the tests' own tests (the full one loads the extension)
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      # The same command as harness-daily.yml: one list, the folder itself.
      - name: Every harness test (this part)
        working-directory: desktop/e2e
        # Why (Gitar on #2793): node reads --test-shard only before the files, and npm adds extra arguments after the glob, where the flag is ignored and all 3 parts run the whole folder. The script carries the flag and reads this variable.
        env:
          TEST_SHARD: ${{ matrix.part }}/3
        run: npm test
