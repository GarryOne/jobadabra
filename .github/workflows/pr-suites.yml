name: CI · E2E suites for a PR
# The e2e suites a pull request points at (its UI text, its suite or harness files, and since gate G1b the suites that RUN the lines it changes: the code → suite map from
# main's coverage, e2e.yml's coverage-map job), started on the PR's own branch through e2e.yml: Linux suites, plus a macOS suite the map says ran the changed lines.
# A red suite blocks the merge (gate G1a, owner's yes 26 Oct 2026: on 25 Oct two run-view PRs saw cardstates red on their own run, merged, and beta 2 failed on it): the e2e
# run, titled "E2E for PR · <suites> · <branch>", is read by pr-verdict.yml into the PR's "All checks passed", and its first red suite turns that status red at once.
# This job only starts the run and ends (26 Oct 2026): it used to wait for it on a runner, ~20 min per push (owner: "How could you design such a slow and inefficient
# method of checking PRs?"). A flaky suite (red, then green on the same commit) passes inside e2e.yml; red twice blocks.
# Was report only from 24 Oct 2026, at most 4 suites. Why it exists: 8 of ~10 e2e fixes in beta runs 5-11 were tests lagging the app, found a night late.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'desktop/renderer/**'
      - 'desktop/lib/**'
      - 'desktop/main.js'
      - 'desktop/e2e/suites/**'
      - 'desktop/e2e/lib/**'
      - 'extension/**'
      # The files suites watch (their `export const watches`; #2043 changed quality's score.py and never started this: tests/test_workflow_paths.py)
      - 'src/ai/**'   # and what those import from their folder (lib/import-graph.mjs watchesWithImports: #2043's schema_notes.py, imported by score.py)
      - 'tools/mail_eval.py'
      - 'tests/fixtures/mail_eval.json'
      - 'desktop/e2e/fixtures/golden/**'
      - '.github/workflows/pr-suites.yml'

permissions:
  contents: read
  actions: write   # start e2e.yml on the PR's branch, see it listed (and read the coverage map artifact)
  pull-requests: read   # the PR still open? (no e2e run for a merged one); the PR's verdict
  statuses: write       # the PR's "All checks passed"

concurrency:
  group: pr-suites-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start:
    name: Start the suites this PR points at
    # A fork has no secrets: nothing to run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # the plan and the start; nothing waits here for the suites
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install what the plan loads
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}   # reads the newest code → suite map artifact (desktop/e2e/pr-suites.mjs)
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          git fetch -q origin main
          node desktop/e2e/pr-suites.mjs --base origin/main --plan | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Start them
        id: start
        if: steps.plan.outputs.suites != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ steps.plan.outputs.suites }}
          LEFT: ${{ steps.plan.outputs.left }}
          STEPS: ${{ steps.plan.outputs.steps }}   # {suite: [step names]}: only the steps this PR's changed lines reach (desktop/e2e/pr-suites.mjs)
          HEAD_REF: ${{ github.head_ref }}   # a branch name is untrusted text: never inline in the script
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          # Merged or closed while this job waited for a runner (an override merge deletes the branch: #2041 went red on HTTP 422 "No ref found"): nothing to test.
          if [ "$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)" != OPEN ]; then echo "PR #$PR is merged or closed: no e2e run." | tee -a "$GITHUB_STEP_SUMMARY"; echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          # The input made for this (e2e.yml): SQLite store, no screenshot review, no harness-test step. It runs the PR branch's own e2e.yml, so a branch cut before the input existed gets HTTP 422.
          if ! gh workflow run e2e.yml --ref "$HEAD_REF" -f pr_suites="$SUITES" -f pr_steps="${STEPS:-}" 2>"$RUNNER_TEMP/dispatch.err"; then
            cat "$RUNNER_TEMP/dispatch.err"
            if grep -q 'Unexpected inputs' "$RUNNER_TEMP/dispatch.err"; then echo "This branch's e2e.yml is older than main's: rebase on main (tools/ship.sh does it), then push again." | tee -a "$GITHUB_STEP_SUMMARY"; fi
            exit 1
          fi
          echo "Started e2e.yml on \`$HEAD_REF\`: $SUITES. Left to the gate: ${LEFT:-none}. See https://github.com/$GITHUB_REPOSITORY/actions/workflows/e2e.yml" | tee -a "$GITHUB_STEP_SUMMARY"
      # Seen listed before this job ends: pr-verdict.yml runs when this workflow ends, and must find the e2e run pending, never a commit that looks finished.
      - name: See the e2e run listed
        if: steps.plan.outputs.suites != '' && steps.start.outputs.skipped != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 1 24); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow e2e.yml --commit "$HEAD_SHA" -L 20 --json databaseId,displayTitle -q '[.[] | select(.displayTitle | startswith("E2E for PR · "))][0].databaseId // empty')"
            [ -n "$id" ] && { echo "E2E for this PR: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
            sleep 5
          done
          echo "::error::no \"E2E for PR\" run for $HEAD_SHA after 2 min: this branch's e2e.yml is older than main's (its runs are titled otherwise). Rebase on main (tools/ship.sh does it) and push again."; exit 1
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
