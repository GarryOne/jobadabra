name: CI · UI findings

# THE PRODUCER of the UI loop. After EVERY end-to-end run (e2e.yml: the run after the nightly build, and the three daytime runs: four a day) it reads the run's artifacts
# and files what they found as GitHub issues, one per problem: severity, kind, view and suite as labels, the screenshot, the app's state, the logs of a failed step, a
# "Seen again" comment with a new screenshot each time a finding comes back, and "Not seen" when its page was reviewed again and it did not. No AI fix happens here
# (ui-fix.yml does that, four times a day, for the most critical issue). A false positive is closed with the label `wontfix-auto`; a real one a person marks `confirmed`.
on:
  workflow_run:
    # a Windows run files its own issues, labelled platform:windows. The release run (desktop.yml, 7 Oct 2026) holds both gates: filed once per platform (the matrix below).
    workflows: ['CI · End-to-end on Mac + Linux', 'CI · End-to-end on Windows', 'Release · Build, test, beta']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'An e2e run id whose artifacts to file'
        required: false
      platform:
        description: "mac (e2e.yml) or windows (e2e-windows.yml): the run's platform, for a run_id filed by hand"
        required: false
      plant:
        description: 'DRY RUN, only on a branch other than main: a ui-findings.json array to file instead of a real run (see desktop/e2e/README.md)'
        required: false

permissions:
  contents: write   # the evidence branch (pr-assets): the screenshots the issues show
  issues: write
  actions: read

concurrency:
  group: ui-findings
  cancel-in-progress: false

jobs:
  findings:
    # Scheduled, chained or by hand only; a push-triggered e2e run (a change to the tests themselves) is not evidence about the product.
    # The daily stable canary (stable-canary.yml) names its runs "Stable canary …": it alarms by itself and never files into the backlog.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event != 'push' && !startsWith(github.event.workflow_run.display_title, 'Stable canary') && !startsWith(github.event.workflow_run.display_title, 'Mutant') && !startsWith(github.event.workflow_run.display_title, 'Bisect '))   # a bisect step tests an old commit on purpose (gate G2b)   # a mutation test breaks the app on purpose: never filed
    runs-on: ubuntu-24.04
    timeout-minutes: 35   # 15 for filing, up to 15 more for judging before filing (its own step limit below)
    # The release run tested both platforms in one run: Mac + Linux first, then Windows, one after the other (both write issues). Any other run: one platform.
    strategy:
      max-parallel: 1
      matrix:
        platform: ${{ fromJson(github.event.workflow_run.name == 'Release · Build, test, beta' && '["mac","windows"]' || '[""]') }}
    env:
      GH_TOKEN: ${{ github.token }}
      NOTION_BRAIN_WRITE_TOKEN: ${{ secrets.NOTION_BRAIN_WRITE_TOKEN }}   # a planted bug no detector caught becomes a Bug Tracker row (desktop/e2e/lib/tracker-write.mjs); no token, no row
      BUG_TRACKER_DB: ${{ vars.BUG_TRACKER_DB }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
      RUN_URL: ${{ github.event.workflow_run.html_url || format('https://github.com/{0}/actions/runs/{1}', github.repository, inputs.run_id || github.run_id) }}
      PLANT: ${{ inputs.plant }}
      RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}   # main, or the release tag
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      PLATFORM: ${{ matrix.platform || inputs.platform || (contains(github.event.workflow_run.name, 'Windows') && 'windows') || 'mac' }}
      BASE: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download the run's screenshots and findings (or plant one, for a dry run)
        run: |
          mkdir -p e2e-artifacts
          if [ -n "$PLANT" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "A planted finding is only allowed off main." >&2; exit 1; fi
            printf '%s' "$PLANT" > e2e-artifacts/ui-findings.json
            echo "DRY RUN on $BASE: triaging a planted finding."
          elif [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$REPO" --pattern 'e2e-artifacts-*' --dir e2e-artifacts || echo "No artifacts for run $RUN_ID"   # one folder per suite
            # Only this platform's suites (the release run has both: e2e-artifacts-<suite> and e2e-artifacts-windows-<suite>).
            if [ "$PLATFORM" = windows ]; then find e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-*' ! -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
            else find e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-windows-*' -exec rm -rf {} +; fi
          fi
      # JUDGE BEFORE FILING (desktop/e2e/lib/prejudge.mjs): the run's new findings (at most 3) are judged in one Claude session before any issue opens; noise is
      # never filed. Only with JOB_PILOTTO_FIXER_VERDICTS = "on" (AI credit) and while the AI budget breaker is closed; otherwise everything is filed as before.
      - name: New findings to judge before filing
        id: pending
        if: vars.JOB_PILOTTO_FIXER_VERDICTS == 'on' && env.PLANT == ''
        run: |
          mkdir -p .heal
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "pending=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node desktop/e2e/triage.mjs --artifacts e2e-artifacts --run-url "$RUN_URL" --out .heal --platform "$PLATFORM" --pending-out .heal/pending.json
          node desktop/e2e/reversals.mjs --out .heal/lessons.md   # the owner's corrections, appended to the prompt
          node desktop/e2e/prejudge.mjs --pending .heal/pending.json --out .heal
      - name: Claude judges them (read-only)
        id: judge
        timeout-minutes: 15   # a slow judgement must never cost the run its filing: on timeout the findings are filed as before
        if: steps.pending.outputs.pending != '' && steps.pending.outputs.pending != '0'
        continue-on-error: true   # no verdict: the findings are filed as before and judged later (ui-verdict.yml)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.UI_FINDINGS_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 30
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*)"
          prompt: Read .heal/prejudge-prompt.md and follow it exactly. Write only .heal/verdicts.md.
      - name: Why Claude failed (the API's own error)
        if: failure()
        run: python3 tools/claude-failure-reason.py
      - name: Read the verdicts, and the cost of judging
        if: steps.pending.outputs.pending != '' && steps.pending.outputs.pending != '0'
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          node desktop/e2e/prejudge.mjs --parse .heal/verdicts.md --pending .heal/pending.json --out .heal/verdicts.json || true
          node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job "judging ${{ steps.pending.outputs.pending }} finding(s) before filing" || true
          node desktop/e2e/ai-cost-report.mjs --job ui-prejudge --execution /home/runner/work/_temp/claude-execution-output.json --suffix "$RUN_ID" || true
      - name: File the findings
        run: |
          mkdir -p .heal
          # Which code was tested: an issue about a finding already fixed on main must be recognisable at a glance.
          BUILD=""
          if [ -n "$RUN_SHA" ]; then BUILD="${RUN_BRANCH} @ ${RUN_SHA:0:7} (${RUN_EVENT} run)"; fi
          # A run that tested another commit than its own (a soak top-up on a release tag) says which one. tested.txt has no final newline: `read` then
          # returns 1 and bash -e ended the step, so nothing was filed (3 Oct 2026, four runs).
          tested=$(find e2e-artifacts -name tested.txt | head -1)
          if [ -n "$tested" ]; then read -r label sha < "$tested" || true; BUILD="${label} @ ${sha:0:7} (${RUN_EVENT} run)"; fi
          # The app version too, when a build was made from that commit (its desktop-v* tag; looked up now, as a push's build can finish after its e2e run).
          # No build yet: the line keeps just the commit. A peeled `^{}` row is an annotated tag's commit.
          full=${sha:-$RUN_SHA}
          if [ -n "$full" ]; then
            version=$(git ls-remote --tags origin 'refs/tags/desktop-v*' | awk -v s="$full" '$1 == s { t = $2; sub("refs/tags/desktop-", "", t); sub(/\^\{\}$/, "", t); print t; exit }') || true
            if [ -n "$version" ]; then BUILD="${version} · ${BUILD}"; fi
          fi
          judged=(); if [ -f .heal/verdicts.json ]; then judged=(--verdicts .heal/verdicts.json); fi
          # The suites whose job was cancelled or timed out in the run under test: their findings are partial, and each issue says so (desktop/e2e/lib/run-context.mjs).
          incomplete=""
          if [ -n "$RUN_ID" ]; then incomplete=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs -q '[.jobs[] | select(.conclusion == "cancelled" or .conclusion == "timed_out") | .name | sub("^.* / "; "") | sub("^E2E · [^·]+ · "; "") | sub(" \\(Windows\\)$"; "")] | join(",")' 2>/dev/null || true); fi
          node desktop/e2e/triage.mjs --artifacts e2e-artifacts --run-url "$RUN_URL" --out .heal --file-only --build "$BUILD" --platform "$PLATFORM" --incomplete "$incomplete" "${judged[@]}"
      # What this run filed, dropped and called stale, kept as numbers for /self-heal (desktop/e2e/lib/run-summary.mjs): the reasons findings were dropped were once only in the step summary.
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.heal/run-summary.json') != ''
        with:
          name: finder-run-summary${{ matrix.platform && format('-{0}', matrix.platform) || '' }}   # two in a release run; selfheal-stats.mjs reads every finder-run-summary*
          path: .heal/run-summary.json
          retention-days: 60
