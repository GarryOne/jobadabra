<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fullstack Engineer with DevOps Mindset at E2E Chain Recruiting</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}.field{margin:14px 0}label{display:block;margin-bottom:4px}input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body><h1>Fullstack Engineer with DevOps Mindset</h1><p>E2E Chain Recruiting · Zurich, Switzerland</p>
<style>.field label.up{font-size:11px;color:#667}</style><form id="application_form"><div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required ></div><div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required ></div><div class="field"><label for="email">E-mail *</label><input id="email" name="email" type="email" required ></div><div class="field"><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div><div class="field"><label for="question_3001">Years of experience with Kubernetes *</label><input id="question_3001" name="question_3001" type="text" required ></div><div class="field"><button type="submit" id="submit_app">Submit Application</button></div></form>
<script>
const fired = kind => fetch('/__fired?kind=' + kind + '&form=' + encodeURIComponent(location.pathname), {method: 'POST', keepalive: true});
document.addEventListener('click', event => { if (event.target.closest('[type=submit]')) fired('click'); }, true);
document.addEventListener('submit', event => { event.preventDefault(); fired('submit'); }, true);
document.querySelectorAll('input[type=text],input[type=email]').forEach(input => input.addEventListener('blur', () => document.querySelector('label[for=' + input.id + ']').classList.toggle('up', !!input.value)));
</script></body></html>
