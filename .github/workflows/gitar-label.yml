# Puts one coloured "Gitar: …" label on a PR from Gitar's verdict comment, so the PR list shows changes requested / approved with suggestions / approved (owner, 28 Oct 2026).
# Runs main's copy (pull_request_target, issue_comment; Gitar's verdict arrives as a comment, so no pull_request_review trigger) and NEVER checks out or runs the PR's code; its only writes are labels. Cost per event: a few seconds on ubuntu.
# Gray labels: "reviewing" while Gitar has no verdict for the head, "working on PR comments" while a session handles feedback (set by tools/ship-watch.sh; a push or approval clears it).
# A push removes a stale green/yellow at once (the verdict is older than the head commit); Gitar's re-review edits its comment, which sets the label again. Parser and cases: tools/gitar-label.mjs, tests/test_gitar_label.py.
name: CI · Gitar label
run-name: Gitar label on #${{ github.event.pull_request.number || github.event.issue.number }}

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  checks: read   # the head's first check suite gives its push time (tools/gitar-label.mjs)
  pull-requests: write
  issues: write

jobs:
  label:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login == 'gitar-bot[bot]')
    # Why (28 Oct 2026, owner's PR list: #2400 showed a red ✗ from a cancelled label run): no concurrency group. A cancelled run is drawn as a failed check in
    # the PR list. Runs needing a live sync re-read the verdict, head and labels after every write until nothing changes (converge in
    # tools/gitar-label.mjs); unchanged comment payloads from GITHUB_EVENT_PATH skip all API calls, and pushes always sync live state.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # main's copy of the script, whatever event started this (Gitar on web#216)
          sparse-checkout: tools/gitar-label.mjs
      - name: Set the label from Gitar's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: node tools/gitar-label.mjs "$PR"
