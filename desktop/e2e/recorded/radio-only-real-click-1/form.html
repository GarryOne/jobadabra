<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Recorded page (hand-cut from the widget zoo): Role=radio options that ignore a scripted click (event.isTrusted false): only a real click selects. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<label id="reloc-label">Are you willing to relocate?</label>
<div role="radiogroup" aria-labelledby="reloc-label"><div role="radio" aria-checked="false" tabindex="0" data-v="yes">Yes</div><div role="radio" aria-checked="false" tabindex="0" data-v="no">No</div></div>
</form>
<script>
for (const r of document.querySelectorAll('[role=radio]')) r.addEventListener('click', e => { if (!e.isTrusted) return; for (const o of r.parentElement.children) o.setAttribute('aria-checked', 'false'); r.setAttribute('aria-checked', 'true'); });
</script>
</body></html>
