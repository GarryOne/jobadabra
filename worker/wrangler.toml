# Telegram webhook for @sre_job_pilotto_bot. Deploy: npm run deploy
name = "sre-job-pilotto-bot"
# Why (1 Nov 2026, owner: desktop + extension only): the code is app-core/src, which the app also runs; this folder is only the deploy shell (it moves to jobadabra-web).
main = "../app-core/src/index.js"
compatibility_date = "2026-09-01"

# No cron triggers here any more: the on-time starts (04:00 Zurich nightly build, three e2e runs a day, night passes, PR verdict sweeps every 10 minutes, /self-heal numbers every 3 hours) are started by the site Worker (www, jobadabra-web workers/www/wrangler.toml); their rules stay in app-core/src/scheduler.js.
# GitHub's own crons in the workflow files stay as the backup (the night passes have none).
# Why (2 Nov 2026, owner: "Timers to site Worker, delete bot"): the account allows 5 cron triggers and all 5 were used, so the bot gives its three up BEFORE www takes the 47 one.
[triggers]
crons = []

[vars]
GITHUB_REPO = "jobadabra/jobadabra"
WORKFLOW_FILE = "daily.yml"
NOTION_APPLICATIONS_DB = "f56b68942d3b43cbb85a7b1ebfe2df1b"
NOTION_EVENTS_DB = "95ae2d6b81804e838985d0de5cbd945b"
NOTION_PROFILE_PAGE_ID = "3e562be8fd8681579078d09829921b8c"
NOTION_ANSWERS_PAGE_ID = "3e562be8fd868108ae38d1f47d52a811"

# Secrets, set with `npx wrangler@4 secret put <NAME>`:
# TELEGRAM_BOT_TOKEN, OWNER_CHAT_ID, WEBHOOK_SECRET, GITHUB_TOKEN, NOTION_TOKEN,
# EXTENSION_TOKEN (the Chrome extension's access token; see extension/README.md),
# ANTHROPIC_API_KEY (the extension's "Fill with AI" answers)
