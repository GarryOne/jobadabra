      - 'worker/src/answer-facts.js'
      - 'worker/src/country-names.js'
      - 'worker/src/pay-convert.js'
      - 'worker/src/written-answer.js'
      - 'worker/src/writing-rules.js'
      - 'worker/src/answer-missing.js'
      - 'worker/src/cv-facts.js'
      - 'worker/src/extension-log.js'
      - 'worker/src/extension-run-record.js'
      - 'worker/src/extension.js'
      - 'worker/src/job-answers.js'
      - 'worker/src/owner-guard.js'
      - 'desktop/e2e/package.json'
      - 'desktop/e2e/package-lock.json'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/page-cases.yml'
      - '.github/actions/playwright-browser/**'
  workflow_dispatch:
    inputs:
      window:
        description: 'quick = what a pull request runs (measures PR seconds per case); full = the whole window'
        default: 'full'
        type: choice
        options: [full, quick]
  schedule:
    - cron: '0 3 * * *'   # daily, the FULL window (owner, 17 Oct 2026): a pull request ends a must-not-happen window early (JP_REPLAY_WINDOW=quick); main (build.yml) and this daily run wait the whole window, so a late forbidden action is caught once a day

concurrency:   # newest wins (owner, 15 Oct 2026): a newer push replaces the PR's older run, (main runs these cases inside build.yml, so no push group here); a by-hand and the daily run is its own group and never cancelled
  group: recorded-pages-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  JP_REPLAY_SHARD_COUNT: 2   # two longer parts, not four (15 Oct 2026: a flow PR started ~25 jobs and PRs waited for runners); the documented ~8-minute replay also needs setup/full-window retry headroom; retain the existing 20-minute ceiling (#2306)

jobs:
  replay:
    name: page cases ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 2}   # HEAD^1 (the base, on a pull_request run) for the changed-files step below
      - name: The PR paths list everything this workflow loads
        run: node tools/replay-files.mjs --check page-cases.yml
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      # A row case starts the offline app, which imports desktop/lib/server.js and its packages (@anthropic-ai/sdk).
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - name: Chromium (the real extension needs the full browser, not the headless shell)
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e}
      - name: The files this pull request changes (a slow case runs on it only if it touches that case's folder)
        id: changed
        if: github.event_name == 'pull_request'
        # Why (28 Oct 2026, #2367/#2364 went red on "API rate limit exceeded for installation"): the checkout is the merge commit, so its first parent is the base and
        # the PR's files are one git diff away; a call to the API let the shared token budget decide a PR's red. HEAD must have two parents (Gitar on #2369: a head-ref
        # checkout would give the last commit's files) and the list is read BEFORE the block is opened: a failure stops the step saying so, not "Matching delimiter not found"
        # (tests/test_page_cases_workflow.py plays both).
        run: |
          [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ] || { echo "HEAD is not the pull request's merge commit (one commit and its two parents): its changed files cannot be read from git" >&2; exit 1; }
          files="$(git diff --name-only HEAD^1 HEAD)"
          { echo 'files<<CHANGED_END'; echo "$files"; echo 'CHANGED_END'; } >> "$GITHUB_OUTPUT"
      - name: Replay this shard's recorded cases
        working-directory: desktop/e2e
        env:
          JP_REPLAY: 1
          JP_REPLAY_TABS: 4
          JP_REPLAY_WINDOW: ${{ github.event_name == 'pull_request' && 'quick' || github.event_name == 'workflow_dispatch' && inputs.window || 'full' }}   # lib/page-replay.mjs watchWindow: quick = end a must-not-happen window once the fill is over and the page quiet 12 s; full = the whole window
          JP_REPLAY_SHARD: ${{ matrix.shard }}/${{ env.JP_REPLAY_SHARD_COUNT }}
          JP_REPLAY_PR_SPLIT: ${{ github.event_name == 'pull_request' && '1' || '' }}   # a PR leaves the slow cases (desktop/e2e/slow-cases.json) to main and the daily run unless it touches their folder; main and the daily run replay all
          JP_REPLAY_CHANGED: ${{ steps.changed.outputs.files }}
          JP_REPLAY_RESULTS: replay-results-${{ matrix.shard }}.json
        run: node --test --test-concurrency=1 test/recorded-pages.test.mjs
      - name: Keep this shard's results for the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: replay-results-${{ matrix.shard }}
          path: desktop/e2e/replay-results-${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 3

  # /admin/form-filling/lab's Fixed-site replays show CI on main only (12 Oct 2026: local runs of work-in-progress branches showed main as broken): every shard's results, ONE PUT
  # with the build's sha (desktop/e2e/replays-report.mjs). Also when a case failed (that is the point). On a PR it is a dry run: it proves the step, sends nothing.
  report:
    name: page cases to /admin/form-filling/lab
    needs: replay
    if: always() && needs.replay.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # main's last replay results, for the fill time below; the commit's runs and jobs, for the PR's verdict
      pull-requests: read
      statuses: write   # the PR's "All checks passed", written as this job ends (the replays it needs have no verdict step: they would see the run ended first)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: replay-results-*
          path: desktop/e2e/results
          merge-multiple: true
      - name: Send the replays of this build
        working-directory: desktop/e2e
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
          JP_REPLAYS_DRY: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: node replays-report.mjs "$JP_REPLAY_SHARD_COUNT" $(seq -f 'results/replay-results-%g.json' 1 "$JP_REPLAY_SHARD_COUNT")
      # A PR's fill time per case against main's last replays (desktop/e2e/replay-time.mjs, owner 12 Oct 2026): a median +1 s fails. Main's results are the last successful
      # push run's artifacts (kept 3 days); none, or too few cases in both: it says so and passes.
      - name: Fill time vs main
        if: github.event_name == 'pull_request'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(for wf in page-cases.yml recorded-pages.yml; do gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf" --branch main --event push --status success --limit 1 --json databaseId -q '.[0].databaseId' || true; done | head -n 1)   # recorded-pages.yml: the old file name, read until 17 Oct 2026 (3-day artifacts)
          if [ -n "$id" ]; then gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'replay-results-*' --dir main-results || echo "fill time: main's results of run $id could not be read"; fi
          node replay-time.mjs --pr results/replay-results-*.json --main main-results/*/*.json   # one folder per artifact; an unmatched pattern is a missing file, skipped
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
