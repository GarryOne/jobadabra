name: Proof · Codex subscription broker
# Why (30 Oct 2026, owner): PR checks cannot read AI keys; prove the Codex subscription broker answers instead, using GitHub OIDC only.
on:
  pull_request:
    paths:
      - '.github/workflows/key-org-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # The existing broker accepts GitHub OIDC; no secret is needed.
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read

concurrency:   # newest wins: a newer push replaces the PR's older run; a by-hand run is its own group and never cancelled
  group: key-org-proof-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  proof:
    name: Codex subscription broker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      CI_AI_PROVIDER: codex
      E2E_AI_PROVIDER: codex
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Prove the Codex subscription answers
        run: node tools/persona-search/codex.mjs --proof
