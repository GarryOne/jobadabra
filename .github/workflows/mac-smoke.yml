name: CI · Mac smoke (by hand)

# The Mac smoke test (desktop/scripts/mac-smoke.mjs) on an already published build, in about a minute and with no e2e: for fixing the smoke test itself (10 Oct 2026: the packaged
# app opened no window on a CI Mac, and each try was a 45-minute beta by hand). Empty tag = the newest release that has a Mac zip.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Mac .zip to smoke-test (empty: the newest release with a Mac zip)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke · Mac
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Download that build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then   # the newest release that has a Mac zip (a build whose Mac lane failed has none; old builds are pruned)
            for candidate in $(gh release list --limit 15 --json tagName,isDraft -q '.[] | select(.isDraft | not) | .tagName'); do
              if gh release view "$candidate" --json assets -q '.assets[].name' | grep -qE '^(Jobadabra|Job-Pilotto)-[0-9].*-arm64\.zip$'; then TAG=$candidate; break; fi
            done
          fi
          [ -n "$TAG" ] || { echo "::error::No release with a Mac zip"; exit 1; }
          echo "Smoke-testing $TAG"
          gh release download "$TAG" -p 'Jobadabra-[0-9]*-arm64.zip' -p 'Job-Pilotto-[0-9]*-arm64.zip' -D dist
          ls -la dist
      - name: Smoke test · the built app
        working-directory: desktop
        run: |
          zips=(../dist/Jobadabra-[0-9]*-arm64.zip ../dist/Job-Pilotto-[0-9]*-arm64.zip)   # a release made before the rename has only the old name
          [ -f "${zips[0]}" ] || zips=("${zips[@]:1}")
          node scripts/mac-smoke.mjs "${zips[0]}" smoke
      - name: Keep the Mac screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mac-smoke-screens
          path: desktop/smoke
          if-no-files-found: ignore
          retention-days: 14
