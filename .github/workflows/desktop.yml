        shell: bash
        run: |
          spent="$(curl -s -m 10 "${E2E_FREE_AI_URL%/api/ai}/__report" || echo '{}')"
          echo "Free AI (Workers AI) this suite: $spent"
          echo "$spent" > "$E2E_ARTIFACTS/free-ai-spend.json" || true
      - name: Report what the suite paid for AI to /ai-cost (the app under test and the judges)
        if: always() && env.E2E_ANTHROPIC_KEY != '' && matrix.suite != 'unit'
        timeout-minutes: 5
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for kind in app app-openai judges; do   # app-openai: the app under test on an OpenAI engine (odd runs), shown under OpenAI on /ai-cost
            for dir in "$E2E_ARTIFACTS" "${{ github.workspace }}/e2e-artifacts-windows/apply-edge"; do
              file="$dir/ai-usage-$kind.json"; [ -f "$file" ] || continue
              tag=""; case "$dir" in *apply-edge*) tag="-edge";; esac
              job="e2e-$kind"; provider=anthropic
              if [ "$kind" = app-openai ]; then job=e2e-app; provider=openai; tag="$tag-openai"; fi
              node desktop/e2e/ai-cost-report.mjs --job "$job" --suffix "windows-${{ matrix.key }}$tag" --file "$file" --provider "$provider"
            done
          done
      - name: Keep the AI answers for the next run
        timeout-minutes: 5
        if: always() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != '' && matrix.suite != 'unit'
        run: find desktop/e2e/.ai-cache -name '*.json' -mtime +7 -delete   # an answer not replayed for a week is dropped (a replay touches it)
      - if: success() && steps.suite_run.outputs.tolerant_failed != '1' && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != '' && matrix.suite != 'unit'
        timeout-minutes: 5
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-windows-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_7
        if: always() && matrix.suite != 'unit'
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            blob-report
        run: python "$GITHUB_WORKSPACE/lock-tools/tools/scan-e2e-artifacts.py"
      - name: The suite's part of the HTML report
        if: (always()) && steps.artifact_scan_7.outcome == 'success' && matrix.suite != 'unit'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: blob-windows-${{ matrix.key }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # Steps and a failed suite's trace as data (the /admin/e2e runs page that read them was dropped on 15 Oct 2026; the artifact stays for download).
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_8
        if: always() && matrix.suite != 'unit'
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts-windows/${{ matrix.key }}/steps.json
            e2e-artifacts-windows/${{ matrix.key }}/trace-*.zip
        run: python "$GITHUB_WORKSPACE/lock-tools/tools/scan-e2e-artifacts.py"
      - name: Steps and trace for /admin/e2e
        if: (always()) && steps.artifact_scan_8.outcome == 'success' && matrix.suite != 'unit'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: e2e-view-windows-${{ matrix.key }}
          path: |
            e2e-artifacts-windows/${{ matrix.key }}/steps.json
            e2e-artifacts-windows/${{ matrix.key }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_9
        if: always() && matrix.suite != 'unit'
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts-windows/${{ matrix.key }}
        run: python "$GITHUB_WORKSPACE/lock-tools/tools/scan-e2e-artifacts.py"
      - name: Screenshots and logs
        if: (always()) && steps.artifact_scan_9.outcome == 'success' && matrix.suite != 'unit'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: e2e-artifacts-windows-${{ matrix.key }}
          path: e2e-artifacts-windows/${{ matrix.key }}
          if-no-files-found: ignore
      # The Edge pass keeps its own folder (apply-edge); without this upload its app log and screenshots reached no one (beta 40281407461, 26 Oct 2026).
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_10
        if: always() && matrix.suite != 'unit'
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts-windows/apply-edge
        run: python "$GITHUB_WORKSPACE/lock-tools/tools/scan-e2e-artifacts.py"
      - name: The Edge pass's screenshots and logs
        if: (always() && matrix.suite == 'apply') && steps.artifact_scan_10.outcome == 'success' && matrix.suite != 'unit'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          overwrite: true
          name: e2e-artifacts-windows-${{ matrix.key }}-edge
          path: e2e-artifacts-windows/apply-edge
          if-no-files-found: ignore
      - name: The App token to give the lock back (the first one may have expired)
        timeout-minutes: 5
        id: lock_app_end
        if: always() && matrix.suite != 'unit'
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Give the suite's lock back
        if: always() && matrix.suite != 'unit'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app_end.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh release "${{ matrix.key }}"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # Why (1 Nov 2026, a8; owner: "the blocking of the main's CI"): main's build.yml on this commit is awaited from the START of a gated beta, beside Build and the E2E, so the Release
  # jobs only read its result. They used to wait for it after their own work (beta 41333086670: Release · Mac waited ~8 min on a build.yml that started 17:41). tools/release-checks.sh
  # stays the one place that knows the check (--wait-ci here, --after-ci in the Release jobs); a red, timed out, cancelled or skipped job refuses the release (the Release jobs read its result).
  main-ci:
    name: Main's CI on this commit
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 70   # Why (31 Oct 2026, a8; beta 41246139016): release-checks.sh waits up to RELEASE_CI_WAIT (3600 s) for main's build.yml; 5 minutes killed it in an all-green beta
    permissions:
      contents: read
      actions: read   # build.yml's runs on the commit and on newer commits of main
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: Wait for main's build.yml on this commit and read its verdict
        timeout-minutes: 65
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: tools/release-checks.sh --wait-ci "$TAG" "$REF"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of BOTH lanes passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved:" line that offers the build to Mac beta testers (desktop/lib/updater.js). Red = not released on Mac.

  # Why (30 Oct 2026, owner): most Windows suites were dropped as duplicates of Mac + Linux, so a red there is unproven on Windows too, and a red on Windows holds Mac as well;
  # beta 41090972183 shipped Windows 0.8.53 while Mac + Linux applyflows was red. Both lanes green, or neither platform is offered.
  release-mac:
    name: Release · Mac beta
    needs: [changes, build, windows, test-mac, test-windows, main-ci]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-mac.result != 'skipped' && needs.test-mac.result != 'cancelled'
    outputs:
      retry: ${{ steps.retry.outputs.text }}   # the steps that passed on their retry, for the offer job's line in the notes
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # Why (1 Nov 2026, a8): the lane's checks (the e2e review left the beta, owner 1 Nov); main's CI is awaited by the main-ci job, not here (it was 90 min while this job waited up to 60 min for it; 20 once cut Windows off at 18 min, beta 41090972183)
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: write    # this run's artifacts, build.yml's verdict on the commit; release-stable.sh starts the Chrome Web Store publish
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        CI_ALERTS_TELEGRAM_BOT_TOKEN
        CI_ALERTS_TELEGRAM_CHAT_ID
        GH_TOKEN
        GITHUB_TOKEN
      GH_TOKEN: ${{ github.token }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}   # release-stable.sh alerts once when a store publish does not start (job level: the artifact scan lists it)
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: Both builds published? (a lane is never released alone)
        timeout-minutes: 5
        run: python3 tools/beta_lane_gate.py --mac "${{ needs.build.result }}" --windows "${{ needs.windows.result }}"
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-windows-*' -exec rm -rf {} +
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          rm -f "$RUNNER_TEMP/made.txt"; GITHUB_OUTPUT="$RUNNER_TEMP/made.txt" bash ../../tools/merge-e2e-report.sh "$PWD/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q made=1 "$RUNNER_TEMP/made.txt" 2>/dev/null; then
              echo "## 📊 [Open the Mac HTML report](https://www.jobpilotto.top/admin/operations/e2e/run/${{ github.run_id }}/report) · every suite, its steps with a screenshot each, the failure and its trace (admins)"
          fi
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_11
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-report
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - uses: actions/upload-artifact@v6
        if: (hashFiles('e2e-report/index.html') != '') && steps.artifact_scan_11.outcome == 'success'
        timeout-minutes: 5
        with:
          overwrite: true
          name: e2e-report   # admin/e2e-report.js serves it
          path: e2e-report
          compression-level: 0
      - name: Not released on Mac, an E2E suite failed on Mac + Linux or Windows, or a unit test failed
        timeout-minutes: 10
        run: python3 tools/beta_rate_gate.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --e2e-only --platform mac
      - name: Tolerant AI rates against main's nightly band (report only)
        timeout-minutes: 10
        if: needs.changes.outputs.gate == 'true'
        run: python3 tools/beta_rate_gate.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --platform mac
      - name: No layout-check high-severity finding in the Mac suites (no AI finding decides)
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts --no-ai > block.txt || status=$?
          cat block.txt
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Mac: a high-severity layout-check finding in its end-to-end suites."; exit 1; fi
      - name: Steps that passed on their retry (listed in the release notes)
        id: retry
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          node passed-on-retry.mjs --artifacts ../../e2e-artifacts | tee ../../passed-on-retry.txt   # Why (1 Nov 2026, owner: "Auto-retry in betas only"): the beta released past these; empty when none retried
          { echo 'text<<RETRY_END'; cat ../../passed-on-retry.txt; echo RETRY_END; } >> "$GITHUB_OUTPUT"   # Why (1 Nov 2026, a8): the offer job writes the line into the notes
      - name: Main's CI was green on this commit (the Main's CI job waited for it)
        timeout-minutes: 5
        env:
          MAIN_CI: ${{ needs.main-ci.result }}
        run: |
          # Why (1 Nov 2026, a8; Gitar on #2858): only a result that said success is success; red, timed out, cancelled, skipped or missing all stop the release, with today's words.
          if [ "$MAIN_CI" != success ]; then echo "$TAG stays a pre-release: build.yml is not green on its commit (the Main's CI job ended: ${MAIN_CI:-missing})."; exit 1; fi
      - name: The shared release checks after main's CI (soak on, the Notion schema additive over stable)
        timeout-minutes: 10   # Why (1 Nov 2026, a8): only the schema comparison is left here; the wait for main's build.yml moved to the main-ci job (it needed 65 min while it waited here)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: tools/release-checks.sh --after-ci "$TAG" "$REF"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # Why (1 Nov 2026, a8; owner: "why Windows is waiting on Mac? Why they're not being released in parallel?"): the Release jobs run at once; the only thing that must be one at a time is the write into the
  # release's notes (both lanes edit the same body, a read then an edit), so ONLY this tiny job holds the lock. A lane that did not pass its checks never reaches it, and offers nothing.
  release-mac-offer:
    name: Release · Mac beta · offer
    needs: [changes, release-mac]
    if: needs.release-mac.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: write    # release-stable.sh starts the Chrome Web Store publish
      issues: write     # the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false   # two lanes at most: one runs, one waits, none is cancelled
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        CI_ALERTS_TELEGRAM_BOT_TOKEN
        CI_ALERTS_TELEGRAM_CHAT_ID
        GH_TOKEN
        GITHUB_TOKEN
      GH_TOKEN: ${{ github.token }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}   # release-stable.sh alerts once when a store publish does not start
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: Release it to Mac beta testers
        timeout-minutes: 5
        env:
          E2E_ALREADY_GREEN: '1'   # required Mac suites passed; outside health is reported separately
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
          RETRY: ${{ needs.release-mac.outputs.retry }}   # tools/beta-approve.sh adds its line to the notes
          RED_ON_MAIN_NOTE: ${{ needs.changes.outputs.red_note }}   # Why (1 Nov 2026): the red steps the gate let through; tools/beta-approve.sh adds the line beside the retry line
        run: |
          if [ -n "$RETRY" ]; then printf '%s\n' "$RETRY" > "$RUNNER_TEMP/passed-on-retry.txt"; export PASSED_ON_RETRY_FILE="$RUNNER_TEMP/passed-on-retry.txt"; fi
          echo "Outside-world health: see the notion-real job notice and Mac HTML report (tolerant; does not block beta)."
          if [ "$SOAK" = on ]; then
            tools/beta-approve.sh "$TAG"
            echo "Beta-approved: $TAG (unit suites and required end-to-end suites passed on its commit). It becomes stable through canary-promote.yml: more end-to-end runs, no blocking finding, then healthy beta use."
          else
            tools/release-stable.sh "$TAG"
            echo "Stable: $TAG (all required suites passed on its commit)"
          fi
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of BOTH lanes passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved (Windows):" line that offers the build to Windows beta testers (desktop/lib/updater.js). Red = not released on Windows.
  release-windows:
    name: Release · Windows beta   # needs both lanes: the Why above release-mac
    needs: [changes, build, windows, test-mac, test-windows, main-ci]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-windows.result != 'skipped' && needs.test-windows.result != 'cancelled'
    outputs:
      retry: ${{ steps.retry.outputs.text }}   # the steps that passed on their retry, for the offer job's line in the notes
    runs-on: ubuntu-24.04
    timeout-minutes: 40   # Why (1 Nov 2026, a8): the lane's checks (the e2e review left the beta, owner 1 Nov); main's CI is awaited by the main-ci job, not here (it was 90 min while this job waited up to 60 min for it; 20 once cut Windows off at 18 min, beta 41090972183)
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: write    # this run's artifacts, build.yml's verdict on the commit; release-stable.sh starts the Chrome Web Store publish
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        GH_TOKEN
        GITHUB_TOKEN
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: Both builds published? (a lane is never released alone)
        timeout-minutes: 5
        run: python3 tools/beta_lane_gate.py --mac "${{ needs.build.result }}" --windows "${{ needs.windows.result }}"
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-*' ! -name 'blob-windows-*' -exec rm -rf {} +
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          rm -f "$RUNNER_TEMP/made.txt"; GITHUB_OUTPUT="$RUNNER_TEMP/made.txt" bash ../../tools/merge-e2e-report.sh "$PWD/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q made=1 "$RUNNER_TEMP/made.txt" 2>/dev/null; then
              echo "## 📊 [Open the Windows HTML report](https://www.jobpilotto.top/admin/operations/e2e/run/${{ github.run_id }}/report?os=windows) · every suite, its steps with a screenshot each, the failure and its trace (admins)"
          fi
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_12
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-report
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - uses: actions/upload-artifact@v6
        if: (hashFiles('e2e-report/index.html') != '') && steps.artifact_scan_12.outcome == 'success'
        timeout-minutes: 5
        with:
          overwrite: true
          name: e2e-report-windows   # admin/e2e-report.js serves it
          path: e2e-report
          compression-level: 0
      - name: Not released on Windows, an E2E suite failed on Mac + Linux or Windows, or a unit test failed
        timeout-minutes: 10
        run: python3 tools/beta_rate_gate.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --e2e-only --platform windows
      - name: Tolerant AI rates against main's nightly band (report only)
        timeout-minutes: 10
        if: needs.changes.outputs.gate == 'true'
        run: python3 tools/beta_rate_gate.py --repo "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --platform windows
      - name: No layout-check high-severity finding in the Windows suites (no AI finding decides)
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-*' ! -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts --no-ai > block.txt || status=$?
          cat block.txt
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Windows: a high-severity layout-check finding in its end-to-end suites."; exit 1; fi
      - name: Steps that passed on their retry (listed in the release notes)
        id: retry
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          node passed-on-retry.mjs --artifacts ../../e2e-artifacts | tee ../../passed-on-retry.txt   # Why (1 Nov 2026, owner: "Auto-retry in betas only"): the beta released past these; empty when none retried
          { echo 'text<<RETRY_END'; cat ../../passed-on-retry.txt; echo RETRY_END; } >> "$GITHUB_OUTPUT"   # Why (1 Nov 2026, a8): the offer job writes the line into the notes
      - name: Main's CI was green on this commit (the Main's CI job waited for it)
        timeout-minutes: 5
        env:
          MAIN_CI: ${{ needs.main-ci.result }}
        run: |
          # Why (1 Nov 2026, a8; Gitar on #2858): only a result that said success is success; red, timed out, cancelled, skipped or missing all stop the release, with today's words.
          if [ "$MAIN_CI" != success ]; then echo "$TAG stays a pre-release: build.yml is not green on its commit (the Main's CI job ended: ${MAIN_CI:-missing})."; exit 1; fi
      - name: The shared release checks after main's CI (soak on, the Notion schema additive over stable)
        timeout-minutes: 10   # Why (1 Nov 2026, a8): only the schema comparison is left here; the wait for main's build.yml moved to the main-ci job (it needed 65 min while it waited here)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: tools/release-checks.sh --after-ci "$TAG" "$REF"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # Why (1 Nov 2026, a8; owner: "why Windows is waiting on Mac? Why they're not being released in parallel?"): the Release jobs run at once; the only thing that must be one at a time is the write into the
  # release's notes (both lanes edit the same body, a read then an edit), so ONLY this tiny job holds the lock. A lane that did not pass its checks never reaches it, and offers nothing.
  release-windows-offer:
    name: Release · Windows beta · offer
    needs: [changes, release-windows]
    if: needs.release-windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: write    # release-stable.sh starts the Chrome Web Store publish
      issues: write     # the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false   # two lanes at most: one runs, one waits, none is cancelled
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        CI_ALERTS_TELEGRAM_BOT_TOKEN
        CI_ALERTS_TELEGRAM_CHAT_ID
        GH_TOKEN
        GITHUB_TOKEN
      GH_TOKEN: ${{ github.token }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}   # release-stable.sh alerts once when a store publish does not start
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: Release it to Windows beta testers
        timeout-minutes: 5
        env:
          E2E_ALREADY_GREEN: '1'   # every Windows suite passed on this commit, in this run
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
          RETRY: ${{ needs.release-windows.outputs.retry }}   # tools/beta-approve.sh adds its line to the notes
          RED_ON_MAIN_NOTE: ${{ needs.changes.outputs.red_note }}   # Why (1 Nov 2026): the red steps the gate let through; tools/beta-approve.sh adds the line beside the retry line
        run: |
          if [ -n "$RETRY" ]; then printf '%s\n' "$RETRY" > "$RUNNER_TEMP/passed-on-retry.txt"; export PASSED_ON_RETRY_FILE="$RUNNER_TEMP/passed-on-retry.txt"; fi
          set -o pipefail   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
          tools/beta-approve.sh --windows "$TAG"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # Keep the release list short: stable releases stay, plus the newest 3 test builds (tools/prune-releases.sh) and each platform's newest beta. After both lanes, so
  # tonight's approvals are already written when it decides what to keep.
  # A gate that was planned but did not start must not end the run green (18-21 Oct 2026: the plan step crashed, E2E and Release were skipped, the run read "success").
  # A plan of ZERO suites is the same failure (count '0' skips test-mac too), so it is not excluded here (24 Oct 2026).
  gate-ran:
    name: Gate ran?
    needs: [changes, build, windows, test-mac, test-windows]
    if: always() && needs.changes.outputs.gate == 'true' && (needs.build.result == 'failure' || needs.windows.result == 'failure' || (needs.build.result == 'success' && needs.test-mac.result == 'skipped') || (needs.windows.result == 'success' && needs.test-windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      # Why (31 Oct 2026, a8; beta 41226261602, owner: a failed build in either lane blocks the beta loudly): Build · Mac failed at its release upload, so its E2E matrix,
      # this job and Release · Mac were all skipped with no word, and Release · Windows ran alone and failed on a reason that was not true.
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: A build failed, the beta is not released (names the lane and the step)
        if: needs.build.result != 'success' || needs.windows.result != 'success'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/beta_lane_gate.py --mac "${{ needs.build.result }}" --windows "${{ needs.windows.result }}"
      - name: Fail the run, the E2E gate did not run
        if: (needs.build.result == 'success' && needs.test-mac.result == 'skipped') || (needs.windows.result == 'success' && needs.test-windows.result == 'skipped')
        timeout-minutes: 5
        run: |
          echo "### ❌ The E2E gate was planned but did not run: no build was tested or approved. See the 'Plan the E2E suites' step of Anything new?."
          echo "::error::The E2E gate was skipped after a green build."
          exit 1
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  prune:
    name: Clean up old builds
    needs: [changes, build, windows, test-mac, test-windows, release-mac, release-windows, release-mac-offer, release-windows-offer]
    if: always() && needs.changes.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # delete the older test builds, retitle releases
      issues: write     # the pinned Release channels issue
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - name: A release neither build published (both failed) is removed; its tag stays and its number is not reused
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ needs.changes.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then gh release delete "$TAG" --yes; echo "::warning::$TAG: no build finished; its draft is removed."; fi
      - name: Remove older test builds (their tags stay)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 3
      - name: Release titles and the pinned Release channels issue (a new build is listed at once, not at the next soak run)
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_release_labels.py || echo "labels not refreshed"   # best effort, never fails a build
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # Why (31 Oct 2026, owner): "It should just raise an alert. And that's it." One credit alert per workflow run, never a beta hold.
  ai-credit-health:
    name: AI credit health
    needs: [test-mac, test-windows]
    if: always() && !cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/beta-pick/'))
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        GH_TOKEN
        CI_ALERTS_TELEGRAM_BOT_TOKEN
        CI_ALERTS_TELEGRAM_CHAT_ID
      GH_TOKEN: ${{ github.token }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/gh-ledger.sh
            .github/actions/gh-ledger
            tools/scan-e2e-artifacts.py
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: AI credit is an alert, never a hold
        timeout-minutes: 5
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ai-credit-health || echo "::notice::No suite artifacts available for AI credit health"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ai-credit-alert-$GITHUB_RUN_ID" --dir ai-credit-alert || true
          node desktop/e2e/credit-alert.mjs --artifacts ai-credit-health --marker ai-credit-alert/alert-sent.txt
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        id: artifact_scan_1
        if: always()
        env:
          E2E_ARTIFACT_PATHS: ai-credit-alert/alert-sent.txt
        run: python tools/scan-e2e-artifacts.py
      - name: Remember this run's single credit alert
        if: (always() && hashFiles('ai-credit-alert/alert-sent.txt') != '') && steps.artifact_scan_1.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: ai-credit-alert-${{ github.run_id }}
          path: ai-credit-alert/alert-sent.txt
          overwrite: true
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
