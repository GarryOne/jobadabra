name: CI · Tests · desktop
# On a pull request, GitHub's `paths:` below decides whether it runs (owner, 14 Oct 2026: "drop your shared pick logic, rely fully on gh workflow paths"). Not a required
# check: a workflow `paths:` skips never reports, and a required one would block the PR (tests/test_workflow_paths.py). On main, build.yml (CI · Tests) calls it on
# every push: the backstop for a break from outside these paths.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      - 'extension/**'
      - 'eslint.config.mjs'
      - 'tools/check.sh'
      - 'tools/check.py'
      # Files outside desktop/ that its tests read (tests/test_workflow_paths.py fails when one is missing).
      - '.github/workflows/e2e.yml'
      - '.gitignore'
      - 'tools/design-system/**'   # desktop/test/design-system-page.test.js builds the page with it
      - 'docs/rules/desktop-ui.md'
      - '.claude/skills/ui-look-and-feel/SKILL.md'
      - 'hosted/ready-fill/**'   # the night's filler: desktop/test/ready-fill.test.js imports it
      - 'config/notion_schema.json'
      - 'config/notion_template.json'
      - 'docs/notion-profile-template.md'
      - 'docs/site-routes.json'
      - 'tools/store-zip.mjs'   # desktop/test/store-zip.test.js builds the Web Store package with it
      - 'docs/superpowers/specs/2026-10-10-ai-ladder.md'
      - 'shared/knowledge.js'
      - 'shared/ladder-moves.js'
      - 'api/pro-pay.js'
      - 'shared/telemetry.js'
      - 'test/host-cases.json'
      - 'src/role_kinds.py'
      - 'web/public/privacy.html'
      - 'src/ai/inbox_fields.py'
      - 'src/ai/score.py'
      - 'src/notion/cron_report.py'   # desktop/test/automation.test.js reads CRAWL_MODES from it
      - 'src/notion/ledger.py'
      - 'src/stores/notion_texts.py'
      - 'tests/fixtures/opportunity_origin.json'
      - 'tests/fixtures/run-result.json'
      - 'tests/fixtures/target_roles_cases.json'
      - 'tests/fixtures/stores/conversation.json'
      - 'tests/fixtures/stores/kit-section.md'
      - 'tools/claim-shape.mjs'
      - 'tools/commit-trailers.mjs'
      - 'tools/decision-branches.mjs'
      - 'tools/e2e-unit-wanted.mjs'
      - 'tools/file-size.mjs'
      - 'tools/flow-fresh.mjs'
      - 'tools/pr-check-scorecard.mjs'
      - 'tools/free-ai-eval.mjs'
      - 'tools/free-ai-eval-claude.mjs'
      - 'tools/free-ai-eval-metrics.mjs'
      - 'tools/free-ai-writing-cases.mjs'
      - 'tools/free-ai-writing-eval.mjs'
      - 'tools/free-ai-writing-judge.mjs'
      - 'shared/free-ai-models.js'
      - 'shared/free-ai-translate.js'
      - 'tools/hardcoded-page-words.mjs'
      - 'tools/journey-gate.mjs'
      - 'tools/ladder-gate.mjs'
      - 'tools/ladder-progress.mjs'
      - 'tools/merge-baseline.mjs'
      - 'tools/pool-rows.mjs'
      - 'tools/pre-push-check.sh'
      - 'tools/recorded-cases.mjs'
      - 'tools/owner-report.mjs'
      - 'tools/recorded-fails-on-old.mjs'
      - 'tools/replay-files.mjs'
      - 'tools/rung-trailer.mjs'
      - 'tools/sentry-fixer/lib.mjs'
      - 'tools/spec-proof.mjs'
      - 'worker/src/ai-prices.js'
      - 'worker/src/report.js'
      - '.github/workflows/tests-desktop.yml'

permissions:
  contents: read

concurrency:   # a PR's newer push replaces its older run and frees its runners; each commit of main keeps its own run (tests/test_main_runs_finish.py, tests/test_pr_runs_cancel.py)
  group: tests-desktop-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    # Linux only: Windows has its own workflow (tests-desktop-windows.yml) that a PR starts only for the files with platform branches; main runs both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # `npm test` globs test/*.test.js, which pwsh would hand to node unexpanded
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Install exactly what a developer (and the release workflow) has, dev dependencies included: `npm test` runs scripts/stage.mjs, which needs esbuild.
      # Only Electron's large binary is skipped, as the tests don't start it. tools/pre-push-check.sh blocks `--omit` here.
      - run: npm ci
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bash tools/check.sh --area desktop
