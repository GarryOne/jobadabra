name: CI · UI verdicts

# THE VERDICT PASS, in parallel. After every filing of the UI loop (ui-findings.yml), up to five one-off findings (seen on one build, not yet judged) are
# read by Claude, one job each, read-only: it opens the code and the screenshot and answers real / false-positive / needs-human. A real one is labelled
# `confirmed` (the fixer takes it next), a false positive is closed `wontfix-auto`, the rest `needs-human`. Why: the fixer judged one finding per run, so a run
# that filed a dozen took days to sort (4 Oct 2026). Only with the repo variable JOB_PILOTTO_FIXER_VERDICTS = "on" (it spends AI credit).
on:
  workflow_run:
    workflows: ['CI · UI findings']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ui-verdict
  cancel-in-progress: false

jobs:
  pick:
    if: vars.JOB_PILOTTO_FIXER_VERDICTS == 'on'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The one-off findings to judge (none while the AI limit is reached)
        id: list
        run: |
          node desktop/e2e/ai-budget.mjs --check
          if grep -q '^skip=true' "$GITHUB_OUTPUT"; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          node desktop/e2e/pick.mjs --out .heal --verdict-list 5

  judge:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.pick.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The finding and its screenshot
        run: |
          node desktop/e2e/reversals.mjs --out .heal/lessons.md   # the owner's corrections, appended to the prompt
          node desktop/e2e/pick.mjs --out .heal --issue "$NUMBER"
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; fi
      - name: Claude judges it (read-only)
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.UI_VERDICT_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 25
            --allowedTools "Read,Glob,Grep,Write,Bash(git log:*),Bash(git show:*)"
          prompt: Read .heal/prompt.md and follow it exactly. Write only .heal/verdict.md.
      - name: Why Claude failed (the API's own error)
        if: failure()
        env:   # a credit failure also goes to the owner on Telegram (desktop/e2e/credit-alert.mjs)
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
        run: python3 tools/claude-failure-reason.py
      - name: AI budget and cost of this run
        if: always()
        run: node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job "verdict of issue $NUMBER"
      - name: Report the AI cost to /ai-cost
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: node desktop/e2e/ai-cost-report.mjs --job ui-verdict --execution /home/runner/work/_temp/claude-execution-output.json --suffix "${{ matrix.issue }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-cost-verdict-${{ matrix.issue }}
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      - name: Apply the verdict
        if: steps.claude.outcome == 'success'
        run: |
          set -euo pipefail
          # Comment, severity, labels, close: one script, shared with the triage-github-open-issues skill (desktop/e2e/apply-verdict.sh).
          desktop/e2e/apply-verdict.sh "$NUMBER" .heal/verdict.md "$REPO"
