name: CI · Windows smoke (weekly)

# The release workflow installs and smoke-tests the Windows app only when a push touches it, so a quiet week is a
# blind week: the runner image changes under us, and so do the things the app bundles (node-pty, PyAV, sherpa-onnx,
# the Python build). Once a week, build the Windows app from main and install it on a fresh runner, with no release
# attached — if this goes red while nothing was pushed, the environment moved and not our code.
on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC (an hour before the daily discovery run)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash   # `npm test` globs test/*.test.js, which pwsh would hand to node unexpanded
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # stage.mjs counts the extension's commits for its version (desktop/scripts/extension-stamp.mjs)
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6   # only reads the Python release list; the app bundles its own
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: App tests (on Windows)
        working-directory: desktop
        run: npm test
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json; fi
      - name: Bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Build the installer
        working-directory: desktop
        run: npm run build:win -- -c.buildVersion="${{ github.run_number }}"
      # The upgrade a friend's Windows app goes through: the last released installer, then this build over it (owner, 25 Oct 2026: the exe was renamed Jobadabra.exe).
      - name: Upgrade proof · last release, then this build over it
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the last release's generic installer: Jobadabra-* once it has it, else the Job-Pilotto-* name every release made before 25 Oct 2026 has
          gh release download --repo "$GITHUB_REPOSITORY" --pattern Jobadabra-windows-x64.exe --pattern Job-Pilotto-windows-x64.exe --dir previous
          previous=(previous/Jobadabra-windows-x64.exe previous/Job-Pilotto-windows-x64.exe)
          for file in "${previous[@]}"; do [ -f "$file" ] && { before="$file"; break; }; done
          installers=(dist/Jobadabra-*-x64.exe)
          node scripts/windows-upgrade-proof.mjs "$before" "${installers[0]}"
      - name: Install it and smoke-test what a user gets
        working-directory: desktop
        run: node scripts/windows-smoke.mjs "$(ls dist/Jobadabra-*-x64.exe | head -1)" smoke
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-screens
          path: desktop/smoke
          if-no-files-found: ignore
          retention-days: 14
