<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Example role</title></head>
<body>
<!-- Recorded page (hand-cut from the widget zoo): The question sits in a closed accordion section; its box exists only once the section is opened. Hand-made, no real site, no personal data. -->
<h1>Apply for Example role</h1>
<form id="apply" onsubmit="return false">
<label for="first">First name</label> <input id="first" name="first_name" type="text" required>
<label for="last">Last name</label> <input id="last" name="last_name" type="text" required>
<label for="mail">Email</label> <input id="mail" name="email" type="email" required>
<section class="acc"><button type="button" class="acc-head" aria-expanded="false">Skills</button><div class="acc-body" hidden></div></section>
</form>
<script>
const head = document.querySelector('.acc-head'), body = document.querySelector('.acc-body');
head.addEventListener('click', () => { const open = head.getAttribute('aria-expanded') !== 'true'; head.setAttribute('aria-expanded', String(open)); body.hidden = !open; if (open && !body.children.length) body.innerHTML = '<label for="skill">Main programming language</label><input id="skill" name="skill" type="text">'; });
</script>
</body></html>
