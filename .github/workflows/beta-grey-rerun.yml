# A grey beta backbone job re-runs once on a fresh runner; a second grey holds the beta with its cause named.
# Job: report health
# Tests: tests/test_beta_grey_rerun.py
name: CI · Re-run a grey beta once

on:
  workflow_run:
    workflows: ['Release · Build, test, beta']
    types: [completed]
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: beta-grey-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/beta_grey_rerun.py
      - name: Re-run a grey beta once, or name the second grey hold
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: python3 tools/beta_grey_rerun.py --repo "$GITHUB_REPOSITORY" --run "$RUN_ID" --attempt "$RUN_ATTEMPT"
