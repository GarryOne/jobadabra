permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read

concurrency:   # a PR's newer push replaces its older run and frees its runners; each commit of main keeps its own run (tests/test_main_runs_finish.py, tests/test_pr_runs_cancel.py)
  group: tests-desktop-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    # Linux only: Windows has its own workflow (tests-desktop-windows.yml) that a PR starts only for the files with platform branches; main runs both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash   # `npm test` globs test/*.test.js, which pwsh would hand to node unexpanded
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Install exactly what a developer (and the release workflow) has, dev dependencies included: `npm test` runs scripts/stage.mjs, which needs esbuild.
      # Electron's binary too, and a virtual display: the tests that render the demo app (card-grid-layout, palette-*, rail-badges, report-grid-layout, shot-mark)
      # run here, not only on a Mac (Why (31 Oct 2026, owner: "How did it endup in main ?"): they skipped on CI, so palette-one-row-per-card went red on main unseen).
      # tools/pre-push-check.sh blocks `--omit` here. ELECTRON_DISABLE_SANDBOX: Ubuntu 24.04 runners refuse Chromium's sandbox, as the e2e harness knows (--no-sandbox).
      - run: npm ci
        working-directory: desktop
      - name: The Electron binary (version 44 has no install script, so it would only download on the first launch)
        timeout-minutes: 5
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: A virtual display and Electron's libraries
        timeout-minutes: 5
        run: bash tools/apt-install.sh xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core
      - run: xvfb-run -a --server-args='-screen 0 1440x900x24' bash tools/check.sh --area desktop
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          DESKTOP_RENDER_REQUIRED: '1'   # test/needs-electron.js: no electron or display is a red job here, never a green skip
