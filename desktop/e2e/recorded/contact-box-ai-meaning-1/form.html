<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Application</title></head><body>
<!-- An application whose name boxes say more than one part of a name (benchmark fair round, 27 Oct 2026, form 103: "Legal First Name", "Legal Last Name",
     "Preferred First & Last Name"). Written by hand from the run's field list; fake applicant. -->
<form onsubmit="return false" style="font:14px system-ui;padding:20px;max-width:560px">
  <div><label for="legal-first">Legal First Name<span aria-hidden="true">*</span></label><input id="legal-first" name="legal-first" type="text" required></div>
  <div><label for="legal-last">Legal Last Name<span aria-hidden="true">*</span></label><input id="legal-last" name="legal-last" type="text" required></div>
  <div><label for="preferred">Preferred First &amp; Last Name</label><input id="preferred" name="preferred" type="text"></div>
  <div><label for="email">Email<span aria-hidden="true">*</span></label><input id="email" name="email" type="email" required></div>
  <div><label for="hear">How did you hear about this opportunity?</label><input id="hear" name="hear" type="text"></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
