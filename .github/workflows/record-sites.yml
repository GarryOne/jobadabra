# DAILY DISCOVERY BATCH (owner, 17 Oct 2026, "Everything daily"; sketch https://claude.ai/artifact/A48novQqV7PFTFEiJoquBQ): the one exception to "by hand only". At 06:00 UTC a `pick` job
# (desktop/e2e/discovery-pick.mjs, lib/discovery-pick.mjs) ranks up to 5 sites from four real signals (real fills that missed, stuck applications, new shapes in matches, platform gaps; never
# random sites; none already recorded) and records them here (rows file as RECORD_SITES, the same recorder, held, never Submit). Cap: $3 a calendar week counted from the batch's own spend
# lines (discovery-state artifacts); at the cap no run, one Telegram note a week. No new candidate: the recording job does not start. The AI judge marks each row (fields left / wrong / stopped
# early) and ONE Telegram message lists new failures (discovery-report.mjs); rows that reached a new shape join smoke-sites.json by a PR the owner merges (never merged here).
# Record sites: this workflow's ONE job is recording (owner, 14 Oct 2026: record each site once, then test offline; renamed from "Pool smoke" on 15 Oct 2026, spec
# docs/superpowers/specs/2026-10-15-record-once.md). It visits the pool's sites on a GitHub runner, started BY HAND (owner, 12 Oct 2026: this changes the 11 Oct rule "the pool runs locally only, never in CI";
# start simple, grow it over time, report to the coordinator before growing it). By hand, plus the daily batch above: never another schedule, a push or a pull request (owner, 13 Oct 2026:
# "I don't want PR to generate an AI cost"; a fix is confirmed OFFLINE on a recording, never by a live run: record-once spec 15 Oct 2026). Guard: e2e/test/pool-ci-triggers.test.mjs.
# - Rows: the pool list in the repo (desktop/e2e/smoke-sites.json: every row since 12 Oct 2026; postings are public pages, the owner's details never enter a run).
# - Floors unchanged: the fake applicant, HELD (never Submit, no account or consent button, no password, no captcha), the privacy tripwire on, nothing uploaded
#   (lib/applying-report.mjs refuses CI) but what the last step sends with the narrow REPLAYS_PUBLISH_KEY: the rows' results (a run on main only), their endings, and the ladder moves the rows' pages
#   confirmed (desktop/e2e/pool-moves.mjs: fixed values per page shape, marked source 'ci' so they never pose as a user's; spec 2026-10-12-one-next-move.md).
# - AI: the app's own API engine on the Tests key (E2E_ANTHROPIC_KEY, the Tests workspace's $20 limit), through the harness's metering proxy (lib/live-row.mjs).
#   Hard caps per run, here: MAX_ROWS rows and MAX_USD dollars (the run stops between rows once its spend reaches it). Its own key, so its cost shows apart:
#   LIVE_POOL_ANTHROPIC_KEY by hand (lib/engine.mjs liveKeyName), else the Tests key; the summary names the one used. Every run reports its spend to /admin/ai-cost (pool-live).
# - Site limit: CI's own ledger per UTC day, at most 2 visits per host across ALL CI runs, a host that showed a block page rests the day;
#   a by-hand run may use both (no PR proof keeps one back since 15 Oct 2026).
#   Each run uploads a small state artifact (its ledger and rows); the next run reads them all (GitHub's cache is per branch: a PR's visits would be unseen).
#   CI visits are NOT in the Mac's ledger: a host can get 3 (Mac) + 2 (CI) visits on a day both run.
# - Data-center IPs meet more bot walls: such a row is "blocked (CI IP)" in the summary, never a failure, never retried (no Electron leg on CI).
# - A recording proves nothing live: a fix is confirmed offline on the recording (fix-verdicts.yml). Its encrypted record is the artifact net-records-<run> (14 days).
#   Red when NO row ran ("NOT RUN: <why>, next visit possible <when>" leads the summary and a PR gets it as a comment: 12 Oct 2026, a 1-minute green ran nothing),
#   for a row that did not finish (a harness error), the tripwire, a refused AI, or a row reaching less than its last CI run on main or on this
#   PR (lib/pool-ci-state.mjs); never for a bot wall, a refusal or a gone posting.
# Result: the table in the job log and the artifact (the day report, smoke.log, evidence/<day>/<row>/: end.png, step-*.png, app.log, run.log, evidence.md).
# Captures: every row's journey (scrubbed pages, styles, AI answers, app.log, build) as pool-captures-<run>, 30 days (owner, 13 Oct 2026; spec
# 2026-10-13-capture-once-measure-many.md); `npm run captures -- pull` keeps them on the Mac, `npm run measure` re-runs a build on them with no site visit.
name: CI · Record sites (by hand)

on:
  schedule:
    - cron: '0 6 * * *'   # the daily discovery batch (header); a by-hand run is workflow_dispatch below
  workflow_dispatch:
    inputs:
      only:
        description: 'Rows: words of a row name, several rows joined by | (empty: the bot-tolerant default list)'
        type: string
        default: ''
      share:
        description: 'How many of those rows this run (at most MAX_ROWS)'
        type: number
        default: 1

permissions:
  contents: read
  actions: read   # the earlier CI runs' state artifacts (site ledger, last results)

jobs:
  # The daily batch's picker: no AI, no browser. Skipped on a by-hand run.
  pick:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read   # the earlier batch runs' state artifacts (their rows and spend)
    outputs:
      count: ${{ steps.pick.outputs.count }}
      only: ${{ steps.pick.outputs.only }}
      max_usd: ${{ steps.pick.outputs.max_usd }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: The earlier batch runs' states (rows recorded, spend, the week the cap was told)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p discovery-states
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh run list --workflow record-sites.yml --event schedule --limit 60 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$since\") | .databaseId" 2>/dev/null | grep -vx "$GITHUB_RUN_ID" | while read -r id; do
            gh run download "$id" --name "discovery-state-$id" --dir "discovery-states/$id" >/dev/null 2>&1 || true
            gh run download "$id" --name "discovery-alert-$id" --dir "discovery-states/$id-alert" >/dev/null 2>&1 || true
          done
          echo "earlier batch states: $(find discovery-states -name discovery.json | wc -l)"
      - name: Pick the day's sites (red when the site's input cannot be read)
        id: pick
        env:
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}
          BUILDLOG_TELEGRAM_TOKEN: ${{ secrets.BUILDLOG_TELEGRAM_TOKEN }}   # only the once-a-week "cap reached" note
          BUILDLOG_TELEGRAM_CHAT: ${{ secrets.BUILDLOG_TELEGRAM_CHAT }}
        run: node desktop/e2e/discovery-pick.mjs discovery-out discovery-states 2>&1 | tee discovery-out.log
      - name: The picked rows
        uses: actions/upload-artifact@v6
        with:
          name: discovery-picked-${{ github.run_id }}
          path: |
            discovery-out/discovery-rows.json
            discovery-out/picked.json
          retention-days: 14
          if-no-files-found: warn
      - name: The cap note's state (told once a week)
        if: steps.pick.outputs.cap_alert == '1'
        uses: actions/upload-artifact@v6
        with:
          name: discovery-alert-${{ github.run_id }}
          path: discovery-out/alert-state/discovery.json
          retention-days: 14

  smoke:
    needs: pick
    # By hand: always. The daily batch: only when the picker succeeded and found a new candidate (no candidate, no run, no cost).
    if: ${{ always() && (github.event_name != 'schedule' || (needs.pick.result == 'success' && needs.pick.outputs.count != '0')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90   # up to 60 to wait its turn (pool-ci-wait.mjs), then the rows
    # No concurrency group: GitHub keeps one pending run per group and cancels the older one (12 Oct 2026: Ocado's dispatch was cancelled by FNAC's).
    # The queue step below waits for every earlier pool run instead: one at a time, oldest first, none dropped.
    env:
      MAX_ROWS: ${{ github.event_name == 'schedule' && '5' || '3' }}          # the hard row cap (owner, 12 Oct 2026: start with 1-3 rows; the daily batch: 5)
      MAX_USD: ${{ github.event_name == 'schedule' && needs.pick.outputs.max_usd || '0.50' }}      # the hard AI dollar cap per run (the batch: twice its expected spend, never above what the week's $3 has left)
      # Public rows with no bot wall in the Mac's runs of 10-12 Oct 2026 (SmartRecruiters showed one every time: not in the default).
      DEFAULT_ROWS: 'Lever: single page|Personio form in German|Recruitee: one-page form'
      ONLY: ${{ github.event_name == 'schedule' && needs.pick.outputs.only || inputs.only }}
      SHARE: ${{ github.event_name == 'schedule' && '5' || inputs.share }}
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}               # the Tests key: the fallback while a live run's own key is not set
      LIVE_POOL_ANTHROPIC_KEY: ${{ secrets.LIVE_POOL_ANTHROPIC_KEY }}   # a pool run by hand (owner, 12 Oct 2026: each live run's cost apart)
      JP_NO_REPORT: '1'                # no applying report from CI (the code refuses it anyway); the proven records and ladder moves go with their own narrow key
      JP_APPLICANT: thin   # the thin test applicant: runs are by hand only (the PR proof that ran the grown one was removed on 13 Oct 2026)
      JOB_PILOTTO_HEAVY: '0'           # the heavy lock is a Mac's machine-wide queue; this runner is its own machine
      JOB_PILOTTO_SESSION: record-sites CI run ${{ github.run_id }}
      JOB_PILOTTO_SITE_LIMIT: '2'
      JOB_PILOTTO_VISIT_KIND: hand   # each visit says its kind (lib/site-ledger.mjs; lib/engine.mjs liveKeyName)
      JP_NET_RECORD_DIR: ${{ github.workspace }}/net-records   # each row's network record (lib/net-record.mjs): uploaded encrypted below, never in the plain captures
      JOB_PILOTTO_SITE_LEDGER_DIR: ${{ github.workspace }}/record-sites-out/site-ledger
      RECORD_PAIRED: '0'
      RECORD_REPORTS: ${{ github.workspace }}/record-sites-out/smoke-reports
      RECORD_CANDIDATES: ${{ github.workspace }}/record-sites-out/replay-candidates
      RECORD_CAPTURES: ${{ github.workspace }}/record-sites-out/captures   # every row's whole journey (lib/capture-library.mjs): npm run measure re-runs a build on it offline
      RECORD_SITES: ${{ github.workspace }}/record-sites-out/${{ github.event_name == 'schedule' && 'discovery/discovery-rows.json' || 'no-mac-list.json' }}   # by hand: never present (the Mac's rows stay on the Mac); the batch: its picked rows
    steps:
      - uses: actions/checkout@v5
      - name: The batch's picked rows
        if: github.event_name == 'schedule'
        uses: actions/download-artifact@v7
        with:
          name: discovery-picked-${{ github.run_id }}
          path: record-sites-out/discovery
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Python packages the engine needs (the app's store)
        run: pip install --quiet -r requirements.txt
      - name: Chromium for the real extension, and a virtual display
        working-directory: desktop/e2e
        timeout-minutes: 15
        run: |
          npx playwright-core install --with-deps chromium
          bash ../../tools/apt-install.sh xvfb
      - name: Wait for the earlier pool runs (one at a time, oldest first, none dropped)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/e2e/pool-ci-wait.mjs
      - name: Earlier CI runs (main and every PR) -> today's site ledger, each row's last CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p record-sites-out/states record-sites-out/site-ledger
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for workflow in record-sites.yml pool-smoke.yml watch-live.yml; do   # pool-smoke.yml: the name until 15 Oct 2026; watch-live.yml: the daily watch shares the site ledger
            gh run list --workflow "$workflow" --limit 40 --json databaseId,createdAt --jq ".[] | select(.createdAt >= \"$since\") | .databaseId" 2>/dev/null || true
          done | sort -rn | uniq | grep -vx "$GITHUB_RUN_ID" | head -40 | while read -r id; do
            gh run download "$id" --name "record-sites-state-$id" --dir "record-sites-out/states/$id" >/dev/null 2>&1 \
              || gh run download "$id" --name "pool-smoke-state-$id" --dir "record-sites-out/states/$id" >/dev/null 2>&1 || true   # the old artifact name
          done
          node desktop/e2e/pool-ci-state.mjs prepare record-sites-out/states record-sites-out/baseline.json
      - name: Run the pool rows (held, fake applicant, never Submit)
        working-directory: desktop/e2e
        run: |
          set -o pipefail
          mkdir -p "$RECORD_REPORTS"
          rows=${SHARE:-1}
          if ! [ "$rows" -ge 1 ] 2>/dev/null; then rows=1; fi
          if [ "$rows" -gt "$MAX_ROWS" ]; then rows=$MAX_ROWS; fi
          only=${ONLY:-$DEFAULT_ROWS}
          echo "record-sites: rows matching \"$only\", at most $rows, AI cap \$$MAX_USD; CI's site limit $JOB_PILOTTO_SITE_LIMIT a host a day"
          RECORD_MAX_ROWS=$rows RECORD_MAX_USD=$MAX_USD xvfb-run -a --server-args='-screen 0 1440x900x24' node record-sites.mjs --only "$only" 2>&1 | tee "$GITHUB_WORKSPACE/record-sites-out/smoke.log"
      - name: Encrypt the network records (the public key is in the repo; the private key only in the owner's Keychain)
        if: always()
        run: |
          [ -d net-records ] && [ -n "$(ls -A net-records)" ] || { echo "no network record"; exit 0; }
          mkdir -p net-out && tar czf "$RUNNER_TEMP/net.tgz" net-records && rm -rf net-records
          openssl rand -hex -out "$RUNNER_TEMP/k" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/net.tgz" -out net-out/net.tgz.enc -pass "file:$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey desktop/e2e/net-record.pub.pem -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out net-out/k.enc
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/net.tgz"
      - name: The encrypted network records (14 days)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: net-records-${{ github.run_id }}
          path: net-out/
          retention-days: 14
          if-no-files-found: ignore
      - name: Hand this run's state to the next runs (its ledger and rows)
        if: always()
        run: node desktop/e2e/pool-ci-state.mjs save "$RECORD_REPORTS" record-sites-out/state/state.json
      - name: This run's state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-sites-state-${{ github.run_id }}
          path: record-sites-out/state/state.json
          retention-days: 14
          if-no-files-found: warn
      - name: The rows table (red when no row ran, a row did not finish, the tripwire, a refused AI, a fall below its last CI run)
        if: always()
        working-directory: desktop/e2e
        env:
          NOT_RUN_FILE: ${{ runner.temp }}/not-run.txt   # a run where no row ran: its NOT RUN line (lib/pool-ci.mjs), never a green pass
        run: |
          set -o pipefail
          node pool-ci-summary.mjs "$RECORD_REPORTS" "$GITHUB_WORKSPACE/record-sites-out/baseline.json"
      - name: The ladder moves, the rows' endings, and (on main only) the rows' results for /admin/lab-form-filling
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAYS_PUBLISH_KEY: ${{ secrets.REPLAYS_PUBLISH_KEY }}   # the narrow key: it writes only the replays, test-source ladder moves, the rows' endings and (main only) the rows' results
        run: |
          node desktop/e2e/pool-moves.mjs "$RECORD_REPORTS" || true   # the moves per row: the one-next-move spec's phase-1 proof
          node desktop/e2e/pool-endings.mjs "$RECORD_REPORTS"   # each row's ending: main's feed /admin/lab-form-filling's Resolution tile (phase 1a)
          # A recording run is how the pool's table moves (owner, 14 Oct 2026): the site refuses any branch but main (admin/applying-ci-rows.js).
          [ "$GITHUB_REF" = "refs/heads/main" ] && node desktop/e2e/pool-ci-rows.mjs "$RECORD_REPORTS" || echo "ci rows report: not sent (not a run on main)"
      - name: Report the run's AI spend to /admin/ai-cost (never fails the job)
        if: always()
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          AI_COST_JOB: pool-live
        run: node desktop/e2e/pool-ai-cost.mjs "$RECORD_REPORTS" "$RUNNER_TEMP/pool-ai-cost.json" && node desktop/e2e/ai-cost-report.mjs --job "$AI_COST_JOB" --file "$RUNNER_TEMP/pool-ai-cost.json" || true
      - name: Discovery batch - verdicts, the one Telegram message, this run's state
        if: always() && github.event_name == 'schedule'
        env:
          BUILDLOG_TELEGRAM_TOKEN: ${{ secrets.BUILDLOG_TELEGRAM_TOKEN }}   # the Build Log bot; missing: the message is skipped with a line
          BUILDLOG_TELEGRAM_CHAT: ${{ secrets.BUILDLOG_TELEGRAM_CHAT }}
        run: |
          mkdir -p discovery-states discovery-out
          node desktop/e2e/discovery-report.mjs "$RECORD_REPORTS" record-sites-out/discovery/picked.json discovery-out discovery-states
      - name: The batch's state (rows, spend) for the next runs and the pool PR
        if: always() && github.event_name == 'schedule'
        uses: actions/upload-artifact@v6
        with:
          name: discovery-state-${{ github.run_id }}
          path: |
            discovery-out/discovery.json
            discovery-out/pool-add.json
          retention-days: 14
          if-no-files-found: warn
      - name: Every row's capture (capture once, measure many)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pool-captures-${{ github.run_id }}
          path: record-sites-out/captures/
          retention-days: 30
          if-no-files-found: ignore
      - name: The day report, the log and each row's evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: record-sites-${{ github.run_id }}
          path: |
            record-sites-out/smoke.log
            record-sites-out/smoke-reports/
          retention-days: 14
          if-no-files-found: warn

  # Rows that reached a new flow shape join the pool by a PR (never merged here: the owner merges every PR by hand).
  pool-pr:
    needs: smoke
    if: ${{ always() && github.event_name == 'schedule' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The batch's new shapes
        uses: actions/download-artifact@v7
        with:
          name: discovery-state-${{ github.run_id }}
          path: discovery-out
      # GitHub starts no workflow for a push or PR made with GITHUB_TOKEN, so the PR would sit without checks: push and open it with the CI GitHub App's token (else the workflow token, and no checks).
      - name: The App token, so the PR's checks start
        id: pr_app
        continue-on-error: true   # a failed mint falls back to the workflow token, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Add them to smoke-sites.json and open the PR
        env:
          PR_TOKEN: ${{ steps.pr_app.outputs.token }}
        run: |
          [ -s discovery-out/pool-add.json ] || { echo "no new shape"; exit 0; }
          added=$(node desktop/e2e/discovery-pool-add.mjs discovery-out/pool-add.json)
          echo "$added"
          git diff --quiet -- desktop/e2e/smoke-sites.json && { echo "nothing to add"; exit 0; }
          branch="discovery/$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add desktop/e2e/smoke-sites.json
          tools/bot-commit.sh "Add the daily discovery batch's new shapes to the pool" "a pool list entry, no code the app runs" "$added"
          git push -q "https://x-access-token:${PR_TOKEN:-$GH_TOKEN}@github.com/$REPO.git" "$branch"
          printf '%s\n\nOpened by record-sites.yml (daily discovery batch). The owner merges it; nothing here merges.\n' "$added" > pr-detail.md
          tools/bot-pr-body.sh HEAD~1 --verdict='🟢 The daily discovery batch reached new flow shapes: they join the pool.' --why='the daily discovery batch (record-sites.yml) found sites with shapes the pool lacks' \
            --unblocks='the pool tests those shapes from tomorrow, once the owner merges' --label='Pool shapes' --before='not in the pool' --after='in desktop/e2e/smoke-sites.json' \
            --rate='Form filling=🟡 Medium|new shapes get tested' --rate='Offline replays=🟡 Medium|new rows to record' --rate='Tests & harness=🟡 Medium|a wider pool' --detail=pr-detail.md > pr-body.md
          GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --base main --head "$branch" --title "Add the daily discovery batch's new shapes to the pool" --body-file pr-body.md || true
