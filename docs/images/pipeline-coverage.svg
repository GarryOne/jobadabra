<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748B"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .title{font-size:47px;font-weight:760;letter-spacing:-1.2px;fill:#fff}
      .subtitle{font-size:20px;font-weight:450;fill:#CBD5E1}
      .section{font-size:14px;font-weight:800;letter-spacing:1.5px;fill:#64748B}
      .step{font-size:13px;font-weight:800;letter-spacing:1px;fill:#2563EB}
      .cardtitle{font-size:19px;font-weight:740;fill:#0F172A}
      .body{font-size:14.5px;font-weight:460;fill:#475569}
      .small{font-size:13px;font-weight:540;fill:#64748B}
      .flow{fill:none;stroke:#64748B;stroke-width:2.7;stroke-linecap:round;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#2563EB;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 8;marker-end:url(#blueArrow)}
      .card{fill:#fff;stroke:#CBD5E1;stroke-width:1.7}
      .shadow{fill:#0F172A;opacity:.07}
    </style>
  </defs>

  <rect width="1600" height="820" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="40" y="30" width="1520" height="130" rx="28" fill="url(#header)"/>
  <circle cx="111" cy="95" r="37" fill="#3B82F6"/>
  <path d="M93 99 L107 113 L132 77" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="170" y="88" class="sans title">Jobadabra covers most of the pipeline</text>
  <text x="172" y="126" class="sans subtitle">From discovering opportunities to learning what actually produces interviews and offers.</text>

  <text x="50" y="214" class="sans section">END-TO-END JOB SEARCH AUTOMATION</text>
  <rect x="1300" y="188" width="250" height="36" rx="18" fill="#DCFCE7"/>
  <text x="1425" y="212" text-anchor="middle" class="sans" font-size="14" font-weight="760" fill="#15803D">FULL-LOOP COVERAGE</text>

  <!-- Main connectors, placed in gutters -->
  <path d="M230 405 H270" class="flow"/>
  <path d="M450 405 H490" class="flow"/>
  <path d="M670 405 H710" class="flow"/>
  <path d="M890 405 H930" class="flow"/>
  <path d="M1110 405 H1150" class="flow"/>
  <path d="M1330 405 H1370" class="flow"/>

  <!-- 01 Discover -->
  <rect x="54" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="50" y="260" width="180" height="270" rx="22" class="card"/>
  <text x="75" y="293" class="sans step">01 · DISCOVER</text>
  <circle cx="140" cy="340" r="32" fill="#E0F2FE"/>
  <path d="M124 354 H156 M127 354 V328 H153 V354 M134 328 V318 M146 328 V318" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
  <text x="140" y="397" text-anchor="middle" class="sans cardtitle">Find opportunities</text>
  <text x="140" y="429" text-anchor="middle" class="sans body">Job boards</text>
  <text x="140" y="452" text-anchor="middle" class="sans body">Employer feeds</text>
  <text x="140" y="475" text-anchor="middle" class="sans body">New sources daily</text>
  <rect x="73" y="495" width="134" height="24" rx="12" fill="#F0F9FF"/>
  <text x="140" y="512" text-anchor="middle" class="sans small" fill="#0369A1">AUTOMATED</text>

  <!-- 02 Score -->
  <rect x="274" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="270" y="260" width="180" height="270" rx="22" fill="#fff" stroke="#A5B4FC" stroke-width="1.8"/>
  <text x="295" y="293" class="sans step">02 · SCORE</text>
  <circle cx="360" cy="340" r="32" fill="#E0E7FF"/>
  <path d="M344 352 L354 342 L363 347 L378 329 M370 329 H378 V337" fill="none" stroke="#4F46E5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="360" y="397" text-anchor="middle" class="sans cardtitle">Rank the fit</text>
  <text x="360" y="429" text-anchor="middle" class="sans body">Structured facts</text>
  <text x="360" y="452" text-anchor="middle" class="sans body">Profile match</text>
  <text x="360" y="475" text-anchor="middle" class="sans body">Gaps + reasons</text>
  <rect x="293" y="495" width="134" height="24" rx="12" fill="#EEF2FF"/>
  <text x="360" y="512" text-anchor="middle" class="sans small" fill="#4338CA">AI-ASSISTED</text>

  <!-- 03 Kits -->
  <rect x="494" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="490" y="260" width="180" height="270" rx="22" class="card"/>
  <text x="515" y="293" class="sans step">03 · PREPARE</text>
  <circle cx="580" cy="340" r="32" fill="#F3E8FF"/>
  <path d="M566 323 H590 L596 329 V357 H566 Z M590 323 V330 H596 M572 339 H589 M572 346 H589" fill="none" stroke="#7C3AED" stroke-width="2.8" stroke-linejoin="round"/>
  <text x="580" y="397" text-anchor="middle" class="sans cardtitle">Build the kit</text>
  <text x="580" y="429" text-anchor="middle" class="sans body">Tailored cover letter</text>
  <text x="580" y="452" text-anchor="middle" class="sans body">Form answers</text>
  <text x="580" y="475" text-anchor="middle" class="sans body">Best matches first</text>
  <rect x="513" y="495" width="134" height="24" rx="12" fill="#FAF5FF"/>
  <text x="580" y="512" text-anchor="middle" class="sans small" fill="#6D28D9">AI-ASSISTED</text>

  <!-- 04 Fill -->
  <rect x="714" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="710" y="260" width="180" height="270" rx="22" class="card"/>
  <text x="735" y="293" class="sans step">04 · FILL</text>
  <circle cx="800" cy="340" r="32" fill="#DBEAFE"/>
  <rect x="784" y="327" width="32" height="25" rx="4" fill="none" stroke="#2563EB" stroke-width="3"/>
  <path d="M784 334 H816 M792 352 H808" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <text x="800" y="397" text-anchor="middle" class="sans cardtitle">Fill the form</text>
  <text x="800" y="429" text-anchor="middle" class="sans body">Claude · Codex</text>
  <text x="800" y="452" text-anchor="middle" class="sans body">or ChatGPT</text>
  <text x="800" y="475" text-anchor="middle" class="sans body">Works in Chrome</text>
  <rect x="733" y="495" width="134" height="24" rx="12" fill="#EFF6FF"/>
  <text x="800" y="512" text-anchor="middle" class="sans small" fill="#1D4ED8">OPTIONAL</text>

  <!-- Human gate -->
  <rect x="934" y="264" width="180" height="270" rx="22" fill="#C2410C" opacity=".08"/>
  <rect x="930" y="260" width="180" height="270" rx="22" fill="#FFF7ED" stroke="#FB923C" stroke-width="2.4"/>
  <text x="955" y="293" class="sans step" fill="#C2410C">HUMAN GATE</text>
  <circle cx="1020" cy="340" r="32" fill="#FFEDD5"/>
  <path d="M1005 341 L1016 352 L1036 324" fill="none" stroke="#EA580C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1020" y="397" text-anchor="middle" class="sans" font-size="18" font-weight="760" fill="#9A3412">Review &amp; Submit</text>
  <text x="1020" y="429" text-anchor="middle" class="sans body" fill="#9A3412">You check every</text>
  <text x="1020" y="452" text-anchor="middle" class="sans body" fill="#9A3412">answer first</text>
  <text x="1020" y="483" text-anchor="middle" class="sans" font-size="13.5" font-weight="700" fill="#C2410C">Never automated</text>

  <!-- 05 Track -->
  <rect x="1154" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="1150" y="260" width="180" height="270" rx="22" class="card"/>
  <text x="1175" y="293" class="sans step">05 · TRACK</text>
  <circle cx="1240" cy="340" r="32" fill="#DCFCE7"/>
  <path d="M1225 326 H1255 V354 H1225 Z M1235 326 V354 M1245 326 V354 M1225 336 H1255 M1225 345 H1255" fill="none" stroke="#16A34A" stroke-width="2.4"/>
  <text x="1240" y="397" text-anchor="middle" class="sans cardtitle">Track progress</text>
  <text x="1240" y="429" text-anchor="middle" class="sans body">Notion pipeline</text>
  <text x="1240" y="452" text-anchor="middle" class="sans body">Application history</text>
  <text x="1240" y="475" text-anchor="middle" class="sans body">Current stage</text>
  <rect x="1173" y="495" width="134" height="24" rx="12" fill="#F0FDF4"/>
  <text x="1240" y="512" text-anchor="middle" class="sans small" fill="#15803D">AUTO-UPDATED</text>

  <!-- 06 Learn -->
  <rect x="1374" y="264" width="180" height="270" rx="22" class="shadow"/>
  <rect x="1370" y="260" width="180" height="270" rx="22" fill="#fff" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="1395" y="293" class="sans step">06 · LEARN</text>
  <circle cx="1460" cy="340" r="32" fill="#E0F2FE"/>
  <path d="M1443 352 V340 L1453 331 L1462 338 L1478 320 M1469 320 H1478 V329" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1460" y="397" text-anchor="middle" class="sans cardtitle">Learn outcomes</text>
  <text x="1460" y="429" text-anchor="middle" class="sans body">Gmail replies</text>
  <text x="1460" y="452" text-anchor="middle" class="sans body">Funnel conversion</text>
  <text x="1460" y="475" text-anchor="middle" class="sans body">Interview reviews</text>
  <rect x="1393" y="495" width="134" height="24" rx="12" fill="#F0F9FF"/>
  <text x="1460" y="512" text-anchor="middle" class="sans small" fill="#0369A1">CONTINUOUS</text>

  <!-- Learning loop -->
  <path d="M1460 530 V584" class="feedback"/>
  <rect x="418" y="592" width="1132" height="142" rx="28" fill="url(#loop)" stroke="#93C5FD" stroke-width="1.8"/>
  <text x="450" y="622" class="sans section" fill="#1D4ED8">OUTCOME LEARNING LOOP</text>

  <rect x="452" y="643" width="188" height="54" rx="17" fill="#fff" stroke="#BFDBFE"/>
  <circle cx="479" cy="670" r="16" fill="#DCFCE7"/>
  <path d="M470 664 H488 V677 H470 Z M470 665 L479 671 L488 665" fill="none" stroke="#16A34A" stroke-width="1.8"/>
  <text x="505" y="675" class="sans" font-size="14" font-weight="680" fill="#334155">Gmail replies</text>

  <rect x="662" y="643" width="188" height="54" rx="17" fill="#fff" stroke="#BFDBFE"/>
  <circle cx="689" cy="670" r="16" fill="#E0E7FF"/>
  <path d="M681 678 V671 L688 664 L694 669 L700 660" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <text x="715" y="675" class="sans" font-size="14" font-weight="680" fill="#334155">Funnel data</text>

  <rect x="872" y="643" width="202" height="54" rx="17" fill="#fff" stroke="#BFDBFE"/>
  <circle cx="899" cy="670" r="16" fill="#F3E8FF"/>
  <path d="M891 663 H907 V674 H899 L895 679 V674 H891 Z" fill="none" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="925" y="675" class="sans" font-size="14" font-weight="680" fill="#334155">Interview reviews</text>

  <path d="M640 670 H662 M850 670 H872 M1074 670 H1106" class="flow"/>
  <rect x="1106" y="633" width="404" height="74" rx="20" fill="#1D4ED8"/>
  <text x="1308" y="661" text-anchor="middle" class="sans" font-size="17" font-weight="760" fill="#fff">Better decisions next time</text>
  <text x="1308" y="686" text-anchor="middle" class="sans" font-size="13.5" font-weight="520" fill="#DBEAFE">Improve matching · applications · interview prep</text>

  <!-- Feedback to scoring, routed around all cards -->
  <path d="M1106 670 H1060 Q1038 670 1038 716 H360 Q326 716 326 682 V530" class="feedback"/>
  <rect x="637" y="704" width="230" height="26" rx="13" fill="#F8FAFC" stroke="#93C5FD"/>
  <text x="752" y="722" text-anchor="middle" class="sans small" fill="#1D4ED8">INSIGHTS → YOUR SETTINGS</text>

  <text x="50" y="782" class="sans" font-size="18" font-weight="620" fill="#334155">Discovery → scoring → kits → filling → <tspan fill="#EA580C" font-weight="760">your approval</tspan> → tracking → learning</text>
  <text x="1550" y="782" text-anchor="end" class="sans" font-size="15" font-weight="560" fill="#64748B">Jobadabra automates the work — you keep the decision.</text>
</svg>
