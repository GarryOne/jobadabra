name: CI · Judge exam

# The verdict pass's exam (desktop/e2e/lib/judge-exam.mjs): ten findings from this loop's own history, each with the code as it was at its build and a known answer (four real, six false),
# judged by the same prompt as a real finding and scored. A judge that dismisses a real bug or believes a false alarm shows it as a number on /self-heal, without anyone ticking a box.
# It costs one broker call (about ten findings in one prompt, Codex plan), so it is OFF until the owner turns it on:  gh variable set JOB_PILOTTO_JUDGE_EXAM --body on
# Why (31 Oct 2026, owner: "We should use fully the Codex"): it ran claude-code-action on an API key; a refused broker call skips the exam with its reason (desktop/e2e/judge-codex.mjs).
on:
  schedule:
    - cron: '17 8 * * 0'   # Sunday morning, before the Saturday audit is read
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write   # the Codex broker knows a run by its OIDC token (desktop/e2e/lib/broker-client.mjs)

concurrency:
  group: judge-exam
  cancel-in-progress: false

jobs:
  exam:
    if: vars.JOB_PILOTTO_JUDGE_EXAM == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare the exam
        run: |
          mkdir -p .heal
          node desktop/e2e/judge-exam.mjs --prepare .heal
        id: prepare
      - name: Codex judges the planted findings (read-only, one broker call)
        id: judge
        run: node desktop/e2e/judge-codex.mjs --mode exam
      - name: Score it
        if: steps.judge.outputs.skipped != 'true'
        run: node desktop/e2e/judge-exam.mjs --score --verdicts .heal/verdicts.md --out .heal/judge-exam.json
      - name: Tell the owner once if the broker refused
        if: always() && !cancelled()
        continue-on-error: true
        uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
          notes-dir: ${{ runner.temp }}/ai-capped
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('.heal/judge-exam.json') != ''
        with:
          name: judge-exam
          path: .heal/judge-exam.json
          retention-days: 90
