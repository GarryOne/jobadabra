name: UI loop · Finder self-review
# The Finder learns from its own week (owner, 4 Oct 2026: "make the Finder and Fixer autonomous"): the facts are the false positives' verdict reasons,
# harness issues, duplicates, detector misses and fixes handed to a person (desktop/e2e/finder-review.mjs, no AI). Claude Code (Sonnet, 30 turns) proposes
# at most 3 rule/prompt changes in desktop/e2e with a test each (desktop/e2e/finder-review-prompt.md). The e2e unit tests must pass; ONE PR, never merged by itself.
on:
  schedule:
    - cron: '0 17 * * 6'  # Saturday 17:00 UTC: a week of findings, a day before the rules self-review
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write   # the weekly verdict audit issue
  id-token: write

concurrency:
  group: finder-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the e2e tools (as e2e.yml's plan job, which runs the same tests)
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: The AI budget allows it
        id: budget
        run: node desktop/e2e/ai-budget.mjs --check
      - name: Gather the Finder's week (no AI)
        if: steps.budget.outputs.skip != 'true'
        env:
          NOTION_BRAIN_TOKEN: ${{ secrets.NOTION_BRAIN_TOKEN }}   # the Bug Tracker, read-only: the bugs the Finder missed, as local sessions logged them
          BUG_TRACKER_DB: ${{ vars.BUG_TRACKER_DB }}
        run: |
          node desktop/e2e/reversals.mjs --out .finder-review/lessons.md   # the owner's corrections: the strongest lessons of the week
          node desktop/e2e/finder-review.mjs .finder-review
      - name: Claude Code proposes Finder changes
        if: steps.budget.outputs.skip != 'true'
        id: claude
        # 50 turns (owner, 11 Oct 2026): 30 failed the 10 Oct run at turn 34 after its work was done (~$0.34 a run).
        # Trial: if the runs of 17, 24 and 31 Oct open no PR the owner merges, this workflow is removed.
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.FINDER_REVIEW_ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model claude-sonnet-5-5 --max-turns 50
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git show:*),Bash(git log:*),Bash(cd desktop/e2e && npm test:*),Bash(npm test:*),Bash(node --test:*)"
          prompt: |
            Follow desktop/e2e/finder-review-prompt.md exactly. The facts are in .finder-review/facts.md.
      - name: Why Claude failed (the API's own error)
        if: failure()
        run: python3 tools/claude-failure-reason.py
      - name: The AI's cost and limit
        if: always() && steps.budget.outputs.skip != 'true'
        run: node desktop/e2e/ai-budget.mjs --after /home/runner/work/_temp/claude-execution-output.json --job "Finder self-review"
      - name: Report the AI cost to /ai-cost
        if: always() && steps.budget.outputs.skip != 'true'
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: node desktop/e2e/ai-cost-report.mjs --job finder-review --execution /home/runner/work/_temp/claude-execution-output.json
      - uses: actions/upload-artifact@v6
        if: always() && steps.budget.outputs.skip != 'true'
        with:
          name: ai-cost-finder-review
          path: ${{ runner.temp }}/ai-cost.json
          if-no-files-found: ignore
      # GitHub starts no workflow for a push or PR made with GITHUB_TOKEN, so the PR would sit without checks: push and open it with the CI GitHub App's token (else the workflow token, and no checks).
      - name: The App token, so the PR's checks start
        id: pr_app
        continue-on-error: true   # a failed mint falls back to the workflow token, never a red job
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Check, test, open the pull request
        if: steps.budget.outputs.skip != 'true'
        env:
          PR_TOKEN: ${{ steps.pr_app.outputs.token }}
        run: |
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}' | grep -v '^\.finder-review/' || true)
          if [ -z "$changed" ]; then
            { echo "## Finder self-review: no changes proposed"; cat .finder-review/summary.md 2>/dev/null || echo "Claude made no edits."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bad=$(echo "$changed" | grep -v -E '^desktop/e2e/(lib/[a-z0-9-]+\.mjs|test/[a-z0-9-]+\.test\.mjs|[a-z-]+-prompt\.md)$' || true)
          if [ -n "$bad" ]; then
            { echo "## Finder self-review: refused"; echo "Edits outside the Finder's files:"; echo '```'; echo "$bad"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if ! (cd desktop/e2e && npm test > ../../.finder-review/test.log 2>&1); then
            { echo "## Finder self-review: its change failed the e2e unit tests, no PR"; echo '```'; tail -40 .finder-review/test.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ -s .finder-review/pr-body.md ] || echo "Finder: weekly self-review changes" > .finder-review/pr-body.md
          title=$(head -1 .finder-review/pr-body.md | node -e 'let s=require("fs").readFileSync(0,"utf8").trim(); while (Buffer.byteLength(s) > 72) s = s.slice(0, -1); process.stdout.write(s)')
          { tail -n +2 .finder-review/pr-body.md; echo; echo "Opened by the Finder's weekly self-review (finder-review.yml) from the week's verdict reasons and misses. It never merges itself."; } > .finder-review/body.md
          branch="finder-review/$(date -u +%Y-%m-%d)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          echo "$changed" | xargs git add --
          tools/bot-commit.sh "$title" "the Finder and its unit tests, no page the app fills"
          git push -q "https://x-access-token:${PR_TOKEN:-$GH_TOKEN}@github.com/$REPO.git" "$branch"
          tools/bot-pr-body.sh HEAD~1 --verdict="🟢 $title" --why="the Finder's weekly self-review (finder-review.yml) read the week's verdict reasons and misses" \
            --unblocks='a Finder that finds more real bugs and fewer false ones, once the owner merges' --label='Finder' --before='the Finder as it was' --after='the Finder with this change' \
            --rate='Tests & harness=🟡 Medium|the Finder and its unit tests' --detail=.finder-review/body.md > .finder-review/laid-out.md
          url=$(GH_TOKEN="${PR_TOKEN:-$GH_TOKEN}" gh pr create --repo "$REPO" --base main --head "$branch" --title "$title" --body-file .finder-review/laid-out.md)
          { echo "## Finder self-review: PR opened"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"

  # The verdict pass's measured accuracy: five random verdicts of the week in one issue to tick right or wrong; last week's audit is closed with its score. No AI.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Open this week's verdict audit
        run: node desktop/e2e/verdict-audit.mjs
