name: CI · Tests · worker
# On a pull request, GitHub's `paths:` below decides whether it runs (owner, 14 Oct 2026: "drop your shared pick logic, rely fully on gh workflow paths"). Not a required
# check: a workflow `paths:` skips never reports, and a required one would block the PR (tests/test_workflow_paths.py). On main, build.yml (CI · Tests) calls it on
# every push: the backstop for a break from outside these paths.
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - 'tools/check.sh'
      - 'tools/check.py'
      # Files outside worker/ that its tests read (tests/test_workflow_paths.py fails when one is missing).
      - '.github/workflows/pr-verdict.yml'   # watchdog.test.js checks the Worker's sweep run-name
      - 'hosted/ready-fill/**'   # the night's AI: worker/test/ready-night-ai.test.js imports it
      - 'desktop/demo/answers.md'
      - 'desktop/demo/job-pages.json'
      - 'desktop/demo/profile.md'
      - 'desktop/e2e/lib/cookie-layer-left.mjs'
      - 'desktop/lib/**'   # panel-files.test.js walks every desktop/lib and tools script for the panel's injectors
      - 'tools/*.js'
      - 'tools/*.mjs'
      - 'tools/**/*.js'
      - 'tools/**/*.mjs'
      - 'tests/fixtures/stores/job-answers.md'
      - 'extension/**'
      - 'tools/browser-form-fastpath.js'
      - 'tools/free-ai-eval-metrics.mjs'
      - 'tools/free-ai-form-asks.mjs'
      - 'tools/free-ai-form-cases.mjs'
      - 'tools/free-ai-form-list.mjs'
      - 'tools/free-ai-form-applicants.mjs'
      - 'tools/browser-form-snapshot.js'
      - 'tools/browser-submit-guard.js'
      - 'tools/fill-fixture.mjs'
      - 'desktop/test/fake-fill-page.js'   # worker/test/fill-page-characterization.test.js drives the page fill with it
      - '.github/workflows/tests-worker.yml'

permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read

concurrency:   # a PR's newer push replaces its older run and frees its runners; each commit of main keeps its own run (tests/test_main_runs_finish.py, tests/test_pr_runs_cancel.py)
  group: tests-worker-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
        working-directory: worker
      - run: bash tools/check.sh --area worker
