name: CI · Self-heal stats
# Who started it, on GitHub: the Worker's on-time start is named so (app-core/src/scheduler.js TITLES); GitHub's schedule and a hand start keep the default name.
run-name: ${{ inputs.scheduled && 'Self-heal stats · on time (Worker cron)' || '' }}

# The self-healing loop's numbers for the owner's page https://www.jobpilotto.top/self-heal: every issue the loop filed, by detector and how it ended,
# precision, the fixer's pull requests, the verdict pass, the AI cost per real bug, the recall of the planted bugs, the real bugs it caught. Computed from
# GitHub (desktop/e2e/selfheal-stats.mjs) and published to the site (PUT /self-heal/data, SELFHEAL_PUBLISH_KEY); the site keeps one snapshot per day.
on:
  schedule:   # the backup: the Worker's cron (app-core/src/scheduler.js) starts this on time, GitHub's scheduler is best-effort
    - cron: '40 */3 * * *'
  workflow_dispatch:
    inputs:
      scheduled:
        description: 'Started on time by the Worker (app-core/src/scheduler.js), not by hand'
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read   # the ai-cost artifacts and the interactions run's recall.json

concurrency:
  group: self-heal-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELFHEAL_PUBLISH_KEY: ${{ secrets.SELFHEAL_PUBLISH_KEY }}
      NOTION_BRAIN_TOKEN: ${{ secrets.NOTION_BRAIN_TOKEN }}   # the escape rate: the Bug Tracker, read-only (it must be shared with the "Job Pilotto Brain" connection)
      BUG_TRACKER_DB: ${{ vars.BUG_TRACKER_DB }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the whole history: what changed in the Finder each day (lib/finder-changes.mjs)
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Collect and publish
        run: node desktop/e2e/selfheal-stats.mjs --publish
