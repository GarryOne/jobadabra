name: CI · E2E suites for a PR
# Job: pick the suites
# The e2e suites a pull request points at (its UI text, its suite or harness files, and since gate G1b the suites that RUN the lines it changes: the code → suite map from
# main's coverage, e2e.yml's coverage-map job), started on the PR's own branch through e2e.yml: Linux suites, plus a macOS suite the map says ran the changed lines.
# A red suite blocks the merge (gate G1a, owner's yes 26 Oct 2026: on 25 Oct two run-view PRs saw cardstates red on their own run, merged, and beta 2 failed on it): the e2e
# run, titled "E2E for PR · <suites> · <branch>", is read by pr-verdict.yml into the PR's "All checks passed", and its first red suite turns that status red at once.
# This job only starts the run and ends (26 Oct 2026): it used to wait for it on a runner, ~20 min per push (owner: "How could you design such a slow and inefficient
# method of checking PRs?"). A flaky suite (red, then green on the same commit) passes inside e2e.yml; red twice blocks.
# Was report only from 24 Oct 2026, at most 4 suites. Why it exists: 8 of ~10 e2e fixes in beta runs 5-11 were tests lagging the app, found a night late.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'desktop/renderer/**'
      - 'desktop/lib/**'
      - 'desktop/main.js'
      - 'desktop/e2e/suites/**'
      - 'desktop/e2e/lanes.json'   # a promotion into backbone requires burn-in even without a suite-file edit
      - 'desktop/e2e/lib/**'
      - 'extension/**'
      # The files suites watch (their `export const watches`; #2043 changed quality's score.py and never started this: tests/test_workflow_paths.py)
      - 'src/ai/**'   # and what those import from their folder (lib/import-graph.mjs watchesWithImports: #2043's schema_notes.py, imported by score.py)
      - 'tools/mail_eval.py'
      - 'tests/fixtures/mail_eval.json'
      - 'desktop/e2e/fixtures/golden/**'
      - '.github/workflows/pr-suites.yml'
      # CI plumbing and shell: one short Windows check (lib/pr-suites.mjs windowsSmoke; #1997's relay tar broke every Windows suite, seen only by the next beta)
      - '.github/**'
      - 'tools/*.sh'
      - 'desktop/scripts/*.sh'

permissions:
  contents: read
  actions: write   # start e2e.yml on the PR's branch, see it listed (and read the coverage map artifact)
  pull-requests: read   # the PR still open? (no e2e run for a merged one); the PR's verdict

concurrency:
  group: pr-suites-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start:
    name: Start the suites this PR points at
    # A fork has no secrets: nothing to run there.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15   # the plan and the start; nothing waits here for the suites
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Install what the plan loads
        timeout-minutes: 5
        run: |
          (cd desktop/e2e && npm ci)
          (cd desktop && npm ci --omit=dev --ignore-scripts)
      - name: Plan
        timeout-minutes: 5
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}   # reads the newest code → suite map artifact (desktop/e2e/pr-suites.mjs)
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          git fetch -q origin main
          node desktop/e2e/pr-suites.mjs --base origin/main --plan --pull-request   # a PR: no `recorded` (page-cases.yml replays the cases; lib/pr-suites.mjs ON_PR_ELSEWHERE)
      - name: Start them
        timeout-minutes: 5
        id: start
        if: steps.plan.outputs.suites != '' || steps.plan.outputs.windows != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ steps.plan.outputs.suites }}
          LEFT: ${{ steps.plan.outputs.left }}
          STEPS: ${{ steps.plan.outputs.steps }}   # a PR: no step names, every suite whole, only the "(why)" reasons (desktop/e2e/lib/pr-suites.mjs stepLists, spec rule G2)
          WINDOWS: ${{ steps.plan.outputs.windows }}   # the Windows check's steps (JSON) when this PR changes CI plumbing or shell; empty: none
          HEAD_REF: ${{ github.head_ref }}   # a branch name is untrusted text: never inline in the script
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail   # a program piped into tee keeps its exit code (tests/test_workflow_pipefail.py)
          # Merged or closed while this job waited for a runner (an override merge deletes the branch: #2041 went red on HTTP 422 "No ref found"): nothing to test.
          if [ "$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json state -q .state)" != OPEN ]; then echo "PR #$PR is merged or closed: no e2e run."; echo "skipped=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          started() { echo "$1"; }
          dispatch() {   # a branch whose workflow file predates the input gets HTTP 422 "Unexpected inputs"
            if ! gh workflow run "$@" 2>"$RUNNER_TEMP/dispatch.err"; then
              cat "$RUNNER_TEMP/dispatch.err"
              if grep -q 'Unexpected inputs' "$RUNNER_TEMP/dispatch.err"; then echo "This branch's $1 is older than main's: rebase on main (tools/ship.sh does it), then push again."; fi
              exit 1
            fi
          }
          # The input made for this (e2e.yml): SQLite store, no screenshot review, no harness-test step. It runs the PR branch's own e2e.yml.
          if [ -n "$SUITES" ]; then
            dispatch e2e.yml --ref "$HEAD_REF" -f pr_suites="$SUITES" -f pr_steps="${STEPS:-}"
            started "Started e2e.yml on \`$HEAD_REF\`: $SUITES. Left to the gate: ${LEFT:-none}."
          fi
          if [ -n "$WINDOWS" ]; then
            gh workflow run e2e-windows.yml --ref "$HEAD_REF" -f suites=settings -f pr_steps="$WINDOWS" 2>"$RUNNER_TEMP/dispatch.err" || { cat "$RUNNER_TEMP/dispatch.err"; exit 1; }
            started "Started the Windows check on \`$HEAD_REF\`: settings · $WINDOWS."
          fi
      # Seen listed before this job ends: pr-verdict.yml runs when this workflow ends, and must find the e2e run pending, never a commit that looks finished.
      - name: See the e2e runs listed
        if: (steps.plan.outputs.suites != '' || steps.plan.outputs.windows != '') && steps.start.outputs.skipped != '1'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUITES: ${{ steps.plan.outputs.suites }}
          WINDOWS: ${{ steps.plan.outputs.windows }}
        run: |
          listed() {   # $1: the workflow file; its run for this PR is titled "E2E for PR · ..."
            for _ in $(seq 1 24); do
              id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$1" --commit "$HEAD_SHA" -L 20 --json databaseId,displayTitle -q '[.[] | select(.displayTitle | startswith("E2E for PR · "))][0].databaseId // empty')"
              [ -n "$id" ] && { echo "$1 for this PR: https://github.com/$GITHUB_REPOSITORY/actions/runs/$id"; return 0; }
              sleep 5
            done
            echo "::error::no \"E2E for PR\" run of $1 for $HEAD_SHA after 2 min: this branch's $1 is older than main's (its runs are titled otherwise). Rebase on main (tools/ship.sh does it) and push again."; return 1
          }
          if [ -n "$SUITES" ]; then listed e2e.yml; fi
          if [ -n "$WINDOWS" ]; then listed e2e-windows.yml; fi
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
