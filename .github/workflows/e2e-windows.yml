name: CI · End-to-end on Windows

# The Mac is the product's main platform (e2e.yml); Windows users get the same app, and a Windows-only break (paths, quoting, the installer's
# environment) was invisible there. One job per suite, like e2e.yml. By hand: the `suites` input (empty = all), `fixed: true` = the fixed path (E2E_SEED=0).
# 4 Oct 2026, parity with the Mac: the Mac run (e2e.yml, job "Windows follows") starts this one when it tested something, with its commit, the same
# suites and the same AI review (plan-windows.mjs). A commit Windows already tested is not run again. On a release gate's build it is the Windows beta gate (approve-windows).
# 7 Oct 2026: the release run (desktop.yml) calls it as its "E2E · Windows" job, after "E2E · Mac + Linux", with that gate's suites, on the fixed path as the Mac gate
# (it used to take the Mac run's id as its seed: a gate walked a different path on Windows than on the Mac).
run-name: ${{ inputs.pr_steps && format('E2E for PR · windows {0} · {1}', inputs.suites, github.ref_name) || format('E2E Windows · {0} · {1}', inputs.suites || inputs.mac_run && 'the Mac run''s suites' || 'all suites', inputs.sha || github.ref_name) }}   # which suites, at a glance (owner, 7 Oct 2026)   # a PR's check (pr-suites.yml): the verdict counts runs titled "E2E for PR · "
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to run on Windows, comma-separated (empty = all)'
        required: false
      fixed:
        description: 'The fixed path (E2E_SEED=0, as the release gate) instead of a seeded one'
        type: boolean
        default: false
      mac_run:
        description: 'Set by e2e.yml: the Mac run to follow (its suites)'
        required: false
      sha:
        description: 'Set by e2e.yml: the commit to test'
        required: false
      review:
        description: 'Set by e2e.yml: 1 = the AI screenshot review, as on the Mac run'
        required: false
      full:
        description: 'Set by e2e.yml: 1 = the paid AI judge steps, as on the Mac run'
        required: false
      tag:
        description: 'Set by e2e.yml on a release gate: the build to approve for Windows beta testers when every Windows suite passes'
        required: false
      pr_steps:
        description: "Set by pr-suites.yml: a PR's short Windows check, the steps to run as JSON (SQLite, no lock; lib/pr-suites.mjs WINDOWS_SMOKE)"
        required: false
  # The release run (desktop.yml) calls this as its "E2E · Windows" job: the Windows beta gate for the release it built.
  workflow_call:
    inputs:
      pr_steps:
        description: 'Never set by a release run: the PR check only (pr-suites.yml dispatches it)'
        type: string
        default: ''
      suites:
        description: 'Suites, comma-separated; empty = the gate plans them itself (plan-windows.mjs: the same plan as the Mac + Linux gate)'
        type: string
        default: ''
      sha:
        description: 'The commit the release was built from'
        type: string
        required: true
      tag:
        description: 'The release to approve for Windows beta testers when every Windows suite passes'
        type: string
        required: true
      review:
        description: '1 = the AI screenshot review (only with suites named; a planned gate decides it as the Mac + Linux gate)'
        type: string
        default: ''
      full:
        description: '1 = the paid AI judge steps, as on the Mac + Linux gate'
        type: string
        default: '1'
      fixed:
        description: 'The fixed path (E2E_SEED=0), as the Mac + Linux gate'
        type: boolean
        default: true
      release_run:
        description: 'Called by the release run, which shows the approval as its own "Release · Windows beta" step: not here'
        type: boolean
        default: true

permissions:
  contents: read

# One Windows run at a time, whole: two Mac runs close together started two Windows runs whose jobs cancelled each other in the shared
# per-suite groups (runs 37170683571 and 37171347525, 4 Oct 2026). A newer waiting run replaces an older waiting one: Windows tests the latest.
concurrency:
  group: e2e-windows
  cancel-in-progress: false


jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: read     # the release gate's plan (plan-run.mjs) reads the waiting UI findings for its AI review decision, as the Mac + Linux gate's
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      count: ${{ steps.pick.outputs.count }}
      review: ${{ steps.pick.outputs.review }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: What to run (the Mac run's suites and AI review, or the ones named by hand)
        id: pick
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ONLY: ${{ inputs.suites }}
          MAC_RUN: ${{ inputs.mac_run }}
          SHA: ${{ inputs.sha }}
          REVIEW: ${{ inputs.review }}
          GATE_TAG: ${{ inputs.tag }}   # the release run's Windows gate: planned as the Mac + Linux gate (plan-run.mjs), not after it
        run: node plan-windows.mjs >> "$GITHUB_OUTPUT"

  suite:
    name: ${{ matrix.key }} (Windows)
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 225   # + the wait for the suite's lock (up to 3 h)
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash   # the suites' commands use bash syntax; pwsh would mangle quoting
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}   # the OpenAI family's turn (odd runs; desktop/e2e/lib/engine.mjs pickFamily)
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_FOCUSDISMISS: ${{ secrets.E2E_NOTION_TOKEN_FOCUSDISMISS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_APPLYFLOWS: ${{ secrets.E2E_NOTION_TOKEN_APPLYFLOWS }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_FULL: ${{ inputs.full }}   # the paid AI judge steps, as on the Mac run it follows (a nightly gate or a run by hand)
      E2E_SEED: ${{ inputs.fixed && '0' || inputs.mac_run || github.run_id }}   # after a Mac run: the Mac's own seed, the same path on both   # printed and saved in seed.json: E2E_SEED=<n> node suite.mjs <suite> replays it
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/${{ matrix.key }}
      JP_REPLAY_SHARD: ${{ matrix.shard }}   # a sharded suite's slice (lib/suite-shards.mjs: the recorded replay, 13 Oct 2026); empty: the whole suite
      # AI cost: as e2e.yml. A Windows run follows a Mac run that already asked live, so it always replays what it has seen (its own cache: paths differ).
      E2E_AI_CACHE: ${{ github.workspace }}/desktop/e2e/.ai-cache
      E2E_AI_REPLAY: '1'
      E2E_JUDGE_MODEL: ${{ matrix.suite == 'quality' && 'claude-sonnet-5-5' || 'claude-haiku-5-5' }}
      E2E_BLOB_DIR: ${{ github.workspace }}/blob-report   # the suite's part of the run's HTML report (the report job merges them)
      E2E_RUN_KIND: ${{ inputs.tag && 'gate' || '' }}   # how an issue names the run (lib/replay.mjs), as e2e.yml
      # A PR's short Windows check (pr-suites.yml, owner's yes 26 Oct 2026): only these steps (lib/runner.mjs), on a fresh SQLite store, so no Notion page and no lock.
      E2E_STEP_NAMES: ${{ inputs.pr_steps }}
      E2E_STORE: ${{ inputs.pr_steps != '' && 'sqlite' || '' }}
    permissions:
      contents: write   # tools/e2e-lock.sh creates the lock ref
      issues: read      # the screenshot review reads its by-design lessons from the closed issues (lib/review-lessons.mjs)
      statuses: write   # a PR check: the PR's "All checks passed", written as the job ends (tools/pr-verdict.py)
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}   # the commit the Mac run tested
      # Waits for the suite's lock instead of queueing in a concurrency group (GitHub keeps ONE waiting job per group and cancels the older one: beta 14, 24 Oct 2026).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: lock-tools
          sparse-checkout: tools/e2e-lock.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The relay comes from this workflow's own commit: a bisect or a soak checks out an older commit above, which may have no relay (26 Oct 2026: every bisect
      # failed with "Can't find 'action.yml'"). Guard: tests/test_ci_free_ai.py test_no_job_loads_a_local_action_from_another_commit.
      - name: The Free AI relay from this workflow's own commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci-relay
          persist-credentials: false
      - name: Free AI relay (CI's AI since 26 Oct 2026; the site's handler on this runner, CI's own Workers AI token)
        uses: ./.ci-relay/.github/actions/free-ai-relay
        with:
          public-tree: .ci-relay
          cf-token: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          cf-account: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          app-id: ${{ secrets.CI_APP_ID }}
          app-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the suites that use a browser (the real extension, the extension's page code)
        working-directory: desktop/e2e
        # As on the Mac (e2e.yml): the suite says it needs one (`export const browser = true` or `export const needsChromium = true`). A list of suite names here
        # missed visitread and visitsauto (7 Oct 2026: "Executable doesn't exist at ...chrome.exe").
        run: |
          if [ -f "suites/${{ matrix.suite }}.mjs" ] && grep -qE '^export const (browser|needsChromium) = true' "suites/${{ matrix.suite }}.mjs"; then npx playwright-core install chromium; else echo "no browser needed"; fi
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Earlier AI answers (replayed instead of paid again; lib/ai-meter.mjs)
        if: env.E2E_ANTHROPIC_KEY != ''
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-windows-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-answers-v2-windows-${{ matrix.key }}-
      # The lock is taken as late as possible (after the installs, which never touch the suite's Notion page): a waiting job holds its runner.
      - name: The App token for the lock (a re-run attempt's workflow token cannot create refs)
        id: lock_app
        if: inputs.pr_steps == ''
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Take the suite's lock (it owns one Notion page; waits, never dropped)
        if: inputs.pr_steps == ''   # a PR check runs on SQLite: no page to share, and a runner never waits for a lock
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh acquire "${{ matrix.key }}"
      - name: Run the ${{ matrix.suite }} suite on Windows
        working-directory: desktop/e2e
        timeout-minutes: 15   # the suite stops itself at its budget (7 min, recorded 11), and by force 3 min later (suite.mjs)
        run: |
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped."; exit 0; fi
          node suite.mjs ${{ matrix.suite }}
      - name: The apply suite again in Microsoft Edge (the Windows default; preinstalled on the runner)
        if: matrix.suite == 'apply'
        working-directory: desktop/e2e
        timeout-minutes: 30
        env:
          E2E_BROWSER: msedge
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/apply-edge   # its own folder: the Chromium run's evidence stays
        run: node suite.mjs apply
      - name: What the suite spent on Free AI (the relay's own meter)
        if: always() && env.E2E_FREE_AI_URL != ''
        continue-on-error: true   # a report never decides a run
        shell: bash
        run: |
          spent="$(curl -s -m 10 "${E2E_FREE_AI_URL%/api/ai}/__report" || echo '{}')"
          echo "Free AI (Workers AI) this suite: $spent"
          echo "$spent" > "$E2E_ARTIFACTS/free-ai-spend.json" || true
      - name: Report what the suite paid for AI to /ai-cost (the app under test and the judges)
        if: always() && env.E2E_ANTHROPIC_KEY != ''
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for kind in app app-openai judges; do   # app-openai: the app under test on an OpenAI engine (odd runs), shown under OpenAI on /ai-cost
            for dir in "$E2E_ARTIFACTS" "${{ github.workspace }}/e2e-artifacts-windows/apply-edge"; do
              file="$dir/ai-usage-$kind.json"; [ -f "$file" ] || continue
              tag=""; case "$dir" in *rerun*) tag="-rerun";; *apply-edge*) tag="-edge";; esac
              job="e2e-$kind"; provider=anthropic
              if [ "$kind" = app-openai ]; then job=e2e-app; provider=openai; tag="$tag-openai"; fi
              node desktop/e2e/ai-cost-report.mjs --job "$job" --suffix "windows-${{ matrix.key }}$tag" --file "$file" --provider "$provider"
            done
          done
      - name: Keep the AI answers for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        run: find desktop/e2e/.ai-cache -name '*.json' -mtime +7 -delete   # an answer not replayed for a week is dropped (a replay touches it)
      - if: success() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-windows-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The suite's part of the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-windows-${{ matrix.key }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # Steps and a failed suite's trace as data (the /admin/e2e runs page that read them was dropped on 15 Oct 2026; the artifact stays for download).
      - name: Steps and trace for /admin/e2e
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-windows-${{ matrix.key }}
          path: |
            e2e-artifacts-windows/${{ matrix.key }}/steps.json
            e2e-artifacts-windows/${{ matrix.key }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-windows-${{ matrix.key }}
          path: e2e-artifacts-windows/${{ matrix.key }}
          if-no-files-found: ignore
      - name: The App token to give the lock back (the first one may have expired)
        id: lock_app_end
        if: always() && inputs.pr_steps == ''
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Give the suite's lock back
        if: always() && inputs.pr_steps == ''
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app_end.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh release "${{ matrix.key }}"
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && inputs.pr_steps != ''   # a PR's Windows check (pr-suites.yml)
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"

  # One Playwright HTML report for the run (6 Oct 2026): every suite wrote a blob (desktop/e2e/report/playwright.config.mjs); merged here, uploaded as e2e-report
  # (uncompressed: the owner's site serves its files straight from the artifact, admin/e2e-report.js) and its link printed in the merge step's log.

  # The AI screenshot review: every suite's pages in ONE Claude batch, after the suites (.github/actions/e2e-review; owner, 26 Oct 2026: "cut the costs in half, but close to the same quality as Claude").
  review:
    name: AI review of the screenshots
    needs: [plan, suite]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.review == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # the batch waits up to 6 min, then asks what is left directly
    permissions:
      contents: read
      issues: read    # the by-design lessons come from the closed issues (lib/review-lessons.mjs)
      actions: read   # this run's suite artifacts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: ./.github/actions/e2e-review
        with:
          lane: windows
          anthropic-key: ${{ secrets.E2E_ANTHROPIC_KEY }}
          publish-key: ${{ secrets.AI_COST_PUBLISH_KEY }}
          github-token: ${{ github.token }}

  report:
    name: Windows HTML report
    needs: [plan, suite]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/merge-e2e-report.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: blob-windows-*   # only Windows: in the release run the Mac gate's blob-<suite> sit in the same run
          path: blob-reports
          merge-multiple: true
      - name: Merge the suites into one HTML report
        id: merge
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          bash "$GITHUB_WORKSPACE/tools/merge-e2e-report.sh" "$GITHUB_WORKSPACE/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q "^made=1" "$GITHUB_OUTPUT"; then echo "HTML report (admins): https://www.jobpilotto.top/admin/e2e/run/${{ github.run_id }}/report?os=windows"; fi
      - uses: actions/upload-artifact@v6
        if: steps.merge.outputs.made == '1'
        with:
          name: e2e-report-windows   # its own name: in the release run it sits beside the Mac + Linux gate's e2e-report (admin/e2e-report.js reads both)
          path: e2e-report
          compression-level: 0

  # Windows beta approval (owner, 6 Oct 2026) for a gate by hand (tag set, not from the release run): beta-approve.yml, the same job the release run (desktop.yml) shows
  # as its own "Release · Windows beta" step after "E2E · Windows". Each platform is approved on its own (desktop/lib/updater.js approvedFor).
  approve-windows:
    needs: [plan, suite]
    if: success() && inputs.tag != '' && !inputs.release_run
    permissions:
      contents: write
      actions: read
      issues: write
    uses: ./.github/workflows/beta-approve.yml
    with:
      platform: windows
      tag: ${{ inputs.tag }}
      sha: ${{ inputs.sha }}
