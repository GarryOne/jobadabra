name: CI · Harness tests
# The e2e harness's safety-critical unit tests (desktop/e2e/test-sets.json "pr", about a minute; the rest run daily in harness-daily.yml, owner 17 Oct 2026: 0 catches in 30 days), on a pull request that changes the harness's code. GitHub's `on: paths:` below decides (owner, 14 Oct 2026: "rely fully on gh workflow
# paths"; the shared pick ran them on a PR that changed only a recorded case). Not a required check: a required check whose workflow `paths:` skips never reports and
# blocks the PR (tests/test_affected_jobs.py checks no required check lives in a workflow with `paths:`). The backstop for a break from outside these paths is e2e.yml's plan job.
# History: they ran only in that scheduled plan job, which broke silently for ~11 h (12 Oct 2026, ERR_MODULE_NOT_FOUND after 3394c2e); here they gate the change that would
# break them (test/recorded-ci-deps.test.mjs checks every job that runs them installs the app's own packages and stages desktop/shared).
on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/e2e/**'
      # Data that other jobs replay, not harness code: recorded cases (page-cases.yml, "New test pages fail on the old build"), fixture pages, the widget zoo (control-tests.yml).
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      - 'desktop/scripts/stage.mjs'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - '.github/workflows/harness.yml'

permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read
  statuses: write       # the PR's "All checks passed"

concurrency:
  group: harness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: The safety-critical tests (privacy scrub, records publish and fetch, discovery pick and judge, journey check, gates, ledgers, owner guards)
        working-directory: desktop/e2e
        # the flags go before the files; the full set runs daily (harness-daily.yml)
        run: |
          # shellcheck disable=SC2046
          node --test --test-reporter=spec $(node test-sets.mjs pr)
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
