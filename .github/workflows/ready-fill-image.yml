name: CI · Ready to send image
# Builds the Ready to send container image and runs one night in it against a stand-in site (hosted/ready-fill/image-check.mjs, ~1-2 min):
# a night that cannot start fails the PR instead of the first real night (18 Oct 2026: every night failed at setup, found 25 min after the deploy).
# Fictional data only, no AI, no keys, nothing deployed.
on:
  pull_request:
    paths:
      - 'hosted/ready-fill/**'
      - 'desktop/ready-fill/**'   # extension/ and app-core/src/ changes are checked by the same night before each runner deploy (release-ready-runner.yml), not on every PR
      - 'desktop/lib/form-address.js'   # copied into the image
      - '.github/workflows/ready-fill-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read
concurrency:
  group: ready-fill-image-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # a PR's newer push cancels its older run
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build the image
        run: docker build -f hosted/ready-fill/Dockerfile -t ready-fill:check .
      - name: One night against a stand-in site
        run: node hosted/ready-fill/image-check.mjs ready-fill:check
