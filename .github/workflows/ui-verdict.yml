name: CI · UI verdicts

# THE VERDICT PASS, in parallel. After every filing of the UI loop (ui-findings.yml), up to five one-off findings (seen on one build, not yet judged) are
# read by Codex, one job each, read-only: it opens the code and the screenshot and answers real / false-positive / needs-human. A real one is labelled
# `confirmed` (the fixer takes it next), a false positive is closed `wontfix-auto`, the rest `needs-human`. Why: the fixer judged one finding per run, so a run
# that filed a dozen took days to sort (4 Oct 2026). Only with the repo variable JOB_PILOTTO_FIXER_VERDICTS = "on" (it spends Codex plan).
# AI: Codex plan through the broker, one call per finding (desktop/e2e/judge-codex.mjs). Why (31 Oct 2026, owner: "Why Anthropic is reached? We should use fully the Codex"): the Claude step failed four jobs
# red on "Credit balance is too low" and each sent its own alert. A refused call (budget until Codex resets, login, broker down) skips the job with its reason; one alert per run (ai-skipped job).
on:
  workflow_run:
    workflows: ['CI · UI findings']
    types: [completed]
  workflow_dispatch:
    inputs:
      issues:
        description: 'Re-judge these issues (comma-separated numbers): the verdicts are printed in the log and nothing is applied to the issues'
        required: false
      judge_model:
        description: 'Which Claude tier judges on the broker: claude-sonnet-5-5 (mid, gpt-6.1-sol; the default) or claude-opus-5-5 (large, gpt-6-astra). A by-hand measurement of the verdict quality (owner, 31 Oct 2026)'
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5

permissions:
  contents: read
  issues: write
  id-token: write   # the Codex broker knows a run by its OIDC token (desktop/e2e/lib/broker-client.mjs)

concurrency:
  group: ui-verdict
  cancel-in-progress: false

jobs:
  pick:
    if: vars.JOB_PILOTTO_FIXER_VERDICTS == 'on'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The one-off findings to judge
        id: list
        env:
          ISSUES: ${{ inputs.issues }}
        run: node desktop/e2e/pick.mjs --out .heal --verdict-list 5 --issues "$ISSUES"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  judge:
    needs: pick
    if: needs.pick.outputs.count != '0' && needs.pick.outputs.count != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.pick.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NUMBER: ${{ matrix.issue }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The finding and its screenshot
        run: |
          node desktop/e2e/reversals.mjs --out .heal/lessons.md   # the owner's corrections, appended to the prompt
          node desktop/e2e/pick.mjs --out .heal --issue "$NUMBER"
          shot=$(jq -r '.screenshot // ""' .heal/candidate.json)
          if [ -n "$shot" ]; then curl -fsSL -o .heal/screenshot.png "$shot" || echo "screenshot not downloaded"; fi
      - name: Codex judges it (read-only, one broker call; skips with its reason when the broker refuses)
        id: judge
        env:
          JUDGE_MODEL: ${{ inputs.judge_model }}
        run: node desktop/e2e/judge-codex.mjs --mode verdict
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ai-capped-verdict-${{ matrix.issue }}   # present only when the broker refused: the ai-skipped job sends the one alert
          path: ${{ runner.temp }}/ai-capped/ai-capped.json
          if-no-files-found: ignore
      - name: Show the verdict (a re-judgement by hand applies nothing)
        if: inputs.issues != '' && steps.judge.outcome == 'success' && steps.judge.outputs.skipped != 'true'
        run: cat .heal/verdict.md
      - name: Apply the verdict
        if: inputs.issues == '' && steps.judge.outcome == 'success' && steps.judge.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          # Comment, severity, labels, close: one script, shared with the triage-github-open-issues skill (desktop/e2e/apply-verdict.sh).
          desktop/e2e/apply-verdict.sh "$NUMBER" .heal/verdict.md "$REPO"
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  # One alert for the whole run, however many judge jobs the broker refused (owner, 31 Oct 2026: four identical alerts from one run).
  ai-skipped:
    needs: judge
    if: always() && !cancelled() && needs.judge.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/gh-ledger.sh
            .github/actions
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
