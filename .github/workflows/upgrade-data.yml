name: CI · Upgrade + data test (weekly, report only)

# Each release fills its own data folder (its bundled Python and store), the build of main replaces it the way an update does, the app opens that folder, and every job, answer and setting
# must still be there (desktop/scripts/upgrade-data-proof.mjs, compare in desktop/lib/data-fingerprint.js). Mac and Windows.
# Cadence follows how likely each scenario is to break or change (owner, 1 Nov 2026: "their frequency should be different, based on the probability for that thing to break or to be
# modified"): the newest stable release every week, the three newest on the 1st of the month (an old format drifts slowly); the folder-move logic, the likelier break, is a fast
# test on the pull requests that touch it (next PR of the spec), not here. Weekly, not daily (owner, 1 Nov 2026: "We can have it but running weekly").
# Report only (owner, 1 Nov 2026, five new test methods): nothing waits for this run and a red one blocks no merge and no beta; a red run is a finding for the Testing Overview.
# Spec: docs/superpowers/specs/2026-11-01-upgrade-data-test-design.md. Never the owner's data, apps or port: a temp data folder, apps installed on the runner only.
on:
  schedule:
    - cron: '41 4 * * 1'   # Mondays: the newest stable release (a backup start; the timer belongs to the Worker that starts the other jobs)
    - cron: '41 5 1 * *'   # the 1st of the month: the three newest
  workflow_dispatch:
    inputs:
      new_tag:
        description: 'A published build to update TO (empty: build main in this run, 15 to 25 minutes)'
        required: false
        default: ''
      releases:
        description: 'How many of the newest stable releases to update from (1 to 3)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: upgrade-data
  cancel-in-progress: false

jobs:
  releases:
    name: Which releases
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the newest stable releases (no draft, no beta) that ship both generic installers: 3 on the monthly start, else the input (1)
          if [ "${{ github.event.schedule }}" = "41 5 1 * *" ]; then want=3; else want="${{ inputs.releases || 1 }}"; fi
          tags=""
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 40 --json tagName,isDraft,isPrerelease -q '.[] | select((.isDraft | not) and (.isPrerelease | not)) | .tagName'); do
            names=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            if echo "$names" | grep -qx 'Jobadabra-mac-arm64.zip' && echo "$names" | grep -qx 'Jobadabra-windows-x64.exe'; then tags="$tags $tag"; fi
            [ "$(echo $tags | wc -w)" -ge "$want" ] && break
          done
          [ -n "$tags" ] || { echo "::error::No stable release with both installers"; exit 1; }
          echo "tags=$(echo $tags)" >> "$GITHUB_OUTPUT"
          echo "Testing updates from:$tags"

  mac:
    name: Upgrade · Mac
    needs: releases
    runs-on: macos-latest   # Apple Silicon, the image the Mac build and its e2e run on
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # stage.mjs counts the extension's commits for its version
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6   # only reads the Python release list; the app bundles its own
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: The build to update to · published build
        if: inputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.new_tag }}" --repo "$GITHUB_REPOSITORY" -p 'Jobadabra-mac-arm64.zip' -D desktop/dist
      - name: The build to update to · build main
        if: inputs.new_tag == ''
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > ../config/google_oauth_client.json; fi
          scripts/audiotee.sh && test -x build/bin/audiotee
          node scripts/stage.mjs --app && scripts/python.sh
          npm run build -- -c.buildVersion="${{ github.run_number }}"
          cp dist/Jobadabra-*-arm64.zip dist/Jobadabra-mac-arm64.zip
      - name: Update each release to it, and compare the data
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.releases.outputs.tags }}
        run: |
          failed=0
          for tag in $TAGS; do
            mkdir -p "old/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'Jobadabra-mac-arm64.zip' -D "old/$tag"
            node scripts/upgrade-data-proof.mjs "${tag#desktop-v}" "old/$tag/Jobadabra-mac-arm64.zip" dist/Jobadabra-mac-arm64.zip upgrade || failed=1
          done
          exit $failed
      - name: Summary
        if: always()
        working-directory: desktop
        run: |
          # the job log, not a step summary (owner, 26 Oct 2026: no CI job writes one; tests/test_no_step_summaries.py)
          for f in upgrade/upgrade-*.json; do [ -f "$f" ] && jq -r '"\(.os) from \(.from): \(.state), \(.lost | length) lost, \(.changed | length) changed \(.note)"' "$f"; done; true
      - name: Keep the screenshots and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-data-mac
          path: desktop/upgrade
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Upgrade · Windows
    needs: releases
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: The build to update to · published build
        if: inputs.new_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.new_tag }}" --repo "$GITHUB_REPOSITORY" -p 'Jobadabra-windows-x64.exe' -D desktop/dist
      - name: The build to update to · build main
        if: inputs.new_tag == ''
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > ../config/google_oauth_client.json; fi
          node scripts/stage.mjs --app && scripts/python.sh
          npm run build:win -- -c.buildVersion="${{ github.run_number }}"
          cp dist/Jobadabra-*-x64.exe dist/Jobadabra-windows-x64.exe
      - name: Update each release to it, and compare the data
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.releases.outputs.tags }}
        run: |
          failed=0
          for tag in $TAGS; do
            mkdir -p "old/$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p 'Jobadabra-windows-x64.exe' -D "old/$tag"
            node scripts/upgrade-data-proof.mjs "${tag#desktop-v}" "old/$tag/Jobadabra-windows-x64.exe" dist/Jobadabra-windows-x64.exe upgrade || failed=1
          done
          exit $failed
      - name: Summary
        if: always()
        working-directory: desktop
        run: |
          # the job log, not a step summary (owner, 26 Oct 2026: no CI job writes one; tests/test_no_step_summaries.py)
          for f in upgrade/upgrade-*.json; do [ -f "$f" ] && jq -r '"\(.os) from \(.from): \(.state), \(.lost | length) lost, \(.changed | length) changed \(.note)"' "$f"; done; true
      - name: Keep the screenshots and results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-data-windows
          path: desktop/upgrade
          if-no-files-found: ignore
          retention-days: 14
