<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Cashier, Collapsed Sections at E2E Accordion Retail</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}.field{margin:14px 0}label{display:block;margin-bottom:4px}input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body><h1>Cashier, Collapsed Sections</h1><p>E2E Accordion Retail · Zurich, Switzerland</p>
<form id="application_form"><div class="field"><label for="first_name">Prénom *</label><input id="first_name" name="first_name" type="text" required ></div><div class="field"><label for="last_name">Nom *</label><input id="last_name" name="last_name" type="text" required ></div>
  <h3><button type="button" id="b_sec_profile" aria-expanded="false" aria-controls="sec_profile" onclick="const r = document.getElementById('sec_profile'); r.hidden = !r.hidden; this.setAttribute('aria-expanded', String(!r.hidden))">Informations sur le profil</button></h3><div id="sec_profile" hidden><div class="field"><label for="email">E-mail *</label><input id="email" name="email" type="email" required ></div></div>
  <h3><button type="button" id="b_sec_job" aria-expanded="false" aria-controls="sec_job" onclick="const r = document.getElementById('sec_job'); r.hidden = !r.hidden; this.setAttribute('aria-expanded', String(!r.hidden))">Informations propres au poste</button></h3><div id="sec_job" hidden><div class="field"><label for="question_4001">Years of experience with cash registers *</label><input id="question_4001" name="question_4001" type="text" required ></div></div>
  <div class="field"><button type="submit" id="submit_app">Envoyer</button></div></form>
<script>
const fired = kind => fetch('/__fired?kind=' + kind + '&form=' + encodeURIComponent(location.pathname), {method: 'POST', keepalive: true});
document.addEventListener('click', event => { if (event.target.closest('[type=submit]')) fired('click'); }, true);
document.addEventListener('submit', event => { event.preventDefault(); fired('submit'); }, true);

</script></body></html>
