name: Extension · Web Store zip
# Builds the Chrome Web Store package (no manifest "key", stamped version) by hand or from a tag extension-v*; the zip is the artifact to upload
# in the developer dashboard (owner, 24 Oct 2026). Nothing is uploaded or published from here.
on:
  workflow_dispatch:
  push:
    tags: ['extension-v*']
permissions:
  contents: read
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version counts the extension's commits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/store-zip.mjs jobadabra-extension.zip
      - run: unzip -p jobadabra-extension.zip manifest.json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));if('key' in m)process.exit(1);console.log(m.version)"
      - uses: actions/upload-artifact@v4
        with:
          name: jobadabra-extension-store-zip
          path: jobadabra-extension.zip
