name: CI · Harness tests
# The e2e harness's unit tests a pull request reaches (owner, 27 Oct 2026, "Yes, reached files"): the safety-critical set (desktop/e2e/test-sets.json "pr") when the harness
# itself changed, plus every test file whose imports reach a changed file (desktop/e2e/lib/test-reach.mjs); the whole folder still runs daily (harness-daily.yml).
# Why: with only the pr set on PRs, 8c8bd70 and 3fc251e broke daily-set tests unseen and harness-daily stayed red 10 days (17-27 Oct 2026).
# GitHub's `on: paths:` below starts it for every area a harness test reaches (test/test-reach.test.mjs fails when one is missing); the plan step then picks the files, no install first.
# Not a required check: a required check whose workflow `paths:` skips never reports and blocks the PR (tests/test_affected_jobs.py). The backstop is harness-daily.yml.
# History: they ran only in e2e.yml's scheduled plan job, which broke silently for ~11 h (12 Oct 2026, ERR_MODULE_NOT_FOUND after 3394c2e); here they gate the change that would
# break them (test/recorded-ci-deps.test.mjs checks every job that runs them installs the app's own packages and stages desktop/shared).
on:
  pull_request:
    branches: [main]
    paths:
      # Every file or folder a harness test reaches (desktop/e2e/lib/test-reach.mjs), so the plan below sees each change that can break one: test/test-reach.test.mjs fails on a missing one.
      - 'desktop/**'
      # Data that other jobs replay (page-cases.yml, control-tests.yml); no harness test reaches them (owner, 14 Oct 2026: a recorded case alone started the harness).
      - '!desktop/e2e/recorded/**'
      - '!desktop/e2e/recorded-pending/**'
      - '!desktop/e2e/fixtures/**'
      - '!desktop/e2e/ladder-fixtures/**'
      - '!desktop/e2e/widget-zoo/**'
      # ... except the ones a harness test reads (a later pattern wins)
      - 'desktop/e2e/fixtures/cv.json'
      - 'desktop/e2e/fixtures/cv.pdf'
      - 'desktop/e2e/fixtures/golden/**'   # quality.test.mjs reads truth.json and sources.json (#2450 added sources.json)
      - 'desktop/e2e/fixtures/golden-photographer/**'
      - 'desktop/e2e/fixtures/real-forms/**'
      - 'desktop/e2e/recorded/multi-select-menu-1/form.html'
      - 'extension/**'
      - 'src/**'   # test/quality.test.mjs reads the engine's folder
      - '.github/workflows/harness.yml'
      - '.github/workflows/e2e-windows.yml'
      - '.github/workflows/e2e.yml'
      - '.github/workflows/journeys.yml'
      - '.github/workflows/page-cases.yml'
      - '.github/workflows/replay-refill.yml'
      - 'hosted/ready-fill/extension-storage.mjs'
      - 'hosted/ready-fill/fill-video.mjs'
      - 'tools/browser-submit-guard.js'
      - 'tools/claim-shape.mjs'
      - 'tools/design-system/build.mjs'
      - 'tools/design-system/rules-html.mjs'
      - 'tools/design-system/serve.mjs'
      - 'tools/design-system/zip.mjs'
      - 'tools/lanes-check.mjs'
      - 'tools/pool-rows.mjs'
      - 'tools/record-env.mjs'
      - 'tools/rung-trailer.mjs'
      - 'tools/suspend-flip.mjs'
      - 'worker/src/**'   # staged into desktop/shared/worker/, which the app's server imports (review on #2241)

permissions:
  contents: read
  actions: read         # the commit's runs and jobs, for the PR's verdict (the last step of each job)
  pull-requests: read
  statuses: write       # the PR's "All checks passed"

concurrency:
  group: harness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the plan diffs the PR against main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Which harness tests this change reaches
        id: plan
        working-directory: desktop/e2e
        run: |
          git fetch -q origin main
          node test-sets.mjs reached --base origin/main >> "$GITHUB_OUTPUT"
      - name: Install the tests
        if: steps.plan.outputs.files != ''
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Install the app's own packages
        if: steps.plan.outputs.files != ''
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      - name: Stage the app's shared files
        if: steps.plan.outputs.files != ''
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      - name: The browsers, when a picked test opens one (the full one loads the extension)
        if: steps.plan.outputs.browser == 'true'
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: The harness tests this change reaches
        if: steps.plan.outputs.files != ''
        working-directory: desktop/e2e
        env:
          FILES: ${{ steps.plan.outputs.files }}
        # the flags go before the files; the full set runs daily (harness-daily.yml)
        run: |
          # shellcheck disable=SC2086
          node --test --test-reporter=spec $FILES
      # The PR's one required status, written as this job ends (tools/pr-verdict.py): no separate job waits for a runner to write it (owner on #2042, 26 Oct 2026).
      - name: Write the PR's verdict
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true   # never turns a job red; pr-verdict.yml writes it again when the workflow ends
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/tools/pr-verdict.py?ref=$GITHUB_SHA" > "$RUNNER_TEMP/pr-verdict.py"
          py=python3; "$py" -c 1 2>/dev/null || py=python
          "$py" "$RUNNER_TEMP/pr-verdict.py" --repo "$GITHUB_REPOSITORY" --sha "$SHA" --job-status "$JOB_STATUS"
