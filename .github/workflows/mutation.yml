name: CI · Planted code bugs
# Job: report health
# Do the tests catch SERIOUS bugs in the app's own code? (5 Oct 2026) Each mutant of desktop/e2e/mutants.json writes one real bug into critical-path code
# (a lost calendar day, a failed run shown done, raw API text, a wrong count, a write that never reaches the store) and runs the test that should catch it:
# red = caught, green = missed (one detector-miss issue). Each test also runs once unplanted: red there makes its mutants "unknown". Report only: no PR runs it.
# Why (1 Nov 2026, owner via mac-07, tg's report §7 item 4; JOB-177): the screens moved from e2e suites to unit and integration tests and the list was emptied with
# them. A mutant now names a `test` (desktop/e2e/mutate-tests.mjs runs it here, in seconds); one that names a `suite` still dispatches e2e.yml, one run at a time
# (a suite owns one Notion page and its queue keeps one waiting run, so parallel dispatches would cancel each other). No AI review.
on:
  schedule:
    - cron: '0 1 * * 0'   # Sunday 01:00 UTC: a quiet hour, before the weekly reviews
  workflow_dispatch:

permissions:
  actions: write    # start e2e.yml runs and read them
  issues: write     # a missed mutant files a detector-miss issue
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  mutate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # The install of integration.yml's app job: the engine's packages (the Python tests), the app with its dev packages (scripts/stage.mjs needs esbuild),
      # the Electron binary and a virtual display (the app-integration tests open a window), and the tests' own packages (the store-integration tests).
      - run: pip install --quiet -r requirements.txt
      - run: npm ci
        working-directory: desktop
      - name: The Electron binary
        timeout-minutes: 5
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: A virtual display and Electron's libraries
        timeout-minutes: 5
        run: bash tools/apt-install.sh xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core
      - run: npm ci || npm install
        working-directory: desktop/e2e
      - name: Stage the app's shared files
        working-directory: desktop
        run: node scripts/stage.mjs
      - name: Each planted bug that names a test, against its test (seconds each)
        timeout-minutes: 30
        env:
          ELECTRON_DISABLE_SANDBOX: '1'   # Ubuntu 24.04 runners refuse Chromium's sandbox (integration.yml)
          DESKTOP_RENDER_REQUIRED: '1'    # no electron or display is a red baseline (unknown), never a green skip
        run: xvfb-run -a --server-args='-screen 0 1440x900x24' node desktop/e2e/mutate-tests.mjs runs.json
      - name: Run each baseline and mutant that names a suite, one at a time
        run: |
          set -uo pipefail
          [ -f runs.json ] || echo '{}' > runs.json
          node desktop/e2e/mutate.mjs --plan > plan.json
          count=$(jq length plan.json)
          for i in $(seq 0 $((count - 1))); do
            mutant=$(jq -r ".[$i].mutant" plan.json); suite=$(jq -r ".[$i].suite" plan.json); store=$(jq -r ".[$i].store // \"\"" plan.json)
            # Each mutant runs on the store its bug lives on (mutants.json "store"), against its suite's baseline on that store (lib/mutation.mjs baselineKey).
            key="$mutant"; [ "$mutant" = baseline ] && key="baseline:$suite${store:+:$store}"
            since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run e2e.yml --ref main -f suite="$suite" -f mutant="$mutant" -f store="${store:-alternate}"
            id=""
            for _ in $(seq 1 30); do
              sleep 10
              id=$(gh run list --workflow e2e.yml --event workflow_dispatch --limit 20 --json databaseId,displayTitle,createdAt \
                --jq "[.[] | select(.displayTitle == \"Mutant $mutant\" and .createdAt >= \"$since\")] | last | .databaseId // empty")
              [ -n "$id" ] && break
            done
            if [ -z "$id" ]; then echo "$key: the run never started"; jq --arg k "$key" '.[$k] = "not started"' runs.json > tmp.json && mv tmp.json runs.json; continue; fi
            gh run watch "$id" --interval 60 > /dev/null 2>&1 || true
            # The suite job's own result: the run as a whole also holds skipped jobs (Windows, promote).
            result=$(gh run view "$id" --json jobs --jq "[.jobs[] | select(.name == \"$suite\")][0].conclusion // \"none\"")
            # What the detectors raised (kind|view): a truth check files a finding without turning the suite red, so it counts as a catch too.
            rm -rf art && mkdir art && gh run download "$id" --pattern 'e2e-artifacts-*' --dir art > /dev/null 2>&1 || true
            findings=$(find art -name ui-findings.json -exec jq -c '[.[] | select(.kind) | "\(.kind)|\(.view)"]' {} \; 2>/dev/null | jq -s -c 'add // [] | unique')
            echo "$key ($suite): $result, findings $findings  https://github.com/$GH_REPO/actions/runs/$id"
            jq --arg k "$key" --arg v "$result" --argjson f "${findings:-[]}" '.[$k] = {conclusion: $v, findings: $f}' runs.json > tmp.json && mv tmp.json runs.json
          done
      - name: Score, and file what no suite caught
        if: always()
        run: node desktop/e2e/mutation-score.mjs runs.json mutation-result.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutation-result
          path: mutation-result.json
          retention-days: 90
          if-no-files-found: ignore
