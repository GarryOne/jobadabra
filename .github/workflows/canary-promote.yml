name: Release · Promote to stable
# Each run says what it did (owner, 7 Oct 2026: "I don't see stable in this name"): a hot path names the tag it made stable.
run-name: ${{ inputs.force_tag && format('Hot path · {0} to stable', inputs.force_tag) || github.event_name == 'schedule' && 'Soak check · beta to stable' || 'Promote to stable (dry run)' }}

# The last stretch before stable (2 Oct 2026 pipeline, soak added 4 Oct). With the repository variable JOB_PILOTTO_SOAK = on, e2e.yml no longer promotes a build the moment
# it passes: it APPROVES it for beta testers (tools/beta-approve.sh), and this workflow decides when it becomes stable, every 8 hours:
#   1. the candidate is the canary build (the oldest pre-release newer than stable, under 7 days old). It gets end-to-end TOP-UP runs on its own commit (about every 7 h),
#      so "green three times over a day" is evidence, not luck; their findings are filed as issues that name the build.
#   2. tools/canary_promote.py decides (gates 3-5): >= 48 h out, build.yml green, end-to-end green >= 3 times over >= 24 h with no red among the last 3 and no open
#      high-severity finding on that commit, no new telemetry/fill-failure issue, and (JOB_PILOTTO_REQUIRE_BETA = on) healthy opt-in beta use: >= 3 installs,
#      >= 30 successful runs, no crash. Without beta testers yet, thin app evidence is noted, not blocking; a crash or a worse failure rate still blocks.
#   3. JOB_PILOTTO_AUTO_PROMOTE = on promotes it (tools/release-stable.sh); a canary that failed for sure is dropped; one that is still unproven after 5 days opens a
#      `release-decision` issue: a person promotes it (hot path below), waits, or drops it.
# HOT PATH: a security or data-loss fix must not wait for the soak. Run this workflow by hand with `force_tag` and `force_reason`: it promotes that tag with SKIP_E2E=1
# and writes the reason into the release notes. By hand without them it prints the decision (dry run).
on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only print the decision'
        type: boolean
        default: true
      force_tag:
        description: 'HOT PATH: promote this release tag now, skipping the soak and the end-to-end gate'
        required: false
      force_reason:
        description: 'HOT PATH: why (written into the release notes; required with force_tag)'
        required: false

permissions:
  contents: write   # gh release edit (promote)
  issues: write     # release-decision issue
  actions: write    # gh workflow run (the end-to-end top-up)

concurrency:
  group: canary-promote   # not desktop-release: a waiting run there would replace a waiting build
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}   # on: only a beta-approved build is the candidate (canary_promote.py approved_only)
    steps:
      - uses: actions/checkout@v5
      - name: HOT PATH (by hand with force_tag)
        if: github.event_name == 'workflow_dispatch' && inputs.force_tag != ''
        env:
          FORCE_TAG: ${{ inputs.force_tag }}
          FORCE_REASON: ${{ inputs.force_reason }}
        run: |
          [ -n "$FORCE_REASON" ] || { echo "force_reason is required: it goes into the release notes." >&2; exit 1; }
          body=$(gh release view "$FORCE_TAG" -R "$REPO" --json body -q .body)
          gh release edit "$FORCE_TAG" -R "$REPO" --notes "$(printf '%s\n\nPromoted by hand, soak and end-to-end gate skipped: %s' "$body" "$FORCE_REASON")"
          SKIP_E2E=1 tools/release-stable.sh "$FORCE_TAG"
          echo "HOT PATH: $FORCE_TAG is stable (soak skipped: $FORCE_REASON)"
      - name: End-to-end top-up on the candidate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_tag != '') }}
        run: |
          tag=$(python3 tools/canary_promote.py --candidate)
          [ -n "$tag" ] || { echo "No canary build: nothing to soak."; exit 0; }
          sha=$(gh api "repos/$REPO/commits/$tag" -q .sha)
          # only for a build the gate approved, and not more often than every 7 hours (a run takes about 15 minutes of paid macOS time)
          gh release view "$tag" -R "$REPO" --json body -q .body | grep -q '^Beta-approved:' || { echo "$tag is not beta-approved yet: no top-up."; exit 0; }
          # a top-up is a run NAMED "RC soak <tag>" (it runs main's workflow file on the tag's commit), or a run whose own commit is the tag's
          recent=$(gh run list -R "$REPO" --workflow=e2e.yml -L 40 --json createdAt,status,conclusion,headSha,displayTitle \
            -q "[.[] | select(.headSha == \"$sha\" or .displayTitle == \"RC soak $tag\" or .displayTitle == \"Gate $sha\" or .displayTitle == \"Beta E2E tests $sha\") | select(.status != \"completed\" or .conclusion == \"success\" or .conclusion == \"failure\") | select((.createdAt | fromdateiso8601) > (now - 25200))] | length")
          # the gate's own run: inside the release run that built this commit since 7 Oct 2026 (desktop.yml "E2E · Mac + Linux"); a build only has no gate
          gated=$(gh run list -R "$REPO" --workflow=desktop.yml -L 20 --json createdAt,headSha,displayTitle \
            -q "[.[] | select(.headSha == \"$sha\") | select(.displayTitle | startswith(\"Build only\") | not) | select((.createdAt | fromdateiso8601) > (now - 25200))] | length")
          recent=$(( ${recent:-0} + ${gated:-0} ))
          if [ "${recent:-0}" = 0 ]; then gh workflow run e2e.yml -R "$REPO" --ref main -f soak=true -f target_ref="$tag"; echo "Top-up end-to-end run started on $tag."
          else echo "$tag had an end-to-end run in the last 7 hours: no top-up."; fi
      - name: Decide (and promote when switched on)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_tag != '') }}
        env:
          JOB_PILOTTO_TELEMETRY_KEY: ${{ secrets.JOB_PILOTTO_TELEMETRY_KEY }}
          JOB_PILOTTO_REQUIRE_BETA: ${{ vars.JOB_PILOTTO_REQUIRE_BETA }}
          SWITCH: ${{ vars.JOB_PILOTTO_AUTO_PROMOTE }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--repo "$REPO")
          if [ "$SWITCH" != "on" ]; then
            args+=(--dry-run); note="Auto-promote is off (repository variable JOB_PILOTTO_AUTO_PROMOTE is not \`on\`): decision only."
          elif [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run); note="Dry run (manual start): decision only."
          else
            note="Auto-promote is on."
          fi
          status=0
          out=$(python3 tools/canary_promote.py "${args[@]}" 2>&1) || status=$?
          echo "$out"
          { echo "### Promote to stable"; echo; echo "$note"; echo; echo '```'; echo "$out"; echo '```'; }
          echo "$out" > decision.txt
          exit "$status"
      - name: A canary that stays unproven for 5 days needs a person
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_tag != '') }}
        run: |
          tag=$(python3 tools/canary_promote.py --candidate)
          [ -n "$tag" ] || exit 0
          age_days=$(gh release view "$tag" -R "$REPO" --json publishedAt -q '((now - (.publishedAt | fromdateiso8601)) / 86400 | floor)')
          if [ "$age_days" -ge 5 ] && ! grep -q '^Canary auto-promote: PROMOTE' decision.txt; then
            gh label create release-decision -R "$REPO" --force --color 5319E7 --description "A release candidate needs a person's decision" > /dev/null
            existing=$(gh issue list -R "$REPO" --label release-decision --state open --search "$tag in:title" --json number -q '.[0].number // empty')
            if [ -z "$existing" ]; then
              gh issue create -R "$REPO" --label release-decision --title "Release candidate $tag is still unproven after $age_days days" \
                --body $'It will be dropped at 7 days. Why it waits is in the latest run of the "Release · Promote to stable" workflow.\n\nOptions: wait; promote it by hand with force_tag and force_reason (hot path); or drop it.'
            fi
          fi
      - name: Label the releases (STABLE / BETA / Build / Previous stable) and update the pinned "Release channels" issue
        if: always()
        run: python3 tools/sync_release_labels.py || echo "labels not refreshed"
