name: Release · Build, test, beta
# ONE RUN PER RELEASE, ONE LANE PER PLATFORM (owner, 7 Oct 2026: three runs chained by triggers were hard to follow; then "2 parallel pipelines"):
#   Anything new? -+- Build · Mac     -> E2E · Mac + Linux -> Release · Mac beta     -+- Clean up old builds
#                  +- Build · Windows -> E2E · Windows     -> Release · Windows beta -+
# One box per step (owner, 7 Oct 2026: "I want it to literally look that clean"): Anything new? also plans the suites, each E2E is one matrix box (the suite jobs of
# e2e.yml / e2e-windows.yml, copied with the gate's settings), each Release also merges its lane's HTML report.
# Three distinct steps per lane (owner, 7 Oct 2026): Build publishes the files to the one pre-release (offered to nobody), E2E runs the gate suites on it, Release
# offers it to that platform's beta testers ("Beta-approved:" / "Beta-approved (Windows):", desktop/lib/updater.js). A lane never waits for the other. The same suite on both platforms takes turns (it owns one Notion test page: concurrency group e2e-<suite>).
# The run is red when a lane is red; that platform's testers are then not offered it.
# Names: the Worker's cron (worker/src/scheduler.js) starts the one "Nightly beta" a day; GitHub's schedule is only the backup start, an "E2E check · nightly backup" (owner, 12 Oct 2026); tools/beta-release.sh (-f beta=true) a "Beta by hand"; a plain
# gh workflow run desktop.yml is a "Build only": built and published as a pre-release for trying, never tested here, offered to nobody.
run-name: ${{ inputs.nightly && 'Nightly beta' || github.event_name == 'schedule' && 'E2E check · nightly backup' || inputs.beta && 'Beta by hand' || 'Build only (by hand, not tested)' }}

# Builds the Mac app (Apple Silicon .dmg + .zip, bundled Python and pipeline) and publishes it as a
# GitHub Release: nightly at 04:00 Zurich (only when something that goes into the app changed on main since the last release) or on
# demand (gh workflow run desktop.yml, always builds). The release starts as a draft (made by Anything new?); Build · Mac adds the .dmg/.zip,
# Build · Windows the x64 installer (.exe, unsigned: SmartScreen asks "Run anyway"), and the first one done publishes it as a pre-release
# (a build: offered to nobody until a lane's gate approves it for that platform's beta). Friends' apps and the website follow the latest *stable* release: one
# promoted with tools/release-stable.sh (then its .exe and .dmg are what "latest" serves).
on:
  # Nightly, and by hand (gh workflow run desktop.yml). Not on every push: with several pushes an hour, a release per push
  # was mostly noise and a macOS + Windows build each (2 Oct 2026). A night with nothing new for the app builds nothing.
  schedule:
    # ONE backup start only (owner, 10 Oct 2026: "the nightly beta should run only once"). The nightly is started on time by the Worker's cron (worker/src/scheduler.js, 04:00
    # Zurich); this GitHub cron exists for the day the Worker fails, and runs only if no nightly has run yet today (the diff step below). It used to be four slots at :17 (02-05 UTC),
    # because GitHub starts scheduled runs late, up to six hours: all four then ran every night, each one listed as a "Nightly beta" and, after a nightly whose gate failed, able to
    # rebuild. A scheduled run is always recorded, so fewer crons is the only way to a shorter list. Not on the hour: :00 is GitHub's busiest minute.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: 'The nightly build, started on time by the Worker (worker/src/scheduler.js): builds only when the app changed since the last release, and the e2e gate follows. Empty = a build by hand, which always builds'
        type: boolean
        default: false
      beta:
        description: 'A beta by hand, in one shot: always builds, then the same e2e gate as the nightly (every gate suite, unit suites green, no high-severity finding, additive Notion schema) approves it for beta testers. Empty = a build for trying, offered to nobody'
        type: boolean
        default: false
      over_red_main:
        description: 'Set by tools/beta-release.sh --force "<why>": main''s e2e was red and the beta starts anyway; the reason shows in this run''s summary (gate G2, 26 Oct 2026)'
        type: string
        default: ''

permissions:
  contents: write      # create the release
  id-token: write      # build provenance: GitHub signs "this file was built from this commit by this workflow"
  attestations: write  # (verify: gh attestation verify <file> -R GarryOne/jobadabra)
  actions: write       # start a fresh build of main when this one can't be released (see Release)

# A release runs to the end (both lanes, their gates, the clean-up); a newer run waits, and only the newest waiting one runs.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Did anything that goes into the app change since the newest release (a nightly; a manual run always builds)? If so, create the release, and both lanes start.
  changes:
    name: Anything new?
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
      version: ${{ steps.version.outputs.version }}     # the release both lanes add their files to
      extension_version: ${{ steps.version.outputs.extension_version }}   # stamped into the app's extension copy (desktop/scripts/extension-stamp.mjs): counted here, on the full clone
      released: ${{ steps.release.outputs.released }}
      gate: ${{ steps.plan.outputs.gate }}                 # a nightly or a beta by hand that released: both lanes test it
      mac_matrix: ${{ steps.plan.outputs.matrix }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
      count: ${{ steps.plan.outputs.count }}
      review: ${{ steps.plan.outputs.review }}
      over: ${{ steps.spend.outputs.over }}                # today's e2e AI budget is spent
    permissions:
      contents: write   # the tag and the draft release
      actions: write    # a fresh build of main when this one can't be released
      issues: read      # the gate's plan reads the waiting UI findings (its AI review decision)
    steps:
      - name: Started over a red main e2e
        if: inputs.over_red_main != ''
        env:
          WHY: ${{ inputs.over_red_main }}   # free text: never inline in the script
        run: |
          echo "### ⚠️ Started while main's e2e was red (tools/beta-release.sh --force): $WHY"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Anything new for the app?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ inputs.nightly }}
          ALERT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ] && [ "$NIGHTLY" != true ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A nightly already ran today (the Worker's, on time): this backup schedule has nothing to do. Without the check every backup run compared against the last APPROVED
          # release, so after a nightly whose gate failed it built the same night again (10 Oct 2026: four "Nightly beta" runs listed for one night).
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            earlier=$(gh run list -R "$GITHUB_REPOSITORY" --workflow desktop.yml --limit 30 --json databaseId,displayTitle,createdAt \
              -q "[.[] | select(.displayTitle == \"Nightly beta\") | select(.createdAt >= \"$(date -u +%Y-%m-%d)T00:00:00Z\") | select(.databaseId != $GITHUB_RUN_ID)] | length" || echo 0)
            if [ "${earlier:-0}" -gt 0 ]; then echo "A nightly beta already ran today: the backup schedule has nothing to do."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          fi
          hour=$(TZ=Europe/Zurich date +%H)
          # 04:00-15:59: GitHub starts scheduled runs late, on 4 Oct 2026 by six hours (07:52 and 09:29 UTC), and the old 04:xx-05:xx guard skipped
          # both, so no build and no beta that day. A late run still builds; the second of the two finds nothing new since the first one's release.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && { [ $((10#$hour)) -lt 4 ] || [ $((10#$hour)) -gt 15 ]; }; then echo "It is $hour:xx in Zurich: outside the nightly window (04:00-15:59): not this schedule's turn."; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Against the newest release that reached someone (a stable, or a build a platform's gate approved as beta), never a build that failed
          # its gate: 9 Oct 2026 the failed 0.6.12 counted as "the last release", the nightly built nothing and the fix waited for a manual beta.
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft | not) | select((.prerelease | not) or ((.body // "") | test("(^|\n)Beta-approved")))][0].tag_name // empty' || true)
          sha=$([ -n "$tag" ] && git rev-list -n 1 "$tag" 2>/dev/null || true)
          # The tests of the app (desktop/test, desktop/e2e) are not in the app: a night when only they changed builds nothing.
          paths=(desktop src config templates tools extension worker/src requirements.txt requirements-transcribe.txt
                 docs/notion-profile-template.md docs/job-pilotto-guide.md .github/workflows/desktop.yml ':!desktop/e2e' ':!desktop/test')
          if [ -n "$sha" ] && git diff --quiet "$sha" HEAD -- "${paths[@]}"; then
            echo "Nothing new for the app since ${tag}: no build tonight."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes since ${tag:-the start}: building."
            # No offline replay gate (owner, 17 Oct 2026: replays are for debugging; the beta is gated by the e2e suites, page cases and unit tests, the daily live check reports real-site health separately).
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      # Something to build: the release both lanes add their files to, here so each lane starts straight from this job (owner, 7 Oct 2026: "Anything new should
      # trigger 2 separate pipelines"). Its version (the next patch), its tag (at the start: a push to main during the builds costs nothing) and a draft with the notes.
      - uses: actions/setup-node@v5
        if: steps.diff.outputs.build == 'true'
        with:
          node-version: '22'
      - name: Version
        if: steps.diff.outputs.build == 'true'
        id: version
        working-directory: desktop
        # package.json holds the target (0.5.0): each build is the next patch, 0.5.1, 0.5.2 … The channel (build, beta, stable) says how proven it is, not the version.
        run: |
          version=$(scripts/next-version.sh)
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          extension=$(node scripts/extension-stamp.mjs)
          echo "Extension version $extension"
          echo "extension_version=$extension" >> "$GITHUB_OUTPUT"
      - name: Tag this build now (its workflows still match main's)
        if: steps.diff.outputs.build == 'true'
        # GitHub refuses (HTTP 403) to let this run's token create a tag on a commit whose workflow files differ from main's. Tagged here, at the
        # start, that can't happen: a push to main during the build no longer costs a rebuild (7 Oct 2026). A build that fails after this leaves
        # its number unused; scripts/next-version.sh then takes the next one.
        run: |
          tag="desktop-v${{ steps.version.outputs.version }}"
          if git push -q origin "$GITHUB_SHA:refs/tags/$tag"; then echo "Tagged $tag at ${GITHUB_SHA::7}"
          else echo "::warning::Could not tag $tag at the start: the Release step tags it (and rebuilds main if workflows changed meanwhile)."; fi
      - name: Release
        if: steps.diff.outputs.build == 'true'
        id: release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.version.outputs.version }}
        run: |
          # GitHub refuses (HTTP 403) to let this run's token tag a commit whose workflow files differ from main's.
          # When workflows changed on main during the build, a fresh build of main releases instead.
          tag="desktop-v${version}"
          # Tagged at the start (above): nothing to refuse. Only a build that could not tag then still needs main's workflows to match.
          git fetch -q origin main
          if [ "$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)" != "$GITHUB_SHA" ] && ! git diff --quiet "$GITHUB_SHA" origin/main -- .github/workflows; then
            echo "::warning::Workflows changed on main during this build: not released; a new build of main starts."
            echo "### ⚠️ ${version} not released: superseded by a new build of main (workflows changed on main during the build)."
            # what this run was, as below: a beta stays a beta, a nightly a nightly
            gh workflow run desktop.yml --ref main -f beta=${{ inputs.beta && 'true' || 'false' }} -f nightly=${{ (inputs.nightly || github.event_name == 'schedule') && 'true' || 'false' }}
            echo "released=false" >> "$GITHUB_OUTPUT"
            # This run built nothing and must not read "success" (18 Oct 2026: a Beta by hand ended green with 7 of 8 jobs skipped): it ends cancelled, the reason in its summary.
            gh run cancel "$GITHUB_RUN_ID" || true
            exit 0
          fi
          { echo "**Version ${version}**"; echo; scripts/release-notes.sh "$GITHUB_SHA"; echo
            echo "Built by GitHub Actions from ${GITHUB_SHA::7}. Check a download: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`"
          } > release-notes.md
          # A draft under this tag is a build that never finished (cancelled, or refused after main moved): this newer build replaces it. A PUBLISHED one means two
          # builds took the same version: stop, rather than attach files to another commit's release (6 Oct 2026: 0.5.11 was published from a cancelled build's draft).
          if existing=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$existing" = true ]; then gh release delete "$tag" --yes; echo "::warning::Removed a draft $tag left by an unfinished earlier build."
            else echo "::error::$tag is already published (another build took this version): not releasing over it."; exit 1; fi
          fi
          if ! gh release create "$tag" \
            --title "$(scripts/release-title.sh "$version")" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA" \
            --draft 2> release-error.txt; then   # a draft with no files: each build lane adds its own and publishes it
            cat release-error.txt >&2
            # The same 403 when workflows changed on main in the seconds after the check above: hand over to a fresh
            # build of main instead of failing. Only when main has moved, so a real 403 on main itself still fails.
            git fetch -q origin main
            if grep -q 'HTTP 403' release-error.txt && [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true   # a half-made draft, if any
              echo "::warning::Release refused (403) after main moved: not released; a new build of main starts."
              # Keep what this build was (6 Oct 2026: a beta by hand came back as a plain build, which no gate approves): a beta stays a beta, a nightly a nightly.
              gh workflow run desktop.yml --ref main -f beta=${{ inputs.beta && 'true' || 'false' }} -f nightly=${{ (inputs.nightly || github.event_name == 'schedule') && 'true' || 'false' }}
              echo "### ⚠️ ${version} not released: superseded by a new build of main (workflows changed on main)."
              echo "released=false" >> "$GITHUB_OUTPUT"
              gh run cancel "$GITHUB_RUN_ID" || true   # ends cancelled, never "success" (see above)
              exit 0
            fi
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
      # Today's e2e AI budget (desktop/e2e/ai-spend.mjs; owner, 7 Oct 2026: "$30 a week"): spent, the lanes skip the paid judge and the screenshot review.
      - name: Today's e2e AI budget
        id: spend
        if: steps.release.outputs.released == 'true' && (github.event_name == 'schedule' || inputs.nightly || inputs.beta)
        working-directory: desktop/e2e
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_DAILY_BUDGET: ${{ vars.E2E_DAILY_BUDGET }}
        run: node ai-spend.mjs >> "$GITHUB_OUTPUT"
      # The gate's plan, once for both lanes (desktop/e2e/plan-run.mjs, GATE_TAG): the same suites on Mac + Linux and on Windows, and whether the AI screenshot
      # review runs. A build by hand ("Build only") is not tested.
      - name: Plan the E2E suites for both lanes
        id: plan
        if: steps.release.outputs.released == 'true' && (github.event_name == 'schedule' || inputs.nightly || inputs.beta)
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: gate
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TARGET_REF: desktop-v${{ steps.version.outputs.version }}
          GATE_TAG: desktop-v${{ steps.version.outputs.version }}
          GATE_STORE_LEGS: one   # one Mac job per suite: this workflow's copy of the job does not pass the leg's store to the suite (desktop/e2e/plan-run.mjs says why)
          GATE_KIND: ${{ (github.event_name == 'schedule' || inputs.nightly) && 'nightly' || 'beta' }}   # a beta by hand runs quality only when what it watches changed
          OVER: ${{ steps.spend.outputs.over }}
        run: |
          set -o pipefail   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
          npm ci || npm install
          node plan-run.mjs | { if [ "$OVER" = true ]; then sed 's/^review=.*/review=0/'; else cat; fi; } >> "$GITHUB_OUTPUT"
          # windows_matrix (from plan-run.mjs): its suites less those the same on every OS (quality), a sharded one as one entry per slice (lib/suite-shards.mjs)
          echo "gate=true" >> "$GITHUB_OUTPUT"

  # One box per lane step (owner, 10 Oct 2026: "Put Compile, Smoke inside the Build"). A build is: it compiles, the unit tests pass, and a very small, fast smoke test of the
  # built app passes; they are NAMED STEPS of the one Build box (Unit tests · …, Compile · …, Smoke test · …), never boxes of their own.
  build:
    name: Build · Mac
    needs: changes   # the version and the draft release exist
    if: needs.changes.outputs.released == 'true'
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      EXTENSION_VERSION: ${{ needs.changes.outputs.extension_version }}   # the build checkouts are shallow: stage.mjs refuses to count there
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6   # only runs the pipeline tests; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      # The desktop app's unit tests, the SAME on Mac and Windows (owner, 10 Oct 2026: "both should have the full set of unit tests, only related to the desktop app; no site,
      # no Cloudflare workers"): the Python pipeline the app bundles (`tools/check.sh --area python`) and the app's own tests (`--area desktop`: lint + node tests), side by side
      # so the step takes the longer one. The site and the Worker are tested by CI · Tests on every push and deployed by their own pipelines (site.yml, worker.yml).
      - name: Unit tests · desktop app (Python pipeline and app, side by side)
        env:
          PYTHONUTF8: '1'   # as the app runs its own engine (lib/pipeline-env.js): files in UTF-8 on Windows too, whose default is the ANSI code page (the tests read UTF-8 files)
          UNIT_AREAS: 'python desktop'
          JOB_PILOTTO_PY_JOBS: '6'   # the Mac runner's cores / check slots gave 2 shards (the Python half took 5-6.5 min); the slow modules sleep and wait, so 6 overlap well (12 Oct 2026, as build.yml)
        run: |
          pids=""
          for area in $UNIT_AREAS; do bash tools/check.sh --area "$area" > "unit-$area.log" 2>&1 & pids="$pids $area:$!"; done
          status=0
          # The answer on top, the detail one click away (owner, 10 Oct 2026: "human readable, without scrolling a lot"): a passing suite is ONE line here and its per-file log
          # is collapsed; a failing suite prints its log in full, whose first lines are the failing tests and their errors. The same lines are the step's log.
          for entry in $pids; do
            area="${entry%%:*}"
            if wait "${entry#*:}"; then result=passed; else result=FAILED; status=1; fi
            line=$(grep -E '^(OK|FAILED): |^py-shards: .*(passed|FAILED)' "unit-$area.log" | tail -1)
            echo "| $area | $result | ${line:-no summary line} |" >> unit-table.md
            if [ "$result" = passed ]; then echo "✔ $area: ${line}"; echo "::group::$area · every test file"; cat "unit-$area.log"; echo "::endgroup::"
            else echo "::error::The $area unit tests failed"; cat "unit-$area.log"; fi
          done
          { echo "### Unit tests · desktop app"; echo; echo "| Suite | Result | Summary |"; echo "|---|---|---|"; cat unit-table.md; }
          exit $status
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: |
          if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json
          else echo "::notice::GOOGLE_SHARED_CLIENT_JSON is not set; the app will ask users for their own Google app."; fi
      - name: Compile · AudioTee (the call's audio, Core Audio taps)
        working-directory: desktop
        run: scripts/audiotee.sh && test -x build/bin/audiotee
      - name: Compile · bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Compile · build and sign the app
        working-directory: desktop
        env:
          # The release certificate (scripts/sign.cjs): every build carries the same self-made signature.
          MAC_SIGN_P12: ${{ secrets.MAC_SIGN_P12 }}
          MAC_SIGN_PASSWORD: ${{ secrets.MAC_SIGN_PASSWORD }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm run build -- -c.buildVersion="${{ github.run_number }}"   # CFBundleVersion = the release build number
          codesign -dvv dist/mac-arm64/*.app 2>&1 | grep -q "Authority=Jobadabra Self-Signed" \
            || { echo "::error::The app isn't signed with the release certificate"; exit 1; }
      # Smoke tests only in beta mode (the nightly, a beta by hand: owner, 10 Oct 2026); a "Build only" run is compile + unit tests.
      - name: Smoke test · the built app (bundled Python, Keychain, signature, the binary, the Jobs screen)
        if: needs.changes.outputs.gate == 'true'
        working-directory: desktop
        run: node scripts/mac-smoke.mjs "dist/Jobadabra-${VERSION}-arm64.zip" smoke
      - name: Keep the Mac screenshot
        if: always() && needs.changes.outputs.gate == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: mac-screens-${{ needs.changes.outputs.version }}
          path: desktop/smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Build provenance (anyone can verify the download was built here, from this commit)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: desktop/dist/Jobadabra-*-arm64.*
      - name: Add to the release, and publish it (the first lane done publishes; the other adds its files to the published pre-release)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable names too, so a download link can always point at the latest build, and the old Job-Pilotto-* names as copies (tools/release-file-names.sh).
          tools_dir="${GITHUB_WORKSPACE}/tools"
          files=(); while IFS= read -r file; do files+=("$file"); done < <("$tools_dir/release-file-names.sh" make mac "$VERSION" dist)   # not mapfile: the Mac runner has bash 3.2
          gh release upload "desktop-v${VERSION}" "${files[@]}"
          GH_REPO="$GITHUB_REPOSITORY" "$tools_dir/release-file-names.sh" check mac "desktop-v${VERSION}"
          gh release edit "desktop-v${VERSION}" --draft=false --prerelease

  windows:
    name: Build · Windows
    needs: changes   # the version and the draft release exist: no wait for the Mac build
    if: needs.changes.outputs.released == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.changes.outputs.version }}
      EXTENSION_VERSION: ${{ needs.changes.outputs.extension_version }}   # the build checkouts are shallow: stage.mjs refuses to count there
    steps:
      # Windows Defender scans every file the install and the build write; excluding the working folders takes the installer from ~75 s down (owner, 10 Oct 2026:
      # "no build over 3-4 minutes"). Never fails the build: without it the build is only slower.
      - name: Speed · leave the build folders out of Windows Defender
        continue-on-error: true
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:LOCALAPPDATA\Programs", "$env:TEMP", "$env:RUNNER_TEMP"
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6   # only reads the Python release list; the app bundles its own Python
        with:
          python-version: '3.12'
      - name: Install
        working-directory: desktop
        run: npm ci
      # The desktop app's unit tests, the SAME on Mac and Windows (owner, 10 Oct 2026: "both should have the full set of unit tests, only related to the desktop app; no site,
      # no Cloudflare workers"): the Python pipeline the app bundles (`tools/check.sh --area python`) and the app's own tests (`--area desktop`: lint + node tests), side by side
      # so the step takes the longer one. The site and the Worker are tested by CI · Tests on every push and deployed by their own pipelines (site.yml, worker.yml).
      # Windows has no time-zone database, and the Python tests load Europe/Zurich: the same tzdata the app bundles for Windows (requirements.txt, sys_platform == win32).
      - name: Install · time-zone data for the Python tests
        run: python -m pip install tzdata
      - name: Unit tests · desktop app (Python pipeline and app, side by side)
        env:
          PYTHONUTF8: '1'   # as the app runs its own engine (lib/pipeline-env.js): files in UTF-8 on Windows too, whose default is the ANSI code page (the tests read UTF-8 files)
          # TEMPORARY (10 Oct 2026): 196 of the 1,943 Python tests fail on Windows for environmental reasons (SQLite files left open in temp folders, tests of the repo's own
          # dev scripts, a few Mac-only assumptions): until they are fixed the Windows build runs the app's tests only. Then this reads 'python desktop', as on the Mac.
          UNIT_AREAS: 'desktop'
        run: |
          pids=""
          for area in $UNIT_AREAS; do bash tools/check.sh --area "$area" > "unit-$area.log" 2>&1 & pids="$pids $area:$!"; done
          status=0
          # The answer on top, the detail one click away (owner, 10 Oct 2026: "human readable, without scrolling a lot"): a passing suite is ONE line here and its per-file log
          # is collapsed; a failing suite prints its log in full, whose first lines are the failing tests and their errors. The same lines are the step's log.
          for entry in $pids; do
            area="${entry%%:*}"
            if wait "${entry#*:}"; then result=passed; else result=FAILED; status=1; fi
            line=$(grep -E '^(OK|FAILED): |^py-shards: .*(passed|FAILED)' "unit-$area.log" | tail -1)
            echo "| $area | $result | ${line:-no summary line} |" >> unit-table.md
            if [ "$result" = passed ]; then echo "✔ $area: ${line}"; echo "::group::$area · every test file"; cat "unit-$area.log"; echo "::endgroup::"
            else echo "::error::The $area unit tests failed"; cat "unit-$area.log"; fi
          done
          { echo "### Unit tests · desktop app"; echo; echo "| Suite | Result | Summary |"; echo "|---|---|---|"; cat unit-table.md; }
          exit $status
      - name: Add the shared Google app client
        env:
          CLIENT: ${{ secrets.GOOGLE_SHARED_CLIENT_JSON }}
        run: if [ -n "$CLIENT" ]; then printf '%s' "$CLIENT" > config/google_oauth_client.json; fi
      - name: Compile · bundle Python
        working-directory: desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHON_ARCH: x86_64-pc-windows-msvc
        run: node scripts/stage.mjs --app && scripts/python.sh
      - name: Compile · build the installer
        working-directory: desktop
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version >/dev/null
          npm run build:win -- -c.buildVersion="${{ github.run_number }}"
      - name: Smoke test · the installed app (install, bundled Python, Credential Manager, the Jobs screen)
        if: needs.changes.outputs.gate == 'true'
        working-directory: desktop
        run: node scripts/windows-smoke.mjs "dist/Jobadabra-${VERSION}-x64.exe" smoke smoke
      - name: Keep the Windows screenshots
        if: always() && needs.changes.outputs.gate == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-screens-${{ needs.changes.outputs.version }}
          path: desktop/smoke
          if-no-files-found: ignore
          retention-days: 14
      - name: Add to the release, and publish it (as Build · Mac, whichever lane is done first publishes)
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A stable name too, so a download link can always point at the latest build, and the old Job-Pilotto-* names as copies (tools/release-file-names.sh).
          tools_dir="${GITHUB_WORKSPACE}/tools"
          files=(); while IFS= read -r file; do files+=("$file"); done < <("$tools_dir/release-file-names.sh" make windows "$VERSION" dist)   # not mapfile: the Mac runner has bash 3.2
          gh release upload "desktop-v${VERSION}" "${files[@]}"
          GH_REPO="$GITHUB_REPOSITORY" "$tools_dir/release-file-names.sh" check windows "desktop-v${VERSION}"
          gh release edit "desktop-v${VERSION}" --draft=false --prerelease
      # Build · Windows failed: the release carries the last working Windows installer, so the Windows download link of a release that becomes stable keeps working until a
      # Windows build passes again. It is never approved for Windows (E2E · Windows needs this build to pass). A step, not a job: no box of its own in the graph.
      - name: Build failed, so carry over the last working Windows installer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            -q '[.[] | select(.draft | not) | select(.tag_name != "desktop-v'"$VERSION"'") | select(any(.assets[]; .name == "Job-Pilotto-windows-x64.exe" or .name == "Jobadabra-windows-x64.exe"))][0].tag_name')
          if [ -n "$prev" ]; then
            # whichever generic names that release has (Jobadabra-* and the Job-Pilotto-* copy; a release before 25 Oct 2026 has only the old one)
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" -p Job-Pilotto-windows-x64.exe -p Jobadabra-windows-x64.exe -D previous
            gh release upload "desktop-v${VERSION}" --repo "$GITHUB_REPOSITORY" previous/* --clobber
            echo "::warning::Windows build failed; desktop-v${VERSION} carries the Windows installer from ${prev}."
          else
            echo "::warning::Windows build failed and no earlier release has a Windows installer."
          fi

  # One look at the AI key before ~60 suite jobs start: a refused key or an empty credit balance ("credit balance is too low") is one red line here, not a job each (run 11, 23 Oct 2026).
  ai-ready:
    name: AI key ready?
    needs: [changes]
    if: needs.changes.outputs.gate == 'true' && needs.changes.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}
      CI_FREE_AI_CF_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}   # set: the suites run on Free AI, so this token is what is checked (key-preflight.mjs)
    steps:
      - uses: actions/checkout@v5
      - run: node desktop/e2e/key-preflight.mjs

  # E2E: the gate suites on this build, one box (a matrix) per lane. The suite job of e2e.yml with the gate's settings (fixed path, replayed AI answers, paid judge);
  # a copy so the graph shows one box, not e2e.yml's plan/report/approve jobs (owner, 7 Oct 2026: "I want it to literally look that clean"). Keep the two in step.
  test-mac:
    name: E2E · Mac + Linux · ${{ matrix.key }}
    needs: [changes, build, ai-ready]
    if: needs.build.result == 'success' && needs.changes.outputs.gate == 'true' && needs.changes.outputs.count != '0'
    runs-on: ${{ matrix.os || 'macos-latest' }}   # Linux unless the suite needs the Mac (lib/plan.mjs runnerOf); a virtual display there
    timeout-minutes: 360   # the lock's wait (up to 3 h) plus the suite; each step below has its own limit, so this only ends a hung wait
    strategy:
      fail-fast: false      # one suite failing must not hide what the others found
      matrix: ${{ fromJson(needs.changes.outputs.mac_matrix) }}
    env:
      # A suite whose secrets are missing FAILS here instead of a green "skipped" (lib/skip.mjs). 6 Oct 2026: failuresnotion and failureschannels
      # had never run (no token) and showed ✓. Forks have no secrets: they still skip with a warning.
      E2E_REQUIRE_SECRETS: ${{ github.repository_owner == 'GarryOne' && '1' || '' }}
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}   # the OpenAI family's turn (odd runs; desktop/e2e/lib/engine.mjs pickFamily)
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_FAILURESNOTION: ${{ secrets.E2E_NOTION_TOKEN_FAILURESNOTION }}
      E2E_NOTION_TOKEN_FAILURESCHANNELS: ${{ secrets.E2E_NOTION_TOKEN_FAILURESCHANNELS }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_FOCUSDISMISS: ${{ secrets.E2E_NOTION_TOKEN_FOCUSDISMISS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_APPLYFLOWS: ${{ secrets.E2E_NOTION_TOKEN_APPLYFLOWS }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.key }}
      JP_REPLAY_SHARD: ${{ matrix.shard }}   # a sharded suite's slice (lib/suite-shards.mjs: the recorded replay, 13 Oct 2026); empty: the whole suite
      # AI cost (7 Oct 2026: the e2e key billed ~$10 a day, mostly unseen). Only the scheduled runs ask the model live; every other run (gates, soaks, the canary, reruns,
      # by hand) answers a request it has seen before from the replay cache, and pays only for new ones (lib/ai-meter.mjs). Judges on Haiku, except the quality suite,
      # which measures Sonnet's scoring.
      E2E_AI_CACHE: ${{ github.workspace }}/desktop/e2e/.ai-cache
      E2E_AI_REPLAY: '1'   # the gate replays AI answers it has seen (lib/ai-meter.mjs)
      E2E_JUDGE_MODEL: ${{ matrix.suite == 'quality' && 'claude-sonnet-5-5' || 'claude-haiku-5-5' }}
      E2E_BLOB_DIR: ${{ github.workspace }}/blob-report   # the suite's part of the run's HTML report (the report job merges them)
      E2E_RUN_KIND: gate   # how an issue names the run (lib/replay.mjs)
      E2E_SEED: '0'   # the fixed path (lib/variation.mjs), on both platforms
      E2E_FULL: ${{ (github.event_name == 'schedule' || inputs.nightly) && needs.changes.outputs.over != 'true' && '1' || '' }}   # the paid AI judge steps: the nightly beta only, under today's budget (7 Oct 2026)
    permissions:
      contents: write   # tools/e2e-lock.sh creates the lock ref
      issues: read      # the screenshot review reads its by-design lessons from the closed issues (lib/review-lessons.mjs)
    steps:
      - uses: actions/checkout@v5
      # Waits for the suite's lock instead of queueing in a concurrency group (GitHub keeps ONE waiting job per group and cancels the older one: beta 14, 24 Oct 2026).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: lock-tools
          sparse-checkout: tools/e2e-lock.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Free AI relay (CI's AI since 26 Oct 2026; the site's handler on this runner, CI's own Workers AI token)
        uses: ./.github/actions/free-ai-relay
        with:
          cf-token: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          cf-account: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          app-id: ${{ secrets.CI_APP_ID }}
          app-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the suites that use a browser (the real extension, the extension's page code)
        working-directory: desktop/e2e
        # A suite says it needs one: `export const browser = true` (the app's extension browser) or `export const needsChromium = true` (a plain Chromium).
        run: |
          if grep -qE '^export const (browser|needsChromium) = true' "suites/${{ matrix.suite }}.mjs"; then npx playwright-core install chromium; else echo "no browser needed"; fi
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: A virtual display and Electron's libraries (Linux only)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash tools/apt-install.sh xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core
      - name: Earlier AI answers (replayed instead of paid again; lib/ai-meter.mjs)
        if: env.E2E_ANTHROPIC_KEY != ''
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-answers-v2-${{ matrix.key }}-
      # The lock is taken as late as possible (after the installs, which never touch the suite's Notion page): a waiting job holds its runner.
      - name: The App token for the lock (a re-run attempt's workflow token cannot create refs)
        id: lock_app
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Take the suite's lock (it owns one Notion page; waits, never dropped)
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh acquire "${{ matrix.key }}"
      - name: Run the ${{ matrix.suite }} suite
        id: suite_run
        # A red first run is not the verdict (owner, 6 Oct 2026): the step below runs the suite once more on the same commit and decides. Flaky (red, then green)
        # passes the job and is filed and labelled `flaky`; red twice fails it. A mutation test has no second try: its red means the bug was caught.
        continue-on-error: true
        working-directory: desktop/e2e
        timeout-minutes: 15   # the suite stops itself at its budget (7 min, recorded 11: lib/runner.mjs) with its evidence, by force 3 min later (suite.mjs); this catches only a suite that cannot
        run: |
          # A run on an older commit (target_ref: the stable canary, a release candidate) plans with main's suite list; a suite added since does not exist in that build.
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped."; exit 0; fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs ${{ matrix.suite }}; else node suite.mjs ${{ matrix.suite }}; fi
      # Flaky or real? A red suite runs once more on the same commit (6 Oct 2026); red twice fails the job. A pass the second time passes it only with proof (gate G5,
      # flaky-proof.mjs): every first-try failure was timing or the test's environment. A wrong value that came right keeps it red: a bug that shows sometimes (#1897).
      # Either way the pass writes the marker beside the first run's artifacts, and triage labels those steps `flaky` or `intermittent`. Its own artifacts stay out of the upload.
      - name: The ${{ matrix.suite }} suite once more, to tell flaky from real
        if: steps.suite_run.outcome == 'failure'
        working-directory: desktop/e2e
        timeout-minutes: 15
        run: |
          set -o pipefail   # flaky-proof.mjs | tee: the proof's exit decides (tests/test_workflow_pipefail.py)
          first="$E2E_ARTIFACTS"
          export E2E_ARTIFACTS="${{ github.workspace }}/e2e-rerun/${{ matrix.key }}" E2E_RERUN=1 E2E_AI_REPLAY=0   # fresh answers, never the first try's (a replayed bad draw proves nothing); a second try writes no HTML report (report/playwright.config.mjs)
          again() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs "$1"; else node suite.mjs "$1"; fi; }
          if again ${{ matrix.suite }}; then
            echo '{"rerun": "passed"}' > "$first/flaky.json"
            # "Flaky" needs proof (gate G5): a first-try failure on a wrong value, not timing, is a bug that shows sometimes; the job stays red (lib/flaky-proof.mjs).
            if node flaky-proof.mjs "$first/suite-failures.json"; then
              echo "Passed on the second try, and every failure of the first was timing or the test's environment: flaky (labelled by triage)."
            else
              exit 1
            fi
          else
            echo "Failed again on the same commit: a real failure."
            exit 1   # red twice: the job (and the gate) fail
          fi
      - name: What the suite spent on Free AI (the relay's own meter)
        if: always() && env.E2E_FREE_AI_URL != ''
        continue-on-error: true   # a report never decides a run
        shell: bash
        run: |
          spent="$(curl -s -m 10 "${E2E_FREE_AI_URL%/api/ai}/__report" || echo '{}')"
          echo "Free AI (Workers AI) this suite: $spent"
          echo "$spent" > "$E2E_ARTIFACTS/free-ai-spend.json" || true
      - name: Report what the suite paid for AI to /ai-cost (the app under test and the judges)
        if: always() && env.E2E_ANTHROPIC_KEY != ''
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for kind in app app-openai judges; do   # app-openai: the app under test on an OpenAI engine (odd runs), shown under OpenAI on /ai-cost
            for dir in "$E2E_ARTIFACTS" "${{ github.workspace }}/e2e-rerun/${{ matrix.key }}"; do
              file="$dir/ai-usage-$kind.json"; [ -f "$file" ] || continue
              tag=""; case "$dir" in *rerun*) tag="-rerun";; *apply-edge*) tag="-edge";; esac
              job="e2e-$kind"; provider=anthropic
              if [ "$kind" = app-openai ]; then job=e2e-app; provider=openai; tag="$tag-openai"; fi
              node desktop/e2e/ai-cost-report.mjs --job "$job" --suffix "${{ matrix.key }}$tag" --file "$file" --provider "$provider"
            done
          done
      - name: Keep the AI answers for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        run: find desktop/e2e/.ai-cache -name '*.json' -mtime +7 -delete   # an answer not replayed for a week is dropped (a replay touches it)
      - if: success() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The suite's part of the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-${{ matrix.key }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # Steps and a failed suite's trace as data (the /admin/e2e runs page that read them was dropped on 15 Oct 2026; the artifact stays for download).
      - name: Steps and trace for /admin/e2e
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-${{ matrix.key }}
          path: |
            e2e-artifacts/${{ matrix.key }}/steps.json
            e2e-artifacts/${{ matrix.key }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Screenshots and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.key }}
          path: e2e-artifacts/${{ matrix.key }}
          if-no-files-found: ignore
      - name: The App token to give the lock back (the first one may have expired)
        id: lock_app_end
        if: always()
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Give the suite's lock back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app_end.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh release "${{ matrix.key }}"

  # The Windows lane's E2E box: e2e-windows.yml's suite job with the gate's settings, the same suites as the Mac lane (planned once, in Anything new?).

  test-windows:
    name: E2E · Windows · ${{ matrix.key }}
    needs: [changes, windows, ai-ready]
    if: needs.windows.result == 'success' && needs.changes.outputs.gate == 'true' && needs.changes.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 225   # + the wait for the suite's lock (up to 3 h)
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.changes.outputs.windows_matrix) }}
    defaults:
      run:
        shell: bash   # the suites' commands use bash syntax; pwsh would mangle quoting
    env:
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}   # the OpenAI family's turn (odd runs; desktop/e2e/lib/engine.mjs pickFamily)
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_FOCUSDISMISS: ${{ secrets.E2E_NOTION_TOKEN_FOCUSDISMISS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_APPLYFLOWS: ${{ secrets.E2E_NOTION_TOKEN_APPLYFLOWS }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_FULL: ''   # no paid AI judge on Windows: it would judge the same screens the Mac lane judges (owner, 7 Oct 2026: "$30 a week")
      E2E_SEED: '0'   # the fixed path, as the Mac lane
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/${{ matrix.key }}
      JP_REPLAY_SHARD: ${{ matrix.shard }}   # a sharded suite's slice (lib/suite-shards.mjs: the recorded replay, 13 Oct 2026); empty: the whole suite
      # AI cost: as e2e.yml. A Windows run follows a Mac run that already asked live, so it always replays what it has seen (its own cache: paths differ).
      E2E_AI_CACHE: ${{ github.workspace }}/desktop/e2e/.ai-cache
      E2E_AI_REPLAY: '1'
      E2E_JUDGE_MODEL: ${{ matrix.suite == 'quality' && 'claude-sonnet-5-5' || 'claude-haiku-5-5' }}
      E2E_BLOB_DIR: ${{ github.workspace }}/blob-report   # the suite's part of the run's HTML report (the report job merges them)
      E2E_RUN_KIND: gate
    permissions:
      contents: write   # tools/e2e-lock.sh creates the lock ref
      issues: read      # the screenshot review reads its by-design lessons from the closed issues (lib/review-lessons.mjs)
    steps:
      - uses: actions/checkout@v5
      # Waits for the suite's lock instead of queueing in a concurrency group (GitHub keeps ONE waiting job per group and cancels the older one: beta 14, 24 Oct 2026).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: lock-tools
          sparse-checkout: tools/e2e-lock.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Free AI relay (CI's AI since 26 Oct 2026; the site's handler on this runner, CI's own Workers AI token)
        uses: ./.github/actions/free-ai-relay
        with:
          cf-token: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          cf-account: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          app-id: ${{ secrets.CI_APP_ID }}
          app-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the suites that use a browser (the real extension, the extension's page code)
        working-directory: desktop/e2e
        # As on the Mac (e2e.yml): the suite says it needs one (`export const browser = true` or `export const needsChromium = true`). A list of suite names here
        # missed visitread and visitsauto (7 Oct 2026: "Executable doesn't exist at ...chrome.exe").
        run: |
          if [ -f "suites/${{ matrix.suite }}.mjs" ] && grep -qE '^export const (browser|needsChromium) = true' "suites/${{ matrix.suite }}.mjs"; then npx playwright-core install chromium; else echo "no browser needed"; fi
      - name: Python packages the engine needs
        run: pip install --quiet -r requirements.txt
      - name: Earlier AI answers (replayed instead of paid again; lib/ai-meter.mjs)
        if: env.E2E_ANTHROPIC_KEY != ''
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-windows-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-answers-v2-windows-${{ matrix.key }}-
      # The lock is taken as late as possible (after the installs, which never touch the suite's Notion page): a waiting job holds its runner.
      - name: The App token for the lock (a re-run attempt's workflow token cannot create refs)
        id: lock_app
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Take the suite's lock (it owns one Notion page; waits, never dropped)
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh acquire "${{ matrix.key }}"
      - name: Run the ${{ matrix.suite }} suite on Windows
        working-directory: desktop/e2e
        timeout-minutes: 15   # the suite stops itself at its budget (7 min, recorded 11), and by force 3 min later (suite.mjs)
        run: |
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped."; exit 0; fi
          node suite.mjs ${{ matrix.suite }}
      - name: The apply suite again in Microsoft Edge (the Windows default; preinstalled on the runner)
        if: matrix.suite == 'apply'
        working-directory: desktop/e2e
        timeout-minutes: 30
        env:
          E2E_BROWSER: msedge
          E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts-windows/apply-edge   # its own folder: the Chromium run's evidence stays
        run: node suite.mjs apply
      - name: What the suite spent on Free AI (the relay's own meter)
        if: always() && env.E2E_FREE_AI_URL != ''
        continue-on-error: true   # a report never decides a run
        shell: bash
        run: |
          spent="$(curl -s -m 10 "${E2E_FREE_AI_URL%/api/ai}/__report" || echo '{}')"
          echo "Free AI (Workers AI) this suite: $spent"
          echo "$spent" > "$E2E_ARTIFACTS/free-ai-spend.json" || true
      - name: Report what the suite paid for AI to /ai-cost (the app under test and the judges)
        if: always() && env.E2E_ANTHROPIC_KEY != ''
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for kind in app app-openai judges; do   # app-openai: the app under test on an OpenAI engine (odd runs), shown under OpenAI on /ai-cost
            for dir in "$E2E_ARTIFACTS" "${{ github.workspace }}/e2e-artifacts-windows/apply-edge"; do
              file="$dir/ai-usage-$kind.json"; [ -f "$file" ] || continue
              tag=""; case "$dir" in *rerun*) tag="-rerun";; *apply-edge*) tag="-edge";; esac
              job="e2e-$kind"; provider=anthropic
              if [ "$kind" = app-openai ]; then job=e2e-app; provider=openai; tag="$tag-openai"; fi
              node desktop/e2e/ai-cost-report.mjs --job "$job" --suffix "windows-${{ matrix.key }}$tag" --file "$file" --provider "$provider"
            done
          done
      - name: Keep the AI answers for the next run
        if: always() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        run: find desktop/e2e/.ai-cache -name '*.json' -mtime +7 -delete   # an answer not replayed for a week is dropped (a replay touches it)
      - if: success() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-v2-windows-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: The suite's part of the HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: blob-windows-${{ matrix.key }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # Steps and a failed suite's trace as data (the /admin/e2e runs page that read them was dropped on 15 Oct 2026; the artifact stays for download).
      - name: Steps and trace for /admin/e2e
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-windows-${{ matrix.key }}
          path: |
            e2e-artifacts-windows/${{ matrix.key }}/steps.json
            e2e-artifacts-windows/${{ matrix.key }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-windows-${{ matrix.key }}
          path: e2e-artifacts-windows/${{ matrix.key }}
          if-no-files-found: ignore
      - name: The App token to give the lock back (the first one may have expired)
        id: lock_app_end
        if: always()
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Give the suite's lock back
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app_end.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh release "${{ matrix.key }}"

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of the lane passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved:" line that offers the build to Mac beta testers (desktop/lib/updater.js). Red = not released on Mac.

  release-mac:
    name: Release · Mac beta
    needs: [changes, test-mac]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-mac.result != 'skipped' && needs.test-mac.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: read     # this run's artifacts, build.yml's verdict on the commit
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-windows-*' -exec rm -rf {} +
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          rm -f "$RUNNER_TEMP/made.txt"; GITHUB_OUTPUT="$RUNNER_TEMP/made.txt" bash ../../tools/merge-e2e-report.sh "$PWD/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q made=1 "$RUNNER_TEMP/made.txt" 2>/dev/null; then
              echo "## 📊 [Open the Mac HTML report](https://www.jobpilotto.top/admin/e2e/run/${{ github.run_id }}/report) · every suite, its steps with a screenshot each, the failure and its trace (admins)"
          fi
      - uses: actions/upload-artifact@v6
        if: hashFiles('e2e-report/index.html') != ''
        with:
          name: e2e-report   # admin/e2e-report.js serves it
          path: e2e-report
          compression-level: 0
      # The AI screenshot review of this lane's suites, also when one failed, before the block check reads its findings (.github/actions/e2e-review: one Claude
      # batch for every page, half the price; owner, 26 Oct 2026). Inside this job, so the release graph stays Build -> E2E -> Release.
      - uses: ./.github/actions/e2e-review
        with:
          lane: mac
          anthropic-key: ${{ secrets.E2E_ANTHROPIC_KEY }}
          publish-key: ${{ secrets.AI_COST_PUBLISH_KEY }}
          github-token: ${{ github.token }}
      - name: Not released on Mac, an E2E suite failed
        if: needs.test-mac.result != 'success'
        run: |
          echo "### ❌ $TAG is not offered to Mac beta testers: an E2E suite failed (see the report above)."
          exit 1
      - name: No real high-severity finding in the Mac suites
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Mac: a real high-severity finding in its end-to-end suites."; exit 1; fi
      - name: The shared release checks (unit suites green on the commit; soak on, the Notion schema additive over stable)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: tools/release-checks.sh "$TAG" "$REF"
      - name: Release it to Mac beta testers
        env:
          E2E_ALREADY_GREEN: '1'   # every Mac suite passed on this commit, in this run
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          if [ "$SOAK" = on ]; then
            tools/beta-approve.sh "$TAG"
            echo "Beta-approved: $TAG (unit suites and every end-to-end suite passed on its commit). It becomes stable through canary-promote.yml: more end-to-end runs, no blocking finding, then healthy beta use."
          else
            tools/release-stable.sh "$TAG"
            echo "Stable: $TAG (every suite passed on its commit)"
          fi

  # RELEASE: the lane's HTML report (always), then, only when every E2E suite of the lane passed: no real high-severity finding, the shared release checks, and the
  # "Beta-approved (Windows):" line that offers the build to Windows beta testers (desktop/lib/updater.js). Red = not released on Windows.
  release-windows:
    name: Release · Windows beta
    needs: [changes, test-windows]
    if: always() && needs.changes.outputs.gate == 'true' && needs.test-windows.result != 'skipped' && needs.test-windows.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # the approval line (release-stable.sh when the soak is off)
      actions: read     # this run's artifacts, build.yml's verdict on the commit
      issues: write     # block-check.mjs reads the UI-loop issues; the release scripts rewrite the pinned Release channels issue
    concurrency:
      group: release-promote   # one writer of a release's notes at a time: both lanes edit the same body
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-v${{ needs.changes.outputs.version }}
      REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The E2E suites' HTML report (also when one failed)
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'blob-*' --dir blob-reports || true
          mkdir -p blob-reports
          find blob-reports -mindepth 1 -maxdepth 1 -name 'blob-*' ! -name 'blob-windows-*' -exec rm -rf {} +
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          rm -f "$RUNNER_TEMP/made.txt"; GITHUB_OUTPUT="$RUNNER_TEMP/made.txt" bash ../../tools/merge-e2e-report.sh "$PWD/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q made=1 "$RUNNER_TEMP/made.txt" 2>/dev/null; then
              echo "## 📊 [Open the Windows HTML report](https://www.jobpilotto.top/admin/e2e/run/${{ github.run_id }}/report?os=windows) · every suite, its steps with a screenshot each, the failure and its trace (admins)"
          fi
      - uses: actions/upload-artifact@v6
        if: hashFiles('e2e-report/index.html') != ''
        with:
          name: e2e-report-windows   # admin/e2e-report.js serves it
          path: e2e-report
          compression-level: 0
      # The AI screenshot review of this lane's suites, also when one failed, before the block check reads its findings (.github/actions/e2e-review: one Claude
      # batch for every page, half the price; owner, 26 Oct 2026). Inside this job, so the release graph stays Build -> E2E -> Release.
      - uses: ./.github/actions/e2e-review
        with:
          lane: windows
          anthropic-key: ${{ secrets.E2E_ANTHROPIC_KEY }}
          publish-key: ${{ secrets.AI_COST_PUBLISH_KEY }}
          github-token: ${{ github.token }}
      - name: Not released on Windows, an E2E suite failed
        if: needs.test-windows.result != 'success'
        run: |
          echo "### ❌ $TAG is not offered to Windows beta testers: an E2E suite failed (see the report above)."
          exit 1
      - name: No real high-severity finding in the Windows suites
        working-directory: desktop/e2e
        run: |
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ../../e2e-artifacts || echo "no artifacts to read"
          mkdir -p ../../e2e-artifacts
          find ../../e2e-artifacts -mindepth 1 -maxdepth 1 -name 'e2e-artifacts-*' ! -name 'e2e-artifacts-windows-*' -exec rm -rf {} +
          status=0
          node block-check.mjs --artifacts ../../e2e-artifacts > block.txt || status=$?
          cat block.txt
          if [ "$status" != 0 ]; then echo "$TAG is not offered on Windows: a real high-severity finding in its end-to-end suites."; exit 1; fi
      - name: The shared release checks (unit suites green on the commit; soak on, the Notion schema additive over stable)
        env:
          JOB_PILOTTO_SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: tools/release-checks.sh "$TAG" "$REF"
      - name: Release it to Windows beta testers
        env:
          E2E_ALREADY_GREEN: '1'   # every Windows suite passed on this commit, in this run
          SOAK: ${{ vars.JOB_PILOTTO_SOAK }}
        run: |
          set -o pipefail   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
          tools/beta-approve.sh --windows "$TAG"

  # Keep the release list short: stable releases stay, plus the newest 3 test builds (tools/prune-releases.sh) and each platform's newest beta. After both lanes, so
  # tonight's approvals are already written when it decides what to keep.
  # A gate that was planned but did not start must not end the run green (18-21 Oct 2026: the plan step crashed, E2E and Release were skipped, the run read "success").
  # A plan of ZERO suites is the same failure (count '0' skips test-mac too), so it is not excluded here (24 Oct 2026).
  gate-ran:
    name: Gate ran?
    needs: [changes, build, windows, ai-ready, test-mac, test-windows]
    if: always() && needs.changes.outputs.gate == 'true' && ((needs.build.result == 'success' && needs.test-mac.result == 'skipped') || (needs.windows.result == 'success' && needs.test-windows.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "### ❌ The E2E gate was planned but did not run: no build was tested or approved. See the 'Plan the E2E suites' step of Anything new?. Or the AI key was refused: see 'AI key ready?'."
          echo "::error::The E2E gate was skipped after a green build."
          exit 1

  prune:
    name: Clean up old builds
    needs: [changes, build, windows, test-mac, test-windows, release-mac, release-windows]
    if: always() && needs.changes.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # delete the older test builds, retitle releases
      issues: write     # the pinned Release channels issue
    steps:
      - uses: actions/checkout@v5
      - name: A release neither build published (both failed) is removed; its tag stays and its number is not reused
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: desktop-v${{ needs.changes.outputs.version }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null)" = true ]; then gh release delete "$TAG" --yes; echo "::warning::$TAG: no build finished; its draft is removed."; fi
      - name: Remove older test builds (their tags stay)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/prune-releases.sh 3
      - name: Release titles and the pinned Release channels issue (a new build is listed at once, not at the next soak run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync_release_labels.py || echo "labels not refreshed"   # best effort, never fails a build
