name: CI · Page cases (all cases, real extension, Linux)
# The net under the local push gate (owner, 11 Oct 2026, "CI heavy, local light"): every push to main replays ALL recorded cases (desktop/e2e/recorded) with the real extension,
# offline, sharded across the matrix, 4 tabs at a time in one browser per job (desktop/e2e/lib/replay-browser.mjs). The local pre-push replays only the cases a change can affect.
# A failing case fails the run; the push hook then treats main as red (tools/pre-push-check.sh, AGENTS.md "Red main"). No AI, no network: the pages and answers come from the cases.
on:
  pull_request:   # GitHub's paths decide on a pull request (owner, 14 Oct 2026: "rely fully on gh workflow paths"); not required (a skipped workflow never reports); main runs it as a step of build.yml (CI · Tests)
    branches: [main]
    paths:
      # Exactly what this workflow loads (tools/replay-files.mjs --paths page-cases.yml prints it; desktop/test/replay-workflow-paths.test.js fails when it drifts), plus its install files.
      - 'desktop/cv/template.js'
      - 'desktop/e2e/fixtures/cv.json'
      - 'desktop/e2e/lib/app-front.mjs'
      - 'desktop/e2e/lib/app-log.mjs'
