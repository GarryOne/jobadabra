<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Retail Assistant, One-page Sign-up at E2E One-page Retail</title>
<style>body{font:15px/1.4 system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}.field{margin:14px 0}label{display:block;margin-bottom:4px}input[type=text],input[type=email],input[type=tel],input[type=url],select,textarea{width:100%;padding:6px;box-sizing:border-box}</style></head>
<body><h1>Retail Assistant, One-page Sign-up</h1><p>E2E One-page Retail · Zurich, Switzerland</p>
<p>Are you already registered? <a href="#login">Log in here.</a></p><form id="application_form"><div class="field"><button type="button" id="upload_cv" onclick="document.getElementById('cv_file').click()">Upload a CV</button><input id="cv_file" name="cv_file" type="file" style="display:none"></div><div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required ></div><div class="field"><label for="email_again">Please re-enter your email address *</label><input id="email_again" name="email_again" type="email" required ></div><div class="field"><label for="password">Choose a password *</label><input id="password" name="password" type="password" required></div><div class="field"><label for="password_again">Confirm password *</label><input id="password_again" name="password_again" type="password" required></div><div class="field"><label for="first_name">First name *</label><input id="first_name" name="first_name" type="text" required ></div><div class="field"><label for="last_name">Last name *</label><input id="last_name" name="last_name" type="text" required ></div><div class="field"><label for="city">City *</label><input id="city" name="city" type="text" required ></div><div class="field"><label for="phone">Phone *</label><input id="phone" name="phone" type="tel" required ></div><div class="field"><label for="question_3001">Years of experience with Kubernetes *</label><input id="question_3001" name="question_3001" type="text" required ></div><div class="field"><button type="submit" id="submit_app">Submit Application</button></div></form>
<script>
const fired = kind => fetch('/__fired?kind=' + kind + '&form=' + encodeURIComponent(location.pathname), {method: 'POST', keepalive: true});
document.addEventListener('click', event => { if (event.target.closest('[type=submit]')) fired('click'); }, true);
document.addEventListener('submit', event => { event.preventDefault(); fired('submit'); }, true);

</script></body></html>
