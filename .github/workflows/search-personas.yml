name: CI · Search check (6 personas)
# Every PR that changes search: six fictional job seekers press Find jobs once on fresh installs; a press over 180 s is red.
# Quality is shown per persona and pooled; it gates only after 10 measured complete main runs, below their mean minus twice the sample standard deviation
# (owner, 27 Oct 2026: "Time only, until 10 runs"). Each relevant main merge contributes another measured run.
# Why (30 Oct 2026, owner; supersedes 27 Oct's proof-key decision): PR workflows cannot reach an AI key; CI AI uses the Codex subscription.
# The app and engine keep their Messages contract; codex.mjs sends every call to the existing OIDC broker, including the blind judge. No secret or API fallback.
# Tools: tools/persona-search/gate.py (cv, result, compare), gate_judge.py (the blind judge), run.mjs (the press). Guard: tests/test_search_personas_gate.py.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/daily_search.py'
      - 'src/daily_args.py'
      - 'src/daily_modes.py'
      - 'src/first_jobs.py'
      - 'src/time_budget.py'
      - 'src/budget_tape.py'   # Why (#2285, 27 Oct 2026): the 3-minute clock's owners, app and engine; a change to it is measured on its PR (tests/test_search_personas_gate.py)
      - 'src/run_log.py'
      - 'desktop/lib/search-steps.js'
      - 'desktop/lib/pipeline-args.js'
      - 'desktop/lib/pipeline-run.js'
      - 'src/run_counts.py'
      - 'src/places.py'
      - 'src/geo.py'
      - 'src/regions.py'
      - 'src/pool_served.py'
      - 'src/source_rank.py'
      - 'src/job_rank.py'
      - 'src/role_kinds.py'
      - 'src/target_roles.py'
      - 'src/scout*.py'
      - 'src/sources/**'
      - 'src/ai/board_ideas.py'
      - 'src/ai/batch_scope.py'
      - 'src/ai/engine.py'
      - 'src/ai/few_jobs.py'
      - 'src/ai/locations.py'
      - 'src/ai/place_triage.py'
      - 'src/ai/role_ideas.py'
      - 'src/ai/score*.py'
      - 'src/ai/scout_ideas.py'
      - 'src/ai/slots.py'
      - 'src/ai/title_triage.py'
      - 'src/ai/providers/**'
      - 'tools/persona-search/**'
      - '.github/workflows/search-personas.yml'
  push:
    branches: [main]
    paths:
      - 'src/daily_search.py'
      - 'src/daily_args.py'
      - 'src/daily_modes.py'
      - 'src/first_jobs.py'
      - 'src/time_budget.py'
      - 'src/budget_tape.py'   # Why (#2285, 27 Oct 2026): the 3-minute clock's owners, app and engine; a change to it is measured on its PR (tests/test_search_personas_gate.py)
      - 'src/run_log.py'
      - 'desktop/lib/search-steps.js'
      - 'desktop/lib/pipeline-args.js'
      - 'desktop/lib/pipeline-run.js'
      - 'src/run_counts.py'
      - 'src/places.py'
      - 'src/geo.py'
      - 'src/regions.py'
      - 'src/pool_served.py'
      - 'src/source_rank.py'
      - 'src/job_rank.py'
      - 'src/role_kinds.py'
      - 'src/target_roles.py'
      - 'src/scout*.py'
      - 'src/sources/**'
      - 'src/ai/board_ideas.py'
      - 'src/ai/batch_scope.py'
      - 'src/ai/engine.py'
      - 'src/ai/few_jobs.py'
      - 'src/ai/locations.py'
      - 'src/ai/place_triage.py'
      - 'src/ai/role_ideas.py'
      - 'src/ai/score*.py'
      - 'src/ai/scout_ideas.py'
      - 'src/ai/slots.py'
      - 'src/ai/title_triage.py'
      - 'src/ai/providers/**'
      - 'tools/persona-search/**'
      - '.github/workflows/search-personas.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read         # main's measured history, and the commit's runs and jobs for the PR's verdict
  pull-requests: read

concurrency:   # a PR's newer push replaces its older run; a newer merge replaces main's older run (tests/test_main_runs_finish.py); a by-hand run is its own group
  group: search-personas-${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CI_AI_PROVIDER: codex
  E2E_AI_PROVIDER: codex
  JOB_PILOTTO_MODEL_OVERRIDE: claude-haiku-5-5   # Why (30 Oct 2026, owner): retain the small tier through the Codex broker; tests/test_search_personas_gate.py

jobs:
  persona:
    name: Persona ${{ matrix.persona }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write   # Existing broker authentication: GitHub OIDC, no stored secret.
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        persona: [1, 2, 3, 4, 5, 6]   # Why (30 Oct 2026, owner): keep all six cases, two at a time; six at once left 17 calls outstanding on the four-slot broker
    steps:
      - name: This run can use the Codex broker
        id: token
        env:
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          mkdir -p out
          if [ "$TRUSTED" = true ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::warning::No trusted GitHub OIDC token: the search check is not measured"
          printf '{"persona": %s, "not_measured": "no trusted GitHub OIDC token for Codex"}\n' "${{ matrix.persona }}" > out/result.json
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'yes'
        with: {persist-credentials: false}
      - uses: ./.github/actions/gh-ledger
        if: steps.token.outputs.ok == 'yes'   # the checkout that holds the action only runs for a trusted run
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'yes'
        with: {node-version: '22'}
      - uses: actions/setup-python@v6
        if: steps.token.outputs.ok == 'yes'
        with: {python-version: '3.12'}
      - name: The engine, the app's libraries and a browser
        if: steps.token.outputs.ok == 'yes'
        run: |
          pip install --quiet -r requirements.txt
          (cd desktop && npm ci && node scripts/stage.mjs --files-only)   # Why (#2259): the API engine imports desktop/shared/worker/ai.js, which stage.mjs generates; the plan engine never loaded it
          (cd desktop/e2e && (npm ci || npm install))
      # Why (runs 40510577328, 40507593762, 27 Oct 2026): a bare --with-deps install crawled at 41 kB/s for 10 min and the persona hit its 12-min cap.
      - name: The browser (cached; a stalled mirror is cut and retried)
        if: steps.token.outputs.ok == 'yes'
        uses: ./.github/actions/playwright-browser
        with: {working-directory: desktop/e2e, mode: both}
      - name: The persona's fictional CV, then one Find jobs press (small tier through the Codex relay)
        if: steps.token.outputs.ok == 'yes'
        run: |
          set -o pipefail
          python3 tools/persona-search/gate.py cv "${{ matrix.persona }}" out
          node tools/persona-search/codex.mjs -- node tools/persona-search/run.mjs draw "$GITHUB_WORKSPACE/out" --presses 1 --fresh --engine api --tag gate 2>&1 | tee out/run.log || true
          grep -h 'with claude-' out/draw/run-*.log | grep -v -c 'claude-haiku-5-5' > out/non-haiku-steps.txt || true
          python3 tools/persona-search/gate.py extract "$(node -p 'require("os").tmpdir()')/jp-persona-draw-gate/data/jobs.sqlite" out/jobs.json
      - name: The blind judge (right role, right place; Codex small tier)
        if: steps.token.outputs.ok == 'yes'
        run: |
          set -o pipefail
          node tools/persona-search/codex.mjs -- python3 tools/persona-search/gate_judge.py "${{ matrix.persona }}" out/jobs.json out/judged.json 2>&1 | tee out/judge.log
      - name: The persona's numbers
        if: always() && steps.token.outputs.ok == 'yes'
        run: python3 tools/persona-search/gate.py result "${{ matrix.persona }}" out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: search-personas-p${{ matrix.persona }}
          retention-days: 30
          path: |
            out/result.json
            out/judged.json
            out/run.log
            out/judge.log
            out/draw/presses.jsonl
            out/draw/run-*.log
      - if: always() && steps.token.outputs.ok == 'yes'
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5

  compare:
    name: Search check
    needs: persona
    if: ${{ !cancelled() }}   # Why (#2243): a run a newer push cancelled posted a red table ("p6: no result"); only a finished run is compared
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: write   # the table as one comment on the PR, edited on each push
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: ./.github/actions/gh-ledger
        with:
          phase: start
        timeout-minutes: 5
      - uses: actions/download-artifact@v7
        with: {pattern: 'search-personas-p*', path: results}
      - name: Main's measured runs (the quality gate, from 10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p main
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow search-personas.yml --branch main --event push --status completed --limit 40 \
                        --json databaseId --jq '.[].databaseId'); do
            [ "$id" = "$GITHUB_RUN_ID" ] && continue
            # Why (#2295, gitar): fetch more than the ten measured runs the gate requires; neutral or incomplete runs must not consume all history slots.
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n search-personas-result -D "main/$id" 2>/dev/null || continue
          done
          printf 'main runs: '
          for dir in main/*; do [ ! -d "$dir" ] || printf '%s ' "${dir#main/}"; done
          printf '\n'
      - name: Compare with main
        id: compare
        run: |
          set +e
          mapfile -t mains < <(find main -mindepth 1 -maxdepth 1 -type d | sort -t/ -k2 -nr)   # newest run first
          python3 tools/persona-search/gate.py compare results result "${mains[@]}"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with: {name: search-personas-result, path: result/verdict.json, retention-days: 90}
      - name: The table on the PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" -R "$GITHUB_REPOSITORY" --body-file result/table.md --edit-last --create-if-none
      - name: Red when a persona is below main's range or a press is over 3 minutes
        env:
          CODE: ${{ steps.compare.outputs.code }}
        run: test "$CODE" = 0
      - if: always()
        uses: ./.github/actions/gh-ledger
        with:
          phase: end
        timeout-minutes: 5
