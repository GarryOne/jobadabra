name: CI · PR verdict
# Job: report health
# The ONE writer of a pull request's one required status, "All checks passed" (tools/pr-verdict.py), each time one of its workflows ends: pending while any runs,
# red when a run ended red, green when all ended green. A job of seconds per event, never a wait loop: a pending result reads once more ~20 s later (#2533's list
# lag; owner, 26 Oct 2026: "How could you design such a
# slow and inefficient method of checking PRs?"). Until 26 Oct pr-gate.yml's "Other workflows passed" and pr-suites.yml's wait each sat on a runner ~20 min per push.
# Why one writer (owner, 30 Oct 2026, "One writer"): every PR job also wrote it as its last step (#2042); ~21 jobs x ~24 GitHub calls per push spent the token's
# 5,000 calls an hour by ~35 min past each hour, a failed read wrote nothing, and green PRs sat at "pending" (#2609, #2605, #2598, #2593).
# workflow_run runs main's copy of this file. Every workflow a pull request starts must be listed below (tests/test_pr_verdict.py), plus the e2e runs pr-suites.yml starts.
on:
  workflow_run:
    types: [completed]
    workflows:
      - 'CI · Pull request'
      - 'CI · E2E suites for a PR'
      - 'CI · End-to-end on Mac + Linux'
      - 'CI · End-to-end on Windows'
      - 'CI · Control tests (measure, not required)'
      - 'CI · Harness tests'
      - 'CI · Hosted Always on cost probe (one-off)'
      - 'Proof · Which org the e2e AI keys belong to'
      - 'Extension · Chrome Web Store publish'
      - 'Proof · LibreOffice add-on on Mac and Windows'
      - 'CI · Page cases (all cases, real extension, Linux)'
      - 'CI · Ready to send image'
      - 'CI · Search check (6 personas)'
      - 'CI · Tests · desktop (Windows)'
      - 'CI · Tests · desktop'
      - 'CI · Tests · python'
      - 'CI · Tests · worker'

permissions:
  contents: read

# One verdict per PR branch: one runs, the newest waits and replaces an older waiting one (it reads the same state; every PR job also writes it as its last step).
# Why (27 Oct 2026): per commit (workflow_run.head_sha) every push kept its own runs. An event the job below skips (a replaced commit, a merged PR) waits in its
# own group: concurrency applies before the job's `if:`, so in the branch group it could replace the head's waiting verdict and then write nothing (review on #2248).
concurrency:
  group: >-
    pr-verdict-${{ ((github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha == github.event.workflow_run.pull_requests[0].head.sha)
    || startsWith(github.event.workflow_run.display_title, 'E2E for PR · ')) && github.event.workflow_run.head_branch || 'skipped' }}
  cancel-in-progress: false

jobs:
  verdict:
    name: Write the PR's verdict
    # Only runs of a pull request's CURRENT head, or the e2e run one started: main's schedules and bisects end here at once.
    # Why (27 Oct 2026, 6e with the owner's yes): a commit a newer push replaced still started a verdict per finished workflow, each holding a runner; 22 were cancelled
    # by hand at 06:53 while 38 Linux jobs queued behind GitHub's 20-job cap. workflow_run.pull_requests[].head.sha is the PR's head NOW (an older commit's run
    # names the newer head), and it is empty once the PR is merged or closed: a skipped job takes no runner. Guard: tests/test_pr_verdict.py.
    if: >-
      (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_sha == github.event.workflow_run.pull_requests[0].head.sha)
      || startsWith(github.event.workflow_run.display_title, 'E2E for PR · ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read          # the commit's workflow runs
      pull-requests: read    # the PR's files and commits (the CI change budget)
      statuses: write        # the "All checks passed" status
    steps:
      - uses: actions/checkout@v5
        with:
          # Its companions too: each one a standalone copy fetched over the API cost a call per write (main_state_module).
          sparse-checkout: |
            tools/pr-verdict.py
            tools/main_e2e_state.py
            tools/pr_ai_number.py
            tools/pr_burn_in.py
            tools/pr_health_greys.py
            tools/pr_speed_number.py
            tools/beta_rate_gate.py
          sparse-checkout-cone-mode: false
      - name: All checks passed?
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/pr-verdict.py --repo "$GITHUB_REPOSITORY" --sha "$SHA"
