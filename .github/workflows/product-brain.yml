name: Product brain · Daily brief
# Every morning: reads the product's signals (the owner's 📍 Product Compass and strategy pages, website + app numbers,
# the website as visitors see it, GitHub, its own past decisions), recommends ONE action that serves the Compass's
# phase and goal, and sends it to the owner's "Job Pilotto Brain" Telegram bot. Nothing goes further without a tap:
#   ✅ Explore it   -> step explore: the large model (Codex) brainstorms options and a plan into the Notion page, then stops
#   ✅ Approve plan -> step approve: marked Approved (building it is a normal session, with the owner)
#   ⏭ / ✖           -> step skip: Not now      🔁 -> step another: Not now + a different recommendation
# Sundays: step review, a 30-day strategy review (large model, no web research) that proposes Compass changes; ✅ writes them in.
# Every message and tap is also logged in the site's D1 (brain_messages) for /admin/intelligence/brain; step sync copies Notion's rows there.
# Buttons: the bot's webhook is the website (api/brain.js). Plumbing: tools/product_brain.py, tools/site-shots.mjs.
# AI: the owner's Codex plan through the broker (desktop/e2e/brain-codex.mjs), never an Anthropic key (owner, 31 Oct 2026). A refused call (budget, login, broker down) skips the day: green with "AI skipped: <reason>", one alert (.github/actions/ai-skipped-alert). Secrets: NOTION_BRAIN_TOKEN (Notion connection "Job Pilotto Brain": the Decisions database and
# the pages the owner shares with it), BRAIN_BOT_TOKEN, BRAIN_CHAT_ID, JOB_PILOTTO_TELEMETRY_KEY; variable BRAIN_DATABASE_ID.
# Prompts: private (GarryOne/jobadabra-lab/prompts, synced into the secrets BRAIN_PROMPT_BRIEF|REVIEW|EXPLORE).
# Cost: a call is a share of the owner's weekly plan (the broker counts it), no dollars.

on:
  schedule:
    - cron: '0 5 * * *'   # daily brief: 07:00 Zurich in summer, 06:00 in winter
    - cron: '0 16 * * 0'  # Sunday strategy review
  workflow_dispatch:
    inputs:
      step:
        description: brief, explore, approve, skip, another, review or sync (Notion rows -> /admin/intelligence/brain's log)
        type: choice
        options: [brief, explore, approve, skip, another, review, sync]
        default: brief
      id:
        description: The decision's Notion page id (explore, approve, skip, another)
        type: string
        default: ''

permissions:
  id-token: write   # the broker knows a run by its OIDC token (desktop/e2e/lib/broker-client.mjs)
  contents: read
  issues: read
  actions: read

concurrency:
  group: product-brain
  cancel-in-progress: false

jobs:
  brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      STEP: ${{ inputs.step || (github.event.schedule == '0 16 * * 0' && 'review' || 'brief') }}
      DECISION: ${{ inputs.id }}
      GH_TOKEN: ${{ github.token }}
      NOTION_BRAIN_TOKEN: ${{ secrets.NOTION_BRAIN_TOKEN }}
      BRAIN_DATABASE_ID: ${{ vars.BRAIN_DATABASE_ID }}
      BRAIN_BOT_TOKEN: ${{ secrets.BRAIN_BOT_TOKEN }}
      BRAIN_CHAT_ID: ${{ secrets.BRAIN_CHAT_ID }}
      JOB_PILOTTO_TELEMETRY_KEY: ${{ secrets.JOB_PILOTTO_TELEMETRY_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 300   # a month of commits for the signals
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Record a button (Not now, Approved)
        if: env.STEP == 'skip' || env.STEP == 'approve' || env.STEP == 'another'
        run: |
          case "$STEP" in
            approve) python tools/product_brain.py status --id "$DECISION" --status Approved ;;
            *)       python tools/product_brain.py status --id "$DECISION" --status 'Not now' ;;
          esac

      - name: Copy the Decisions rows into the site's log (/admin/intelligence/brain)
        if: env.STEP == 'sync'
        run: python tools/product_brain.py sync

      - name: Gather the signals
        if: env.STEP == 'brief' || env.STEP == 'another' || env.STEP == 'review'
        run: python tools/product_brain.py signals --out .brain/signals.md --days "$([ "$STEP" = review ] && echo 30 || echo 7)"

      - name: See the website as visitors do (desktop and phone)
        if: env.STEP != 'skip' && env.STEP != 'approve' && env.STEP != 'sync'
        continue-on-error: true   # the brief still runs on the page source
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cp tools/site-shots.mjs "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP/shots" && npm init -y >/dev/null && npm i -s playwright@1
      - name: Chromium for the screenshots (cached)
        if: env.STEP != 'skip' && env.STEP != 'approve' && env.STEP != 'sync'
        continue-on-error: true
        uses: ./.github/actions/playwright-browser
        with:
          working-directory: ${{ runner.temp }}/shots
          mode: full
      - name: Screenshots
        if: env.STEP != 'skip' && env.STEP != 'approve' && env.STEP != 'sync'
        continue-on-error: true
        run: |
          node "$RUNNER_TEMP/shots/site-shots.mjs" https://www.jobpilotto.top/ "$GITHUB_WORKSPACE/.brain"

      - name: Codex picks today's one action, or reviews the strategy (Sundays)
        id: brief_ai
        if: env.STEP == 'brief' || env.STEP == 'another' || env.STEP == 'review'
        env:
          BRAIN_PROMPT_BRIEF: ${{ secrets.BRAIN_PROMPT_BRIEF }}
          BRAIN_PROMPT_REVIEW: ${{ secrets.BRAIN_PROMPT_REVIEW }}
        run: node desktop/e2e/brain-codex.mjs --step "$STEP"

      - name: Send the brief
        if: (env.STEP == 'brief' || env.STEP == 'another' || env.STEP == 'review') && steps.brief_ai.outputs.skipped != 'true'
        run: python tools/product_brain.py post --brief .brain/brief.json

      - name: Read the decision to explore
        if: env.STEP == 'explore'
        run: |
          mkdir -p .brain
          python tools/product_brain.py status --id "$DECISION" --status Exploring
          python tools/product_brain.py decision --id "$DECISION" > .brain/decision.md
          python tools/product_brain.py signals --out .brain/signals.md

      - name: Codex explores it (brainstorm, options, plan) and stops
        id: explore_ai
        if: env.STEP == 'explore'
        env:
          BRAIN_PROMPT_EXPLORE: ${{ secrets.BRAIN_PROMPT_EXPLORE }}
        run: node desktop/e2e/brain-codex.mjs --step explore
      - name: Send the plan
        if: env.STEP == 'explore' && steps.explore_ai.outputs.skipped != 'true'
        run: python tools/product_brain.py plan --id "$DECISION" --file .brain/plan.md

      - name: Tell the owner once if Codex refused (the day is skipped, nothing is paid)
        if: always() && (steps.brief_ai.outputs.skipped == 'true' || steps.explore_ai.outputs.skipped == 'true')
        uses: ./.github/actions/ai-skipped-alert
        with:
          bot-token: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          github-token: ${{ github.token }}
          notes-dir: ${{ runner.temp }}/ai-capped
      - name: Say it failed
        if: failure()
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, 'tools')
          import product_brain
          product_brain.telegram(f'⚠️ Product brain ({os.environ["STEP"]}) failed: '
                                 f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}')
          EOF
