# Refill the replays' missing AI answers in CI, not on the Mac (owner, 15 Oct 2026: "Let's have a separate CI workflow only for that, with a separate Anthropic API Key").
# A PR that changes what the app asks the AI makes the site replays gate say "ask changed" / "out of date" for the pinned rows whose stored answers no longer match. This refills only those
# asks, one pinned row per runner in parallel (fill-memo.mjs: the network record is replayed, no site visit, the fake applicant, the privacy tripwire on, old answers never changed),
# publishes the refilled rows through the guard (records-publish.mjs, desktop/e2e/lib/record-guard.mjs: worse, garbled or pinned-breaking rows refused), then re-runs the PR's gate.
# Since 17 Oct 2026 (owner: "Off PRs now, scheduled only"): NO push trigger, no PR gate any more. It starts by hand, or from the daily site replays (site-replays.yml, `only` = the rows its verdict flagged "out of date" / "ask changed").
# The text below on a push to main and on PRs is the history of the earlier design. Two ways in. (1) By hand with a PR number (workflow_dispatch, as before): that PR's pinned rows. (2) Was: AUTOMATICALLY on main (owner, 15 Oct 2026): a push to main that changes a ladder prompt fingerprint
# (desktop/e2e/ladder-baseline.json, compared by refill-trigger.mjs with the file before the push; a score update alone does not count), OR a change to a file that builds the ask (the worker's instructions, fact rule, field list, CV facts; desktop/e2e/lib/prompt-sources.mjs; owner, 15 Oct 2026: #904 and #912 changed the ask and no refill ran), or a by-hand run with no PR number: EVERY recorded row, pinned or not.
# NOT a pull_request trigger (owner rule, 13 Oct 2026: no workflow a PR starts can reach an AI key; desktop/e2e/test/pool-ci-triggers.test.mjs): a push to main is merged code the owner reviewed.
# Never a fork PR: the key is never given to it. Never every PR. Refill runs take their turn one at a time (pool-ci-wait.mjs), so two never publish the same rows.
# On main the publish works in groups of 3 rows (records-publish.mjs refuses more at once), one runner per group, and a failed or cap-refused run tells the owner on Telegram (ci-alert.mjs).
# Key: REPLAY_REFILL_ANTHROPIC_KEY, its own workspace and spend limit, NO fallback to ANTHROPIC_API_KEY or any other key: missing = the job says so and stops (lib/refill.mjs).
# Money: the estimate is printed first (pick job), above max_asks (default 40) or $3 the run does not start, a row stops at 30 paid calls, each row's spend is in the job log and on /admin/ai-cost (job replay-refill).
# The tree: main's tools + the PR's head merged on the runner (tools/refill-merge-main.sh; a branch older than this workflow still runs; one that conflicts with main stops with "rebase it").
# Needs also: NET_RECORD_KEY, NET_RECORDS_READ_TOKEN (as the replay), NET_RECORDS_WRITE_TOKEN (contents:write on the private jobadabra-lab: only the publish job reads it), AI_COST_PUBLISH_KEY.
# Guard: tests/test_refill_workflow.py, desktop/e2e/test/refill.test.mjs. Never posts a Replay-accept line.
name: CI · Replay refill
run-name: ${{ inputs.pr != '' && format('Replay refill PR {0} @ {1}', inputs.pr, inputs.head) || 'Replay refill' }}   # the PR gate looks for this title before it starts another automatic refill for the same commit

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number whose pinned rows get their missing answers refilled; empty = main: every recorded row'
        required: false
        default: ''
      rows:
        description: 'changed = only the pinned rows its gate marked ask changed / out of date; all = every pinned row'
        default: changed
        type: choice
        options: [changed, all]
      auto:
        description: 'Started by a PR gate itself (owner, 17 Oct 2026): only rows whose outcome fell, at most $0.50 a run and $5 a calendar month, Telegram when a cap stops it'
        default: ''
      head:
        description: 'The PR commit the automatic run is for (its title; one automatic run per commit)'
        default: ''
      max_asks:
        description: 'Refuse to start above this many asks (empty: 40 for a PR, 200 for main)'
        default: ''
      only:
        description: 'Main run: only these recorded rows (one name per line). The daily site replays start it with the rows its verdict flagged (owner, 17 Oct 2026); empty = every recorded row'
        default: ''

permissions:
  contents: read
  actions: write        # re-run the PR's gate after the publish
  pull-requests: read   # the PR's head repo (never a fork)

concurrency:
  # The newest main commit wins (owner, 15 Oct 2026; tests/test_main_runs_finish.py): a push shares ONE group on main and cancels the older commit's run (only the newest prompt matters; a publish is additive per group, nothing half-written).
  # A by-hand run is its own group and never cancelled. Whatever runs, the trigger job makes the runs take turns, so two never publish the same rows.
  group: replay-refill-hand-${{ github.run_id }}
  cancel-in-progress: false

env:
  PR: ${{ inputs.pr }}

jobs:
  trigger:
    # Is this run wanted, and is it its turn? A by-hand run always; a push to main only when it changed a ladder prompt fingerprint.
    runs-on: ubuntu-24.04
    timeout-minutes: 75   # up to 60 minutes waiting for the earlier refill runs
    outputs:
      run: ${{ steps.what.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the commit before the push, to read its ladder baseline
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Did the merge change a prompt fingerprint?
        id: what
        working-directory: desktop/e2e
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = push ]; then   # no push trigger since 17 Oct 2026 (owner: the daily replay starts the refill for the rows it flags); kept until refill-trigger.mjs goes
            if git show "$BEFORE:desktop/e2e/ladder-baseline.json" > "$RUNNER_TEMP/baseline-before.json" 2>/dev/null; then before="$RUNNER_TEMP/baseline-before.json"; else before=-; fi
            said="$(node refill-trigger.mjs "$before" ladder-baseline.json "$BEFORE" 2>/dev/null)"
            verdict="$(echo "$said" | tail -n 1)"
            if [ "$verdict" = changed ]; then run=1; else run=0; fi
            echo "refill (main): the push $verdict what the AI is asked (the ladder prompt fingerprints, the worker's instructions and field list): run=$run"
            echo "$said" | grep -v -x -E 'changed|same' | sed 's/^/  - /' || true
          else run=1; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - name: Wait for its turn (earlier refill runs finish first)
        if: steps.what.outputs.run == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          POOL_WAIT_WORKFLOWS: replay-refill.yml
          POOL_WAIT_WHAT: replay refill
        run: node desktop/e2e/pool-ci-wait.mjs

  bundles:
    # The release's recordings downloaded ONCE for every job of this run and kept ENCRYPTED (this repo is public: an artifact is readable by anyone; each job decrypts with NET_RECORD_KEY as before).
    needs: trigger
    if: needs.trigger.outputs.run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5   # the workflow's own ref (main): its tools
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The release's bundles, still encrypted
        env:
          GH_TOKEN: ${{ github.token }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: bash desktop/e2e/net-records-fetch.sh --bundles-only "$RUNNER_TEMP/bundles"
      - uses: actions/upload-artifact@v6
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
          retention-days: 1

  pick:
    needs: [trigger, bundles]
    if: needs.trigger.outputs.run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rows: ${{ steps.pick.outputs.rows || steps.pickmain.outputs.rows }}
      groups: ${{ steps.pick.outputs.groups || steps.pickmain.outputs.groups }}
      count: ${{ steps.pick.outputs.count || steps.pickmain.outputs.count }}
      line: ${{ steps.pick.outputs.line || steps.pickmain.outputs.line }}
    steps:
      - name: The key is set, and the PR is not from a fork
        env:
          GH_TOKEN: ${{ github.token }}
          REFILL_KEY: ${{ secrets.REPLAY_REFILL_ANTHROPIC_KEY }}
        run: |
          if [ -z "$REFILL_KEY" ]; then echo "refill: no REPLAY_REFILL_ANTHROPIC_KEY secret: nothing was asked (this workflow never runs on another key)"; exit 1; fi
          if [ -n "$PR" ]; then
            cross="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)"
            if [ "$cross" != "false" ]; then echo "refill: PR $PR is from a fork or unknown: the key is never given to it"; exit 1; fi
          fi
      - uses: actions/checkout@v5   # the workflow's own ref (main): its tools, never the PR's code
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: The rows the PR's gate marked, the estimate, the caps
        id: pick
        if: inputs.pr != ''
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          ROWS: ${{ inputs.rows || 'changed' }}
          MAX_ASKS: ${{ inputs.max_asks || '40' }}
          AUTO: ${{ inputs.auto }}
          COST_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          head="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
          run="$(gh run list -R "$GITHUB_REPOSITORY" -w site-replays-pr.yml -b "$head" -L 1 --json databaseId -q '.[0].databaseId // empty')"
          mkdir -p "$RUNNER_TEMP/shards" "$RUNNER_TEMP/step4"
          if [ -n "$run" ]; then gh run download "$run" -R "$GITHUB_REPOSITORY" -p "replay-pr-$run-*" -D "$RUNNER_TEMP/shards" || true; fi
          find "$RUNNER_TEMP/shards" -path '*step4/*.json' -exec cp {} "$RUNNER_TEMP/step4/" \;
          all=""; [ "$ROWS" = all ] && all="--all"
          [ "$AUTO" = true ] && all="--worse-only --max-usd 0.5"   # the automatic run: only rows a refill can turn green, $0.50 a run (the month's $5 is checked next)
          cp replay-faithful.json "$RUNNER_TEMP/pins.json"   # main's pins, unless the PR's head has its own file (data only: the PR's code is not run here)
          if git fetch --quiet origin "refs/pull/$PR/head"; then git show FETCH_HEAD:desktop/e2e/replay-faithful.json > "$RUNNER_TEMP/pins-pr.json" 2>/dev/null && mv "$RUNNER_TEMP/pins-pr.json" "$RUNNER_TEMP/pins.json"; fi
          node refill-pick.mjs "$RUNNER_TEMP/pins.json" "$RUNNER_TEMP/step4" $all --max-asks "$MAX_ASKS" > "$RUNNER_TEMP/pick.json"
          { echo "### Replay refill: PR $PR"; echo; echo '```'; jq -r .line "$RUNNER_TEMP/pick.json"; echo '```'; }
          [ -z "$(jq -r .refused "$RUNNER_TEMP/pick.json")" ] || { echo "::error::the estimate is above the cap: nothing was asked"; jq -r .refused "$RUNNER_TEMP/pick.json" > "$RUNNER_TEMP/auto-why.txt"; exit 1; }
          if [ "$AUTO" = true ] && [ "$(jq '.rows | length' "$RUNNER_TEMP/pick.json")" != 0 ]; then   # the month's $5 (/admin/ai-cost, job replay-refill), read here: the PR's job holds no key
            if AI_COST_PUBLISH_KEY="$COST_KEY" node refill-auto.mjs cap "$(jq .usd "$RUNNER_TEMP/pick.json")" > "$RUNNER_TEMP/auto-why.txt"; then cat "$RUNNER_TEMP/auto-why.txt"
            else cat "$RUNNER_TEMP/auto-why.txt"; echo "::error::the automatic refill is over its cap: nothing was asked"; exit 1; fi
          fi
          echo "rows=$(jq -c .rows "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -c .groups "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.rows | length' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "line=$(jq -r .line "$RUNNER_TEMP/pick.json" | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Tell the owner on Telegram when a cap stops the automatic refill
        if: failure() && inputs.auto == 'true' && inputs.pr != ''
        working-directory: desktop/e2e
        env:
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
        run: |
          why="$(head -n 3 "$RUNNER_TEMP/auto-why.txt" 2>/dev/null | tr '\n' ' ')"
          node refill-auto.mjs alert "PR $PR: ${why:-the pick failed, see the run}. Nothing was asked. By hand: gh workflow run replay-refill.yml -f pr=$PR"
      - uses: actions/download-artifact@v7
        if: inputs.pr == ''
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: Every recorded row, the estimate, the caps (main)
        id: pickmain
        if: inputs.pr == ''
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh)
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
          MAX_ASKS: ${{ inputs.max_asks || '200' }}
          ONLY: ${{ inputs.only }}
        run: |
          bash net-records-fetch.sh "$RUNNER_TEMP/records"
          printf '%s' "$ONLY" > "$RUNNER_TEMP/only.txt"   # empty = every recorded row; else just the rows the daily replay flagged
          node refill-pick.mjs --main "$RUNNER_TEMP/records" --max-asks "$MAX_ASKS" --only "$RUNNER_TEMP/only.txt" > "$RUNNER_TEMP/pick.json"
          { echo "### Replay refill: main ($([ -s "$RUNNER_TEMP/only.txt" ] && echo 'the rows the daily replay flagged' || echo 'every recorded row'))"; echo; echo '```'; jq -r .line "$RUNNER_TEMP/pick.json"; echo '```'; }
          echo "line=$(jq -r .line "$RUNNER_TEMP/pick.json" | head -n 1)" >> "$GITHUB_OUTPUT"
          [ -z "$(jq -r .refused "$RUNNER_TEMP/pick.json")" ] || { echo "::error::the estimate is above the cap: nothing was asked"; exit 1; }
          echo "rows=$(jq -c .rows "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "groups=$(jq -c .groups "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.rows | length' "$RUNNER_TEMP/pick.json")" >> "$GITHUB_OUTPUT"

  refill:
    needs: [pick, bundles]
    if: needs.pick.outputs.count != '0'
    name: refill ${{ matrix.row }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4   # one workflow never holds most of the 20 runners (owner, 15 Oct 2026)
      matrix:
        row: ${{ fromJSON(needs.pick.outputs.rows) }}
    env:
      JOB_PILOTTO_HEAVY: '0'
      JP_REFILL_CI: '1'   # the fill replay may ask the API on CI (lib/ai/model-memo.js fillOn); the key itself is given to the one step below
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # main's tools first; the PR's build is brought in by the next step
      - name: The PR's build with main's tools (merged on this runner, never pushed)
        if: inputs.pr != ''
        run: |
          cp tools/refill-merge-main.sh "$RUNNER_TEMP/refill-merge-main.sh"
          git fetch --quiet origin "refs/pull/$PR/head"
          git checkout --quiet --detach FETCH_HEAD
          bash "$RUNNER_TEMP/refill-merge-main.sh" "$PR"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install --with-deps chromium)
      - uses: actions/download-artifact@v7
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The pool's newest records, decrypted on the runner only
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh)
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
      - name: Fill this row's missing answers (the network record replayed, the API asked for the missed asks only)
        id: fill
        working-directory: desktop/e2e
        env:
          REPLAY_REFILL_ANTHROPIC_KEY: ${{ secrets.REPLAY_REFILL_ANTHROPIC_KEY }}   # no fallback: lib/refill.mjs keyRefusal
        run: node fill-memo.mjs "$GITHUB_WORKSPACE/records" "${{ matrix.row }}" --out "$RUNNER_TEMP/fill" 2>&1 | tee -a "$RUNNER_TEMP/fill.log"; exit "${PIPESTATUS[0]}"
      - name: Pack the refilled memo (encrypted with the public key; the page parts never sit in the clear)
        if: success()
        working-directory: desktop/e2e
        run: node refill-pack.mjs "$GITHUB_WORKSPACE/records" "${{ matrix.row }}" "$RUNNER_TEMP/fill" "$RUNNER_TEMP/pack/row" "$RUNNER_TEMP/fill.log"
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: refill-${{ github.run_id }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pack
          retention-days: 3
      - name: This row's line
        if: always()
        run: |
          if grep -q "OUT OF CREDITS" "$RUNNER_TEMP/fill.log" 2>/dev/null; then echo "::error::refill: OUT OF CREDITS (the refill key's balance or workspace limit): add credit in the Anthropic console, then run it again"; fi
          { echo "#### ${{ matrix.row }}"; echo '```'; grep -E "^(fill-memo|replay-net: refill)" "$RUNNER_TEMP/fill.log" 2>/dev/null | cut -c1-300 || echo "no result"; echo '```'; }

  publish:
    # Groups of 3 rows, one runner each: records-publish.mjs refuses more at once (its guard replays each refilled row twice). Each group is its own bundle (NET_RECORDS_BUNDLE_SUFFIX).
    needs: [pick, refill, bundles]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.count != '0'
    name: publish group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4   # as the refill matrix: one workflow never holds most of the 20 runners
      matrix:
        group: ${{ fromJSON(needs.pick.outputs.groups) }}
    env:
      JOB_PILOTTO_HEAVY: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # main's tools first; the PR's build is brought in by the next step
      - name: The PR's build with main's tools (merged on this runner, never pushed)
        if: inputs.pr != ''
        run: |
          cp tools/refill-merge-main.sh "$RUNNER_TEMP/refill-merge-main.sh"
          git fetch --quiet origin "refs/pull/$PR/head"
          git checkout --quiet --detach FETCH_HEAD
          bash "$RUNNER_TEMP/refill-merge-main.sh" "$PR"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            desktop/e2e/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the app, the tests and the browser
        run: |
          (cd desktop && npm ci) && (cd desktop/e2e && (npm ci || npm install))
          pip install --quiet -r requirements.txt
          (cd desktop/e2e && npx playwright-core install --with-deps chromium)
      - uses: actions/download-artifact@v7
        with:
          pattern: refill-${{ github.run_id }}-*
          path: ${{ runner.temp }}/packs
      - name: The rows that were refilled
        id: packs
        run: |
          n="$(find "$RUNNER_TEMP/packs" -name meta.json | wc -l | tr -d ' ')"
          echo "packs=$n" >> "$GITHUB_OUTPUT"
          [ "$n" != 0 ] || echo "refill: no row was refilled: nothing to publish"
      - uses: actions/download-artifact@v7
        if: steps.packs.outputs.packs != '0'
        with:
          name: net-bundles-${{ github.run_id }}
          path: ${{ runner.temp }}/bundles
      - name: Is the records App's key set
        id: records_app_key
        env:
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$CI_APP_PRIVATE_KEY" ]; then echo "set=true" >> "$GITHUB_OUTPUT"
          else echo "set=false" >> "$GITHUB_OUTPUT"; echo "::notice::records App key not set, the old read token is used (it shares the owner's GitHub API limit)"; fi
      - name: The records token from the GitHub App (its own API limit, not the owner's account's)
        id: records_app
        if: steps.records_app_key.outputs.set == 'true'
        continue-on-error: true   # a failed mint falls back to the old secret, never a red job
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: GarryOne
          repositories: jobadabra-lab
      - name: The records now, each refilled memo merged in (old answers never changed)
        if: steps.packs.outputs.packs != '0'
        working-directory: desktop/e2e
        env:
          NET_RECORDS_BUNDLES: ${{ runner.temp }}/bundles   # the run's one download of the release, still encrypted (net-records-fetch.sh)
          GH_TOKEN: ${{ github.token }}
          NET_RECORD_KEY: ${{ secrets.NET_RECORD_KEY }}
          NET_RECORDS_READ_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_READ_TOKEN }}
        run: |
          bash net-records-fetch.sh "$GITHUB_WORKSPACE/records"
          mkdir -p "$RUNNER_TEMP/packs-flat"
          find "$RUNNER_TEMP/packs" -name meta.json | while read -r meta; do d="$(dirname "$meta")"; cp -r "$d" "$RUNNER_TEMP/packs-flat/$(basename "$(dirname "$d")")-$(basename "$d")"; done
          { echo "#### Merged"; node refill-merge.mjs "$GITHUB_WORKSPACE/records" "$RUNNER_TEMP/packs-flat" "$RUNNER_TEMP/staged"; } || true
      - name: This group's rows (at most 3)
        id: group
        if: steps.packs.outputs.packs != '0'
        working-directory: desktop/e2e
        run: |
          node refill-group.mjs "$RUNNER_TEMP/staged" "${{ matrix.group }}" "$RUNNER_TEMP/staged-group" || true
          if [ -d "$RUNNER_TEMP/staged-group" ] && [ -n "$(ls -A "$RUNNER_TEMP/staged-group")" ]; then echo "rows=1" >> "$GITHUB_OUTPUT"; else echo "rows=0" >> "$GITHUB_OUTPUT"; fi
      - name: Publish this group's rows through the guard
        if: steps.packs.outputs.packs != '0' && steps.group.outputs.rows == '1'
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_WRITE_TOKEN }}   # contents:write on jobadabra-lab only
          NET_RECORDS_WRITE_TOKEN: ${{ steps.records_app.outputs.token || secrets.NET_RECORDS_WRITE_TOKEN }}
          DISPATCH_TOKEN: ${{ github.token }}   # starts the site replay after the publish (actions: write above); the write token has no rights on this repo
          NET_RECORDS_BUNDLE_SUFFIX: -g${{ matrix.group }}   # two groups in the same second never write the same asset
        run: |
          if [ -z "$NET_RECORDS_WRITE_TOKEN" ]; then echo "refill: no NET_RECORDS_WRITE_TOKEN secret: the rows are refilled but not published (the owner adds it, then run again)"; exit 1; fi
          node records-publish.mjs "$RUNNER_TEMP/staged-group" --against "$GITHUB_WORKSPACE/records" --report "$RUNNER_TEMP/yellow-g${{ matrix.group }}.json" 2>&1 | tee -a "$RUNNER_TEMP/publish.log"; code=${PIPESTATUS[0]}
          { echo "#### Publish group ${{ matrix.group }}"; echo '```'; tail -n 40 "$RUNNER_TEMP/publish.log" | cut -c1-300; echo '```'; }
          exit "$code"
      # Rows that only need a re-record (pinned not same as live, step mismatch) end this job green; their list travels to the summary and the one yellow message (owner, 17 Oct 2026).
      - name: Keep this group's list of rows that need a re-record
        if: always() && hashFiles(format('{0}/yellow-g{1}.json', runner.temp, matrix.group)) != ''
        uses: actions/upload-artifact@v6
        with:
          name: yellow-${{ github.run_id }}-g${{ matrix.group }}
          path: ${{ runner.temp }}/yellow-g${{ matrix.group }}.json
  finish:
    # Once, after every group: the spend (job log and /admin/ai-cost) and, for a PR run, the PR's gate again.
    needs: [pick, refill, publish]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        with:
          pattern: refill-${{ github.run_id }}-*
          path: ${{ runner.temp }}/packs
      - name: The rows that were refilled
        id: packs
        run: |
          n="$(find "$RUNNER_TEMP/packs" -name meta.json | wc -l | tr -d ' ')"
          echo "packs=$n" >> "$GITHUB_OUTPUT"
      - name: Rows that need a re-record (summary)
        if: always()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/yellow"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p "yellow-$GITHUB_RUN_ID-*" -D "$RUNNER_TEMP/yellow" || true
          mapfile -t lists < <(find "$RUNNER_TEMP/yellow" -name '*.json')
          node desktop/e2e/refill-yellow.mjs "$RUNNER_TEMP/yellow-merged.json" "${lists[@]}" || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Spend (job log and /admin/ai-cost)
        if: always() && steps.packs.outputs.packs != '0'
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          AI_COST_JOB: replay-refill
        run: |
          total="$(find "$RUNNER_TEMP/packs" -name meta.json -exec cat {} + | jq -s '{usd: (map(.usd) | add), calls: (map(.calls) | add)}')"
          echo "$total" > "$RUNNER_TEMP/refill-cost.json"
          echo "**Refill spend: \$$(jq -r '.usd | . * 10000 | round / 10000' "$RUNNER_TEMP/refill-cost.json") in $(jq -r .calls "$RUNNER_TEMP/refill-cost.json") call(s)** (the pick job's log has the estimate)"
          node desktop/e2e/ai-cost-report.mjs --job "$AI_COST_JOB" --file "$RUNNER_TEMP/refill-cost.json" || true
      - name: Re-run the PR's site replays gate (the new bundle is read by its replay)
        if: inputs.pr != '' && needs.publish.result == 'success' && steps.packs.outputs.packs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)"
          run="$(gh run list -R "$GITHUB_REPOSITORY" -w site-replays-pr.yml -b "$head" -L 1 --json databaseId -q '.[0].databaseId // empty')"
          if [ -n "$run" ]; then gh run rerun "$run" -R "$GITHUB_REPOSITORY" && echo "refill: the PR's site replays gate (run $run) started again"; else echo "refill: no gate run found for $head: push or re-run it by hand"; fi

  notify:
    # A failed or cap-refused run on main says so on Telegram (the replay's bot: ci-alert.mjs), and the first good one after it says "back to green". A by-hand PR run does not (its own gate says).
    needs: [trigger, pick, bundles, refill, publish, finish]
    if: always() && inputs.pr == '' && needs.trigger.outputs.run == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Tell the owner on Telegram (a failure or a capped run, one yellow list, or back to green)
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          RESULTS: pick=${{ needs.pick.result }} bundles=${{ needs.bundles.result }} refill=${{ needs.refill.result }} publish=${{ needs.publish.result }} finish=${{ needs.finish.result }}
          PICK: ${{ needs.pick.outputs.line }}
        run: |
          if echo "$RESULTS" | grep -qE '=(failure|cancelled)'; then node ci-alert.mjs failure "The replay refill on main did not finish (${RESULTS}). ${PICK:-the estimate is above the cap, or the key is missing: see the run}" "Run it again: gh workflow run replay-refill.yml (no pr); the recorded rows stay stale until then"
            exit 0
          fi
          # Green run: the rows that need a re-record are ONE yellow message, and only when the set differs from the run before (this run's list is kept as an artifact for the next one).
          mkdir -p "$RUNNER_TEMP/yellow" "$RUNNER_TEMP/before"
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p "yellow-$GITHUB_RUN_ID-*" -D "$RUNNER_TEMP/yellow" || true
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w replay-refill.yml -b main -s completed -L 8 --json databaseId -q '.[].databaseId'); do
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n "yellow-set-$id" -D "$RUNNER_TEMP/before" 2>/dev/null && break
          done
          mapfile -t lists < <(find "$RUNNER_TEMP/yellow" -name '*.json')
          node refill-yellow.mjs "$RUNNER_TEMP/yellow-set-$GITHUB_RUN_ID.json" "${lists[@]}" --previous "$(find "$RUNNER_TEMP/before" -name 'yellow-set-*.json' | head -1)" --alert
          if [ "${#lists[@]}" = 0 ]; then node ci-alert.mjs success; fi
      - name: Keep this run's list for the next run to compare with
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: yellow-set-${{ github.run_id }}
          path: ${{ runner.temp }}/yellow-set-${{ github.run_id }}.json
          if-no-files-found: ignore
