<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Job Application for Machine Learning Engineer at Northwind</title></head>
<body>
<main>
  <h1>Machine Learning Engineer</h1>
  <p>Remote · Full-time</p>
  <h2>Apply for this job</h2>
  <form>
    <label for="first_name">First Name*</label><input id="first_name" name="first_name" required>
    <label for="last_name">Last Name*</label><input id="last_name" name="last_name" required>
    <label for="email">Email*</label><input id="email" name="email" type="email" required>
    <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
    <label for="resume">Resume/CV*</label><input id="resume" name="resume" type="file" required>
    <label for="linkedin">LinkedIn Profile</label><input id="linkedin" name="linkedin">
    <label for="notice">Please specify notice period in your current workplace</label><input id="notice" name="notice">
    <label for="robot">Confirm you are not a robot</label><textarea id="robot" name="robot"></textarea>
    <iframe title="check" src="https://check.example.net/anchor" width="256" height="60"></iframe>
    <p>This site is protected by a check and the provider's Privacy Policy and Terms of Service apply.</p>
    <button type="submit">Submit application</button>
  </form>
</main>
</body>
</html>
