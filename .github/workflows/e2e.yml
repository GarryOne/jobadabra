name: CI · End-to-end on Mac + Linux
# Job: serve stored answers

# The real Jobadabra app, driven by Playwright on a macOS runner, one suite per Notion test page (desktop/e2e/README.md). It does two jobs, on two clocks:
#  1. RELEASE GATE. The release run (desktop.yml, "Release · Build, test, beta") calls this workflow as its "E2E · Mac + Linux" job right after the build (7 Oct 2026: one run
#     per release, build -> test -> approve, instead of three runs chained by triggers). It runs EVERY gate suite on the build's commit -> when all pass (and build.yml is green
#     on the commit) the `promote` job approves the build for Mac beta testers (JOB_PILOTTO_SOAK = on; canary-promote.yml then soaks it and promotes) or makes it stable (soak off).
#     The release run then calls e2e-windows.yml with the same suites: the Windows approval. Red: nothing is approved on that platform.
#  2. IMPROVEMENT LOOP. Three runs on main in the working day (09:47, 13:47, 17:47 UTC) feed ui-findings.yml (issues; ui-fix.yml turns the most critical into a pull request once a day). A scheduled run
#     goes ahead on a new commit; on an unchanged one it takes a second and a third look (each a different seeded path, lib/variation.mjs) and then stops until the next commit:
#     at most 3 runs per commit (lib/plan.mjs exploreDecision), so a busy day costs the schedule (3 runs) and an idle weekend 3 runs in all. A look at an unchanged commit runs ONLY the suites that
#     walk a different path each time (`export const varies`, today `interactions`, `apply` and `wander`): the others would repeat themselves.
#     The AI review of screenshots (the costly part) runs when the UI or its tests changed, a finding waits, or the run is exploring. A push to main runs NO e2e here; after each merge main-steps.yml starts only the steps it touched ("E2E after merge", owner 26 Oct 2026); by hand: gh workflow run e2e.yml -f suite=jobs,activity.
# All of it is decided in desktop/e2e/plan-run.mjs (tested). The test key's AI credit is shared and small: see desktop/e2e/README.md.
# Secrets (Settings → Secrets → Actions): E2E_ANTHROPIC_KEY, and one E2E_NOTION_TOKEN_<SUITE> per suite (a connection that sees only that suite's test page).
run-name: ${{ inputs.bisect && format('Bisect {0} {1}', inputs.suite, inputs.target_ref) || inputs.scheduled && 'E2E check · on time (Worker cron)' || inputs.mutant && format('Mutant {0}', inputs.mutant) || inputs.canary && format('Stable canary {0}', inputs.target_ref) || inputs.soak && format('RC soak {0}', inputs.target_ref) || inputs.gate_tag && format('Beta E2E tests {0}', inputs.gate_tag) || github.event.schedule == '17 3 * * *' && 'E2E check · outside world (real Notion)' || github.event_name == 'schedule' && 'E2E check · GitHub schedule (backup)' || inputs.after_merge && format('E2E after merge · {0} · {1}', inputs.after_merge, inputs.pr_suites) || inputs.pr_suites && format('E2E for PR · {0} · {1}', inputs.pr_suites, github.ref_name) || format('E2E Mac + Linux · {0} · {1}', inputs.suite || 'all suites', github.ref_name) }}   # a run by hand says which suites (owner, 7 Oct 2026); a PR's run says its suites (it read "all suites" until 26 Oct 2026), and pr-verdict.yml finds it by "E2E for PR · ". Both name the release they test: ui-findings.yml ignores 'Stable canary'; canary_promote.py counts 'RC soak <tag>' for gate 4. Called by the release run (desktop.yml), this run-name is not used: the jobs show as "E2E · Mac + Linux / <job>"

on:
  workflow_dispatch:
    inputs:
      ai_answers:
        description: 'Record candidate AI answers for owner review (requires owner approval before dispatch); off keeps normal suite behavior'
        type: choice
        options: ['off', record]
        default: 'off'
      ai_provider:
        description: 'AI provider for the judges in this run only: codex, claude or free. Empty = the repo variable CI_AI_PROVIDER, else free (lib/ai-provider.mjs)'
        type: string
        default: ''
      suite:
        description: 'Suites to run, comma-separated (empty = all)'
        required: false
      pr_suites:
        description: 'Exactly these suites as a pull request would run them (pr-suites.yml starts it with this): SQLite store, no AI screenshot review, no harness-test step, the PR branch''s own concurrency group'
        type: string
        default: ''
      pr_steps:
        description: 'With pr_suites: {suite: [step names]} = run only these steps of that suite (their needs and the setup too); a suite not named runs whole (pr-suites.mjs)'
        type: string
        default: ''
      after_merge:
        description: 'With pr_suites on main: the merged commit whose steps these are (main-steps.yml). Titled "E2E after merge · <sha> · <suites>"; a newer merge replaces a queued one; e2e-revert.yml retries one backbone red and offers a revert after two'
        type: string
        default: ''
      fixed:
        description: 'The fixed path (E2E_SEED=0), as the release gate, instead of a new seeded one: two runs then ask the same requests (replay, cost checks)'
        type: boolean
        default: false
      scheduled:
        description: 'Started on time by the Worker (worker/src/scheduler.js) in place of the three-a-day schedule: planned exactly as a schedule event, no paid AI judge'
        type: boolean
        default: false
      canary:
        description: 'The daily stable canary (stable-canary.yml): no paid AI judge, and ui-findings.yml files nothing from it'
        type: boolean
        default: false
      gate_tag:
        description: 'Run the full release gate for this pre-release tag by hand (a manual build is never gated by the nightly path): every suite on its commit, then approve it for beta (or promote it when the soak is off)'
        required: false
      target_ref:
        description: "Test this release tag's commit with THIS workflow file (the soak top-ups and the stable canary: an old tag's own workflow file does not know their inputs)"
        required: false
      soak:
        type: boolean
        default: false
        description: 'A top-up run on a release candidate (canary-promote.yml): no paid AI judge; its findings ARE filed, naming the build'
      all_on_mac:
        description: 'Run every suite on macOS (as before 6 Oct 2026), to compare with the Linux runners'
        type: boolean
        default: false
      family:
        description: 'The AI family the app under test runs on: alternate by run number (odd: OpenAI, even: Claude), or claude / openai to pin one (desktop/e2e/lib/engine.mjs pickFamily)'
        type: choice
        options: [alternate, claude, openai]
        default: alternate
      store:
        description: 'Where the app keeps its data (desktop/e2e/lib/store.mjs): alternate by run number (runs 0,1 sqlite, 2,3 the Notion stand-in), or pin one; a gate runs both. No suite uses a Notion token except notion-real'
        type: choice
        options: [alternate, sqlite, standin]
        default: alternate
      mutant:
        description: 'MUTATION TEST (mutation.yml): write this mutant of desktop/e2e/mutants.json into the app first, or "baseline". Fixed path, no AI review, nothing filed, no Windows run'
        required: false
      bisect:
        description: 'Set by e2e-bisect.yml (tools/e2e_bisect.py, gate G2b): one step of a bisect, the suite on target_ref. Titled "Bisect <suite> <sha>": never a main check, never filed by the Finder, no paid judge'
        type: boolean
        default: false
  schedule:
    - cron: '47 21,23,1 * * *'   # 23:47, 01:47, 03:47 in Zurich in summer, 22:47-02:47 in winter: at night only (owner, 15 Oct 2026: the 20 runners are for PRs by day); the UI loop's producer, ui-findings.yml, follows each run
    - cron: '17 3 * * *'   # Why (30 Oct 2026, a8, #2502): the outside world (real Notion) once a day on its own clock; the nightly gate skips a night with no app change
  # The release run (desktop.yml) calls this as its "E2E · Mac + Linux" job, right after it built the release (7 Oct 2026). GitHub names the jobs "E2E · Mac + Linux / <job>"
  # and uses the CALLER's event (schedule, workflow_dispatch): the gate is told by gate_tag, never by the event.
  workflow_call:
    inputs:
      gate_tag:
        description: 'The release just built: every gate suite on its commit, then the promote job approves it for Mac beta testers'
        type: string
        required: false
        default: ''
      pr_suites:
        description: 'Exactly these suites as a pull request would run them (no caller since the flow e2e left PRs, owner 13 Oct 2026; kept to turn it back on), on the SQLite store, no AI screenshot review, in the PR''s own concurrency group'
        type: string
        default: ''
      release_run:
        description: 'Called by the release run, which starts the Windows gate itself: no "Windows follows" dispatch from here'
        type: boolean
        default: true
    outputs:
      suites:
        description: 'The suites this gate ran, comma-separated: the Windows gate runs the same ones'
        value: ${{ jobs.plan.outputs.suites }}
      review:
        description: '1 = the AI screenshot review ran here: the Windows gate does the same'
        value: ${{ jobs.plan.outputs.review }}
      ref:
        description: 'The commit tested'
        value: ${{ jobs.plan.outputs.ref }}

# Main checks (the Worker's on-time run, GitHub's backup schedule) share ONE group: one runs, the newest waits, a started one finishes (26 Oct 2026: main checks and
# bisect steps queued 11 deep and held PR suites 20+ minutes). Bisect steps (e2e-bisect.yml) share another. Every other run (a PR's suites, a bisect step, a gate, a run by hand, the release run's call) is
# its own group: a PR cancels its older run per job below. Called by desktop.yml, github.workflow is the caller's name, so the release run never joins e2e-main.
concurrency:
  group: ${{ (inputs.scheduled || github.event_name == 'schedule' && github.workflow == 'CI · End-to-end on Mac + Linux') && 'e2e-main' || inputs.bisect && 'e2e-bisect-step' || format('e2e-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count: ${{ steps.list.outputs.count }}
      ref: ${{ steps.list.outputs.ref }}
      tag: ${{ steps.list.outputs.tag }}
      review: ${{ steps.list.outputs.review }}
      suites: ${{ steps.list.outputs.suites }}
      why: ${{ steps.list.outputs.why }}   # why a run planned what it did (no suite: the Nothing tested job says it)
      over: ${{ steps.spend.outputs.over }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: Install the tests
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: npm ci || npm install
      # Why (a8, 30 Oct 2026): "What to run" (plan-run.mjs) imports lib/ensure-staged.mjs and every suites/*.mjs through context.mjs, which reach the app's code and its
      # packages (@anthropic-ai/sdk); without them the beta and nightly plan dies with ERR_MODULE_NOT_FOUND (11 Oct 2026). The harness tests that once needed them run in harness.yml.
      - name: Install the app's own packages
        if: inputs.pr_suites == ''   # beta, nightly and scheduled plans import every suite
        timeout-minutes: 5
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts
      # desktop/shared is generated (gitignored): the suites the plan imports reach it (lib/ensure-staged.mjs), as the step above explains.
      - name: Stage the app's shared files
        if: inputs.pr_suites == ''   # beta, nightly and scheduled plans import every suite
        timeout-minutes: 5
        working-directory: desktop
        run: node scripts/stage.mjs --files-only
      # The harness's own tests no longer run here (owner, 30 Oct 2026, option C): harness.yml runs every one on each PR that reaches them, harness-daily.yml nightly on main.
      # Today's e2e AI budget (ai-spend.mjs; owner, 7 Oct 2026: "$30 a week"): spent, this run skips the paid judge and the screenshot review.
      - name: Today's e2e AI budget
        timeout-minutes: 5
        id: spend
        working-directory: desktop/e2e
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_DAILY_BUDGET: ${{ vars.E2E_DAILY_BUDGET }}
        run: node ai-spend.mjs >> "$GITHUB_OUTPUT"
      - name: What to run (suites, commit, AI review, release to promote)
        timeout-minutes: 5
        id: list
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && inputs.scheduled && 'schedule' || github.event_name }}   # the Worker's start is the schedule's own
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.suite || inputs.pr_suites }}
          AI_ANSWERS: ${{ github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.ai_answers == 'record' && 'record' || 'off' }}
          PR_SUITES: ${{ inputs.pr_suites }}
          PR_STEPS: ${{ inputs.pr_steps }}   # its "(stores)" and "(why)": the store each suite runs on, and the reasons printed below (desktop/e2e/pr-suites.mjs)
          TARGET_REF: ${{ inputs.target_ref || inputs.gate_tag }}
          GATE_TAG: ${{ inputs.gate_tag }}
          OVER: ${{ steps.spend.outputs.over }}
          OUTSIDE: ${{ github.event.schedule == '17 3 * * *' && '1' || '' }}   # the daily outside-world run plans only the `outside` suites (lib/plan.mjs)
        shell: bash -eo pipefail {0}   # a program piped into tee/cat keeps its exit code (tests/test_workflow_pipefail.py)
        run: node plan-run.mjs | { if [ "$OVER" = true ] || [ -n "$PR_SUITES" ]; then sed 's/^review=.*/review=0/'; else cat; fi; } >> "$GITHUB_OUTPUT"   # a pull request: no AI screenshot review
      # Why (29 Oct 2026, owner): only selected AI suites need preflight; offline settings must run with missing or revoked AI secrets.
      # Why (owner, 27 Oct 2026: "let's close the gaps", part 4): one look at CI's AI before the matrix, as desktop.yml's ai-ready; a refused Free AI token is one red line here,
      # not a red suite each (each suite's relay starts without checking it). Guard: tests/test_ci_free_ai.py test_every_relay_matrix_checks_the_ai_once_first.
      - name: Is CI's AI ready? (one check before the suites)
        if: steps.list.outputs.ai_required == '1'
        timeout-minutes: 5
        env:
          E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
          E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}
          CI_FREE_AI_CF_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}   # set: the suites run on Free AI, so this token is what is checked (key-preflight.mjs)
          CI_FREE_AI_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}   # with the token: the day's $1 cap on Workers AI neurons (lib/ai-cap.mjs; owner, 28 Oct 2026)
          CI_CF_ANALYTICS_TOKEN: ${{ secrets.CI_CF_ANALYTICS_TOKEN }}   # Account Analytics: Read only; unreadable count = the AI is capped (lib/ai-cap.mjs, fail closed)
        run: node desktop/e2e/key-preflight.mjs
  suite:
    name: ${{ matrix.burnIn && format('{0} · burn-in {1}/5', matrix.suite, matrix.burnIn) || matrix.key }}
    needs: plan
    if: needs.plan.outputs.count != '0'   # a push that changed no suite, a scheduled run with nothing new, or a night with no build: no suites
    runs-on: ${{ inputs.all_on_mac && 'macos-latest' || matrix.os || 'macos-latest' }}   # Linux unless the suite needs the Mac (lib/plan.mjs runnerOf); a virtual display there
    timeout-minutes: 360   # the lock's wait (up to 3 h) plus the suite; each step below has its own limit, so this only ends a hung wait
    # Outside failures stay red in their job and report, but do not decide the beta gate.
    continue-on-error: ${{ matrix.tolerant == true }}
    strategy:
      fail-fast: false      # one suite failing must not hide what the others found
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    concurrency:
      # A pull request's run cancels an older run of the SAME pull request; no other job shares a group (a shared group drops its second waiter: the suite's lock waits instead).
      # After a merge (main-steps.yml): one group per suite on main, never cancelled while it runs (its red names its commit); a newer merge's job replaces the one waiting.
      group: ${{ inputs.after_merge != '' && format('e2e-after-merge-{0}', matrix.key) || inputs.pr_suites != '' && format('e2e-pr-{0}-{1}', github.ref, matrix.key) || format('e2e-run-{0}-{1}', github.run_id, matrix.key) }}
      cancel-in-progress: ${{ inputs.pr_suites != '' && inputs.after_merge == '' }}
    env:
      # Why (#2651, owner): the generated relay key exists only when its producer runs.
      E2E_ARTIFACT_SECRET_NAMES: |
        ACTIONS_ID_TOKEN_REQUEST_TOKEN
        AI_COST_PUBLISH_KEY
        CI_CF_ANALYTICS_TOKEN
        CI_FREE_AI_CF_ACCOUNT_ID
        E2E_ANTHROPIC_KEY
        ${{ matrix.offlineAi != true && 'E2E_FREE_AI_KEY' || '' }}
        E2E_LOCK_TOKEN
        E2E_NOTION_TOKEN
        E2E_NOTION_TOKEN_ACTIVITY
        E2E_NOTION_TOKEN_ACTIVITYFAILURES
        E2E_NOTION_TOKEN_APPLY
        E2E_NOTION_TOKEN_CALENDAR
        E2E_NOTION_TOKEN_EMPLOYERS
        E2E_NOTION_TOKEN_FAILURESCHANNELS
        E2E_NOTION_TOKEN_FAILURESNOTION
        E2E_NOTION_TOKEN_FOCUS
        E2E_NOTION_TOKEN_FOCUSDISMISS
        E2E_NOTION_TOKEN_INTERACTIONS
        E2E_NOTION_TOKEN_INTERVIEWS
        E2E_NOTION_TOKEN_JOBS
        E2E_NOTION_TOKEN_PERSONAS
        E2E_NOTION_TOKEN_QUALITY
        E2E_NOTION_TOKEN_SETTINGS
        E2E_NOTION_TOKEN_STRATEGY
        E2E_NOTION_TOKEN_WANDER
        E2E_OPENAI_KEY
        FREE_AI_LOCAL_CF_ACCOUNT_ID
        FREE_AI_LOCAL_CF_AI_TOKEN
        GH_TOKEN
      # A suite whose secrets are missing FAILS here instead of a green "skipped" (lib/skip.mjs). 6 Oct 2026: failuresnotion and failureschannels
      # had never run (no token) and showed ✓. Forks have no secrets: they still skip with a warning.
      E2E_REQUIRE_SECRETS: ${{ github.repository_owner == 'GarryOne' && '1' || '' }}
      E2E_ANTHROPIC_KEY: ${{ secrets.E2E_ANTHROPIC_KEY }}
      E2E_OPENAI_KEY: ${{ secrets.E2E_OPENAI_KEY }}   # the OpenAI family's turn (odd runs; desktop/e2e/lib/engine.mjs pickFamily)
      E2E_AI_FAMILY: ${{ (inputs.family == 'claude' || inputs.family == 'openai') && inputs.family || '' }}   # a manual run pinned to one family; else alternate
      # The store under test (lib/store.mjs pickStore): the gate's two jobs per suite pin one store each (plan-run.mjs legs); any other run alternates on bit 1 of the
      # run number (beside the AI family's bit 0), unless a run by hand pins one.
      E2E_STORE: ${{ matrix.store || (inputs.pr_suites != '' && 'sqlite') || (inputs.store != 'alternate' && inputs.store) || 'alternate' }}   # a pull request: the store its picked steps were recorded on (plan-run.mjs), else SQLite; both are fresh per run
      E2E_NOTION_TOKEN: ${{ secrets.E2E_NOTION_TOKEN }}
      E2E_NOTION_TOKEN_FAILURESNOTION: ${{ secrets.E2E_NOTION_TOKEN_FAILURESNOTION }}
      E2E_NOTION_TOKEN_FAILURESCHANNELS: ${{ secrets.E2E_NOTION_TOKEN_FAILURESCHANNELS }}
      E2E_NOTION_TOKEN_JOBS: ${{ secrets.E2E_NOTION_TOKEN_JOBS }}
      E2E_NOTION_TOKEN_INTERVIEWS: ${{ secrets.E2E_NOTION_TOKEN_INTERVIEWS }}
      E2E_NOTION_TOKEN_SETTINGS: ${{ secrets.E2E_NOTION_TOKEN_SETTINGS }}
      E2E_NOTION_TOKEN_PERSONAS: ${{ secrets.E2E_NOTION_TOKEN_PERSONAS }}
      E2E_NOTION_TOKEN_EMPLOYERS: ${{ secrets.E2E_NOTION_TOKEN_EMPLOYERS }}
      E2E_NOTION_TOKEN_CALENDAR: ${{ secrets.E2E_NOTION_TOKEN_CALENDAR }}
      E2E_NOTION_TOKEN_FOCUS: ${{ secrets.E2E_NOTION_TOKEN_FOCUS }}
      E2E_NOTION_TOKEN_FOCUSDISMISS: ${{ secrets.E2E_NOTION_TOKEN_FOCUSDISMISS }}
      E2E_NOTION_TOKEN_APPLY: ${{ secrets.E2E_NOTION_TOKEN_APPLY }}
      E2E_NOTION_TOKEN_ACTIVITY: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITY }}
      E2E_NOTION_TOKEN_ACTIVITYFAILURES: ${{ secrets.E2E_NOTION_TOKEN_ACTIVITYFAILURES }}
      E2E_NOTION_TOKEN_STRATEGY: ${{ secrets.E2E_NOTION_TOKEN_STRATEGY }}
      E2E_NOTION_TOKEN_QUALITY: ${{ secrets.E2E_NOTION_TOKEN_QUALITY }}
      E2E_NOTION_TOKEN_INTERACTIONS: ${{ secrets.E2E_NOTION_TOKEN_INTERACTIONS }}
      E2E_NOTION_TOKEN_WANDER: ${{ secrets.E2E_NOTION_TOKEN_WANDER }}
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.key }}
      # A pull request runs only the steps its changed lines reach (owner, 26 Oct 2026: "not even an entire e2e suite, but just few tests/scenarios/cases"; lib/runner.mjs).
      E2E_STEP_NAMES: ${{ inputs.pr_steps != '' && toJSON(fromJSON(inputs.pr_steps)[matrix.suite]) || '' }}
      E2E_FALLBACK_SUITES: ${{ matrix.fallbackSuites }}
      E2E_FALLBACK_SUITE: ${{ matrix.suite }}
      JP_REPLAY_SHARD: ${{ matrix.shard }}   # a sharded suite's slice (lib/suite-shards.mjs: the recorded replay, 13 Oct 2026); empty: the whole suite
      # AI cost (7 Oct 2026: the e2e key billed ~$10 a day, mostly unseen). Only the scheduled runs ask the model live; every other run (gates, soaks, the canary, reruns,
      # by hand) answers a request it has seen before from the replay cache, and pays only for new ones (lib/ai-meter.mjs). Every judge runs on Haiku, the quality
      # suite's too since 27 Oct 2026 (its verdicts keep their inputs, so Sonnet can re-judge the same texts offline).
      E2E_AI_CACHE: ${{ github.workspace }}/desktop/e2e/.ai-cache
      E2E_AI_REPLAY: ${{ matrix.suite == 'qualityai' && '0' || '1' }}   # qualityai asks live; every other suite keeps its existing replay path
      E2E_JUDGE_MODEL: claude-haiku-5-5   # every suite's judge, quality too (owner, 27 Oct 2026: "let's do")
      # Why (29 Oct 2026, owner-approved design rule A): quality uses reviewed question answers, never strict hash replay.
      E2E_QUALITY_PARTS: ${{ matrix.suite == 'qualityai' && toJSON(matrix.qualityParts) || '' }}
      E2E_QUALITY_HISTORY: ${{ matrix.suite == 'qualityai' && format('{0}/desktop/e2e/.quality-rate/history.json', github.workspace) || '' }}   # lib/quality-rate.mjs
      # Why (30 Oct 2026, owner via a8, design D/E): pr-suites dispatches report old nights; after-merge, nightly and beta runs still judge them.
      E2E_QUALITY_JUDGE_HISTORY: ${{ inputs.pr_suites && inputs.after_merge == '' && '0' || '1' }}
      E2E_BLOB_DIR: ${{ github.workspace }}/blob-report   # the suite's part of the run's HTML report (the report job merges them)
      E2E_RUN_KIND: ${{ inputs.gate_tag && 'gate' || '' }}   # how an issue names the run (lib/replay.mjs): a gate in a scheduled release run is not a three-a-day run
      CI_FREE_AI_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}   # Why (28 Oct 2026, beta 3): the cap's account and token (lib/ai-cap.mjs) were set only on the AI preflight, so every suite step read an "unreadable" count, took the AI as capped and failed its AI steps (failureschannels, focusdismiss, ...). They belong to the job that runs the suites. Guard: tests/test_ci_free_ai.py
      CI_CF_ANALYTICS_TOKEN: ${{ secrets.CI_CF_ANALYTICS_TOKEN }}
      CI_AI_PROVIDER: ${{ vars.CI_AI_PROVIDER }}   # the global AI switch for the judges: codex | claude | free, empty = free (lib/ai-provider.mjs; owner, 28 Oct 2026); E2E_AI_PROVIDER overrides it for one run
      E2E_AI_PROVIDER: ${{ inputs.ai_provider }}   # one run's choice from the dispatch input (empty = CI_AI_PROVIDER decides)
      JOB_PILOTTO_E2E_EXPECTS_FAILURES: ${{ inputs.mutant && '1' || '' }}   # a mutant run breaks the app on purpose: its crash reports are tagged expected, so the Sentry loop ignores them
      E2E_SEED: ${{ (inputs.fixed || inputs.canary || inputs.soak || inputs.gate_tag || inputs.mutant) && '0' || github.run_id }}   # a different path in every scheduled, top-up or manual run; the release gate, the soak top-ups (their three green runs must be comparable) and the stable canary walk the fixed one (lib/variation.mjs)
      # Which app lines the suite runs (gate G1b, owner's yes 26 Oct 2026; lib/coverage.mjs): main checks, a PR's suites and runs by hand of the newest code, never a release,
      # mutant or bisect (an old commit, timing that matters). Only main's scheduled runs feed the map a PR's plan reads (the coverage-map job below); a PR's files are kept
      # 7 days to compare with main's (pr-suites.mjs --map) and to measure what recording costs.
      E2E_COVERAGE: ${{ !inputs.gate_tag && !inputs.release_run && !inputs.mutant && !inputs.target_ref && !inputs.canary && !inputs.soak && !inputs.bisect && '1' || '' }}
      E2E_COVERAGE_SHA: ${{ needs.plan.outputs.ref }}   # the commit the suite ran: a PR's diff is taken from it
      E2E_FULL: ${{ needs.plan.outputs.over != 'true' && (inputs.gate_tag || (github.event_name == 'workflow_dispatch' && !inputs.canary && !inputs.soak && !inputs.mutant && !inputs.scheduled && !inputs.bisect)) && '1' || '' }}   # the paid AI judge steps: the nightly gate and manual runs only
    permissions:
      contents: write   # tools/e2e-lock.sh creates the lock ref
      issues: read      # the screenshot review reads its by-design lessons from the closed issues (lib/review-lessons.mjs)
      id-token: write   # GitHub's per-run token the Codex broker checks (lib/broker-client.mjs); a fork run gets none and cannot spend the owner's plan
      actions: read     # the commit's runs and jobs, for that verdict
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          ref: ${{ needs.plan.outputs.ref }}   # a push or a schedule: that commit; the run after a build: the build's own commit
      # Waits for the suite's lock instead of queueing in a concurrency group (GitHub keeps ONE waiting job per group and cancels the older one: beta 14, 24 Oct 2026).
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          ref: ${{ github.sha }}
          path: lock-tools
          sparse-checkout: tools/e2e-lock.sh
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: '3.12'
      # The relay comes from this workflow's own commit: a bisect or a soak checks out an older commit above, which may have no relay (26 Oct 2026: every bisect
      # failed with "Can't find 'action.yml'"). Guard: tests/test_ci_free_ai.py test_no_job_loads_a_local_action_from_another_commit.
      # Why (29 Oct 2026, owner): offline suites need neither the relay checkout nor its GitHub App and Cloudflare credentials.
      - name: The Free AI relay from this workflow's own commit
        if: matrix.offlineAi != true
        timeout-minutes: 5
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .ci-relay
          persist-credentials: false
      - name: Free AI relay (CI's AI since 26 Oct 2026; the site's handler on this runner, CI's own Workers AI token)
        if: matrix.offlineAi != true
        timeout-minutes: 5
        uses: ./.ci-relay/.github/actions/free-ai-relay
        with:
          public-tree: .ci-relay
          cf-token: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          cf-account: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          app-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Record which commit this run tested (ui-findings.yml names it in every issue)
        timeout-minutes: 5
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          printf '%s %s\n' "${{ inputs.target_ref || github.ref_name }}" "$(git rev-parse HEAD)" > "$E2E_ARTIFACTS/tested.txt"
      - name: Install the app
        timeout-minutes: 5
        working-directory: desktop
        run: npm ci
      - name: Install the tests
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: npm ci || npm install
      - name: Chromium for the suites that use a browser (the real extension, the extension's page code)
        timeout-minutes: 5
        working-directory: desktop/e2e
        # A suite says it needs one: `export const browser = true` (the app's extension browser) or `export const needsChromium = true` (a plain Chromium).
        run: |
          if grep -qE '^export const (browser|needsChromium) = true' "suites/${{ matrix.suite }}.mjs"; then npx playwright-core install chromium; else echo "no browser needed"; fi
      - name: Python packages the engine needs
        timeout-minutes: 5
        run: pip install --quiet -r requirements.txt
      - name: A virtual display and Electron's libraries (Linux only)
        timeout-minutes: 5
        if: runner.os == 'Linux'
        run: bash tools/apt-install.sh xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1 fonts-noto-color-emoji fonts-dejavu-core
      - name: Write the mutant into the app (mutation test only)
        if: inputs.mutant != '' && inputs.mutant != 'baseline'
        timeout-minutes: 10
        env:
          MUTANT: ${{ inputs.mutant }}
        run: node desktop/e2e/mutate.mjs "$MUTANT"
      - name: Earlier AI answers (replayed instead of paid again; lib/ai-meter.mjs)
        if: env.E2E_ANTHROPIC_KEY != ''
        timeout-minutes: 5
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-answers-${{ matrix.key }}-
      # Main cannot read a PR's cache: after a merge, the merged PR's own green answers are laid over main's, so main asks what its PR asked and replays what the PR
      # was green on (27 Oct 2026: #2180 green on its PR with 0 misses; main restored an older cache, asked 8 questions live and went red). desktop/e2e/pr-answers.mjs.
      - name: The merged PR's own AI answers (after a merge)
        if: inputs.after_merge != '' && env.E2E_ANTHROPIC_KEY != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          MERGED: ${{ inputs.after_merge }}
          KEY: ${{ matrix.key }}
        run: node desktop/e2e/pr-answers.mjs "$MERGED" "$KEY" desktop/e2e/.ai-cache
      # The lock is taken as late as possible (after the installs, which never touch the suite's Notion page): a waiting job holds its runner.
      - name: The score-steadiness history of the night's live qualityai runs (lib/quality-rate.mjs)
        timeout-minutes: 5
        # Owner, 27 Oct 2026 ("Code gate + AI rate"): "same scores twice" is a rate over the last 90 pairs, red below 80% within 8 points or above 2% more than 20 apart.
        if: matrix.suite == 'qualityai'
        uses: actions/cache/restore@v5
        with:
          path: desktop/e2e/.quality-rate
          key: quality-rate-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: quality-rate-
      - name: The App token for the lock (a re-run attempt's workflow token cannot create refs)
        timeout-minutes: 5
        id: lock_app
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Take the suite's lock (only a suite on the real Notion workspace; waits, never dropped)
        timeout-minutes: 185
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh acquire "${{ matrix.key }}"
      - name: Run the ${{ matrix.key }} suite (first try)
        id: suite_run
        env:
          E2E_TRY_MINUTES: 15   # = this step's timeout-minutes: a suite without an aggregate budget stops 4 min before it (its close-down cap + 1), with records that read as timing (lib/runner.mjs budgetMsOf; tests/test_e2e_try_minutes.py)
          # Why (30 Oct 2026, ap; owner-approved rule A and burn-in): admission uses stored answers; manual first attempts may record; a suite that declares aiAnswers as backbone (plan-run.mjs puts it in matrix.aiAnswers) otherwise uses backbone answers on both tries without live AI.
          E2E_AI_ANSWERS: ${{ matrix.burnIn && 'backbone' || github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.ai_answers == 'record' && 'record' || matrix.aiAnswers || 'off' }}
          PR_RUN: ${{ inputs.pr_suites != '' && inputs.after_merge == '' && '1' || '' }}   # a report-only suite skips its retry on a PR only; main, nightly and gate runs keep it
        # A red first run is not the verdict (owner, 6 Oct 2026): the step below runs the suite once more on the same commit and decides. Flaky (red, then green)
        # passes the job and is filed and labelled `flaky`; red twice fails it. A mutation test has no second try: its red means the bug was caught.
        # Why (2026-10-29, owner): a burn-in leg must pass its first attempt; retries cannot turn a flip into admission.
        continue-on-error: ${{ !inputs.mutant && !matrix.burnIn }}
        working-directory: desktop/e2e
        timeout-minutes: 15   # the suite stops itself at its budget (7 min, recorded 11: lib/runner.mjs) with its evidence, by force 3 min later (suite.mjs); this catches only a suite that cannot
        run: |
          report_only=0
          if [ -n "${PR_RUN:-}" ]; then
            report_only=$(SUITE='${{ matrix.suite }}' node -e 'try { const entry = JSON.parse(require("node:fs").readFileSync("lanes.json", "utf8")).suites?.[process.env.SUITE]; process.stdout.write(entry?.lane === "tolerant" && entry.pr === "number" ? "1" : "0"); } catch { process.stdout.write("0"); }' 2>/dev/null) || report_only=0
          fi
          echo "report_only=${report_only:-0}" >> "$GITHUB_OUTPUT"
          # A run on an older commit (target_ref: the stable canary, a release candidate) plans with main's suite list; a suite added since does not exist in that build.
          if [ ! -f "suites/${{ matrix.suite }}.mjs" ]; then echo "The ${{ matrix.suite }} suite does not exist in this build: skipped."; exit 0; fi
          # A red first try shows as an error (GitHub draws a continue-on-error step green; owner, 26 Oct 2026); the next step decides (tests/test_first_try_visible.py).
          once() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs "$1"; else node suite.mjs "$1"; fi; }
          # Only a reserved suite may fall back on a renamed pick (red-steps.mjs); the same cap guards the retry below.
          once ${{ matrix.suite }} || { [ -n "${E2E_STEP_NAMES:-}" ] && node red-steps.mjs --renamed-only "$E2E_ARTIFACTS/suite-failures.json" \
              && echo "::notice title=Picked step renamed::A step picked for this PR has a new name: the whole ${{ matrix.key }} suite runs now" && unset E2E_STEP_NAMES && once ${{ matrix.suite }}; } \
            || { echo "::error title=First try failed::The ${{ matrix.key }} suite failed its first try; burn-in admits only 5/5 first tries, other suites retry below"; exit 1; }
      # Flaky or real? A red suite runs once more on the same commit (6 Oct 2026); red twice fails the job. A pass the second time passes it only with proof (gate G5,
      # flaky-proof.mjs): every first-try failure was timing or the test's environment. A wrong value that came right keeps it red: a bug that shows sometimes (#1897).
      # Either way the pass writes the marker beside the first run's artifacts, and triage labels those steps `flaky` or `intermittent`. Its own artifacts stay out of the upload.
      # Why (#2497, Gitar): a report-only suite is not retried (each run costs AI), but its failed first try must still leave the job red; the verdict ignores this job via BASE's lane entry.
      - name: "Report-only ${{ matrix.key }} failed its only try (not retried: each run costs AI)"
        timeout-minutes: 5
        if: steps.suite_run.outcome == 'failure' && !inputs.mutant && steps.suite_run.outputs.report_only == '1'
        run: exit 1
      - name: "First try failed: the ${{ matrix.key }} suite once more, to tell flaky from real"
        if: steps.suite_run.outcome == 'failure' && !inputs.mutant && !matrix.burnIn && steps.suite_run.outputs.report_only != '1' && matrix.tolerant != true
        env:
          E2E_TRY_MINUTES: 15   # = this step's timeout-minutes: a suite without an aggregate budget stops 4 min before it (its close-down cap + 1), with records that read as timing (lib/runner.mjs budgetMsOf; tests/test_e2e_try_minutes.py)
          # Why (30 Oct 2026, ap): a backbone suite's retry uses the same stored answers as its first attempt (matrix.aiAnswers), never a UUID-dependent live replay.
          E2E_AI_ANSWERS: ${{ matrix.aiAnswers || 'off' }}
        working-directory: desktop/e2e
        timeout-minutes: 15
        run: |
          set -o pipefail   # flaky-proof.mjs | tee: the proof's exit decides (tests/test_workflow_pipefail.py)
          first="$E2E_ARTIFACTS"
          if steps=$(node flaky-proof.mjs --grey "$first/suite-failures.json"); then
            echo "::warning title=Grey: the runner%2C not the app::${{ matrix.key }}: $steps"
            echo "grey=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Why (31 Oct 2026, owner): backbone retries use the same saved answers; only tolerant lanes may draw fresh AI (wizard run 41163541081).
          export E2E_ARTIFACTS="${{ github.workspace }}/e2e-rerun/${{ matrix.key }}" E2E_RERUN=1 E2E_AI_REPLAY=1   # same stored table as the first try; a second try writes no HTML report (report/playwright.config.mjs)
          again() { if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a --server-args='-screen 0 1440x900x24' node suite.mjs "$1"; else node suite.mjs "$1"; fi; }
          # Why (#2199): the retry repeats only the first try's red steps and their setup (owner, 27 Oct 2026: "Retry only the red steps"; red-steps.mjs). Main's quality on
          # 27 Oct 2026 had one red step, then a whole-suite retry ran out of the 7-minute budget. No step to name (a crash, a renamed pick) or a build without red-steps.mjs (an older tag: stable canary 40503508863): the whole suite.
          red=; [ ! -f red-steps.mjs ] || red=$(node red-steps.mjs "$first/suite-failures.json")
          if [ -n "$red" ]; then export E2E_STEP_NAMES="$red"; echo "The second try repeats only the red step(s) and their setup: $red"; else unset E2E_STEP_NAMES; echo "The second try runs the whole suite (no red step to name)."; fi
          if again ${{ matrix.suite }}; then
            echo '{"rerun": "passed"}' > "$first/flaky.json"
            # "Flaky" needs proof (gate G5): a first-try failure on a wrong value, not timing, is a bug that shows sometimes; the job stays red (lib/flaky-proof.mjs).
            if node flaky-proof.mjs "$first/suite-failures.json"; then
              echo "Passed on the second try, and every failure of the first was timing or the test's environment: flaky (labelled by triage)."
            else
              exit 1
            fi
          else
            if steps=$(node flaky-proof.mjs --grey "$first/suite-failures.json" "$E2E_ARTIFACTS/suite-failures.json"); then
              echo "::warning title=Grey: the runner%2C not the app::${{ matrix.key }}: both tries stopped on time only ($steps); the release gate checks it once on a fresh runner"
              echo "grey=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Failed again on the same commit: a real failure."
            exit 1   # a wrong value or harness guard stays red
          fi
      - name: Outside-world health
        if: always() && matrix.tolerant == true
        timeout-minutes: 5
        env:
          OUTCOME: ${{ steps.suite_run.outcome }}
        run: |
          echo "::notice title=Outside-world health::${{ matrix.key }}: $OUTCOME (tolerant; does not block beta). Steps, screenshots and failures are in the Mac HTML report and e2e-artifacts-${{ matrix.key }}."
      - name: AI answer candidates written for review
        if: always() && github.event_name == 'workflow_dispatch' && github.run_attempt == 1 && inputs.ai_answers == 'record'
        timeout-minutes: 10
        shell: bash
        run: |
          candidates=0
          if [ -d "$E2E_ARTIFACTS" ]; then
            candidates=$(find "$E2E_ARTIFACTS" -type f \( -name 'ai-answers-candidates.json' -o -name 'ai-answers-item-*.json' \) | wc -l | tr -d '[:space:]')
          fi
          echo "AI answers: record run · ${{ matrix.key }} · $candidates candidate file(s) written (in the e2e-artifacts-${{ matrix.key }} artifact)."
      # Why (29 Oct 2026, owner): an offline suite must not contact even the relay's usage meter.
      - name: What the suite spent on Free AI (the relay's own meter)
        if: always() && matrix.offlineAi != true && env.E2E_FREE_AI_URL != ''
        timeout-minutes: 5
        continue-on-error: true   # a report never decides a run
        shell: bash
        run: |
          spent="$(curl -s -m 10 "${E2E_FREE_AI_URL%/api/ai}/__report" || echo '{}')"
          echo "Free AI (Workers AI) this suite: $spent"
          echo "$spent" > "$E2E_ARTIFACTS/free-ai-spend.json" || true
      - name: Report what the suite paid for AI to /ai-cost (the app under test and the judges)
        if: always() && env.E2E_ANTHROPIC_KEY != ''
        timeout-minutes: 5
        continue-on-error: true   # a report never decides a run
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
        run: |
          for kind in app app-openai judges; do   # app-openai: the app under test on an OpenAI engine (odd runs), shown under OpenAI on /ai-cost
            for dir in "$E2E_ARTIFACTS" "${{ github.workspace }}/e2e-rerun/${{ matrix.key }}"; do
              file="$dir/ai-usage-$kind.json"; [ -f "$file" ] || continue
              tag=""; case "$dir" in *rerun*) tag="-rerun";; *apply-edge*) tag="-edge";; esac
              job="e2e-$kind"; provider=anthropic
              if [ "$kind" = app-openai ]; then job=e2e-app; provider=openai; tag="$tag-openai"; fi
              node desktop/e2e/ai-cost-report.mjs --job "$job" --suffix "${{ matrix.key }}$tag" --file "$file" --provider "$provider"
            done
          done
      - name: Keep the AI answers for the next run
        timeout-minutes: 5
        if: always() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        run: find desktop/e2e/.ai-cache -name '*.json' -mtime +7 -delete   # an answer not replayed for a week is dropped (a replay touches it)
      - if: success() && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != ''
        timeout-minutes: 5
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.ai-cache
          key: ai-answers-${{ matrix.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Keep the score-steadiness history, red or green (the night's live qualityai run on main)
        if: always() && matrix.suite == 'qualityai' && env.E2E_AI_REPLAY != '1' && github.ref == 'refs/heads/main' && hashFiles('desktop/e2e/.quality-rate/history.json') != ''
        timeout-minutes: 10
        uses: actions/cache/save@v5
        with:
          path: desktop/e2e/.quality-rate
          key: quality-rate-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_1
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            desktop/e2e/.ai-cache
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: Hand this PR's green AI answers to main's run after the merge (desktop/e2e/pr-answers.mjs)
        if: (success() && inputs.pr_suites != '' && inputs.after_merge == '' && env.E2E_ANTHROPIC_KEY != '' && hashFiles('desktop/e2e/.ai-cache/*.json') != '') && steps.artifact_scan_1.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: ai-answers-${{ matrix.key }}
          path: desktop/e2e/.ai-cache
          include-hidden-files: true   # .ai-cache is a hidden folder: without this the artifact is empty
          retention-days: 7
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_2
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            blob-report
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: The suite's part of the HTML report
        if: (always()) && steps.artifact_scan_2.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: blob-${{ matrix.key }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 3
      # Steps and a failed suite's trace as data (the /admin/e2e runs page that read them was dropped on 15 Oct 2026; the artifact stays for download).
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_3
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts/${{ matrix.key }}/steps.json
            e2e-artifacts/${{ matrix.key }}/trace-*.zip
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: Steps and trace for /admin/e2e
        if: (always()) && steps.artifact_scan_3.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: e2e-view-${{ matrix.key }}
          path: |
            e2e-artifacts/${{ matrix.key }}/steps.json
            e2e-artifacts/${{ matrix.key }}/trace-*.zip
          compression-level: 0
          if-no-files-found: ignore
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_4
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts/${{ matrix.key }}/coverage-*.json
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: Which app lines the suite ran (the code → suite map)
        if: (always() && env.E2E_COVERAGE == '1') && steps.artifact_scan_4.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: e2e-coverage-${{ matrix.key }}
          path: e2e-artifacts/${{ matrix.key }}/coverage-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_5
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-artifacts/${{ matrix.key }}
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: Screenshots and timings
        if: (always()) && steps.artifact_scan_5.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: e2e-artifacts-${{ matrix.key }}
          path: e2e-artifacts/${{ matrix.key }}
          if-no-files-found: ignore
      # The second try writes its own folder (e2e-rerun): without this upload its logs reached no one and a retry's own failure could not be read
      # (#2087's quality run 40340783596, 26 Oct 2026). Guard: tests/test_e2e_artifacts_uploaded.py.
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_6
        if: always()
        shell: bash
        env:
          AI_COST_PUBLISH_KEY: ${{ secrets.AI_COST_PUBLISH_KEY }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app.outputs.token || github.token }}
          FREE_AI_LOCAL_CF_ACCOUNT_ID: ${{ secrets.CI_FREE_AI_CF_ACCOUNT_ID }}
          FREE_AI_LOCAL_CF_AI_TOKEN: ${{ secrets.CI_FREE_AI_CF_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            e2e-rerun/${{ matrix.key }}
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - name: The second try's screenshots and logs
        if: (always()) && steps.artifact_scan_6.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: e2e-rerun-${{ matrix.key }}
          path: e2e-rerun/${{ matrix.key }}
          if-no-files-found: ignore
      - name: The App token to give the lock back (the first one may have expired)
        timeout-minutes: 5
        id: lock_app_end
        if: always()
        continue-on-error: true   # a failed mint falls back to the workflow token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Give the suite's lock back
        if: always()
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_LOCK_TOKEN: ${{ steps.lock_app_end.outputs.token }}
        run: bash lock-tools/tools/e2e-lock.sh release "${{ matrix.key }}"

  # Nothing tested is never green (gate G7, owner's yes 26 Oct 2026). A scheduled run on main that planned no suite (a release run was testing, the commit's looks were
  # used up, nothing varies) used to end green: on 25 Oct the 23:33 and 23:47 runs skipped while beta 2 ran and read as a green main. It now says why and ends CANCELLED
  # (grey). plan-run.mjs counts only green or red runs as tested, so the next scheduled run tests this commit. Never in a gate (gate_tag): there it would cancel a release.
  # The AI screenshot review: every suite's pages in ONE Claude batch, after the suites (.github/actions/e2e-review; owner, 26 Oct 2026: "cut the costs in half, but close to the same quality as Claude").
  review:
    name: AI review of the screenshots
    needs: [plan, suite]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' && needs.plan.outputs.review == '1' && inputs.mutant == '' && inputs.pr_suites == ''   # a PR's run has no screenshot review
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # the batch waits up to 6 min, then asks what is left directly
    permissions:
      contents: read
      issues: read    # the by-design lessons come from the closed issues (lib/review-lessons.mjs)
      actions: read   # this run's suite artifacts
      id-token: write   # GitHub's per-run token the Codex broker checks (lib/broker-client.mjs)
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        ACTIONS_ID_TOKEN_REQUEST_TOKEN
        AI_COST_PUBLISH_KEY
        E2E_ANTHROPIC_KEY
        GH_TOKEN
        GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - uses: ./.github/actions/e2e-review
        timeout-minutes: 18
        with:
          lane: mac
          anthropic-key: ${{ secrets.E2E_ANTHROPIC_KEY }}
          provider: ${{ inputs.ai_provider || vars.CI_AI_PROVIDER }}
          publish-key: ${{ secrets.AI_COST_PUBLISH_KEY }}
          github-token: ${{ github.token }}

  nothing-tested:
    name: Nothing tested
    needs: plan
    if: needs.plan.outputs.count == '0' && !inputs.gate_tag && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.scheduled)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # cancel this run
    steps:
      - name: Say why, then end the run grey, not green
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          WHY: ${{ needs.plan.outputs.why }}
        run: |
          echo "### ⊘ Nothing tested on ${GITHUB_SHA:0:7}: ${WHY:-no suite was planned}"
          echo "This run ends cancelled so it never reads as a green e2e check; the next scheduled run tests this commit."
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          sleep 120   # the cancel lands while this step waits

  # One Playwright HTML report for the run (6 Oct 2026): every suite wrote a blob (desktop/e2e/report/playwright.config.mjs); merged here, uploaded as e2e-report
  # (uncompressed: the owner's site serves its files straight from the artifact, admin/e2e-report.js) and its link printed in the merge step's log.

  report:
    name: HTML report
    needs: [plan, suite]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/merge-e2e-report.sh
            tools/scan-e2e-artifacts.py
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - uses: actions/download-artifact@v7
        timeout-minutes: 5
        with:
          pattern: blob-*
          path: blob-reports
          merge-multiple: true
      - name: Merge the suites into one HTML report
        timeout-minutes: 5
        id: merge
        working-directory: desktop/e2e
        run: |
          npm ci || npm install
          # A report never decides the run: a corrupt blob is left out and named, a failed merge is said, the job stays green (tools/merge-e2e-report.sh)
          bash "$GITHUB_WORKSPACE/tools/merge-e2e-report.sh" "$GITHUB_WORKSPACE/blob-reports" "$GITHUB_WORKSPACE/e2e-report"
          if grep -q "^made=1" "$GITHUB_OUTPUT"; then echo "HTML report (admins): https://www.jobpilotto.top/admin/operations/e2e/run/${{ github.run_id }}/report"; fi
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_7
        if: always()
        shell: bash
        env:
          E2E_ARTIFACT_PATHS: |
            e2e-report
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - uses: actions/upload-artifact@v6
        if: (steps.merge.outputs.made == '1') && steps.artifact_scan_7.outcome == 'success'
        timeout-minutes: 5
        with:
          name: e2e-report
          path: e2e-report
          compression-level: 0

  # The code → suite map (gate G1b, owner's yes 26 Oct 2026): after a main check, the suites' coverage files are laid over the previous map (a suite this run did
  # not test keeps its entry) and kept as the artifact e2e-coverage-map, which a PR's plan downloads (desktop/e2e/pr-suites.mjs). Why: on 25 Oct #1911 changed
  # menu.css and broke interactions, #1913 changed the run views and broke cardstates; neither PR ran that suite, because file names do not say which suite runs a line.
  # After each merge too (owner's yes 26 Oct 2026, "keep it fresh after each merge"): an after-merge run refreshes the steps it ran and moves the others to its
  # commit by the git diff (lib/coverage-pick.mjs mergeMap), so the full history is fetched (trees and blobs on demand). One at a time: two would each read the same
  # previous map and the later upload would drop the other's steps.
  coverage-map:
    name: Code → suite map
    needs: [plan, suite]
    if: always() && needs.plan.outputs.count != '0' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.scheduled || inputs.after_merge != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: e2e-coverage-map
      cancel-in-progress: false
    permissions:
      actions: read   # the previous map
      contents: read
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        GH_TOKEN
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/scan-e2e-artifacts.py
          fetch-depth: 0
          filter: blob:none
      - uses: actions/download-artifact@v7
        timeout-minutes: 5
        with:
          pattern: e2e-coverage-*
          path: coverage
      - name: The previous map
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-coverage-map&per_page=1" --jq '.artifacts[0].workflow_run.id // empty' || true)
          if [ -n "$id" ]; then gh run download "$id" -n e2e-coverage-map -D previous || echo "previous map not read: starting a new one"; else echo "no map yet: starting one"; fi
      - name: Merge this run's coverage into the map
        timeout-minutes: 5
        working-directory: desktop/e2e
        run: |
          set -o pipefail
          prev=(); [ -f "$GITHUB_WORKSPACE/previous/coverage-map.json" ] && prev=(--previous "$GITHUB_WORKSPACE/previous/coverage-map.json")
          node coverage-map.mjs --artifacts "$GITHUB_WORKSPACE/coverage" "${prev[@]}" --repo "$GITHUB_WORKSPACE" --out "$GITHUB_WORKSPACE/map/coverage-map.json"
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        working-directory: ${{ github.workspace }}
        id: artifact_scan_8
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          E2E_ARTIFACT_PATHS: |
            map/coverage-map.json
        run: python "$GITHUB_WORKSPACE/tools/scan-e2e-artifacts.py"
      - uses: actions/upload-artifact@v6
        if: steps.artifact_scan_8.outcome == 'success'
        timeout-minutes: 5
        with:
          name: e2e-coverage-map
          path: map/coverage-map.json
          retention-days: 30

  # Telegram (owner, 14 Oct 2026): a scheduled or gate run that failed sends 🔴 with the failed suites; the first green one after a failure sends 🟢
  # (desktop/e2e/ci-alert.mjs, bot @jobpilotto_ci_alerts_bot). Not for runs by hand of other kinds (a mutant, a canary, a soak).
  alert:
    name: Telegram alert
    needs: [plan, suite]
    if: always() && github.ref == 'refs/heads/main' && (inputs.scheduled || inputs.gate_tag || github.event_name == 'schedule' || inputs.after_merge != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write   # start e2e-bisect.yml for a new red suite (tools/e2e_bisect.py)
      issues: write    # the red-main issues
      checks: read     # the failed steps' annotations the alert quotes (ci-alert.mjs stepCauses; review on #2249)
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            desktop/e2e
            tools
      - name: Tell the owner (a failure, or back to green)
        timeout-minutes: 5
        # Why (owner, 27 Oct 2026, via the coordinator): a run cancelled by hand is no failure; it sent "🔴 … the estimate is above the cap, or the key is missing" (refill 40451220954). cancelled() is the run's own cancel, never a job's timeout. Also (27 Oct 2026, coordinator): a by-hand run on a PR branch alerted the owner (harness-daily 40457998294), so a dispatch on a branch other than main sends none; a tag (the gate) and main still do. Guard: tests/test_ci_alert_cancel.py.
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || !startsWith(github.ref, 'refs/heads/') || github.ref == 'refs/heads/main') }}
        working-directory: desktop/e2e
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
          CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
          RESULT: ${{ needs.plan.result == 'success' && needs.suite.result || needs.plan.result }}
          AFTER_MERGE: ${{ inputs.after_merge }}
        run: |
          if [ "$RESULT" = failure ] || { [ "$RESULT" = cancelled ] && [ -z "$AFTER_MERGE" ]; }; then   # after a merge, a newer merge cancels the waiting job: not a red
            node ci-alert.mjs failure   # the alert's own link opens the failed job (owner's short shape, 30 Oct 2026)
          elif [ -z "$AFTER_MERGE" ]; then node ci-alert.mjs success; fi   # a few green steps after a merge never say main is green again
      # A red on main gets an owner (gate G2b, owner's yes 26 Oct 2026): each red suite with no open `red-main` issue is bisected to its breaking PR (e2e-bisect.yml),
      # and the issue of a suite this run passed is closed. Not for a release gate (it tests a release, and its reds are the beta's).
      - name: Own the red (bisect new reds, close the ones green again)
        if: ${{ !inputs.gate_tag }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          AFTER_MERGE: ${{ inputs.after_merge }}
        run: if [ -n "$AFTER_MERGE" ]; then python3 tools/e2e_bisect.py after-merge "$GITHUB_RUN_ID"; else python3 tools/e2e_bisect.py after-run "$GITHUB_RUN_ID"; fi   # after a merge: silent here; e2e-revert.yml owns the retry and revert

  # The release step of a gate by hand (gh workflow run e2e.yml -f gate_tag=<tag>): beta-approve.yml, the same job the release run (desktop.yml) shows as its own
  # "Release · Mac beta" step after "E2E · Mac + Linux" (release_run: not here, so it is not done twice).
  promote:
    needs: [plan, suite]
    if: needs.plan.outputs.tag != '' && needs.suite.result == 'success' && !inputs.release_run
    permissions:
      contents: write
      actions: write   # beta-approve.yml's release-stable.sh starts the Chrome Web Store publish
      issues: write
    uses: ./.github/workflows/beta-approve.yml
    with:
      platform: mac
      tag: ${{ needs.plan.outputs.tag }}
      sha: ${{ needs.plan.outputs.ref }}

  windows:
    # The same suites on Windows (e2e-windows.yml), started here only when this run tested something, so Windows never runs empty; it skips a commit it
    # has already tested. A canary, a soak or a promotion dry run is not repeated on Windows. After a gate by hand it is the Windows beta gate (approve-windows), started
    # whatever this run's result. In the release run (release_run) the Windows gate is the release run's own "E2E · Windows" job: nothing to start here.
    name: Windows follows
    needs: [plan, suite]
    # Windows only for the release gate, a gate by hand and main's checks (6 Oct 2026): a push run's Windows jobs held runner slots (20 at once, shared) while
    # the next run's Mac + Linux suites waited. Main's checks start Windows once a UTC day (gate G4, owner's yes 26 Oct 2026): the Worker's on-time runs
    # (inputs.scheduled) are main's checks since 5 Oct, and this job looked only for GitHub's backup schedule, so from 17 Oct Windows ran only inside betas
    # and beta 2 (25 Oct) met its Windows reds (cardstates, foryou) there first.
    if: always() && needs.plan.outputs.count != '0' && !inputs.release_run && !inputs.canary && !inputs.soak && !inputs.mutant && !inputs.bisect && (github.event_name == 'schedule' || inputs.scheduled || inputs.gate_tag)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the Windows run on this commit
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          FULL: ''   # no paid AI judge on Windows: the Mac run judged the same screens (owner, 7 Oct 2026: "$30 a week")
          GATE: ${{ inputs.gate_tag }}
        run: |
          # A main check starts Windows once a UTC day: the first one that tested something. A gate always starts it.
          if [ -z "$GATE" ]; then
            today=$(date -u +%Y-%m-%d)
            ran=$(gh run list --repo "${{ github.repository }}" --workflow e2e-windows.yml --branch main --limit 30 --json createdAt,displayTitle \
              --jq "[.[] | select(.createdAt >= \"${today}T00:00:00Z\" and (.displayTitle | startswith(\"E2E Windows · the Mac run's suites · \")))] | length" || echo 0)
            if [ "${ran:-0}" -gt 0 ]; then echo "Windows already followed a main check today ($today): the next one starts tomorrow."; exit 0; fi
          fi
          gh workflow run e2e-windows.yml --repo "${{ github.repository }}" --ref main \
            -f mac_run=${{ github.run_id }} -f sha=${{ needs.plan.outputs.ref }} -f review=${{ needs.plan.outputs.review }} -f full="$FULL" -f tag="${{ needs.plan.outputs.tag }}"
          echo "Windows run started for commit ${{ needs.plan.outputs.ref }} (it skips a commit Windows already tested)."

  # Why (31 Oct 2026, owner): "It should just raise an alert. And that's it." One credit alert per workflow run, never a beta hold.
  ai-credit-health:
    name: AI credit health
    needs: [suite]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      E2E_ARTIFACT_SECRET_NAMES: |
        GH_TOKEN
        CI_ALERTS_TELEGRAM_BOT_TOKEN
        CI_ALERTS_TELEGRAM_CHAT_ID
      GH_TOKEN: ${{ github.token }}
      CI_ALERTS_TELEGRAM_BOT_TOKEN: ${{ secrets.CI_ALERTS_TELEGRAM_BOT_TOKEN }}
      CI_ALERTS_TELEGRAM_CHAT_ID: ${{ secrets.CI_ALERTS_TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
        timeout-minutes: 5
        with:
          sparse-checkout: |
            desktop/e2e
            tools/scan-e2e-artifacts.py
      - uses: actions/setup-node@v5
        timeout-minutes: 5
        with:
          node-version: '22'
      - name: AI credit is an alert, never a hold
        timeout-minutes: 5
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-artifacts-*' --dir ai-credit-health || echo "::notice::No suite artifacts available for AI credit health"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'e2e-rerun-*' --dir ai-credit-health || echo "::notice::No retry artifacts available for AI credit health"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "ai-credit-alert-$GITHUB_RUN_ID" --dir ai-credit-alert || true
          node desktop/e2e/credit-alert.mjs --artifacts ai-credit-health --marker ai-credit-alert/alert-sent.txt
      - name: Scan artifact contents for CI secrets
        timeout-minutes: 5
        id: artifact_scan_1
        if: always()
        env:
          E2E_ARTIFACT_PATHS: ai-credit-alert/alert-sent.txt
        run: python tools/scan-e2e-artifacts.py
      - name: Remember this run's single credit alert
        if: (always() && hashFiles('ai-credit-alert/alert-sent.txt') != '') && steps.artifact_scan_1.outcome == 'success'
        timeout-minutes: 5
        uses: actions/upload-artifact@v6
        with:
          name: ai-credit-alert-${{ github.run_id }}
          path: ai-credit-alert/alert-sent.txt
          overwrite: true
